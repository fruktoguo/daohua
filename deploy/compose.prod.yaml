name: daoxuan

services:
  db:
    image: postgres:17-alpine
    container_name: daoxuan-db
    init: true
    restart: unless-stopped
    environment:
      POSTGRES_DB: daoxuan
      POSTGRES_USER: daoxuan
      POSTGRES_PASSWORD: ${DAOXUAN_POSTGRES_PASSWORD:?需要在 /opt/daoxuan/daoxuan.env 设置 DAOXUAN_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_wal_size=1GB
      - -c
      - min_wal_size=80MB
      - -c
      - wal_keep_size=64MB
      - -c
      - autovacuum_max_workers=2
      - -c
      - autovacuum_vacuum_scale_factor=0.05
    volumes:
      - daoxuan-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daoxuan -d daoxuan"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    shm_size: 256m
    pids_limit: 256
    cpus: "0.75"
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  app:
    image: ${DAOXUAN_IMAGE:-ccr.ccs.tencentyun.com/yuohira/daoxuan:prod}
    container_name: daoxuan-app
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DAOXUAN_PORT:-15128}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Storage__Provider: postgres
      Storage__ConnectionString: Host=db;Port=5432;Database=daoxuan;Username=daoxuan;Password=${DAOXUAN_POSTGRES_PASSWORD:?需要在 /opt/daoxuan/daoxuan.env 设置 DAOXUAN_POSTGRES_PASSWORD};Maximum Pool Size=32;Minimum Pool Size=1;Timeout=5;Command Timeout=30;Keepalive=30
      Storage__DataDirectory: /app/data
      Storage__DurableOutboxEnabled: "true"
      Storage__OutboxDirectory: /app/data/outbox
      Storage__PersistenceQueueCapacity: "65536"
      Storage__EnableSchemaBootstrap: "true"
      Market__LedgerProvider: postgres
      Market__PartitionCount: "1"
      Market__PartitionId: "0"
      Market__TradeRetentionDays: "14"
      DistributedCompute__Enabled: ${DAOXUAN_DISTRIBUTED_COMPUTE_ENABLED:-false}
      DistributedCompute__NodeEndpoints: ${DAOXUAN_COMPUTE_NODE_ENDPOINTS:-}
      DistributedCompute__Token: ${DAOXUAN_COMPUTE_TOKEN:-}
      DistributedCompute__BatchSize: ${DAOXUAN_COMPUTE_BATCH_SIZE:-64}
      DistributedCompute__MinimumIdleLagSeconds: ${DAOXUAN_COMPUTE_MIN_IDLE_LAG_SECONDS:-300}
      # 可选共享访问令牌；空默认不启用，来源 /opt/daoxuan/daoxuan.env。
      Server__AccessToken: ${DAOXUAN_ACCESS_TOKEN:-}
    volumes:
      - daoxuan-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: "1.00"
    mem_limit: 1g
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  daoxuan-data:
  daoxuan-postgres:
