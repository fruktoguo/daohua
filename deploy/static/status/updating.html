<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f1ecdc" />
    <meta http-equiv="refresh" content="30" />
    <title>道化太初 · 仙界更新维护中</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' fill='%23070604' stroke='%23c9b46d'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='21' fill='%23e8d69a'%3E%E4%BF%AE%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/_status/status.css" />
    <script src="/_status/maintenance.js"></script>
  </head>
  <body>
    <div class="status-screen">
      <div class="motes" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <main class="status-card panel" role="status" aria-live="polite">
        <div class="brand-mark">
          <span class="brand-seal" aria-hidden="true">修</span>
          <span>道化太初</span>
        </div>
        <div class="status-spinner-aura" aria-hidden="true">
          <div class="status-pulsing-circle"></div>
          <div class="status-orbit-dot"></div>
        </div>
        <div id="status-badge" class="status-badge">
          <span class="status-badge-dot" aria-hidden="true"></span>
          <span id="status-badge-text">版本更新 / 停机维护</span>
        </div>
        <h1 id="status-title" class="status-title">仙界更新维护中</h1>
        <p id="status-subtitle" class="status-subtitle">
          服务器正在进行版本更新与数据迁移维护，暂不可接入。
        </p>
        <div class="status-detail-box">
          <p id="status-note">更新完成后将自动恢复开放，您的角色离线挂机与存档进度不受影响。</p>
          <p id="status-probe-line" class="status-probe-line">正在准备自动检测服务端状态…</p>
        </div>
        <div class="status-progress-bar" aria-hidden="true">
          <div class="status-progress-glow"></div>
        </div>
        <div class="status-actions">
          <button id="status-retry-btn" type="button" class="status-btn primary">立即检测恢复</button>
          <button id="status-reload-btn" type="button" class="status-btn secondary">刷新页面</button>
        </div>
        <div class="status-footer">
          <a href="/privacy" target="_blank" rel="noopener noreferrer">《道化太初》隐私政策</a>
        </div>
      </main>
    </div>
  </body>
</html>
