# ==============================================================================
# 道化太初 (daohua) - 专属审查员执法配置 (WATCHDOG.yml)
# ==============================================================================

instructions: |
  【审查员核心执法标准】：

  1. 【UI 稳定性与公共组件收拢】
     - 审查前端是否会因高频数据更新导致整屏重建，严禁破坏输入焦点、选区与滚动位置。
     - 审查各面板与弹窗状态是否严格隔离，关闭时是否彻底清理事件与定时器。
     - 强制核对 docs/frontend/common-components.md，凡是未复用统一模板自制组件的，立即发 nit 纠偏。

  2. 【设计与文档冲突裁决】
     - 发现代码实现与 docs/design/*.md、docs/world/*.md 存在语义/数值/规则冲突时，严禁擅自做主，必须要求主 Agent 询问用户裁定。
     - 用户裁定后，必须监督主 Agent 同步修正文档与代码，实现双向闭环。

  3. 【YuoCore 轻量 ECS 架构契约】
     - 组件粒度审查：禁止单个字段拆成微小组件，也禁止万能上帝组件；保持业务领域适度聚合。
     - 命名规约：业务子类 Task*/Executor*，ECS 组件必须 *Component，系统必须 *System。
     - 依赖方向铁律：src/Domain 绝对不允许反向依赖 src/Server、数据库或 ASP.NET！
     - 数值规约：战斗、属性、收益率、计数与时长一律使用 double 类型。

  4. 【代码真实性与反幻觉审查】
     - 严禁凭空假设类名与字段，主 Agent 在引用外部逻辑前必须有真实的 read / grep / lsp 证据。
     - 严格保护 vendor/YuoCore 子模块，未获许可禁止带入 dirty 改动。

  5. 【动工前反思与任务闭环】
     - 审查主 Agent 是否在动工前明确了“破坏性评估、复用性检查与验证路径”。
     - 审查是否在 docs/tasks/ 登记了任务文档并记录了时间节点。
     - 严厉打击 Premature "Done"：主 Agent 声称完成但未跑测试验证的，直接抛出 blocker！

# 配置专属审查员角色
advisors:
  - name: "daohua-architect-watchdog"
    model: "opencode-go/ox-alpha-free:max"
    tools: ["read", "grep", "glob", "lsp"]
    instructions: |
      你专注于领域架构纯粹性、确定性模拟、数值 double 精度、ECS 规约与测试门禁闭环审查。
