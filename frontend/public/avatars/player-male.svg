<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 底部纯黑气场倒影 -->
  <ellipse cx="512" cy="940" rx="280" ry="40" fill="#090b10" opacity="0.6"/>

  <!-- ==================== 背后斜背古朴飞剑 ==================== -->
  <!-- 飞剑剑身 (骨白折面与冷蓝剑意) -->
  <g transform="translate(620, 180) rotate(28)">
    <!-- 剑气光弧 (强调色 #81adb3) -->
    <polygon points="-8,-360 8,-360 16,180 -16,180" fill="#81adb3" opacity="0.85"/>
    <!-- 剑刃近黑主脊 -->
    <polygon points="-6,-380 6,-380 10,200 -10,200" fill="#222021"/>
    <!-- 剑尖骨白锋芒 -->
    <polygon points="0,-420 12,-370 0,-350 -12,-370" fill="#efe8dc"/>
    <polygon points="-12,-370 0,-350 0,180 -8,180" fill="#dcd3c3"/>
    <polygon points="12,-370 0,-350 0,180 8,180" fill="#f5f0e6"/>
    <!-- 剑格护手 (骨白折角) -->
    <polygon points="-36,190 36,190 48,220 0,235 -48,220" fill="#efe8dc" stroke="#222021" stroke-width="4"/>
    <polygon points="0,200 14,220 0,230 -14,220" fill="#81adb3"/>
    <!-- 剑柄与剑首剑穗 -->
    <polygon points="-8,235 8,235 10,360 -10,360" fill="#222021"/>
    <circle cx="0" cy="375" r="16" fill="#efe8dc"/>
    <polygon points="-6,390 6,390 14,480 0,520 -14,480" fill="#538188"/>
  </g>

  <!-- ==================== 男剑修躯干与道袍 ==================== -->
  <!-- 背后飘逸长发 (近黑硬折面) -->
  <path d="M420,180 C360,260 340,460 380,560 C400,480 430,320 460,240 Z" fill="#18181b"/>
  <path d="M540,180 C600,280 620,480 570,580 C560,490 530,330 500,240 Z" fill="#222021"/>

  <!-- 下裳下摆 (玄黑道袍与骨白褶裥折面) -->
  <polygon points="320,520 704,520 780,880 610,910 512,870 414,910 244,880" fill="#222021"/>
  <polygon points="414,520 610,520 640,890 512,860 384,890" fill="#2a2c30"/>
  <!-- 骨白云纹下摆镶边 -->
  <polygon points="244,880 340,860 350,895 244,905" fill="#efe8dc"/>
  <polygon points="780,880 684,860 674,895 780,905" fill="#efe8dc"/>
  <polygon points="384,890 512,860 640,890 630,915 512,885 394,915" fill="#dcd3c3"/>
  <!-- 青蓝灵力气流暗纹 -->
  <polygon points="492,540 532,540 524,840 500,840" fill="#538188" opacity="0.6"/>

  <!-- 束腰革带与骨白佩玉 -->
  <polygon points="380,480 644,480 630,535 394,535" fill="#18181b"/>
  <!-- 骨白腰封带扣 -->
  <polygon points="480,475 544,475 554,540 470,540" fill="#efe8dc"/>
  <polygon points="495,490 529,490 534,525 490,525" fill="#81adb3"/>

  <!-- 上身玄黑交领长袍与骨白领口 -->
  <polygon points="340,320 684,320 650,490 374,490" fill="#222021"/>
  <!-- 右衽交领折面 (骨白内衬) -->
  <polygon points="450,220 540,340 480,480 430,480 390,340" fill="#efe8dc"/>
  <polygon points="574,220 594,250 490,480 440,480 520,330" fill="#dcd3c3"/>
  <!-- 领口青蓝护符 -->
  <polygon points="495,340 525,340 510,380" fill="#81adb3"/>

  <!-- 双肩棱角骨白披甲 -->
  <!-- 左肩甲 -->
  <polygon points="310,290 410,260 420,330 330,360 280,330" fill="#efe8dc"/>
  <polygon points="280,330 330,360 320,410 260,360" fill="#dcd3c3"/>
  <!-- 右肩甲 -->
  <polygon points="714,290 614,260 604,330 694,360 744,330" fill="#f5f0e6"/>
  <polygon points="744,330 694,360 704,410 764,360" fill="#efe8dc"/>

  <!-- 双臂衣袖与骨白护腕 -->
  <polygon points="280,330 350,360 290,520 210,460" fill="#222021"/>
  <polygon points="210,460 290,520 270,580 190,520" fill="#efe8dc"/>
  <polygon points="744,330 674,360 734,520 814,460" fill="#2a2c30"/>
  <polygon points="814,460 734,520 754,580 834,520" fill="#efe8dc"/>

  <!-- ==================== 头部、五官与发冠 ==================== -->
  <!-- 颈部 (骨白光影) -->
