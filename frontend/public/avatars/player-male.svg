  <!-- 冷峻英武面部折面 -->
  <!-- 脸颊左暗面 -->
  <polygon points="512,110 440,160 460,230 512,250" fill="#ded4c4"/>
  <!-- 脸颊右亮面 -->
  <polygon points="512,110 584,160 564,230 512,250" fill="#f5ede0"/>
  <!-- 下颌与下巴棱角 -->
  <polygon points="490,230 534,230 512,255" fill="#cfc4b2"/>

  <!-- 冷冽剑意双目 (强调色 #81adb3 菱形凶光眼) -->
  <polygon points="460,165 486,160 480,175 464,175" fill="#222021"/>
  <polygon points="470,166 480,163 476,172 468,172" fill="#81adb3"/>
  <polygon points="538,160 564,165 560,175 544,175" fill="#222021"/>
  <polygon points="544,163 554,166 552,172 542,172" fill="#81adb3"/>

  <!-- 剑眉 (锐利折线) -->
  <polygon points="444,152 494,146 488,156 450,158" fill="#18181b"/>
  <polygon points="580,152 530,146 536,156 574,158" fill="#18181b"/>

  <!-- 束发与前额鬓发折面 -->
  <polygon points="440,120 512,80 584,120 564,150 512,125 460,150" fill="#18181b"/>
  <!-- 两侧垂落凌厉剑修鬓角 -->
  <polygon points="434,130 450,130 440,240 430,220" fill="#222021"/>
  <polygon points="590,130 574,130 584,240 594,220" fill="#18181b"/>

  <!-- 头顶金冠与白玉簪 -->
  <polygon points="475,30 549,30 560,85 464,85" fill="#efe8dc"/>
  <polygon points="490,45 534,45 540,75 484,75" fill="#81adb3"/>
  <!-- 横插骨白发簪 -->
  <polygon points="420,50 604,50 600,62 424,62" fill="#f5f0e6"/>

  <!-- 高高束起的潇洒马尾发束 (向上展开折面) -->
  <polygon points="480,30 512,-30 544,30 530,0 494,0" fill="#222021"/>
</svg>
