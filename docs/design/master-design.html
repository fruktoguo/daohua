<!DOCTYPE html>
<html lang="zh-CN">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>道化太初 · 全景主设计总纲 (Master GDD)</title>

 <!-- 可选在线字体与样式增强 (断网时自动使用系统本地字体与离线排版) -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
  rel="stylesheet" media="print" onload="this.media='all'">

 <!-- KaTeX 在线数学公式渲染增强 (离线时优雅降级为等宽高亮) -->
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" media="print"
  onload="this.media='all'">
 <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

 <!-- Mermaid 在线流程图渲染增强 (离线时优雅降级为代码块) -->
 <script defer src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>

 <style>
  /* ==========================================================================
       1. 修仙暗墨古典美学基础变量体系
       ========================================================================== */
  :root {
   --bg-void: #050403;
   --bg-dark: #0b0906;
   --bg-card: rgba(16, 13, 9, 0.96);
   --bg-surface: rgba(28, 22, 15, 0.85);
   --bg-hover: rgba(48, 38, 25, 0.6);

   --gold-primary: #d4a853;
   --gold-bright: #f5d076;
   --gold-dim: #8e7033;
   --gold-border: rgba(212, 168, 83, 0.32);
   --gold-glow: rgba(212, 168, 83, 0.22);

   --tone-jade: #4ade80;
   --tone-jade-bg: rgba(74, 222, 128, 0.14);
   --tone-jade-border: rgba(74, 222, 128, 0.4);

   --tone-qi: #38bdf8;
   --tone-qi-bg: rgba(56, 189, 248, 0.14);
   --tone-qi-border: rgba(56, 189, 248, 0.4);

   --tone-danger: #f87171;
   --tone-danger-bg: rgba(248, 113, 113, 0.14);
   --tone-danger-border: rgba(248, 113, 113, 0.4);

   --tone-purple: #c084fc;
   --tone-purple-bg: rgba(192, 132, 252, 0.14);
   --tone-purple-border: rgba(192, 132, 252, 0.4);

   --tone-amber: #fbbf24;
   --tone-amber-bg: rgba(251, 191, 36, 0.14);
   --tone-amber-border: rgba(251, 191, 36, 0.4);

   --text-main: #e8e1d0;
   --text-bright: #ffffff;
   --text-muted: #a39886;
   --text-dim: #706757;

   --font-serif: "Noto Serif SC", "Kaiti SC", STKaiti, "Songti SC", SimSun, serif;
   --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
   --font-mono: "JetBrains Mono", Consolas, Monaco, "Courier New", monospace;

   --sidebar-width: 320px;
   --topbar-height: 56px;
   --base-font-size: 15px;
  }

  * {
   box-sizing: border-box;
   margin: 0;
   padding: 0;
  }

  html,
  body {
   width: 100%;
   height: 100%;
   background-color: var(--bg-void);
   color: var(--text-main);
   font-family: var(--font-sans);
   font-size: var(--base-font-size);
   line-height: 1.85;
   overflow: hidden;
   -webkit-font-smoothing: antialiased;
   -moz-osx-font-smoothing: grayscale;
  }

  /* 顶部流光细金阅读进度条 */
  #reading-progress-bar {
   position: fixed;
   top: 0;
   left: 0;
   height: 3px;
   width: 0%;
   background: linear-gradient(90deg, var(--gold-dim), var(--gold-bright), var(--tone-qi), var(--gold-bright));
   box-shadow: 0 0 14px var(--gold-primary), 0 0 4px var(--gold-bright);
   z-index: 1000;
   transition: width 0.1s ease-out;
   pointer-events: none;
  }

  /* ==========================================================================
       2. 整体全景流式布局拓扑 (宽屏自适应左右全填充)
       ========================================================================== */
  #app-container {
   display: flex;
   width: 100vw;
   height: 100vh;
   overflow: hidden;
   background:
    radial-gradient(circle at 10% 10%, rgba(45, 33, 18, 0.4) 0%, transparent 65%),
    radial-gradient(circle at 90% 90%, rgba(25, 18, 11, 0.5) 0%, transparent 55%),
    linear-gradient(180deg, #090805 0%, #040302 100%);
  }

  /* ==========================================================================
       3. 顶部修仙导航栏 (Topbar)
       ========================================================================== */
  #topbar {
   position: fixed;
   top: 0;
   left: var(--sidebar-width);
   right: 0;
   height: var(--topbar-height);
   background: rgba(12, 10, 6, 0.92);
   backdrop-filter: blur(16px);
   -webkit-backdrop-filter: blur(16px);
   border-bottom: 1px solid var(--gold-border);
   display: flex;
   align-items: center;
   justify-content: space-between;
   padding: 0 28px;
   z-index: 100;
   transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  #topbar.sidebar-collapsed {
   left: 0;
  }

  .topbar-left {
   display: flex;
   align-items: center;
   gap: 16px;
  }

  .btn-toggle-sidebar {
   background: rgba(26, 20, 13, 0.8);
   border: 1px solid var(--gold-border);
   color: var(--gold-primary);
   width: 34px;
   height: 34px;
   border-radius: 4px;
   cursor: pointer;
   display: flex;
   align-items: center;
   justify-content: center;
   transition: all 0.2s;
  }

  .btn-toggle-sidebar:hover {
   background: var(--bg-surface);
   border-color: var(--gold-bright);
   color: var(--gold-bright);
   box-shadow: 0 0 8px var(--gold-glow);
  }

  .topbar-title {
   font-family: var(--font-serif);
   font-size: 17px;
   font-weight: 700;
   color: var(--gold-bright);
   letter-spacing: 1px;
   display: flex;
   align-items: center;
   gap: 8px;
  }

  .topbar-right {
   display: flex;
   align-items: center;
   gap: 12px;
  }

  .search-box {
   position: relative;
   display: flex;
   align-items: center;
  }

  .search-input {
   background: rgba(22, 17, 11, 0.9);
   border: 1px solid var(--gold-border);
   color: var(--text-bright);
   padding: 6px 14px 6px 34px;
   border-radius: 4px;
   font-size: 13px;
   width: 240px;
   transition: all 0.2s;
   outline: none;
  }

  .search-input:focus {
   width: 320px;
   border-color: var(--gold-primary);
   box-shadow: 0 0 12px var(--gold-glow);
  }

  .search-icon {
   position: absolute;
   left: 11px;
   color: var(--gold-dim);
   pointer-events: none;
  }

  .topbar-btn {
   background: rgba(26, 20, 13, 0.8);
   border: 1px solid var(--gold-border);
   color: var(--text-main);
   padding: 5px 14px;
   border-radius: 4px;
   font-size: 13px;
   cursor: pointer;
   display: inline-flex;
   align-items: center;
   gap: 6px;
   transition: all 0.2s;
  }

  .topbar-btn:hover {
   background: var(--bg-surface);
   border-color: var(--gold-primary);
   color: var(--gold-bright);
   box-shadow: 0 0 8px var(--gold-glow);
  }

  /* ==========================================================================
       4. 左侧修仙大纲目录树 (Sidebar TOC)
       ========================================================================== */
  #sidebar {
   width: var(--sidebar-width);
   height: 100vh;
   background: rgba(10, 8, 5, 0.98);
   border-right: 1px solid var(--gold-border);
   display: flex;
   flex-direction: column;
   z-index: 150;
   flex-shrink: 0;
   transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  #sidebar.collapsed {
   transform: translateX(-100%);
  }

  .sidebar-header {
   padding: 16px 20px;
   border-bottom: 1px solid var(--gold-border);
   display: flex;
   align-items: center;
   gap: 12px;
   background: linear-gradient(180deg, rgba(32, 24, 15, 0.7) 0%, transparent 100%);
  }

  .taiji-badge {
   width: 32px;
   height: 32px;
   border-radius: 50%;
   border: 1.5px solid var(--gold-primary);
   display: flex;
   align-items: center;
   justify-content: center;
   background: #000;
   box-shadow: 0 0 10px var(--gold-glow);
   animation: taiji-spin 40s linear infinite;
  }

  @keyframes taiji-spin {
   from {
    transform: rotate(0deg);
   }

   to {
    transform: rotate(360deg);
   }
  }

  .sidebar-brand h1 {
   font-family: var(--font-serif);
   font-size: 16px;
   font-weight: 700;
   color: var(--gold-bright);
   letter-spacing: 1.5px;
  }

  .sidebar-brand p {
   font-size: 11px;
   color: var(--gold-dim);
   letter-spacing: 0.5px;
  }

  .sidebar-toc {
   flex: 1;
   overflow-y: auto;
   padding: 16px 12px;
  }

  .sidebar-toc::-webkit-scrollbar {
   width: 4px;
  }

  .sidebar-toc::-webkit-scrollbar-thumb {
   background: var(--gold-dim);
   border-radius: 2px;
  }

  .toc-item {
   display: block;
   padding: 6px 10px;
   margin-bottom: 2px;
   color: var(--text-muted);
   text-decoration: none;
   font-size: 13px;
   border-radius: 4px;
   border-left: 2px solid transparent;
   transition: all 0.15s;
   white-space: nowrap;
   overflow: hidden;
   text-overflow: ellipsis;
  }

  .toc-item:hover {
   color: var(--gold-bright);
   background: var(--bg-hover);
  }

  .toc-item.active {
   color: var(--gold-bright);
   background: rgba(212, 168, 83, 0.15);
   border-left-color: var(--gold-primary);
   font-weight: 600;
  }

  .toc-level-1 {
   font-family: var(--font-serif);
   font-size: 14px;
   font-weight: 700;
   color: var(--gold-primary);
   margin-top: 12px;
  }

  .toc-level-2 {
   padding-left: 18px;
  }

  .toc-level-3 {
   padding-left: 30px;
   font-size: 12px;
   opacity: 0.85;
  }

  .sidebar-footer {
   padding: 12px 16px;
   border-top: 1px solid var(--gold-border);
   font-size: 11px;
   color: var(--text-dim);
   display: flex;
   justify-content: space-between;
   align-items: center;
   background: rgba(8, 7, 5, 0.9);
  }

  /* ==========================================================================
       5. 右侧主视口与左右全填充流式阅读区 (Main Content)
       ========================================================================== */
  #main-viewport {
   flex: 1;
   height: 100vh;
   overflow-y: auto;
   padding-top: calc(var(--topbar-height) + 24px);
   padding-bottom: 90px;
   scroll-behavior: smooth;
  }

  #main-viewport::-webkit-scrollbar {
   width: 8px;
  }

  #main-viewport::-webkit-scrollbar-track {
   background: var(--bg-void);
  }

  #main-viewport::-webkit-scrollbar-thumb {
   background: rgba(212, 168, 83, 0.35);
   border-radius: 4px;
   box-shadow: 0 0 6px var(--gold-glow);
  }

  #main-viewport::-webkit-scrollbar-thumb:hover {
   background: var(--gold-primary);
  }

  /* 宽屏流式自适应全填充容器 */
  .content-container {
   width: 100%;
   padding: 0 44px;
   position: relative;
  }

  /* 装饰底框与折角金纹 */
  .stone-card-wrapper {
   position: relative;
   width: 100%;
   background: var(--bg-card);
   border: 1px solid var(--gold-border);
   border-radius: 6px;
   padding: 44px 52px;
   box-shadow: 0 10px 50px rgba(0, 0, 0, 0.9);
   backdrop-filter: blur(14px);
   -webkit-backdrop-filter: blur(14px);
  }

  /* 四角折角装饰 */
  .corner-decor {
   position: absolute;
   width: 14px;
   height: 14px;
   border-color: var(--gold-primary);
   pointer-events: none;
  }

  .corner-tl {
   top: -1px;
   left: -1px;
   border-top: 2px solid;
   border-left: 2px solid;
  }

  .corner-tr {
   top: -1px;
   right: -1px;
   border-top: 2px solid;
   border-right: 2px solid;
  }

  .corner-bl {
   bottom: -1px;
   left: -1px;
   border-bottom: 2px solid;
   border-left: 2px solid;
  }

  .corner-br {
   bottom: -1px;
   right: -1px;
   border-bottom: 2px solid;
   border-right: 2px solid;
  }

  /* ==========================================================================
       6. 视口从右向左渐显进入动效 (Right-to-Left Scroll Reveal Animation)
       ========================================================================== */
  .reveal-item {
   opacity: 0;
   transform: translateX(36px);
   filter: blur(4px);
   transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
    filter 0.6s cubic-bezier(0.16, 1, 0.3, 1);
   will-change: opacity, transform, filter;
  }

  .reveal-item.revealed {
   opacity: 1;
   transform: translateX(0);
   filter: blur(0);
  }

  /* ==========================================================================
       7. 阶梯式层次段落缩进与古籍排版体系 (Hierarchical Indentation)
       ========================================================================== */

  /* 篇章总括导言 (H1 紧随导言) */
  .p-lead {
   font-size: 1.05em;
   color: var(--text-bright);
   line-height: 1.9;
   margin: 16px 0 24px 0;
   padding: 12px 18px;
   background: rgba(32, 24, 15, 0.5);
   border-left: 3px solid var(--gold-primary);
   border-radius: 0 4px 4px 0;
   text-indent: 0 !important;
  }

  /* H2 小节段落 (标准首行缩进 2em，层次鲜明) */
  .p-h2-sub {
   text-indent: 2em;
   margin-bottom: 16px;
   color: var(--text-main);
   text-align: justify;
   padding-left: 4px;
  }

  /* H3 深层细则段落 (阶梯式向右缩进 20px，带有淡金导引线) */
  .p-h3-sub {
   margin-left: 20px;
   padding-left: 14px;
   border-left: 1.5px dashed rgba(212, 168, 83, 0.25);
   text-indent: 2em;
   margin-bottom: 14px;
   color: #dfd7c5;
  }

  /* H4/H5 极细段落 */
  .p-h4-sub {
   margin-left: 36px;
   padding-left: 12px;
   border-left: 1px solid rgba(212, 168, 83, 0.15);
   text-indent: 2em;
   margin-bottom: 12px;
   color: #cec5b1;
  }

  /* 普通未分类段落 fallback */
  .markdown-body p {
   margin-bottom: 16px;
   color: var(--text-main);
   text-align: justify;
  }

  /* ==========================================================================
       8. 修仙发光胶囊体系 (Xianxia Glowing Capsule Badges)
       ========================================================================== */
  .capsule {
   display: inline-flex;
   align-items: center;
   gap: 3px;
   padding: 1px 7px;
   border-radius: 4px;
   font-size: 0.88em;
   font-weight: 600;
   line-height: 1.45;
   white-space: nowrap;
   vertical-align: baseline;
   margin: 0 2px;
   border: 1px solid;
   box-shadow: 0 0 6px rgba(0, 0, 0, 0.4);
   transition: all 0.15s ease;
   text-indent: 0 !important;
  }

  .capsule:hover {
   transform: translateY(-1px);
   filter: brightness(1.2);
  }

  /* 1. 境界阶位胶囊 (Realm Badge) */
  .capsule-realm {
   border-color: #f5d076;
   background: linear-gradient(180deg, rgba(212, 168, 83, 0.28) 0%, rgba(142, 112, 51, 0.2) 100%);
   color: #fff4d1;
   box-shadow: 0 0 8px rgba(245, 208, 118, 0.35);
   font-family: var(--font-serif);
   font-weight: 700;
  }

  /* 2. 8 阶品质色彩胶囊 */
  .capsule-q1 {
   border-color: #d1d5db;
   background: rgba(209, 213, 219, 0.12);
   color: #f3f4f6;
  }

  /* 凡品 白 */
  .capsule-q2 {
   border-color: #4ade80;
   background: rgba(74, 222, 128, 0.15);
   color: #86efac;
   box-shadow: 0 0 6px rgba(74, 222, 128, 0.25);
  }

  /* 灵品 绿 */
  .capsule-q3 {
   border-color: #38bdf8;
   background: rgba(56, 189, 248, 0.15);
   color: #7dd3fc;
   box-shadow: 0 0 6px rgba(56, 189, 248, 0.25);
  }

  /* 玄品 蓝 */
  .capsule-q4 {
   border-color: #c084fc;
   background: rgba(192, 132, 252, 0.18);
   color: #e9d5ff;
   box-shadow: 0 0 8px rgba(192, 132, 252, 0.35);
  }

  /* 地品 紫 */
  .capsule-q5 {
   border-color: #fbbf24;
   background: rgba(251, 191, 36, 0.2);
   color: #fef08a;
   box-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
  }

  /* 天品 金 */
  .capsule-q6 {
   border-color: #fb923c;
   background: rgba(251, 146, 60, 0.22);
   color: #fed7aa;
   box-shadow: 0 0 10px rgba(251, 146, 60, 0.45);
  }

  /* 仙品 橙 */
  .capsule-q7 {
   border-color: #f87171;
   background: rgba(248, 113, 113, 0.25);
   color: #fecaca;
   box-shadow: 0 0 12px rgba(248, 113, 113, 0.5);
  }

  /* 神品 红 */
  .capsule-q8 {
   border-color: #e879f9;
   background: linear-gradient(90deg, rgba(232, 121, 249, 0.25), rgba(56, 189, 248, 0.25));
   color: #fdf4ff;
   box-shadow: 0 0 14px rgba(232, 121, 249, 0.6);
  }

  /* 混沌 彩 */

  /* 3. 战斗属性胶囊 */
  .capsule-hp {
   border-color: var(--tone-jade-border);
   background: var(--tone-jade-bg);
   color: var(--tone-jade);
  }

  .capsule-mp {
   border-color: var(--tone-qi-border);
   background: var(--tone-qi-bg);
   color: var(--tone-qi);
  }

  .capsule-ad {
   border-color: rgba(245, 208, 118, 0.4);
   background: rgba(212, 168, 83, 0.15);
   color: #fde047;
  }

  .capsule-ap {
   border-color: rgba(56, 189, 248, 0.4);
   background: rgba(56, 189, 248, 0.15);
   color: #67e8f9;
  }

  .capsule-armor {
   border-color: rgba(251, 191, 36, 0.4);
   background: rgba(251, 191, 36, 0.12);
   color: #fde68a;
  }

  .capsule-mr {
   border-color: rgba(192, 132, 252, 0.4);
   background: rgba(192, 132, 252, 0.12);
   color: #d8b4fe;
  }

  .capsule-crit {
   border-color: rgba(248, 113, 113, 0.4);
   background: rgba(248, 113, 113, 0.15);
   color: #fca5a5;
  }

  .capsule-break {
   border-color: rgba(251, 146, 60, 0.4);
   background: rgba(251, 146, 60, 0.15);
   color: #fdba74;
  }

  /* 4. 百分比与增益/减益数值胶囊 */
  .capsule-gain {
   border-color: rgba(74, 222, 128, 0.45);
   background: rgba(74, 222, 128, 0.16);
   color: #86efac;
   font-weight: 700;
  }

  .capsule-loss {
   border-color: rgba(248, 113, 113, 0.45);
   background: rgba(248, 113, 113, 0.16);
   color: #fca5a5;
   font-weight: 700;
  }

  .capsule-scale {
   border-color: rgba(56, 189, 248, 0.45);
   background: rgba(56, 189, 248, 0.16);
   color: #7dd3fc;
   font-weight: 700;
  }

  .capsule-special {
   border-color: rgba(212, 168, 83, 0.4);
   background: rgba(212, 168, 83, 0.12);
   color: var(--gold-bright);
  }

  /* 5. 装备槽位胶囊 */
  .capsule-slot {
   border-color: rgba(212, 168, 83, 0.4);
   background: rgba(36, 28, 18, 0.85);
   color: var(--gold-bright);
   font-family: var(--font-serif);
   font-size: 0.85em;
  }

  /* ==========================================================================
       9. Markdown 标题与元素样式
       ========================================================================== */
  .markdown-body h1 {
   font-family: var(--font-serif);
   font-size: 26px;
   font-weight: 900;
   color: var(--gold-bright);
   letter-spacing: 1.5px;
   margin: 48px 0 20px 0;
   padding-bottom: 14px;
   border-bottom: 1px solid var(--gold-border);
   display: flex;
   align-items: center;
   gap: 12px;
   text-shadow: 0 0 24px var(--gold-glow);
  }

  .markdown-body h1:first-child {
   margin-top: 0;
  }

  .markdown-body h2 {
   font-family: var(--font-serif);
   font-size: 20px;
   font-weight: 700;
   color: var(--gold-primary);
   letter-spacing: 1px;
   margin: 36px 0 16px 0;
   padding-left: 12px;
   border-left: 3.5px solid var(--gold-primary);
  }

  .markdown-body h3 {
   font-family: var(--font-serif);
   font-size: 16.5px;
   font-weight: 700;
   color: var(--text-bright);
   margin: 28px 0 12px 20px;
   padding-left: 8px;
   border-left: 2px solid rgba(212, 168, 83, 0.5);
  }

  .markdown-body h4,
  .markdown-body h5,
  .markdown-body h6 {
   font-size: 14.5px;
   font-weight: 600;
   color: var(--gold-bright);
   margin: 20px 0 8px 36px;
  }

  .markdown-body strong {
   color: var(--gold-bright);
   font-weight: 700;
  }

  .markdown-body em {
   color: var(--tone-qi);

# 第一篇 核心哲学与顶层定位

## 1.1 产品定义
《道化太初》是一款以**服务端权威、高确定性离散事件推进（DES）、长线挂机放置**为核心的修仙 RPG 游戏。玩家绝大多数成长行为通过行动队列驱动，离线挂机与在线游玩具有完全等价的确定性数学模拟结果。

## 1.2 核心设计铁律
1. **怪我完全同构 (Monster-Player Isomorphism)**：怪物在领域模型中与玩家完全同构，共享同一套 14 基础属性池、技能装配逻辑、暴击破招对抗与抗性减伤公式，杜绝给怪物编写特殊隐藏补正。
2. **数值全域使用 `double` 精度**：所有属性、收益率、倍率、战斗伤害、时间与计数，计算与存储一律采用 IEEE 754 `double` 精度（百分比存储为 `double` 点数，1 点 = 1%），杜绝整数截断与精度损失。
3. **离散事件飞跃推进 (Discrete Event Simulation)**：游戏推进不依赖固定帧逐秒轮询，而是跳跃至下一个行动或战斗阶段的到期时间戳进行原子状态跃迁。
4. **长线数值闭环量化**：杜绝拍脑袋配表，全量技能、装备、丹药与怪物属性均由顶层数学模型（期望属性池、部位权重、质量预算）确定性推导。
5. **本地开发兼容清零**：在内测开发期直接废弃历史兼容包袱，不保留双读双写与兼容适配器，以代码精简、架构清晰为第一原则。

# 第二篇 修仙境界与四乘区数值底座

## 2.1 境界、阶位与品质三维架构
游戏建立**横向阶位（Tier 1~12 四阶段）**与**纵向品质（Quality 1~8）**交织的修仙体系：

```text
┌────────────────────────────────────────────────────────────────────────┐
│                        全 12 阶位四阶段全景架构                        │
├────────────────────────────────────────────────────────────────────────┤
│ 前期 (凡俗阶段) : 第 1 阶 (凡胎 Lv 1~12) ──> 第 2 阶 (叩仙门 Lv 13~24) │
│ 中期 (气基丹期) : 第 3 阶 (练气) ──> 第 4 阶 (筑基) ──> 第 5 阶 (金丹) │
│ 后期 (婴神虚体) : 第 6 阶 (元婴) ──> 第 7 阶 (化神) ──> 第 8 阶 (炼虚) ──> 第 9 阶 (合体) │
│ 大后期 (仙道真源): 第 10 阶 (大乘) ──> 第 11 阶 (渡劫) ──> 第 12 阶 (飞升真仙) │
└────────────────────────────────────────────────────────────────────────┘
```

- **八大品质等级**：Q1 凡品 (白 1.00x) $\to$ Q2 灵品 (绿 1.15x) $\to$ Q3 玄品 (蓝 1.35x) $\to$ Q4 地品 (紫 1.60x) $\to$ Q5 天品 (金 1.90x) $\to$ Q6 仙品 (橙 2.30x) $\to$ Q7 神品 (红 2.80x) $\to$ Q8 混沌 (彩 3.50x)。
- **一体化徽章表现**：`[大境界牌匾框] ◇位阶棱形框◇ (小境界胶囊框)`（如 `[练气] ◇极◇ (练气巅峰)`，悬浮展示精准等级 Lv）。
- **系统与世界观解耦说明**：12 阶阶位是底层数值、内视面板与装备穿戴的统一系统模型；剧情对白与世界观文案使用“未入门/引炁/炼炁/凝炁”沉浸式口径，两者各司其职。

# 第五篇 持续消耗品机制与生活制造体系

## 5.1 动作耗时分摊持续消耗品机制 (Sustained Consumable)
1. **动作绑定与耗时扣减**：持续消耗品仅在角色实际执行对应动作时，按本次动作**实际耗时**扣除槽位剩余时间：
   $$\text{NewRemaining} = \text{RemainingDurationSeconds} - \text{ActualDuration}$$
2. **状态常驻与槽位持久化**：不主动切槽时，剩余持续时间永久保存在 `AutoUseSlot` 中，绝不随自然时间流逝。
3. **透支免单友好规则**：当剩余持续时间不足以支付下一次动作时，直接消耗完当前物品并结算完整收益，不足部分免除。
4. **切槽惩罚 (Switching Penalty)**：若物品已开封使用了一部分时间，玩家主动切换/卸下该槽位时，已开封的当前这 1 件物品直接扣除作废，不退回时间。

# 第六篇 战斗引擎、减伤公式与状态常驻规约

## 6.1 两层动态抗性非线性减伤公式

战斗伤害采用**大类抗性平方穿甲** + **五行属性抗性百分比减免**两层减伤模型：

1. **第一层：大类抗性非线性平方减伤（护甲 / 法抗）**：
   $$\text{DamageAfterCategory} = \frac{\mathbf{RawDamage^2}}{\mathbf{RawDamage} + \mathbf{RES} \times K + 1.0}$$
   - **有效抗性 $\mathbf{RES}$**：物理伤害根据守方物理护甲（`Armor`）计算；术法伤害根据守方法术抗性（`MagicResistance`）计算。
   - **动态抗性系数 $K$**：随境界阶位线性递增（T1 $K=1.0$, T2 $K=2.0$, ..., T12 $K=12.0$）。
   - **天然穿甲特性**：单发原始伤害（$\text{RawDamage}$）越高，穿透减伤比例越强；法修凭借 2.0x 超大 AP 拥有极强的天然破防优势。

2. **第二层：五行属性抗性减免（金木水火土）**：
   当技能携带具体五行属性时（非 `Element.None`），依据守方对应五行抗性计算二次减免：
   $$\text{Mitigation} = \frac{\text{ElementRes}}{\text{ElementRes} + 100.0 \times K}$$
   $$\text{DamageAfterElement} = \text{DamageAfterCategory} \times \max(0.0, 1.0 - \text{Mitigation})$$

3. **最终伤害与暴击放大**：
   $$\mathbf{实际伤害} = \text{DamageAfterElement} \times (\text{是否暴击} ? \text{CritMultiplier} : 1.0)$$
## 6.2 三大对抗除法概率公式 (常数 $K = 100.0$)
1. **闪避 vs 命中对抗 (先判定是否被闪避)**：
   攻击发起时优先判定守方是否成功闪避：
   $$\text{闪避概率} = \frac{\text{守方闪避}}{\text{守方闪避} + \text{攻方命中} + 100.0}$$
   - **闪避成功**：本次攻击完全落空，造成 0 伤害；
   - **闪避失败 (即命中)**：进入后续伤害与暴击减免结算。$0$ 闪避对 $0$ 命中时闪避率为 $0\%$ (默认必中)。
2. **暴击 vs 免爆对抗**：
   命中后判定是否触发暴击：
   $$\text{暴击概率} = \frac{\text{攻方暴击}}{\text{攻方暴击} + \text{守方免爆} + 100.0} \quad (\text{基础暴伤 } 150\% + \text{暴伤加成})$$
3. **破招 vs 拆招 (化解)**：
   - **破招成功**（概率 $\frac{\text{攻方破招}}{\text{攻方破招} + \text{守方拆招} + 100}$）：**命中值与暴击值实际计算效果翻倍**；
   - **拆招成功**（概率 $\frac{\text{守方拆招}}{\text{守方拆招} + \text{攻方破招} + 100}$）：**双抗（护甲/法抗）与闪避实际计算效果翻倍**。

## 6.3 仇恨威胁与目标选择机制
- **威胁累积**：$\text{有效威胁值} = \text{基础累积伤害威胁} \times (1 + \text{嘲讽/仇恨加成})$。
- **单体技能与非全 AoE 抽取**：将全体存活目标的威胁值作为权重池 $S = \max(1.0, \sum \text{Threat}_i)$ 动态抽取目标；多目标技能采用**动态缩减概率池算法（Sequential Elimination）**逐一抽取，确保单次攻击不重复命中同一目标。

## 6.4 角色状态世界常驻、自然回复与复活规约
1. **世界状态常驻**：移除战斗边界与脱战无故回满。角色生命与灵力在各种行动（挂机、采集、炼丹、赶路、战斗）中连续流转。
2. **自然自动回复（基础属性表驱动）**：
   - 随境界的基础生命回复与灵力回复由基础属性配置提供；修改回复基础值应改表，代码只读取回复属性并结算明确的回复加成。
   - **2% 是生命回复的配表参考**：参考对应境界的基础生命上限，将点数写入表；不是运行时按基础或最终生命上限乘 2%，也不要求代码维持固定比例。
   - 仅增加生命上限不会自动增加回复；灵力回复独立配表，本次不指定其比例。不隐式添加保底 1 点或取整规则。
   - **结算周期基线**：当前实现基线为 **5 秒整额回复周期**（`HpRegen`/`MpRegen` 每 5 秒一跳结算整额回复量）；表中回复量的时间单位即按每跳整额理解。详见 [战斗规约 §9.2](./combat-design.md#92-自然回复属性由基础属性表配置)。
   - 死亡状态下：生命值保持 0，**经脉灵力持续正常回复并完整保留**。
3. **两类复活结算**：
   - **读条完成正式复活**（历练死亡阶段 180s 倒计时完成）：**满生命值、满灵力值**重塑肉身重新投入战斗。
   - **退出战斗脱战复苏**（死亡状态下取消队列或手动脱战）：**恢复至 1 点生命（1 HP）**防止脱战暴毙，**保持死亡期间已自然回复的灵力**，绝不一键回满。

# 第七篇 大世界地图拓扑与质量预算遇怪系统

## 7.1 通用世界地点模型 (`WorldNode`)
不存在割裂的“纯战斗副本”。所有地点均为通用地理节点，包含三大支柱：
1. **开放行动集合 (`availableActionIds`)**：采集、挖矿、炼丹、打坐、历练等。
2. **驻留生物生态 (`npcs`, `buildings`)**：常驻 NPC（任务/传功）与场景陈设建筑。
3. **节点可建列表 (`buildableTemplate` / `buildableList`)**：本节点可建造的公共建筑集合（详见 7.3 与 [`node-building-system.md`](node-building-system.md)）。

> **危险度预算归遭遇而非节点**：`[minBudget, maxBudget]` 战力预算区间、精英/Boss 周期（`battlesPerElite` 默认 5、`battlesPerBoss` 默认 20）与怪群权重池（`randomSpawns`/`eliteEnemyIds`/`bossEnemyIds`/`maxTotalStrength`）均定义在 `config/game-data/encounters/*.json`，节点仅通过 `encounterIds` 弱引用遭遇。节点不承载预算字段。

## 7.2 质量预算遇怪抽取算法
```mermaid
flowchart TD
    Start([寻怪倒计时结束]) --> CheckBoss{waveNumber % battlesPerBoss == 0 ?}
    CheckBoss -- 是 --> SpawnBoss[从 bossEnemyIds 抽取 1 只 Boss, 预算重置为 maxBudget - bossCost]
    CheckBoss -- 否 --> CheckElite{waveNumber % battlesPerElite == 0 ?}
    CheckElite -- 是 --> SpawnElite[从 eliteEnemyIds 抽取 1 只精英怪, 扣除 budgetCost]
    CheckElite -- 否 --> RollBudget[在 [minBudget, maxBudget] 确定性抽取总预算 remainBudget]

    SpawnElite --> DeductElite[剩余预算用于抽取小怪护从]
    DeductElite --> LoopExtract[质量预算扣减循环: 按权重轮盘抽取, 扣除 budgetCost, 直至预算耗尽或满编 3 只]
    RollBudget --> LoopExtract
    LoopExtract --> Finalize[生成怪群阵容 -> 进入 Combat 战斗]
```

> 单波满编 3 只（1 特殊怪 + 2 护从 / 3 普通怪），并受 `maxTotalStrength` 强度上限约束；候选池为空时按预算最低普通小怪保底，杜绝空波次。

## 7.3 节点公共建筑系统 (`NodeBuilding`)
节点级**公共设施**：无建造者概念，同节点同种仅一座，全民可发起建造、填充材料与升级；效果对同地所有玩家生效。核心规则：

- **双进度条**：总进度 = `min(材料%, 时间%)`；时间需求 `600×(1+0.2×(N-1))` 秒，材料需求 `基础×1.1^(N-1)`；惰性推算、无后台 tick。
- **效果模型**：`modifiers` 七项（采集/炼丹的加速与收益、修炼收益、战斗回血与减伤），Lv N 生效 = 每级基准 × N；收益类与消耗品/灵脉倍率同乘区叠加。
- **共享持久化**：节点级注册表落 `game.node_buildings`，玩家聚合内仅为最近已知投影。

完整规则、配表字段与数值见 [`node-building-system.md`](node-building-system.md)。

# 第九篇 世界观设定、主线剧情与叙事红线

## 9.1 时代底色：太初之世
- 天地初开不久，人烟稀少，聚落零星。大地上的“炁”浓郁可见，但**无人知晓炁的规矩**，没有宗门、传承与成型功法。
- 云来集是山脚下唯一的落脚聚落，北边有一口老井（**北井**），集口有刻了阵纹的木柱（**阵基**），山顶有看天的**观星客**。

## 9.2 七章主线剧情与 10 大碎片链
1. **序章·云来**：外乡人落脚云来集，学会引炁入体，夜里路过北井听见怪异声音（水声/风声/数数声）。
2. **第一章·泉变**：澄心灵泉水变味，林伯与兰婆各执一词，玩家学会炼制引炁丹，“听泉底”指向北井。
3. **第二章·矿光**：玄铁矿洞矿壁微光，失踪矿工反复念叨“下面有数数的”，带回发光石头。
4. **第三章·立碑**：古台立起新碑，守井人刻下八字八谜——“**炁有归处，人留门路**”，台基下发现古老暗纹。
5. **第四章·谷鸣**：暮影谷妖兽反常成群，暮影关立起哨塔，谷主身上发现同款暗纹，守岭人赐下行令。
6. **第五章·天铁**：观星客预警坠星，玩家取回天铁，矿光石与天铁放在一起微光暗去，互相感应。
7. **终章·井底**：泉变谷鸣汇聚，玩家与守井人下入北井，见井底窄门石隙与冷白光华，守井人留下谶语：“门不是锁，是留的。回去把碑上的话记住就行。”

## 9.3 文案口径红线清单
- **禁止出现的未来词汇**：道劫、天穹残宫、封天井、星铁雨（用“天铁/坠星”）；在主线剧情对白中不直白出现后世宗门术语。
- **禁止剧透与总结**：不解释井、碑、纹、光的终极来历；任何章节结束不做“所以这一切是……”的总结陈词。

# 第十篇 前端 UI 设计系统与修仙交互规范

## 10.1 暗墨玄石美学与色调规范
- **材质底色**：`rgba(14, 12, 7, 0.96)` 高透明度深黑底色 + `backdrop-filter: blur(14px)` 毛玻璃效果。
- **古典修仙色调 (`FloatingTone` / `PillTone`)**：
  - `gold` (暗金/极品/破招)、`jade` (苍翠/生命/木行)、`qi` (灵虚淡蓝/灵力/神识)、`danger` (朱砂煞红/负伤/削弱)、`purple` (紫极天道/仙品)、`muted` (玄灰幽暗/背景注记)。

## 10.2 核心公共组件速查 (强制收拢规范)
1. **`FloatingPopover` / `FloatingInfoCard` / `FloatingTooltip`**：基于 React Portal 挂载至 `#daohua-floating-root`，自动计算视口翻转（Auto Flip）与边界夹持（Viewport Clamp），标准宽度 `medium` (300px)，支持 `quantity={amount}` 独立中文四位分段副气泡；桌面 Hover 防抖、移动端 Touch 0 阻碍穿透底层。
2. **`RealmBadge`**：大境界牌匾框 + 位阶棱形框 + 小境界胶囊框，Hover 展示精准等级与属性。
3. **`PillStatLabel` / `PillBonusLabel`**：复合修仙胶囊，内置图标、专属下划线数值、内联进度条与 Tooltip。
4. **`ItemTile` / `ItemGridPicker`**：标准物品方块，品阶光晕色、品质边框、旋转填充倒计时遮罩。
5. **`QuantitySelector`**：数量输入、常用预设按钮与 `∞` 无限循环按键。
6. **`UnitNumber`**：万进紧凑展示（最多6位数字、2位小数、向下取整），Hover 弹出中文四位分段对照（如 `1234亿 7777万 5211`）。
7. **`CharacterAvatar`**：角色/妖兽立绘，WebP/PNG/SVG 智能降级，敌方自动镜像翻转（`scaleX(-1)`）。

# 第十一篇 服务端领域数据架构与聚合运行时规约

## 11.1 四层数据架构体系
```text
┌────────────────────────────────────────────────────────────────────────┐
│ 1. 策划静态配置 (GameData 解析) │ 只读不可变、编译期内嵌启动加载、ReadOnlyDictionary │
├────────────────────────────────────────────────────────────────────────┤
│ 2. 运行时玩家聚合 (PlayerAggregate) │ PlayerSectionKind 八分段、PlayerActor 单写者 │
├────────────────────────────────────────────────────────────────────────┤
│ 3. 纯业务逻辑系统 (SimulationEngine) │ 纯函数离散事件模拟推进、100% 确定性      │
├────────────────────────────────────────────────────────────────────────┤
│ 4. 持久化与快照 (Snapshots/DTO)   │ 异步落盘、冷计算传输、不可变流式投影     │
└────────────────────────────────────────────────────────────────────────┘
```

## 11.2 纯函数离散模拟引擎与单写者架构
- **单一真源推进**：所有挂机时间、产物结算与战斗模拟严格以 `SimulationEngine.AdvanceTo(state, now)` 为唯一真源，杜绝任何第二套执行器或过渡调度系统。
- **领域聚合零损耗**：玩家状态收敛为单体聚合 `PlayerAggregate`，按 `PlayerSectionKind` 划分为 8 大分段（`progression` / `world` / `combat` / `buffs` / `loadout` / `settings` / `action_queue` / `duel`），高频 Tick 直接访问聚合内存字段，零反射、零哈希查找。
- **Actor 单写者并发**：同一玩家的命令与模拟推进在其专属 `PlayerActor`（由 `PlayerRuntime` 持有）内串行执行，`SemaphoreSlim` 保证单写者语义；跨边界访问不得直接持有聚合引用，杜绝多重分布式大锁。`YuoCore`（Ecs/Persistence/Runtime）基座引用在项目文件中保留待用，当前不构成运行时对象模型；若未来启用 ECS/Fiber，所有权约束另行定义。

# 第十二篇 生产部署、安全边界与 2c4g/40g 容量目标

## 12.1 生产运维拓扑与持久化
- **部署架构**：Release 多阶段构建 $\to$ CCR 不可变标签 + `prod` 标签 $\to$ 服务器 systemd timer 自动更新 $\to$ Caddy 反向代理 HTTPS/WSS 至回环 `127.0.0.1:15128`。
- **PostgreSQL 权威存储**：账号、玩家快照、Durable Outbox、市场账本与流水全量落库 PostgreSQL；Docker 命名卷 `daohua_daohua-postgres` 承载持久数据；每小时自动生成 gzip 压缩备份并生成 SHA-256 校验。

# 第十三篇 行动统计系统（三账本）

原「战斗收益战报」泛化为**行动统计**，对任意行动持续记录收益与计数，共三类账本：

1. **行动实例账本**：绑定队列中的行动实例，从开始推进到出队归档期间持续记录；一个任务重复多次仍算一个行动。
2. **离线挂机账本**：`Presence` 转入 `Offline` 时重置，记录本次离线会话全部收益。
3. **每日统计账本**：按 UTC+8 自然日自动 rollover。

每本账本记录三类信息：**获取经验**（修为/底蕴/六维/功法参悟经验/等级提升）、**物品得失**（获得与失去分列）、**行动信息**（轮次/时长/遭遇场次/分级击杀/死亡/斗法胜负）。交易（坊市）不计入统计。

完整字段、记账点与协议口径见 [`action-statistics-system.md`](action-statistics-system.md)。

     text = text.replace(/\b(灵力值?|MP|灵力上限)\b/gi, '<span class="capsule capsule-mp">MP</span>');
     text = text.replace(/\b(物理攻击|物攻|AD)\b/gi, '<span class="capsule capsule-ad">物攻</span>');
     text = text.replace(/\b(术法攻击|法攻|AP)\b/gi, '<span class="capsule capsule-ap">法攻</span>');
     text = text.replace(/\b(物理防御|物理护甲|护甲|物防|Armor)\b/gi, '<span class="capsule capsule-armor">护甲</span>');
     text = text.replace(/\b(法术防御|法术抗性|法抗|魔抗|MagicRes)\b/gi, '<span class="capsule capsule-mr">法抗</span>');
     text = text.replace(/\b(暴击率?|暴击等级|暴击)\b/g, '<span class="capsule capsule-crit">暴击</span>');
     text = text.replace(/\b(破招率?|破招等级|破招)\b/g, '<span class="capsule capsule-break">破招</span>');
     text = text.replace(/\b(拆招率?|拆招等级|化解|拆招)\b/g, '<span class="capsule capsule-armor">拆招</span>');

     // 5. 正负百分比与倍率高亮 (+20%, -50%, 100%, 1.4x, 6.0x, 0.250s)
     text = text.replace(/(\+\d+(?:\.\d+)?%)/g, '<span class="capsule capsule-gain">$1</span>');
     text = text.replace(/(-\d+(?:\.\d+)?%)/g, '<span class="capsule capsule-loss">$1</span>');
     text = text.replace(/(\b\d+(?:\.\d+)?%)/g, '<span class="capsule capsule-scale">$1</span>');
     text = text.replace(/(\b\d+(?:\.\d+)?[x×]\b)/gi, '<span class="capsule capsule-scale">$1</span>');
     text = text.replace(/(\b\d+(?:\.\d+)?s\b)/gi, '<span class="capsule capsule-special">$1</span>');
     text = text.replace(/(1秒4刀|1秒1发)/g, '<span class="capsule capsule-special">⚡ $1</span>');

     // 6. 装备槽位 (武器/衣服/头盔/下装/鞋履/饰品)
     text = text.replace(/\b(武器|衣服|头盔|下装|鞋履|饰品)\b/g, '<span class="capsule capsule-slot">$1</span>');

     return text;
    }

    parseInline(text) {
     // 数学公式行内 $...$ (保护不被实体高亮替换)
     const mathTokens = [];
     text = text.replace(/\$([^\$\n]+)\$/g, (m, math) => {
      const token = `__MATH_INLINE_${mathTokens.length}__`;
      mathTokens.push(`<span class="math-inline" data-tex="${this.escapeHtml(math)}">$${this.escapeHtml(math)}$</span>`);
      return token;
     });

     // 粗斜体 ***text***
     text = text.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
     // 粗体 **text**
     text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
     // 斜体 *text*
     text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
     // 删除线 ~~text~~
     text = text.replace(/~~([^~]+)~~/g, '<del>$1</del>');

     // 行内代码 `code` (代码内不进行实体胶囊化，保持原样)
     const codeTokens = [];
     text = text.replace(/`([^`]+)`/g, (m, code) => {
      const token = `__CODE_INLINE_${codeTokens.length}__`;
      codeTokens.push(`<code>${this.escapeHtml(code)}</code>`);
      return token;
     });

     // 链接 [text](url)
     text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:var(--tone-qi);text-decoration:none;border-bottom:1px dashed var(--tone-qi);">$1</a>');

     // 执行全景修仙词法高亮胶囊化
     text = this.highlightXianxiaEntities(text);

     // 还原行内代码与数学公式
     codeTokens.forEach((ct, i) => {
      text = text.replace(`__CODE_INLINE_${i}__`, ct);
     });
     mathTokens.forEach((mt, i) => {
      text = text.replace(`__MATH_INLINE_${i}__`, mt);
     });

     return text;
    }

    render(markdown) {
     this.toc = [];
     this.headerCount = 0;
     this.currentHeaderLevel = 1;
     this.isLeadParagraph = true;

     const lines = markdown.split(/\r?\n/);
     let html = '';
     let inCodeBlock = false;
     let codeBlockLang = '';
     let codeBlockBuffer = [];
     let inTable = false;
     let tableRows = [];
     let inList = false;
     let listType = 'ul';

     const closeTable = () => {
      if (!inTable) return;
      inTable = false;
      if (tableRows.length === 0) return;

      let tableHtml = '<div class="table-wrapper reveal-item"><table>';
      const headerRow = tableRows[0];
      tableHtml += '<thead><tr>';
      headerRow.forEach(cell => {
       tableHtml += `<th>${this.parseInline(cell)}</th>`;
      });
      tableHtml += '</tr></thead><tbody>';

      for (let i = 1; i < tableRows.length; i++) {
       tableHtml += '<tr>';
       tableRows[i].forEach(cell => {
        tableHtml += `<td>${this.parseInline(cell)}</td>`;
       });
       tableHtml += '</tr>';
      }
      tableHtml += '</tbody></table></div>';
      html += tableHtml;
      tableRows = [];
     };

     const closeList = () => {
      if (!inList) return;
      html += `</${listType}>`;
      inList = false;
     };

     for (let i = 0; i < lines.length; i++) {
      let line = lines[i];

      // 1. 代码块
      if (line.startsWith('```')) {
       if (!inCodeBlock) {
        closeTable();
        closeList();
        inCodeBlock = true;
        codeBlockLang = line.slice(3).trim();
        codeBlockBuffer = [];
       } else {
        inCodeBlock = false;
        const rawCode = codeBlockBuffer.join('\n');
        const escaped = this.escapeHtml(rawCode);

        if (codeBlockLang === 'mermaid') {
         html += `<div class="mermaid reveal-item" style="text-align:center; margin:20px 0;">${escaped}</div>`;
        } else {
         html += `
                    <div class="code-block-wrapper reveal-item">
                      <div class="code-header">
                        <span>${codeBlockLang || 'TEXT'}</span>
                        <button class="btn-copy" onclick="copyCode(this)">复制</button>
                      </div>
                      <pre><code class="language-${codeBlockLang}">${escaped}</code></pre>
                    </div>
                  `;
        }
        codeBlockBuffer = [];
       }
       continue;
      }

      if (inCodeBlock) {
       codeBlockBuffer.push(line);
       continue;
      }

      // 2. 表格行
      if (line.trim().startsWith('|') && line.trim().endsWith('|')) {
       closeList();
       const cells = line.split('|').slice(1, -1).map(c => c.trim());
       if (cells.every(c => /^:?-+:?$/.test(c))) {
        continue;
       }
       if (!inTable) {
        inTable = true;
        tableRows = [];
       }
       tableRows.push(cells);
       continue;
      } else {
       closeTable();
      }

      // 3. 独立块级数学公式 $$ ... $$
      if (line.startsWith('$$') && line.endsWith('$$') && line.length > 2) {
       closeList();
       const math = line.slice(2, -2).trim();
       html += `<div class="math-block reveal-item" data-tex="${this.escapeHtml(math)}">$$ ${this.escapeHtml(math)} $$</div>`;
       continue;
      }

      // 4. 标题 H1 ~ H6
      const headerMatch = line.match(/^(#{1,6})\s+(.*)$/);
      if (headerMatch) {
       closeList();
       const level = headerMatch[1].length;
       const titleText = headerMatch[2].trim();
       const id = `heading-${++this.headerCount}`;

       this.currentHeaderLevel = level;
       this.isLeadParagraph = (level === 1);

       this.toc.push({level, title: titleText, id});

       const parsedTitle = this.parseInline(titleText);
       html += `<h${level} id="${id}" class="reveal-item">${parsedTitle}</h${level}>`;
       continue;
      }

      // 5. 分割线
      if (/^(---|\*\*\*|___)$/.test(line.trim())) {
       closeList();
       html += '<hr class="reveal-item">';
       continue;
      }

      // 6. 引用块 >
      if (line.startsWith('>')) {
       closeList();
       const quoteContent = line.replace(/^>\s?/, '');
       html += `<blockquote class="reveal-item"><p>${this.parseInline(quoteContent)}</p></blockquote>`;
       continue;
      }

      // 7. 列表 (阶梯缩进)
      const ulMatch = line.match(/^(\s*)[-*+]\s+(.*)$/);
      const olMatch = line.match(/^(\s*)\d+\.\s+(.*)$/);

      if (ulMatch || olMatch) {
       const curType = ulMatch ? 'ul' : 'ol';
       const content = ulMatch ? ulMatch[2] : olMatch[2];
       if (!inList || listType !== curType) {
        closeList();
        inList = true;
        listType = curType;
        html += `<${listType} class="reveal-item">`;
       }
       html += `<li>${this.parseInline(content)}</li>`;
       continue;
      } else {
       closeList();
      }

      // 8. 阶梯式层次化段落排版
      if (line.trim().length > 0) {
       let pClass = 'reveal-item ';
       if (this.isLeadParagraph) {
        pClass += 'p-lead';
        this.isLeadParagraph = false;
       } else if (this.currentHeaderLevel === 2) {
        pClass += 'p-h2-sub';
       } else if (this.currentHeaderLevel === 3) {
        pClass += 'p-h3-sub';
       } else if (this.currentHeaderLevel >= 4) {
        pClass += 'p-h4-sub';
       } else {
        pClass += 'p-h2-sub';
       }

       html += `<p class="${pClass}">${this.parseInline(line)}</p>`;
      }
     }

     closeTable();
     closeList();
     return html;
    }
   }

   // ------------------------------------------------------------------------
   // 11.2 视口渐显进入观察器 (Scroll Reveal Observer - 从右到左滑入)
   // ------------------------------------------------------------------------
   let revealObserver = null;

   function setupScrollReveal() {
    if (revealObserver) {
     revealObserver.disconnect();
    }

    const items = document.querySelectorAll('.reveal-item');
    const viewportHeight = window.innerHeight;

    // 首屏可见项直接标记 revealed，避免闪烁
    items.forEach(el => {
     const rect = el.getBoundingClientRect();
     if (rect.top < viewportHeight + 50) {
      el.classList.add('revealed');
     }
    });

    // 视口交叉观察器：当新元素从底部进入时从右向左平滑浮现
    revealObserver = new IntersectionObserver((entries) => {
     entries.forEach(entry => {
      if (entry.isIntersecting) {
       entry.target.classList.add('revealed');
       revealObserver.unobserve(entry.target);
      }
     });
    }, {
     root: document.getElementById('main-viewport'),
     rootMargin: '0px 0px 40px 0px',
     threshold: 0.05
    });

    items.forEach(el => {
     if (!el.classList.contains('revealed')) {
      revealObserver.observe(el);
     }
    });
   }

   // ------------------------------------------------------------------------
   // 11.3 视图控制器与交互绑定
   // ------------------------------------------------------------------------
   const parser = new XianxiaMarkdownParser();
   const outputEl = document.getElementById('markdown-output');
   const tocNavEl = document.getElementById('toc-nav');
   const progressBar = document.getElementById('reading-progress-bar');
   const viewport = document.getElementById('main-viewport');
   const searchInput = document.getElementById('search-input');
   const currentChapterTitle = document.getElementById('current-chapter-title');
   const docStatsEl = document.getElementById('doc-stats');
   const btnBackTop = document.getElementById('btn-back-top');
   const sidebar = document.getElementById('sidebar');
   const topbar = document.getElementById('topbar');
   const fileInput = document.getElementById('file-input');

   let currentFontSize = 15;
   let headingsElements = [];

   function renderMarkdownContent(mdText) {
    // 渲染主文档
    const html = parser.render(mdText);
    outputEl.innerHTML = html;

    // 生成目录树
    let tocHtml = '';
    parser.toc.forEach(item => {
     if (item.level <= 3) {
      tocHtml += `<a href="#${item.id}" class="toc-item toc-level-${item.level}" data-target="${item.id}">${item.title}</a>`;
     }
    });
    tocNavEl.innerHTML = tocHtml;

    // 更新统计信息
    const charCount = mdText.length;
    const wordCount = (charCount / 1000).toFixed(1);
    docStatsEl.textContent = `共 ${charCount} 字 (~${wordCount}k字)`;

    // 收集标题元素供滚动高亮
    headingsElements = Array.from(outputEl.querySelectorAll('h1, h2, h3'));

    // 激活视口从右到左渐显进入动效
    setTimeout(setupScrollReveal, 50);

    // 异步尝试渲染 KaTeX 与 Mermaid
    enhanceMathAndDiagrams();
   }

   function enhanceMathAndDiagrams() {
    if (window.katex) {
     try {
      document.querySelectorAll('.math-inline').forEach(el => {
       const tex = el.getAttribute('data-tex');
       if (tex) katex.render(tex, el, {throwOnError: false});
      });
      document.querySelectorAll('.math-block').forEach(el => {
       const tex = el.getAttribute('data-tex');
       if (tex) katex.render(tex, el, {displayMode: true, throwOnError: false});
      });
     } catch (e) {
      console.warn('KaTeX 渲染降级:', e);
     }
    }

    if (window.mermaid) {
     try {
      mermaid.initialize({startOnLoad: false, theme: 'dark', darkMode: true});
      mermaid.run();
     } catch (e) {
      console.warn('Mermaid 渲染降级:', e);
     }
    }
   }

   // 滚动进度与大纲高亮
   viewport.addEventListener('scroll', () => {
    const scrollTop = viewport.scrollTop;
    const scrollHeight = viewport.scrollHeight - viewport.clientHeight;
    const percent = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
    progressBar.style.width = `${percent}%`;

    if (scrollTop > 300) {
     btnBackTop.classList.add('visible');
    } else {
     btnBackTop.classList.remove('visible');
    }

    let activeHeading = null;
    for (let i = 0; i < headingsElements.length; i++) {
     const el = headingsElements[i];
     const rect = el.getBoundingClientRect();
     if (rect.top <= 120) {
      activeHeading = el;
     } else {
      break;
     }
    }

    if (activeHeading) {
     const id = activeHeading.id;
     currentChapterTitle.textContent = activeHeading.textContent;
     document.querySelectorAll('.toc-item').forEach(item => {
      if (item.getAttribute('data-target') === id) {
       item.classList.add('active');
      } else {
       item.classList.remove('active');
      }
     });
    }
   });

   // 目录点击平滑滚动
   tocNavEl.addEventListener('click', (e) => {
    const targetLink = e.target.closest('.toc-item');
    if (targetLink) {
     e.preventDefault();
     const targetId = targetLink.getAttribute('data-target');
     const targetEl = document.getElementById(targetId);
     if (targetEl) {
      targetEl.scrollIntoView({behavior: 'smooth', block: 'start'});
      if (window.innerWidth <= 900) {
       sidebar.classList.remove('active');
      }
     }
    }
   });

   // 侧边栏切换
   document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
    if (window.innerWidth <= 900) {
     sidebar.classList.toggle('active');
    } else {
     sidebar.classList.toggle('collapsed');
     topbar.classList.toggle('sidebar-collapsed');
    }
   });

   // 字号放大/缩小
   document.getElementById('btn-zoom-in').addEventListener('click', () => {
    if (currentFontSize < 20) {
     currentFontSize += 1;
     document.documentElement.style.setProperty('--base-font-size', `${currentFontSize}px`);
    }
   });
   document.getElementById('btn-zoom-out').addEventListener('click', () => {
    if (currentFontSize > 12) {
     currentFontSize -= 1;
     document.documentElement.style.setProperty('--base-font-size', `${currentFontSize}px`);
    }
   });

   // 回到顶部
   btnBackTop.addEventListener('click', () => {
    viewport.scrollTo({top: 0, behavior: 'smooth'});
   });

   // 实时搜索检索
   searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
     const query = searchInput.value.trim().toLowerCase();
     if (!query) return;

     const elements = Array.from(outputEl.querySelectorAll('p, td, li, h1, h2, h3, h4, span'));
     for (let el of elements) {
      if (el.textContent.toLowerCase().includes(query)) {
       el.scrollIntoView({behavior: 'smooth', block: 'center'});
       el.style.outline = '2px solid var(--gold-bright)';
       setTimeout(() => {el.style.outline = '';}, 2000);
       break;
      }
     }
    }
   });

   // 动态载入本地外部 Markdown 文件
   fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
     const reader = new FileReader();
     reader.onload = (event) => {
      renderMarkdownContent(event.target.result);
      viewport.scrollTo({top: 0, behavior: 'smooth'});
     };
     reader.readAsText(file);
    }
   });

   // 拖拽 Markdown 文件至页面即刻渲染
   window.addEventListener('dragover', (e) => e.preventDefault());
   window.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer.files.length > 0) {
     const file = e.dataTransfer.files[0];
     if (file.name.endsWith('.md') || file.name.endsWith('.txt')) {
      const reader = new FileReader();
      reader.onload = (event) => {
       renderMarkdownContent(event.target.result);
       viewport.scrollTo({top: 0, behavior: 'smooth'});
      };
      reader.readAsText(file);
     }
    }
   });

   // 代码一键复制
   window.copyCode = function (button) {
    const pre = button.closest('.code-block-wrapper').querySelector('pre');
    if (pre) {
     navigator.clipboard.writeText(pre.innerText).then(() => {
      const originalText = button.textContent;
      button.textContent = '已复制!';
      button.style.borderColor = 'var(--tone-jade)';
      button.style.color = 'var(--tone-jade)';
      setTimeout(() => {
       button.textContent = originalText;
       button.style.borderColor = '';
       button.style.color = '';
      }, 2000);
     });
    }
   };

   // 初始加载内置总纲
   const defaultMd = document.getElementById('default-markdown').textContent;
   renderMarkdownContent(defaultMd);

  })();
 </script>
