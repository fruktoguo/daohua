<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>道化太初 · 战斗演武画廊 (Canvas v2)</title>
  <link rel="stylesheet" href="../../../frontend/src/styles/theme.css" />
  <link rel="stylesheet" href="../../../frontend/src/styles/expedition.css" />
  <link rel="stylesheet" href="../../../frontend/src/styles/vfx.css" />
  <link rel="stylesheet" href="./gallery.css" />
</head>
<body>
  <div class="gallery-app" id="galleryApp">
    <!-- 顶部栏 -->
    <header class="gallery-topbar">
      <div class="gallery-brand">
        <div class="gallery-brand-seal">演武</div>
        <div>
          <h1>道化太初 · 战斗演武画廊</h1>
          <p class="gallery-subtitle">双层 High-DPI Canvas 2D 特效引擎 · 21 主动技（含踏云 22 态）+ 10 内功心法 + 2 特质反应 + 11 战斗消耗品（共 55 项 VFX）</p>
        </div>
      </div>

      <div class="gallery-topbar-metrics">
        <span class="hud-pill" id="hudStageState">状态：待机</span>
        <span class="hud-pill is-accent" id="hudVfxCount">画布活动：0</span>
        <span class="hud-pill" id="hudFormationState">阵盘：未布阵</span>
        <span class="hud-pill" id="hudYixingState">身法：常态</span>
      </div>

      <div class="gallery-topbar-actions">
        <button type="button" class="btn-ctl is-active" id="btnCastSpeed" title="切换极速演武(0.18x 读条)或真实读条(1.0x)">极速读条 (0.18x)</button>
        <button type="button" class="btn-ctl" id="btnAutoDemo">自动演武</button>
        <button type="button" class="btn-ctl is-danger" id="btnReset">重置战局</button>
      </div>
    </header>

    <div class="selftest-banner" id="selftestBanner" hidden></div>

    <!-- 主演武舞台 + 右侧检视器 -->
    <main class="gallery-main">
      <section class="gallery-center-col">
        <!-- 双层画布舞台 -->
        <div class="arena-shell" id="arenaShell">
          <!-- 地层画布：阵盘、地面光环、地裂 -->
          <div class="vfx-ground-overlay" id="vfxGroundOverlay" aria-hidden="true"></div>

          <!-- 角色战场阵位 -->
          <div class="combat-arena-field arena-field" id="arenaField">
            <div class="arena-column is-allies" id="allyColumn">
              <div class="arena-column-title">我方道友（点击选为施法主控或疗愈目标）</div>
              <div class="arena-unit-list" id="allyUnitsContainer"></div>
            </div>
            <div class="arena-column is-enemies" id="enemyColumn">
              <div class="arena-column-title">妖邪敌阵（点击切换集火目标）</div>
              <div class="arena-unit-list" id="enemyUnitsContainer"></div>
            </div>
          </div>

          <!-- 天层画布：剑气、闪电、粒子、流光、浮字 -->
          <div class="vfx-stage-overlay" id="vfxOverlay" aria-hidden="true"></div>

          <!-- 左下/左上浮动读条与阵盘快捷激发 -->
          <div class="arena-cast-hud" id="castHud" hidden>
            <span class="cast-hud-name" id="castHudName">蓄势中</span>
            <div class="cast-hud-track"><div class="cast-hud-fill" id="castHudFill"></div></div>
            <span class="cast-hud-pct" id="castHudPct">0%</span>
          </div>

          <div class="arena-formation-hud" id="formationHud"></div>
        </div>

        <!-- 底部操作台：快捷栏 + 全量点映分类 -->
        <section class="gallery-console" id="actionConsole">
          <div class="console-hotbars">
            <div class="hotbar-group">
              <div class="hotbar-label">技能快捷栏 (1-6)</div>
              <div class="hotbar-slots" id="skillHotbar"></div>
            </div>
            <div class="hotbar-group">
              <div class="hotbar-label">丹符阵快捷栏 (Q-Y)</div>
              <div class="hotbar-slots" id="consumableHotbar"></div>
            </div>
          </div>

          <div class="console-tabs" id="consoleTabs" role="tablist">
            <button type="button" class="console-tab is-active" data-tab="all-active">全部主动技 (21)</button>
            <button type="button" class="console-tab" data-tab="physical">外功绝学 (9+踏云)</button>
            <button type="button" class="console-tab" data-tab="spell">内功法术 (12)</button>
            <button type="button" class="console-tab" data-tab="consumable">消耗品 · 丹符阵 (11)</button>
            <button type="button" class="console-tab" data-tab="showcase">连携 / 反馈演示</button>
            <button type="button" class="console-tab" data-tab="internal">内功心法周天 (10)</button>
          </div>

          <div class="console-catalog-grid" id="catalogGrid"></div>
        </section>
      </section>

      <!-- 右侧：数值细节检视 & 战况编年 -->
      <aside class="gallery-sidebar">
        <section class="inspector-card" id="detailCard">
          <div class="inspector-header">
            <h2>招式与器物详解</h2>
            <span class="inspector-tag" id="detailTag">就绪</span>
          </div>
          <div class="inspector-body" id="detailBody"></div>
        </section>

        <section class="inspector-card is-log-card">
          <div class="inspector-header">
            <h2>演武实时战报</h2>
            <button type="button" class="btn-mini" id="btnClearLog">清空</button>
          </div>
          <div class="combat-log-list" id="combatLog"></div>
        </section>
      </aside>
    </main>
  </div>

  <!-- 1. 引擎与真源清单 -->
  <script src="./vfx/core.js"></script>
  <script src="./vfx/catalog.js"></script>

  <!-- 2. 通用反馈特效 -->
  <script src="./vfx/feedback.js"></script>

  <!-- 3. 外功主动技能 (9) -->
  <script src="./vfx/abilities/heavy-slash.js"></script>
  <script src="./vfx/abilities/chain-strike.js"></script>
  <script src="./vfx/abilities/taunt.js"></script>
  <script src="./vfx/abilities/heavy-clouds.js"></script>
  <script src="./vfx/abilities/star-piercer.js"></script>
  <script src="./vfx/abilities/sui-gang.js"></script>
  <script src="./vfx/abilities/zhanyu.js"></script>
  <script src="./vfx/abilities/shunshan.js"></script>
  <script src="./vfx/abilities/pojun.js"></script>

  <!-- 4. 内功法术技能 (12) -->
  <script src="./vfx/abilities/palm-lightning.js"></script>
  <script src="./vfx/abilities/blazing-blast.js"></script>
  <script src="./vfx/abilities/qingping-melody.js"></script>
  <script src="./vfx/abilities/lightning-attraction.js"></script>
  <script src="./vfx/abilities/pozhen-melody.js"></script>
  <script src="./vfx/abilities/ganlu.js"></script>
  <script src="./vfx/abilities/tide.js"></script>
  <script src="./vfx/abilities/yueqian.js"></script>
  <script src="./vfx/abilities/huoyan-fengbao.js"></script>
  <script src="./vfx/abilities/tianlei-po.js"></script>
  <script src="./vfx/abilities/zhuoxin.js"></script>
  <script src="./vfx/abilities/shangui-yao.js"></script>

  <!-- 5. 内功心法周天护体 (10) 与战斗特质反应 (2) -->
  <script src="./vfx/abilities/internal-arts-t1.js"></script>
  <script src="./vfx/abilities/internal-arts-t2.js"></script>
  <script src="./vfx/abilities/trait-reactions.js"></script>

  <!-- 6. 战斗消耗品 (6 丹药 + 1 符箓 + 4 阵盘及反击触发) -->
  <script src="./vfx/consumables/pills.js"></script>
  <script src="./vfx/consumables/talismans.js"></script>
  <script src="./vfx/consumables/formations.js"></script>

  <!-- 6. 沙盒调度与画廊界面 -->
  <script src="./sandbox.js"></script>
  <script src="./gallery.js"></script>
</body>
</html>
