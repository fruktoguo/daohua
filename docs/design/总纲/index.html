<!DOCTYPE html>
<html lang="zh-CN">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>道化太初 · 设计总纲 (Master GDD)</title>

 <!-- 可选在线字体与样式增强 (断网时自动使用系统本地字体与离线排版) -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
  rel="stylesheet" media="print" onload="this.media='all'">

 <!-- KaTeX 在线数学公式渲染增强 (离线时优雅降级为等宽高亮) -->
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" media="print"
  onload="this.media='all'">
 <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

 <!-- Mermaid 在线流程图渲染增强 (离线时优雅降级为代码块) -->
 <script defer src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>

 <style>
  /* ==========================================================================
       1. 修仙暗墨古典美学基础变量体系
       ========================================================================== */
  :root {
   --bg-void: #050403;
   --bg-dark: #0b0906;
   --bg-card: rgba(16, 13, 9, 0.96);
   --bg-surface: rgba(28, 22, 15, 0.85);
   --bg-hover: rgba(48, 38, 25, 0.6);

   --gold-primary: #d4a853;
   --gold-bright: #f5d076;
   --gold-dim: #8e7033;
   --gold-border: rgba(212, 168, 83, 0.32);
   --gold-glow: rgba(212, 168, 83, 0.22);

   --tone-jade: #4ade80;
   --tone-jade-bg: rgba(74, 222, 128, 0.14);
   --tone-jade-border: rgba(74, 222, 128, 0.4);

   --tone-qi: #38bdf8;
   --tone-qi-bg: rgba(56, 189, 248, 0.14);
   --tone-qi-border: rgba(56, 189, 248, 0.4);

   --tone-danger: #f87171;
   --tone-danger-bg: rgba(248, 113, 113, 0.14);
   --tone-danger-border: rgba(248, 113, 113, 0.4);

   --tone-purple: #c084fc;
   --tone-purple-bg: rgba(192, 132, 252, 0.14);
   --tone-purple-border: rgba(192, 132, 252, 0.4);

   --tone-amber: #fbbf24;
   --tone-amber-bg: rgba(251, 191, 36, 0.14);
   --tone-amber-border: rgba(251, 191, 36, 0.4);

   --text-main: #e8e1d0;
   --text-bright: #ffffff;
   --text-muted: #a39886;
   --text-dim: #706757;

   --font-serif: "Noto Serif SC", "Kaiti SC", STKaiti, "Songti SC", SimSun, serif;
   --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
   --font-mono: "JetBrains Mono", Consolas, Monaco, "Courier New", monospace;

   --sidebar-width: 320px;
   --topbar-height: 56px;
   --base-font-size: 15px;
  }

  * {
   box-sizing: border-box;
   margin: 0;
   padding: 0;
  }

  html,
  body {
   width: 100%;
   height: 100%;
   background-color: var(--bg-void);
   color: var(--text-main);
   font-family: var(--font-sans);
   font-size: var(--base-font-size);
   line-height: 1.85;
   overflow: hidden;
   -webkit-font-smoothing: antialiased;
   -moz-osx-font-smoothing: grayscale;
  }

  /* 顶部流光细金阅读进度条 */
  #reading-progress-bar {
   position: fixed;
   top: 0;
   left: 0;
   height: 3px;
   width: 0%;
   background: linear-gradient(90deg, var(--gold-dim), var(--gold-bright), var(--tone-qi), var(--gold-bright));
   box-shadow: 0 0 14px var(--gold-primary), 0 0 4px var(--gold-bright);
   z-index: 1000;
   transition: width 0.1s ease-out;
   pointer-events: none;
  }

  /* ==========================================================================
       2. 整体全景流式布局拓扑 (宽屏自适应左右全填充)
       ========================================================================== */
  #app-container {
   display: flex;
   width: 100vw;
   height: 100vh;
   overflow: hidden;
   background:
    radial-gradient(circle at 10% 10%, rgba(45, 33, 18, 0.4) 0%, transparent 65%),
    radial-gradient(circle at 90% 90%, rgba(25, 18, 11, 0.5) 0%, transparent 55%),
    linear-gradient(180deg, #090805 0%, #040302 100%);
  }

  /* ==========================================================================
       3. 顶部修仙导航栏 (Topbar)
       ========================================================================== */
  #topbar {
   position: fixed;
   top: 0;
   left: var(--sidebar-width);
   right: 0;
   height: var(--topbar-height);
   background: rgba(12, 10, 6, 0.92);
   backdrop-filter: blur(16px);
   -webkit-backdrop-filter: blur(16px);
   border-bottom: 1px solid var(--gold-border);
   display: flex;
   align-items: center;
   justify-content: space-between;
   padding: 0 28px;
   z-index: 100;
   transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  #topbar.sidebar-collapsed {
   left: 0;
  }

  .topbar-left {
   display: flex;
   align-items: center;
   gap: 16px;
  }

  .btn-toggle-sidebar {
   background: rgba(26, 20, 13, 0.8);
   border: 1px solid var(--gold-border);
   color: var(--gold-primary);
   width: 34px;
   height: 34px;
   border-radius: 4px;
   cursor: pointer;
   display: flex;
   align-items: center;
   justify-content: center;
   transition: all 0.2s;
  }

  .btn-toggle-sidebar:hover {
   background: var(--bg-surface);
   border-color: var(--gold-bright);
   color: var(--gold-bright);
   box-shadow: 0 0 8px var(--gold-glow);
  }

  .topbar-title {
   font-family: var(--font-serif);
   font-size: 17px;
   font-weight: 700;
   color: var(--gold-bright);
   letter-spacing: 1px;
   display: flex;
   align-items: center;
   gap: 8px;
  }

  .topbar-right {
   display: flex;
   align-items: center;
   gap: 12px;
  }

  .search-box {
   position: relative;
   display: flex;
   align-items: center;
  }

  .search-input {
   background: rgba(22, 17, 11, 0.9);
   border: 1px solid var(--gold-border);
   color: var(--text-bright);
   padding: 6px 14px 6px 34px;
   border-radius: 4px;
   font-size: 13px;
   width: 240px;
   transition: all 0.2s;
   outline: none;
  }

  .search-input:focus {
   width: 320px;
   border-color: var(--gold-primary);
   box-shadow: 0 0 12px var(--gold-glow);
  }

  .search-icon {
   position: absolute;
   left: 11px;
   color: var(--gold-dim);
   pointer-events: none;
  }

  .topbar-btn {
   background: rgba(26, 20, 13, 0.8);
   border: 1px solid var(--gold-border);
   color: var(--text-main);
   padding: 5px 14px;
   border-radius: 4px;
   font-size: 13px;
   cursor: pointer;
   display: inline-flex;
   align-items: center;
   gap: 6px;
   transition: all 0.2s;
  }

  .topbar-btn:hover {
   background: var(--bg-surface);
   border-color: var(--gold-primary);
   color: var(--gold-bright);
   box-shadow: 0 0 8px var(--gold-glow);
  }

  /* ==========================================================================
       4. 左侧修仙大纲目录树 (Sidebar TOC)
       ========================================================================== */
  #sidebar {
   width: var(--sidebar-width);
   height: 100vh;
   background: rgba(10, 8, 5, 0.98);
   border-right: 1px solid var(--gold-border);
   display: flex;
   flex-direction: column;
   z-index: 150;
   flex-shrink: 0;
   transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  #sidebar.collapsed {
   transform: translateX(-100%);
  }

  .sidebar-header {
   padding: 16px 20px;
   border-bottom: 1px solid var(--gold-border);
   display: flex;
   align-items: center;
   gap: 12px;
   background: linear-gradient(180deg, rgba(32, 24, 15, 0.7) 0%, transparent 100%);
  }

  .taiji-badge {
   width: 32px;
   height: 32px;
   border-radius: 50%;
   border: 1.5px solid var(--gold-primary);
   display: flex;
   align-items: center;
   justify-content: center;
   background: #000;
   box-shadow: 0 0 10px var(--gold-glow);
   animation: taiji-spin 40s linear infinite;
  }

  @keyframes taiji-spin {
   from {
    transform: rotate(0deg);
   }

   to {
    transform: rotate(360deg);
   }
  }

  .sidebar-brand h1 {
   font-family: var(--font-serif);
   font-size: 16px;
   font-weight: 700;
   color: var(--gold-bright);
   letter-spacing: 1.5px;
  }

  .sidebar-brand p {
   font-size: 11px;
   color: var(--gold-dim);
   letter-spacing: 0.5px;
  }

  .sidebar-toc {
   flex: 1;
   overflow-y: auto;
   padding: 16px 12px;
  }

  .sidebar-toc::-webkit-scrollbar {
   width: 4px;
  }

  .sidebar-toc::-webkit-scrollbar-thumb {
   background: var(--gold-dim);
   border-radius: 2px;
  }

  .toc-item {
   display: block;
   padding: 6px 10px;
   margin-bottom: 2px;
   color: var(--text-muted);
   text-decoration: none;
   font-size: 13px;
   border-radius: 4px;
   border-left: 2px solid transparent;
   transition: all 0.15s;
   white-space: nowrap;
   overflow: hidden;
   text-overflow: ellipsis;
  }

  .toc-item:hover {
   color: var(--gold-bright);
   background: var(--bg-hover);
  }

  .toc-item.active {
   color: var(--gold-bright);
   background: rgba(212, 168, 83, 0.15);
   border-left-color: var(--gold-primary);
   font-weight: 600;
  }

  .toc-level-1 {
   font-family: var(--font-serif);
   font-size: 14px;
   font-weight: 700;
   color: var(--gold-primary);
   margin-top: 12px;
  }

  .toc-level-2 {
   padding-left: 18px;
  }

  .toc-level-3 {
   padding-left: 30px;
   font-size: 12px;
   opacity: 0.85;
  }

  .sidebar-footer {
   padding: 12px 16px;
   border-top: 1px solid var(--gold-border);
   font-size: 11px;
   color: var(--text-dim);
   display: flex;
   justify-content: space-between;
   align-items: center;
   background: rgba(8, 7, 5, 0.9);
  }

  /* ==========================================================================
       5. 右侧主视口与左右全填充流式阅读区 (Main Content)
       ========================================================================== */
  #main-viewport {
   flex: 1;
   height: 100vh;
   overflow-y: auto;
   padding-top: calc(var(--topbar-height) + 24px);
   padding-bottom: 90px;
   scroll-behavior: smooth;
  }

  #main-viewport::-webkit-scrollbar {
   width: 8px;
  }

  #main-viewport::-webkit-scrollbar-track {
   background: var(--bg-void);
  }

  #main-viewport::-webkit-scrollbar-thumb {
   background: rgba(212, 168, 83, 0.35);
   border-radius: 4px;
   box-shadow: 0 0 6px var(--gold-glow);
  }

  #main-viewport::-webkit-scrollbar-thumb:hover {
   background: var(--gold-primary);
  }

  /* 宽屏流式自适应全填充容器 */
  .content-container {
   width: 100%;
   padding: 0 44px;
   position: relative;
  }

  /* 装饰底框与折角金纹 */
  .stone-card-wrapper {
   position: relative;
   width: 100%;
   background: var(--bg-card);
   border: 1px solid var(--gold-border);
   border-radius: 6px;
   padding: 44px 52px;
   box-shadow: 0 10px 50px rgba(0, 0, 0, 0.9);
   backdrop-filter: blur(14px);
   -webkit-backdrop-filter: blur(14px);
  }

  /* 四角折角装饰 */
  .corner-decor {
   position: absolute;
   width: 14px;
   height: 14px;
   border-color: var(--gold-primary);
   pointer-events: none;
  }

  .corner-tl {
   top: -1px;
   left: -1px;
   border-top: 2px solid;
   border-left: 2px solid;
  }

  .corner-tr {
   top: -1px;
   right: -1px;
   border-top: 2px solid;
   border-right: 2px solid;
  }

  .corner-bl {
   bottom: -1px;
   left: -1px;
   border-bottom: 2px solid;
   border-left: 2px solid;
  }

  .corner-br {
   bottom: -1px;
   right: -1px;
   border-bottom: 2px solid;
   border-right: 2px solid;
  }

  /* ==========================================================================
       6. 视口从右向左渐显进入动效 (Right-to-Left Scroll Reveal Animation)
       ========================================================================== */
  .reveal-item {
   opacity: 0;
   transform: translateX(36px);
   filter: blur(4px);
   transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
    filter 0.6s cubic-bezier(0.16, 1, 0.3, 1);
   will-change: opacity, transform, filter;
  }

  .reveal-item.revealed {
   opacity: 1;
   transform: translateX(0);
   filter: blur(0);
  }

  /* ==========================================================================
       7. 阶梯式层次段落缩进与古籍排版体系 (Hierarchical Indentation)
       ========================================================================== */

  /* 篇章总括导言 (H1 紧随导言) */
  .p-lead {
   font-size: 1.05em;
   color: var(--text-bright);
   line-height: 1.9;
   margin: 16px 0 24px 0;
   padding: 12px 18px;
   background: rgba(32, 24, 15, 0.5);
   border-left: 3px solid var(--gold-primary);
   border-radius: 0 4px 4px 0;
   text-indent: 0 !important;
  }

  /* H2 小节段落 (标准首行缩进 2em，层次鲜明) */
  .p-h2-sub {
   text-indent: 2em;
   margin-bottom: 16px;
   color: var(--text-main);
   text-align: justify;
   padding-left: 4px;
  }

  /* H3 深层细则段落 (阶梯式向右缩进 20px，带有淡金导引线) */
  .p-h3-sub {
   margin-left: 20px;
   padding-left: 14px;
   border-left: 1.5px dashed rgba(212, 168, 83, 0.25);
   text-indent: 2em;
   margin-bottom: 14px;
   color: #dfd7c5;
  }

  /* H4/H5 极细段落 */
  .p-h4-sub {
   margin-left: 36px;
   padding-left: 12px;
   border-left: 1px solid rgba(212, 168, 83, 0.15);
   text-indent: 2em;
   margin-bottom: 12px;
   color: #cec5b1;
  }

  /* 普通未分类段落 fallback */
  .markdown-body p {
   margin-bottom: 16px;
   color: var(--text-main);
   text-align: justify;
  }

  /* ==========================================================================
       8. 修仙发光胶囊体系 (Xianxia Glowing Capsule Badges)
       ========================================================================== */
  .capsule {
   display: inline-flex;
   align-items: center;
   gap: 3px;
   padding: 1px 7px;
   border-radius: 4px;
   font-size: 0.88em;
   font-weight: 600;
   line-height: 1.45;
   white-space: nowrap;
   vertical-align: baseline;
   margin: 0 2px;
   border: 1px solid;
   box-shadow: 0 0 6px rgba(0, 0, 0, 0.4);
   transition: all 0.15s ease;
   text-indent: 0 !important;
  }

  .capsule:hover {
   transform: translateY(-1px);
   filter: brightness(1.2);
  }

  /* 1. 境界徽章胶囊 (Realm Badge) */
  .capsule-realm {
   border-color: #f5d076;
   background: linear-gradient(180deg, rgba(212, 168, 83, 0.28) 0%, rgba(142, 112, 51, 0.2) 100%);
   color: #fff4d1;
   box-shadow: 0 0 8px rgba(245, 208, 118, 0.35);
   font-family: var(--font-serif);
   font-weight: 700;
  }

  /* 2. 八品品质色彩胶囊 */
  .capsule-q1 {
   border-color: #d1d5db;
   background: rgba(209, 213, 219, 0.12);
   color: #f3f4f6;
  }

  /* 凡品 白 */
  .capsule-q2 {
   border-color: #4ade80;
   background: rgba(74, 222, 128, 0.15);
   color: #86efac;
   box-shadow: 0 0 6px rgba(74, 222, 128, 0.25);
  }

  /* 黄品 绿 */
  .capsule-q3 {
   border-color: #38bdf8;
   background: rgba(56, 189, 248, 0.15);
   color: #7dd3fc;
   box-shadow: 0 0 6px rgba(56, 189, 248, 0.25);
  }

  /* 玄品 蓝 */
  .capsule-q4 {
   border-color: #c084fc;
   background: rgba(192, 132, 252, 0.18);
   color: #e9d5ff;
   box-shadow: 0 0 8px rgba(192, 132, 252, 0.35);
  }

  /* 地品 紫 */
  .capsule-q5 {
   border-color: #fbbf24;
   background: rgba(251, 191, 36, 0.2);
   color: #fef08a;
   box-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
  }

  /* 天品 金 */
  .capsule-q6 {
   border-color: #fb923c;
   background: rgba(251, 146, 60, 0.22);
   color: #fed7aa;
   box-shadow: 0 0 10px rgba(251, 146, 60, 0.45);
  }

  /* 灵品 橙 */
  .capsule-q7 {
   border-color: #f87171;
   background: rgba(248, 113, 113, 0.25);
   color: #fecaca;
   box-shadow: 0 0 12px rgba(248, 113, 113, 0.5);
  }

  /* 圣品 红 */
  .capsule-q8 {
   border-color: #e879f9;
   background: linear-gradient(90deg, rgba(232, 121, 249, 0.25), rgba(56, 189, 248, 0.25));
   color: #fdf4ff;
   box-shadow: 0 0 14px rgba(232, 121, 249, 0.6);
  }

  /* 帝品 彩 */

  /* 3. 战斗属性胶囊 */
  .capsule-hp {
   border-color: var(--tone-jade-border);
   background: var(--tone-jade-bg);
   color: var(--tone-jade);
  }

  .capsule-mp {
   border-color: var(--tone-qi-border);
   background: var(--tone-qi-bg);
   color: var(--tone-qi);
  }

  .capsule-ad {
   border-color: rgba(245, 208, 118, 0.4);
   background: rgba(212, 168, 83, 0.15);
   color: #fde047;
  }

  .capsule-ap {
   border-color: rgba(56, 189, 248, 0.4);
   background: rgba(56, 189, 248, 0.15);
   color: #67e8f9;
  }

  .capsule-armor {
   border-color: rgba(251, 191, 36, 0.4);
   background: rgba(251, 191, 36, 0.12);
   color: #fde68a;
  }

  .capsule-mr {
   border-color: rgba(192, 132, 252, 0.4);
   background: rgba(192, 132, 252, 0.12);
   color: #d8b4fe;
  }

  .capsule-crit {
   border-color: rgba(248, 113, 113, 0.4);
   background: rgba(248, 113, 113, 0.15);
   color: #fca5a5;
  }

  .capsule-break {
   border-color: rgba(251, 146, 60, 0.4);
   background: rgba(251, 146, 60, 0.15);
   color: #fdba74;
  }

  /* 4. 百分比与增益/减益数值胶囊 */
  .capsule-gain {
   border-color: rgba(74, 222, 128, 0.45);
   background: rgba(74, 222, 128, 0.16);
   color: #86efac;
   font-weight: 700;
  }

  .capsule-loss {
   border-color: rgba(248, 113, 113, 0.45);
   background: rgba(248, 113, 113, 0.16);
   color: #fca5a5;
   font-weight: 700;
  }

  .capsule-scale {
   border-color: rgba(56, 189, 248, 0.45);
   background: rgba(56, 189, 248, 0.16);
   color: #7dd3fc;
   font-weight: 700;
  }

  .capsule-special {
   border-color: rgba(212, 168, 83, 0.4);
   background: rgba(212, 168, 83, 0.12);
   color: var(--gold-bright);
  }

  /* 5. 装备槽位胶囊 */
  .capsule-slot {
   border-color: rgba(212, 168, 83, 0.4);
   background: rgba(36, 28, 18, 0.85);
   color: var(--gold-bright);
   font-family: var(--font-serif);
   font-size: 0.85em;
  }

  /* ==========================================================================
       9. Markdown 标题与元素样式
       ========================================================================== */
  .markdown-body h1 {
   font-family: var(--font-serif);
   font-size: 26px;
   font-weight: 900;
   color: var(--gold-bright);
   letter-spacing: 1.5px;
   margin: 48px 0 20px 0;
   padding-bottom: 14px;
   border-bottom: 1px solid var(--gold-border);
   display: flex;
   align-items: center;
   gap: 12px;
   text-shadow: 0 0 24px var(--gold-glow);
  }

  .markdown-body h1:first-child {
   margin-top: 0;
  }

  .markdown-body h2 {
   font-family: var(--font-serif);
   font-size: 20px;
   font-weight: 700;
   color: var(--gold-primary);
   letter-spacing: 1px;
   margin: 36px 0 16px 0;
   padding-left: 12px;
   border-left: 3.5px solid var(--gold-primary);
  }

  .markdown-body h3 {
   font-family: var(--font-serif);
   font-size: 16.5px;
   font-weight: 700;
   color: var(--text-bright);
   margin: 28px 0 12px 20px;
   padding-left: 8px;
   border-left: 2px solid rgba(212, 168, 83, 0.5);
  }

  .markdown-body h4,
  .markdown-body h5,
  .markdown-body h6 {
   font-size: 14.5px;
   font-weight: 600;
   color: var(--gold-bright);
   margin: 20px 0 8px 36px;
  }

  .markdown-body strong {
   color: var(--gold-bright);
   font-weight: 700;
  }

  .markdown-body em {
   color: var(--tone-qi);

# 第一篇 核心哲学与顶层定位

## 1.1 产品定义
《道化太初》是一款以**服务端权威、高确定性离散事件推进（DES）、长线挂机放置**为核心的修仙 RPG 游戏。玩家绝大多数成长行为通过行动队列驱动，离线挂机与在线游玩具有完全等价的确定性数学模拟结果。

## 1.2 核心设计铁律
1. **怪我完全同构 (Monster-Player Isomorphism)**：怪物在领域模型中与玩家完全同构，共享同一套 14 基础属性池、技能装配逻辑、暴击破招对抗与抗性减伤公式，杜绝给怪物编写特殊隐藏补正。
2. **数值全域使用 `double` 精度**：所有属性、收益率、倍率、战斗伤害、时间与计数，计算与存储一律采用 IEEE 754 `double` 精度（百分比存储为 `double` 点数，1 点 = 1%），杜绝整数截断与精度损失。
3. **离散事件飞跃推进 (Discrete Event Simulation)**：游戏推进不依赖固定帧逐秒轮询，而是跳跃至下一个行动或战斗阶段的到期时间戳进行原子状态跃迁。
4. **长线数值闭环量化**：杜绝拍脑袋配表，全量技能、装备、丹药与怪物属性均由顶层数学模型（期望属性池、部位权重、质量预算）确定性推导。
5. **玩家三态生命周期（核心主旨，不可变更）**：角色在任意时刻仅处于以下三种状态之一，状态语义不再谈判——
   - **在线**：行动、战斗、旅行等全部运算在服务端实时进行，事件消息实时推送；
   - **离线挂机**：断线未达离线时长上限（收益封顶线）。收益按确定性规则持续产生，但实时调度降级为批量冷算——队伍中有人在线时全员强制实时（在线成员须收到真实事件推送）；全员离线时不再实时推进，可按小时级批次统一结算，批算任务在主服与计算节点之间按负载分配。未轮到批算即回线的玩家，由主服即时完全补算到当前时刻；
   - **彻底离线**：断线超过离线时长上限。有队伍者直接退队、行动队列整体暂停；进入该状态时完成一次覆盖「断线→上限边界」的收益补算（补算本身可走非实时派发），省得下次登录再即时补算；
   - **切换阈值**：在线 → 离线挂机存在连续离线宽限（当前口径 5 分钟），断开瞬间不得立即按离线挂机处置。离线时长上限（当前 48 小时）自断线时刻起算，服务端执行口径见总纲18 §14。
6. **本地开发兼容清零**：在内测开发期直接废弃历史兼容包袱，不保留双读双写与兼容适配器，以代码精简、架构清晰为第一原则。

# 第二篇 角色核心与常驻实体设计

> **文档版本**：v1.0.0 权威标准版  
> **更新时间**：2026-08-24  
> **所属体系**：游戏顶层哲学 / 角色领域模型 / 状态连续性 / 聚合模型与数值架构  
> **适用范围**：`src/Domain` 领域规则、`src/Server` 运行时调度、`src/Protocol` 协议 DTO、`frontend` 交互呈现与后续玩法拓展（秘境、PvP 等）

---

## 2.1 角色核心设计哲学（Core Philosophy）

### 2.1.1 统一常驻实体原理（The Unified Living Entity Principle）

在《道化太初》中，**修仙者角色是一个连续存在、拥有完整生命体征与修行底盘的“统一常驻实体”**。
- **拒绝孤立子系统**：彻底打破传统 RPG 将移动跑图、生产采集、打坐修炼、副本战斗、切磋竞技割裂为相互独立、状态互不连通的临时模块的做法。
- **同一性与守恒性**：无论是长途跋涉跨越大洲、在灵田采撷灵草、于丹房开炉炼药、在秘境斩妖伏魔，还是后续参与仙门切磋与玩家对决，**底层和设计上永远是这同一个角色实体在经历世间万象**。
- **状态不重置**：角色的气血、灵力、神识、增益（Buff）、负面状态（Debuff）、境界修为、随身储物与疲惫损伤，在时间轴上保持 100% 的连续演进，不因动作切换或界面跳转而凭空回满或重置。

```text
               ┌────────────────────────────────────────────────────────┐
               │           统一常驻修仙者实体 (Living Character Entity)   │
               ├────────────────────────────────────────────────────────┤
               │  • 生命体征：当前气血 (HP)、灵力 (MP)、技能/消耗品冷却   │
               │  • 修行底盘：境界等级、修为/底蕴/战斗经验、寿元、灵根、突破瓶颈 │
               │  • 常驻增益：各类丹药药效、祈福、伤病、负面 Debuff      │
               │  • 战备装配：主修心法、神通术法、六部位穿戴、技艺工具   │
               │  • 随身资产：储物袋物品、灵石、世界大地图驻留坐标       │
               └────────────────────────────────────────────────────────┘
                                      ▲
                                      │ 原地读写 / 连续演进 (In-Place Mutation)
               ┌──────────────────────┴────────────────────────┐
               │              世界与行为作用力 (World Forces)   │
               ├───────────────────────────────────────────────┤
               │  • 大地图旅行 (Travel)       -> 产生位移，消耗体魄/灵力 │
               │  • 洞府修炼 (Cultivation)   -> 吸纳灵气，增进修为     │
               │  • 灵野采集 (Gathering)     -> 消耗精力，产出天材地宝 │
               │  • 炉鼎炼丹 (Alchemy)       -> 消耗药材/灵力，产出灵丹│
               │  • 斩妖历练 (Combat)        -> 真实攻防损耗，结算战果 │
               │  • 秘境探索 / 切磋 (PvP)    -> 继承即时状态入场交锋   │
               └───────────────────────────────────────────────┘
```

### 2.1.2 行为与系统的“环境作用力”模型（Action as Environmental Force）

在系统交互模型上：
- **角色是状态的唯一容器**：所有的属性、资源与标记仅存储在角色实体上；
- **各类系统与行动是“外部作用力”**：移动、采集、炼丹、打坐、战斗并非持有独立生命周期的子程序，而是作为施加在角色身上的“环境作用力”。它们读取角色的当前状态作为前置判定，并在执行过程中将消耗、收益、创伤与增益**直接写回角色本身**。

### 2.1.3 确定性时空连续性（Deterministic Spatiotemporal Continuity）

- **离散事件推进（DES）的一致性**：无论玩家保持 WebSocket 实时在线、高频切换网络，还是完全断线离线长达数十小时，角色状态的推进逻辑完全一致。
- **离线快进等价于在线驻留**：服务端的确定性模拟引擎（`SimulationEngine`）基于时间轴推进。离线 8 小时的快进补算结果，与在线保持连接 8 小时逐秒计算得出的血量、灵力、修为与 Buff 衰减状态**完全等价、无缝自洽**。

---

## 2.2 角色多维体征与数据模型（Character Anatomy & Data Model）

角色实体在领域层聚合为一套完整自洽的数据网络，所有数值计算与持久化严格遵循 `double` 高精度规约。

### 2.2.1 精气神基础生命体征（Vital Signs）

| 体征属性 | 符号/字段 | 类型 | 设计定位与业务语义 |
| :--- | :--- | :--- | :--- |
| **当前气血** | `Hitpoints` | `double` | 玩家的生命底线。受战斗伤害、极恶环境侵蚀或特殊功法反噬损耗。脱战不自动回满；依靠自然回复属性、疗伤丹药或调息恢复；降至 0 即为力竭/阵亡。 |
| **当前灵力/法力** | `Manapoints` | `double` | 玩家体内周天运转的灵气储备。施展神通、催动法宝、御剑飞天、开炉控火等一切超凡行为的能量消耗。脱战不自动回满，需通过打坐纳气或回灵丹药补充。 |
| **回复周期余量** | `PlayerCombatState.RegenCarrySeconds` | `double` | 自然回复周期内不足一次结算的累计秒数。用于在低频/高频状态推演中保证回复计算无截断误差；现行实现战斗体征字段全部为 `double`，不再使用 long+Remainder 整数进位。 |
| **神通冷却** | `PlayerCombatSkillState.Cooldowns` | `IReadOnlyList<CombatSkillCooldown>` | 各已装配神通的剩余冷却秒数与吟唱状态，跨行动与脱战后持续倒计时，不受动作切换中断。 |
| **消耗品槽位冷却**| `AutoUseSlotState.CooldownUntilUnixSeconds` | `double` | 各自动使用槽位的绝对冷却就绪时间戳（Unix 秒）。 |

### 2.2.2 修仙境界与成长四池（Cultivation & Realm）

- **十一大境界**：凡俗、练气、筑基、金丹、元婴、化神、炼虚、合体、大乘、渡劫、飞升（涵盖修行四期；数值底座见 `总纲` 第十一篇）。其中凡俗（Lv 1~18）下含 18 个有名小境界：凡胎、炼皮、锻骨、易筋、洗髓、养气、通脉、瑶光、开阳、玉衡、天权、天玑、天璇、天枢、宗师、大宗师、临渊、叩仙门；凡胎、叩仙门为小境界名，不再是大境界。
- **成长四池（`PlayerProgression` / `PlayerLoadout` 字段清单）**：
  - **修为（`Progression.Experience`）**：当前层突破计量条，即顶部进度条；以配表 `expToNext[realmLevel]` 封顶，突破时清零；
  - **底蕴（`Progression.Foundation`）**：修为满层后继续获得的修为 100% 沉淀为底蕴；修为未满层时每 1 点底蕴兑换 1 点额外修为（单笔最高 3 倍，底蕴耗尽即止），突破不清空；
  - **战斗经验（`Progression.CombatExperience`）**：每次修为类收益按增幅前基础量等额入账、不受任何加成；参与命中/闪避对抗修正（口径见 [第七篇 §7.7.6](./07-战斗数值与内视规约.md)），突破不清空；
  - **六维经验（`Loadout.CoreAttributes`）**：体魄/经脉/力道/根骨/身法/神识各自经验（`StaminaExp` 等六字段），等级由 `RootAttributeCurve` 经 `RealmProgressionCatalog` 派生的 381 点成本表导出（曲线口径见 [第三篇 §3.2.2](./03-修仙境界与四乘区数值底座.md)）。
- **总修为（`Progression.LifetimeExperience`）**：历史修为类收益总量（增幅后口径，含满层转底蕴部分），单调递增永不清零；为前端「总修为」悬浮条数据源。
- **突破瓶颈状态（IsPendingBreakthrough）**：当修为达到当前境界上限（`expToNext`）时触发，修为停止增长、溢出沉淀为底蕴，必须完成突破心魔、渡劫或服用破境丹药方可晋升下一小境界。
- **寿元与道龄（Lifespan & Age）**：依据境界决定寿元上限，随时间与特定禁术消耗自然流逝。

### 2.2.3 核心先天与后天属性（Attributes Matrix）

> **量化落地口径**：战斗侧的属性量化以 [战斗设计 §7.5 六维根基](./07-战斗数值与内视规约.md)（体魄/经脉/根骨/力道/神识/身法）为准；本节为先天/后天能力的概念分层，生活与探索维度在对应系统设计时归入同一份角色底盘，不另建平行属性模型。

角色的战斗与日常行为能力统一基于以下四维与五行底盘展开：
1. **气血与体魄（Constitution）**：决定基础生命上限、物理防御、负重能力以及对恶劣环境的耐受力；
2. **灵力与神识（Divine Sense）**：决定法力上限、法术暴击、命中率、大世界侦测范围与高阶采集/炼丹感知精度；
3. **悟性与心境（Perception & Mind）**：影响神通领悟研读速度、打坐修炼吸纳效率与破境成功率；
4. **身法与遁速（Agility）**：影响战斗行动速度、先手闪避、大地图御剑飞行与长途跋涉耗时；
5. **五行灵根（Five-Element Roots）**：金、木、水、火、土五行亲和度，直接决定对应属性神通的增减伤（五行增伤/五行减伤亲和，点数见 [第七篇](./07-战斗数值与内视规约.md) §7.7.5）。

### 2.2.4 武道装配与战备底盘（Loadout & Equipment）

- **功法体系（Dynamic Kungfu Slots）**：
  - **首位核心主修心法（Internal Core）**：常驻被动心法基座——装配即生效、不进入施放序列；定位为**经验获取调整器**：六维经验非守恒乘率重分配（主升/献祭塑形）＋参悟等级放大总量效率＋修为增减点＋常驻面板效果，字段与首批清单见 [第五篇 §5.3](./05-技能神通与秘籍残卷体系.md)；
  - **动态扩展神通槽位（Active Spells）**：随境界提升逐步解锁的战斗与辅助主动法术序列。
- **六大装备部位（Six Equipment Slots）**：
  - `weapon`（武器/神兵）、`head`（头部/道冠）、`armor`（衣服/宝甲）、`legs`（下装/胫甲）、`boots`（鞋履/行云履）、`trinket`（饰品/法宝灵佩）。
  - 各部位遵循严格的数值预算守恒模型，提供基础属性、增减伤修饰与附加词缀。
- **生活技艺工具槽位（Artisan Tool Slots）**：
  - 预留药锄、灵火鼎、探矿罗盘等生活生产专属工具，直接赋能采集与生产行为。

### 2.2.5 随身空间与大世界坐标（Spatial Presence & Storage）

- **随身储物与灵石（AssetWallet + economy 关系表）**：材料、丹药、法宝、战利品与灵石等随身资产**不放入玩家聚合分段**，统一由运行时 `AssetWallet` 钱包视图 + `economy.player_asset_balances` / `economy.player_asset_instances` 关系表承载，支持全自动消耗、堆叠与事务内原子扣减。灵石为修仙界通用硬通货，用于坊市交易、传送法阵消耗或阵法驱动。
- **大世界驻留节点（`PlayerWorldState`）**：记录角色当前所处的地理节点/边与坐标（如“云来集”、“青云门山门”等），位移动作会真实改变该坐标。

## 2.3 状态连续性与跨玩法流转（Cross-System State Continuity）

### 2.3.1 跨行为状态无缝穿透（Seamless State Penetration）

角色状态在各种行为切换之间**完全透明继承**，不存在任何形式的状态重置边界：

```text
 场景 A (历练受伤 -> 日常调理):
 ┌────────────────┐ 战斗结算扣减至 20% HP ┌────────────────┐ 动作队列自动轮转 ┌────────────────┐
 │ 幽林斩妖 (战斗) │ ───────────────────> │ 角色实体保留残血 │ ───────────────> │ 打坐调息 / 嗑药 │
 └────────────────┘                      └────────────────┘                 └────────────────┘
                                                                                    │ 真实消耗丹药/时间
                                                                                    ▼
                                                                            ┌────────────────┐
                                                                            │ 状态逐步恢复饱满 │
                                                                            └────────────────┘

 场景 B (日常准备 -> 突发切磋/秘境):
 ┌────────────────┐ 炼丹消耗 50% 灵力     ┌────────────────┐ 直入秘境/切磋   ┌────────────────┐
 │ 洞府炼丹 (制造) │ ───────────────────> │ 角色实体灵力半空 │ ───────────────> │ 以半蓝状态迎敌  │
 └────────────────┘                      └────────────────┘                 └────────────────┘
```

1. **战后创伤保留**：历练脱战后，血量与法力保持结算时的即时值。若玩家带伤切入采集或跑图，角色依然处于虚弱状态，若遭遇野外突发危险将承担更高风险。
2. **日常消耗穿透至战斗**：长途赶路御剑消耗的灵气、炼丹损耗的心神，若未及时打坐或服丹补充，直接作为战斗入场时的初始状态。
3. **装备与属性实时生效**：任何时刻更换装备、升级功法，其带来的属性变更（如最大生命上限提升、抗性变化）即刻作用于实体，并按比例或绝对值平滑过渡。

### 2.3.2 增益/减益（Buff/Debuff）的实体级统一定时衰减与多维共鸣

- **实体级挂载**：所有 Buff（无论是服用灵丹、阵法加持、环境影响还是受到的诅咒中毒）统一挂载在角色的 `Buffs` 列表中，记录其绝对过期时间戳（`ExpiresAt`）。
- **统一时间轴演进**：Buff 的生命周期由 `SimulationEngine.AdvanceTo` 模拟时间推进驱动，在跨越移动、打坐、炼丹与战斗时**连续倒计时，绝不因动作切换而刷新或提前清除**。
- **多维跨界效能**：单一 Buff 具备穿透多系统的能力。例如：
  - 一枚兼具身法与攻速增益的灵丹，在跑图时缩短位移耗时，在进入战斗时则直接提升攻击频次；
  - 一种降低全属性的剧毒 Debuff，既在战斗中削弱输出，又在炼丹时降低成丹概率，在打坐时增加走火入魔风险。

### 2.3.3 战斗脱战真实继承与 1 HP 濒死复苏机制（Post-Combat Retention & Respawn）

- **常规脱战继承**：战斗胜利或主动脱战时，角色的剩余气血、剩余灵力、技能冷却时间 1:1 原地写回 `CombatResources`，不予补满。
- **阵亡与 1 HP 濒死复苏**：
  - 当角色在战斗或极端环境中气血降至 0（`Hitpoints <= 0`）判定为阵亡/力竭；
  - 角色不会被销毁或硬性永久死亡，而是触发**脱战濒死复苏机制**：脱战后生命值自动恢复为 **1 点（1 HP）**；**灵力持续自然回复并保留**（死亡期间 MP 回复不中断，与 `总纲` §7.9 口径一致）；
  - 濒死状态下，高危险行动（如高阶秘境、斩妖历练）将因前置体征不足而受阻（Blocked），促使玩家安排休整或自动消耗补血药物。

### 2.3.4 秘境探索与切磋 PvP 的真实入场机制（Real-State Entrance for Dungeons & PvP）

> **实现状态**：本节为**规划意图，尚未落地**。当前战斗为 `CombatExpeditionState` 远征状态机，`BattleSnapshot`、秘境与 PvP 在代码中均无实现；落地时必须遵守下列设计红线。

- **无单独虚拟镜像**：后续拓展的秘境探索、宗门战或切磋对决（PvP），**严禁创建脱离主实体的“临时满状态克隆体”**；
- **即时快照切片**：入场交锋时，系统基于角色的即时物理状态（当前 HP/MP、当前装备、当前生效 Buff）生成当前局的战斗快照（`BattleSnapshot`）；
- **交锋结果闭环写回**：战斗中消耗的法宝耐久、药品、受到的伤病以及最终剩余气血，结算后直接原地反哺写回玩家常驻实体，维持全宇宙状态唯一性。

## 2.4 行动队列与物理状态互锁（Action Queue & Physical Interlocking）

### 2.4.1 前置体征准入条件（Pre-condition Gating）

每个行动的启动均需对角色的即时物理状态进行前置校验（`CanStartAction`）：
1. **生命条件**：气血必须处于健康存活状态（`Hitpoints > 0`），濒死（1 HP）且无回复手段时禁止开启高烈度历练；
2. **灵力条件**：高阶炼丹、御剑远行需满足最低启动灵力门槛，灵力枯竭时无法催动；
3. **空间条件**：角色的世界驻留节点必须在行动的允许可用节点集合内（`AvailableNodeIds`）；
4. **材料与道具条件**：随身储物袋必须包含该动作所需的全部输入原料（`Inputs`）。

### 2.4.2 动作阻断与自动跳过机制（Action Blocked & Queue Rotation）

- **条件不满足时的阻断**：当队列头部动作因角色当前状态（如灵力不足、原料耗尽、重伤濒死）无法启动时，状态标记为 `ActionStatus.Blocked`。
- **循环模式下的安全空转**：
  - 若开启队列循环（`LoopEnabled`），阻断的动作被安全移至队尾，尝试执行下一个可用动作；
  - 若全部排队动作均受阻，队列进入**安全空转期**。在此期间，角色进入自然休整状态，持续享受生命与灵力自然回复，直至体征恢复或玩家介入调整。
- **自动移动准入修正（`AutoTravelEnabled`，默认关闭）**：
  - 行动入队时把当前所在节点记入意图锚点（`ActionIntent.AnchorNodeId`）；
  - 队首行动开轮时若地点校验不通过（当前不在该行动允许节点集合内，含旅途中），且自动移动已开启、锚点仍在允许集合内且世界图可达，则不再落入 Blocked，而是把一条 `world.travel` 插队至队首自动赶往锚点，到达后原行动按挂起语义恢复执行；
  - 锚点缺失、锚点已被配表移出允许集、或路径不可规划时，回落原 Blocked 语义；材料不足等非地点原因恒不触发自动移动；
  - 与 `LoopEnabled` 叠加可构成跨节点挂机回路：A 地行动完成轮转 → B 地行动地点不符 → 自动赶往 B → 依此循环；
  - 自动移动只发生在开轮准入一刻，已 Blocked 的停泊行动不追溯解套；
  - 讨伐类战斗行动（`ExecutionKind=CombatEncounter`）不走自动移动回锚点：讨伐跟随玩家驻留地点，当前节点不可执行时按「条件不足」阻断（详见总纲 08 篇讨伐地点语义）。

### 2.4.3 四大动作类型自动消耗品槽位与动作时间池

为保障全常驻实体在无人值守时也能平滑维持生命体征与修炼增益，系统提供完善的消耗品自动使用体系：
- **四大分类独立槽位（4 类 × 3 槽）**：修炼（`Cultivation`）、探索（`Exploration`）、炼丹（`Alchemy`）、战斗（`Combat`）各自拥有独立的 3 个自动消耗品槽位（`AutoUseSlotState`）；
- **持续消耗品 300s 动作时间池机制**：
  - 开启 1 瓶持续型丹药时，消耗 1 件物品并获得 **300 秒有效动作时长**（`RemainingDurationSeconds = 300.0`）；
  - 该时长仅在角色**实际执行对应类型动作时按秒精准扣除**；
  - 动作中途切换或暂停时，剩余秒数精确保存在槽位中，绝不凭空蒸发；
  - 透支免单与切槽惩罚：剩余时间不足以覆盖单次动作时，允许该次动作享受完整增益且不提前吃药；若玩家在尚有剩余时长时主动更换绑定的丹药，旧丹药剩余时长清零（切槽惩罚）。

### 2.4.4 队列级暂停与一键清空（Queue Pause & Clear-All）

- **队列停泊开关（`QueuePaused`）**：`PlayerSettingsState` 玩家级开关，与 `LoopEnabled`/`AutoTravelEnabled` 同族，随 settings 分段持久化与下发，客户端经 `queue.configure { paused }` 切换；
  - 暂停时行动队列整体冻结——计时进度、战斗/搜寻/复活/斗法相位、旅行推进、斗法撮合全部不消费墙钟；队列结构与进度原样保留，恢复后按原进度继续；
  - 墙钟资源窗口照常结算（自然回复、Buff 到期、自动使用冷却、暂存物品、道龄与 48h 离线截断），与 Blocked「时间照走、行动停走」同族；暂停不购买任何额外收益，只是不执行动作；
  - 在线与离线补算语义一致（服务端权威）；暂停期间入队、插队（`world.travel`）与调序照常受理，仅不推进。
- **一键清空（`queue.clear`）**：先补算到当前时刻，队首若为斗法按弃战判负（`ApplyDuelForfeit`，与单项移除同语义）；全部实例经统一队列变更管线归档行动账本、死亡远征恢复最低气血，单次版本提交并清理队首战斗实体；高危操作，前端必须二次确认。

## 2.5 技术架构与系统落地映射（Technical Architecture & Implementation）

在底层实现上，“统一常驻实体”由**纯领域聚合根 + 确定性离散事件引擎 + ECS 分片 Fiber 单写者所有权**三层基座稳固支撑。

```text
 ┌─────────────────────────────────────────────────────────────────────────┐
 │              服务端运行时宿主 (EcsGameRuntime / EcsWorldShard)           │
 │   • 单写者调度：玩家按稳定哈希路由到 ECS 分片，推进在分片 YuoFiber        │
 │     内串行执行；EcsPlayerRuntimeAdapter 玩家级 gate 保证跨边界串行；      │
 │     所有权经 game.player_runtime_leases 租约维持                          │
 │   • 在线实体映射：playerId -> YuoEntity(ECS 组件集)；命令边界经           │
 │     MutatePlayer 通道将组件重建为 PlayerAggregate、执行领域操作、回写组件 │
 │   • 持久化：脏分段经 latest-only 刷盘队列异步写入 PostgreSQL              │
 └────────────────────────────────────┬────────────────────────────────────┘
                                      │ 持有并驱动
                                      ▼
 ┌─────────────────────────────────────────────────────────────────────────┐
 │                      领域聚合根 (PlayerAggregate)                        │
 │   • POCO 纯数据模型，无任何外部框架/IO/数据库依赖                          │
 │   • 按 PlayerSectionKind 八分段聚合                                      │
 │     (Progression/World/Combat/Buffs/Loadout/Settings/ActionQueue/Duel)   │
 │   • 资产走 AssetWallet+economy；细粒度脏段追踪 MarkDirty(PlayerSectionKind)│
 └────────────────────────────────────┬────────────────────────────────────┘
                                      │ 作为唯一输入输出
                                      ▼
 ┌─────────────────────────────────────────────────────────────────────────┐
 │               确定性模拟引擎 (SimulationEngine.AdvanceTo)               │
 │   • 时间片推进 (cursor -> target)，按行动完成边界/微步事件向前演进         │
 │   • 统一执行 Buff 到期结算、行动推进结算、自然回复结算                     │
 │   • 产生增量事件日志与脏分段标记 (DirtySections)                           │
 └─────────────────────────────────────────────────────────────────────────┘
```

### 2.5.1 领域层：`PlayerAggregate` 聚合根

- `PlayerAggregate`（定义于 `src/Domain/Player/PlayerAggregate.cs`）是角色全部状态的**唯一权威数据载体**；
- 内部按 `PlayerSectionKind` 八分段收敛 `PlayerProgression`、`PlayerWorldState`、`PlayerCombatState`（含 `PlayerCombatSkillState`）、`PlayerBuffState`、`PlayerLoadoutState`、`PlayerSettingsState`、`PlayerDuelState` 与行动队列；资产（灵石、物品、装备实例）不进聚合，统一由 `AssetWallet` + `economy.*` 关系表承载；
- 纯 POCO 设计使得任何状态操作都可以被轻松单元测试、离线重放和确定性断言。

### 2.5.2 模拟层：`SimulationEngine` 确定性推进

- `SimulationEngine.AdvanceTo` 是世界状态演进的唯一入口；
- 引擎按离散事件边界切分时间片，在推进循环中统一执行：
  1. Buff 到期结算：推进并失效到期 Buff；
  2. 行动推进与状态转移（根据行动类型由 SimulationEngine 执行挂机产出结算、战斗状态机推进或位移处理；技能施放由 `CombatSkillEngine` 结算）；
  3. 自然回复结算：读取基础属性表及明确加成计算后的回复属性，结算自然气血与灵力回复；不得由生命/灵力上限按固定比例生成回复值，周期口径见 [战斗规约 §7.9.2](./07-战斗数值与内视规约.md#792-自然回复属性由基础属性表配置)；
  4. 产出结算与脏分段标记汇总。

### 2.5.3 运行时层：`EcsGameRuntime` + `EcsWorldShard` + `EcsPlayerRuntimeAdapter`

- **单写者并发模型（Single-Writer）**：每个玩家在内存中是某个 `EcsWorldShard` 内的 `YuoEntity`（按 `PlayerId` 稳定哈希路由），其推进与命令在分片 `YuoFiber` 内串行执行，`EcsPlayerRuntimeAdapter` 的玩家级 `SemaphoreSlim` gate 兜底跨边界串行，从根本上杜绝了多线程并发读写导致的“状态撕裂”；
- **命令通道**：业务命令经 `EcsWorldShard.MutatePlayer` 将 ECS 组件重建为 `PlayerAggregate` 执行领域操作并整体回写，脏段差集驱动回执与推送；
- **冷热无缝切换**：玩家离线后实体休眠，脏分段经 latest-only 刷盘队列异步写入 PostgreSQL section 表。玩家重连时，从 `PlayerStateHead` + 各 `PlayerSectionSnapshot` 恢复组件并由确定性推进补算至当前时刻，状态与一直在线完全无差。

### 2.5.4 网络层：`ProtocolSnapshotMapper` 增量同步

- 服务端通过 `ProtocolSnapshotMapper` 将演进产生的脏分段（`DirtySections`/`PlayerSectionKind`）打包为轻量级快照/增量 DTO（透传当前激活 `GameDataCatalog`）；
- 前端仅针对发生变动的局部数据（如气血微调、Buff 列表变动、背包变动）进行响应式更新，绝不整体重建面板，确保高频状态流转下的流畅交互体验。

---

## 2.6 设计红线与扩展准则（Design Redlines & Guidelines）

为确保“统一常驻实体”核心哲学的长久纯粹性与系统健壮性，后续所有系统开发与玩法扩展必须严格遵守以下红线：

1. **【严禁设立影子角色】**：任何新玩法（秘境、竞技场、帮派战、大世界事件等）不得为玩家创建独立的“临时战斗载荷”或“脱离主实体的副角色”，必须直接引用和修改主 `PlayerAggregate`。（注：秘境/竞技场/PvP 均为规划意图，尚未落地。）
2. **【严禁跨玩法免费重置】**：严禁在进入或退出某个玩法时，私自执行“气血回满”、“灵力回满”、“重置所有技能冷却”等破坏状态连续性的破坏性操作。一切恢复必须有法可循（依赖丹药、打坐、技能或自然回复属性）。
3. **【严禁使用浮点截断】**：所有与时间、资源、属性、收益率相关的计算与存储必须统一使用 `double` 精度，微量回复必须走 `RegenCarrySeconds` 回复周期余量累加机制，严禁因整数截断导致长期挂机收益丢失。
4. **【闭环演进原则】**：任何新增的作用力（新动作类型、新环境效果、新交互机制），必须遵循“从 `PlayerAggregate` 读取条件 -> 计算影响 -> 原地写回 `PlayerAggregate` -> `MarkDirty(PlayerSectionKind.Xxx)`”的标准闭环管线。
5. **【确定性守恒】**：任何状态转移逻辑必须是纯函数的、无副作用的确定性计算，严禁在状态演进代码中调用系统随机数（必须使用确定性种子生成器）、系统时钟（必须使用传入的时间戳参数）或进行异步/外部 I/O 操作。

# 第三篇 修仙境界与四乘区数值底座

## 3.1 境界三层轴、等阶与品质架构
游戏建立**横向等阶（Tier T1~T12，四修行期）**与**纵向品质（Quality 八品）**交织的修仙体系。

### 3.1.1 境界三层展示轴（大境界 · 境界阶段 · 小境界）
- **小境界**：境界等级轴 Lv.1~127，每级一个名号，是突破进度的最小单位；
- **境界阶段**：大境界内的分段徽章单字——凡俗段为「武（Lv1~6）/ 玄（Lv7~12）/ 天（Lv13~18）」，修真段每个大境界 12 层内分「初（1~3 层）/ 中（4~6 层）/ 后（7~9 层）/ 极（10~12 层）」；
- **大境界**（共 11 个）：凡俗（Lv1~18）→ 练气、筑基、金丹、元婴、化神、炼虚、合体、大乘、渡劫（各 12 层，Lv19~126）→ 飞升（Lv127）。凡俗段 18 级的小境界名依次为：凡胎、炼皮、锻骨、易筋、洗髓、养气、通脉、瑶光、开阳、玉衡、天权、天玑、天璇、天枢、宗师、大宗师、临渊、叩仙门；修真段每大境界 12 层命名为「X 一层~X 九层 → X 巅峰 → X 大圆满 → 半步 Y」（半步 Y 为下一大境界的破境过渡档）。
- **一体化徽章表现**：`[大境界牌匾框] ◇境界阶段棱形框◇ (小境界胶囊框)`（如 `[练气] ◇极◇ (练气巅峰)`，悬浮展示精准等级 Lv）。

### 3.1.2 等阶（T级）数值内容轴
等阶 T1~T12 是装备套、技能、丹药与怪物的数值底座与产出分档轴，锚点等级为 `1/18/30/42/54/66/78/90/102/114/126/127`（`BaseAttributeCatalog.TierAt`：不超过当前等级的锚点个数即等阶）。等阶边界与大境界错开一层：每个等阶以「破境过渡小境界」开篇——叩仙门开启 T2，半步筑基开启 T3，……，半步飞升开启 T11——覆盖到对应大境界大圆满为止。即 T2 对应练气内容档、T3 对应筑基档、T10 对应渡劫档、T11 半步飞升、T12 飞升。

### 3.2.2 基础六维资质换算规约 (初始 0 点，每点提供固定值 + 百分比双加成)
六维等级由境界修为表派生的**单点成本表**导出（0 级起算，初始经验 0）：每维上限 **381 点**（127 级境界 × 3 点/级）。记 `B[i] = expToNext[max(0, i−1)]`（跨入第 i+1 级消耗的那格修为条，`B[0]` 取第一条），升到第 p 点（1≤p≤381）所需经验 = `B` 在 `t=(p−1)/3` 处的线性插值 `lerp(B[⌊t⌋], B[⌈t⌉], frac(t))`——一级境界对应三点、三点合计约三倍该级修为条，相邻档间平滑过渡不出现三连同价。单维累计至 3Lv 点 ≈ `3×ΣexpToNext[1..Lv−1]`（境界累计修为的 ~3.1 倍，Lv127 收敛 3.05×），使六维成本与修为通胀永远同节奏。每点六维为映射属性**同时**提供固定值与百分比加成：
- **体魄 (Tǐ Pò)**：`+12 且 +1% 生命上限`、`+1 且 +1% 物理护甲`、`+1 且 +1% 生命自动回复`
- **经脉 (Jīng Mài)**：`+7 且 +1% 灵力上限`、`+1 且 +1% 法术抗性`、`+1 且 +1% 灵力自动回复`
- **根骨 (Gēn Gǔ)**：`+12 且 +1% 生命上限`、`+7 且 +1% 灵力上限`、`+1 且 +1% 化解`
- **力道 (Lì Dào)**：`+1 且 +1% 物理攻击`、`+1 且 +1% 暴击等级`、`+1 且 +1% 破招等级`
- **神识 (Shén Shí)**：`+2 且 +2% 术法攻击 (术法×2)`、`+1 且 +1% 命中等级`
- **身法 (Shēn Fǎ)**：`+1 且 +1% 闪避等级`、`+1 且 +1% 免爆等级`、`+1 且 +1% 化解`

### 3.2.3 双流派对偶配点法则
1. **🗡️ 物理系 (Physical)**：走 **`1 AD : 1 暴击 : 1 破招`**，破招触发**双倍暴击与双倍命中**；普攻为全流派统一物理模型（1.0s 基准 ×(1-ATR)×(1-攻速成长)，满成长 0.25s 极限间隔、`100%→200%` AD），结合重斩/贯星等高倍率单体绝技，主打极致 Boss 斩杀。
2. **🔮 法术系 (Magic)**：**AP 仅供技能结算**（普攻与物理系完全统一）；高法攻面板在平方减伤公式下**天然强势破防**，配合 AP 群攻技能与掌心雷（0CD 填充技）主打范围清场。

## 5.2 完整技能书与残卷体系 (20 种专属道具)
1. **完整技能书 (`item.tome.<ability_id>`)**（掉率 0.1%）：
   - **首次研读**：直接领悟并解锁该技能（初始 Lv.1，0 经验）；
   - **学会后再次使用**：为该技能直接增加 **10,000 点技能经验**。
2. **技能书残卷 (`item.fragment.<ability_id>`)**（掉率 2.0%）：
   - **使用前置条件**：必须先学会对应技能，未领悟前无法研读；
   - **使用收益**：为对应技能增加 **500 点技能经验**。
3. **批量研读**：秘籍与残卷属手动即时消耗品，支持一次选择多本（`ability.learn` 携带 `quantity`）。
   - 语义与逐本重复点击严格等价：**同一笔事务内逐本结算**——未习得功法时使用 N 本秘籍，第 1 本领悟解锁，其余 N-1 本各 +10,000 经验；已习得则 N 本各 +10,000；残卷 N 本各 +500。
   - 一次批量只针对同一种 `itemId`；持有量不足整笔拒绝（扣减与习得在同一经济事务中原子提交或整体回滚）。
4. **等级成长推导规则**：
   - 全部技能数值项每级 **+2.0% 线性成长**：`LevelGrowth = 1 + 0.02 × (Lv − 1)`——伤害倍率、固定伤害、治疗量与支援数值（`threatGain`、Buff 增伤/免伤/威胁增幅/每秒威胁等点数及固定回复）同式；
   - 时长与叠层上限不成长。

## 5.3 内功心法体系（首批 9 门）

**定位**：内功是常驻被动的心法基座——装配 0 号内功位即生效，**不进入施放序列**（无冷却/吟唱/耗蓝/触发器）；其权威定位是**经验获取调整器**：按 `rootExpMultipliers` 对六维经验做**非守恒乘率重分配**（提升某一维度、压低另一维度，达成个性化养成），并可携带修为增减点与常驻面板效果。

### 5.3.1 心法配表字段与结算公式

- `discipline: "internal"`：只入 0 号内功位（槽位双向互斥，术法位只收 `spell`）；internal 功法不配 `defaultTriggers`/`manaCost`/`castMilliseconds`/`damageRatio` 等施放字段，战斗施放管线对 `internal` 一律跳过。
- `rootExpMultipliers`：六维乘率表，键为 `stamina`/`meridians`/`attack`/`bone`/`agility`/`consciousness` 子集，未列维度缺省 `1.0`，允许配 `0`（献祭归墟——该维终身停长，为真代价）。
- **六维入账公式**：`share_i = experience × mult_i × eff`（每个归属维度各得全额乘以自身乘率）；非守恒——六维总效率 = `eff × Σmult/6`，允许偏离 100%（总量是内功强度的定价旋钮：偏科越狠/总量越高，代价越硬）。
- `rootExpEfficiencyPerLevel`：参悟等级每级提升六维总效率，`eff = 1 + perLevel × (参悟Lv − 1)`；参悟等级与术法同口径由功法经验立方曲线导出，内功不施放、参悟经验唯一来源为秘籍/残卷研读（§5.2）。
- `cultivationExpBonusPoints`：修为类收益增减点（1 点 = 1%），作为独立乘区乘在增幅后收益量 `amp` 上，对全部修为类收益路径生效（击杀/行动收益/冥想，见 [第七篇](./07-战斗数值与内视规约.md) §7.11.1）；负值为「弃道从武」型内功的代价。
- `passive`：常驻面板效果块，复用装备 `specialMechanics` 同族点数字段汇入 `PlayerAttributeResolver`；首批仅配小数值。
- `rootAttribute`：保留为主修维度标识（UI 归属展示/设计语义），不再承担分配计算——分配唯一由 `rootExpMultipliers` 决定。
- 未装备内功时六维全归属、各得全额（每维 `experience`，总量 6×）；神通/外功声明 `rootAttribute` 不参与分配。

# 第六篇 持续消耗品机制与生活制造体系

> 本文档正式定义《道化太初》中可使用物品分类（立即消耗品 vs 持续消耗品）、基于动作耗时的持续时间扣除算法、槽位持久化状态、透支结算与切换惩罚规则，以及引气入体与引气丹的数值基线。

---

## 6.1 设计背景与核心目标

在传统放置/挂机 RPG 中，消耗品通常采用自然时间流逝的 Buff 计时器（如吃下一枚丹药获得 5 分钟 Buff，无论角色是否在执行修炼，时间都在无情流逝）。这在多任务切换、断续操作或特定动作加速时体验极差，且容易导致玩家心理负担。

《道化太初》建立了一套契合修仙节奏的**动作耗时分摊持续消耗品机制**：
1. **动作绑定与动作耗时消耗**：持续性道具（如引气丹、寻灵香、地火引等）仅在角色**实际执行并完成对应动作**时，按该动作在本次循环中**实际花费的时间**扣减剩余时间。
2. **状态保全**：不切换槽位物品时，剩余持续时间永久保存在槽位中，绝不随自然时间流逝而损失。
3. **透支友好**：当剩余持续时间不足以支付下一次动作时，直接消耗完当前物品，不足的部分免除（玩家小赚一点）。
4. **切换惩罚**：若物品已启用并消耗了部分时间，玩家主动切换/卸下该槽位物品时，直接扣除当前这一件物品且不返还时间，杜绝频繁切槽蹭药。

---

## 6.2 消耗品分类与生命周期模型

游戏中所有可使用物品（`kind: "consumable"`）先按**消耗入口**严格二分，再在自动消耗品内部按 `isContinuous` 字段划分持续/即时：

| 大类 | 消耗入口 | 品类 | 准入键 |
|---|---|---|---|
| **自动消耗品** | 自动使用槽位调度（触发条件 + 扣减时钟），不提供背包手动使用入口 | 丹药、补给、符箓、阵盘等 | `category == "consumable"`，必须配 `consumable` 块 |
| **手动消耗品** | 背包手动使用、即点即结算，各品类走专属权威命令 | 秘籍/残卷（`ability.learn`）、后续宝箱/礼包等 | `category` 为 `manual`/`chest` 等非 `consumable` 值，**不配 `consumable` 块** |

自动消耗品内部按 `isContinuous` 划分两类：

```mermaid
graph TD
    Item[物品 ItemDefinition] -->|"自动消耗品 category = consumable"| IsContinuous{持续标志 isContinuous}
    IsContinuous -->|"isContinuous = false"| InstantItem[立即消耗品]
    IsContinuous -->|"isContinuous = true"| ContinuousItem[持续消耗品]

    InstantItem --> InstantEffect[瞬发效果: 恢复生命/灵力/爆发伤害]
    InstantEffect --> InstantCD[进入独立冷却 Cooldown]

    ContinuousItem --> EquipSlot[装配至对应行动分类消耗品槽位]
    EquipSlot --> ActionTrigger[执行对应分类动作 Action]
    ActionTrigger --> DurationDeduct[动作完成时: 扣减动作实际耗时]
    DurationDeduct --> TimeCheck{槽位剩余时间判断}
    TimeCheck -->|> 0| RetainTime[保留在槽位中继续生效]
    TimeCheck -->|<= 0| DepleteItem[当前物品耗尽 -> 自动从背包消耗下一件并充能]
```

### 6.2.1 立即消耗品 (Instant Consumable)
- **定义**：使用后立即触发瞬时效果（如战斗瞬回气血丹药、回春丹、回灵丹、保命灵符等）。
- **生效方式**：
  - 装配至自动使用槽位后按机制生效：战斗中根据触发器规则（如生命低于 50%）自动触发；**不提供背包手动使用入口**（边界见 §6.2.4）。
  - 使用后直接结算数值（如 `HitpointRestore`、`ManapointRestore`），并让该槽位或该类物品进入独立冷却时间（`CooldownSeconds`）。
- **生命周期**：单次使用立即消耗 1 件物品，无槽位持续时间概念。

### 6.2.2 持续消耗品 (Continuous / Sustained Consumable)
- **定义**：用于增强特定动作效率或产出的持续性道具（如引气丹、寻灵香、地火引等）。
- **核心属性**（字段名对齐实际 JSON schema）：
  - `durationSeconds`：单件物品提供的总有效动作持续时间（秒，如引气丹为 300 秒）。
  - `usableInActionTypes`：物品可装配的**物品栏域**集合（栏域标识见 §6.2.3），决定该物品允许进入哪些自动使用物品栏；某个物品栏只接受声明了本栏域的自动消耗品。
  - 分类加成字段：直接对该动作结算生效的加成修正，按行动大类分别命名——`cultivationMultiplier`（修炼）、`gatheringMultiplier`（探索）、`alchemyMultiplier`（炼丹制造），如引气丹 `cultivationMultiplier = 1.3` 即增加 30% 修炼效果；**不通过全局 Buff 列表与自然时间计时器流逝**。
  - **生效守卫**：物品对运行中行动大类查得的加成倍率 ≤ 1 时，不充能、不扣剩余时长——引气丹可挂在历练栏内，但跑采集行动时不会白烧丹药（倍率字段只对修炼行动生效）。
  - **无叠层**：同一槽位固定单件效果、无法叠层，多槽位装配同种物品时按独立槽位依次结算或排他生效（不引入 `stackable` 字段）。

### 6.2.3 自动使用物品栏：栏域模型与战斗双组栏位

自动使用消耗品按「物品栏域」（`AutoUseBar`）分支——物品栏域独立于行动大类（`ActionKind`），是槽位、物品准入与消耗判定的统一归属键：

| 物品栏域标识 | 覆盖行动 | 槽数 |
| :--- | :--- | :--- |
| `exploration`（历练栏） | 修炼 `Cultivation` 与历练 `Exploration` 两大类全部行动（吐纳修炼、采集、挖掘、探索等非制造行动） | **6** |
| `alchemy` / `forging` / `talisman` / `formation` / `enhancement`（制造技艺栏） | 炼丹制造大类 `Alchemy` 行动按配表 `technique` 字段归属对应栏域（炼丹/炼器/符箓/阵法行动各归其栏）；强化 `Enhancement` 行动归 `enhancement` 栏 | 各 **3** |
| `combat`（战斗栏） | 战斗 `Combat` 行动 | 药品栏 3 + 通用栏 3 |

- **行动 → 栏域映射**：修炼/历练类 → `exploration`；炼丹大类 → 行动 `technique` 同名栏域（配表装载期校验：炼丹大类行动必须声明制造技艺）；强化 → `enhancement`；战斗 → `combat`；赶路无物品栏。
- **物品准入**：`usableInActionTypes` 声明物品允许装配的栏域集合（如引气丹 `["exploration"]`、地火引 `["alchemy"]`）；`queue.auto_use.configure` 服务端权威校验「物品栏域 ∈ 物品声明集合」。
- **消耗判定**：槽位与运行中行动同栏域时才参与结算；持续消耗品再经 §6.2.2 生效守卫过滤无加成场景。

非战斗物品栏内可用消耗品**一律为持续消耗品**，按 §6.3 动作耗时扣减。战斗行动域的消耗品独立成体系，栏位固定为**两组各 3 槽**：

| 栏位组 | 槽数 | 可装配物品 | 消耗语义 |
|---|---|---|---|
| **药品栏** | 3 | 仅限药品类消耗品（`category: pill` 等药品分类） | 使用即消耗：瞬间回复效果（`hitpointRestore`/`manapointRestore`）与回血/回蓝 Buff（`buffs.hpRegen`/`mpRegen`），使用后进入独立冷却 |
| **通用栏** | 3 | 任意自动消耗品：符咒、阵法、特殊道具，**药品亦可放入** | 物品声明直接消耗或持续消耗两种模式 |

**通用栏持续消耗的扣减时钟**——与行动耗时扣减不同源，按战斗状态机判定：

| 战斗状态 | 是否扣减 |
|---|---|
| 战斗进行中（含我方吟唱/敌方出手间隙） | ✅ 扣减 |
| 玩家死亡等待复活（战斗未终结） | ✅ 扣减 |
| 寻敌/遭遇间隙（战斗已结束、下一波未开始） | ❌ 不扣 |
| 退出战斗后 | ❌ 不扣 |

即：持续消耗随"遭遇战存活时钟"走——只要本次遭遇尚未结算离场（含躺尸等待），持续消耗品就持续扣件；寻敌与脱战期间时钟冻结。

持续消耗品可另配 `cooldownSeconds`：时长耗尽时刻起算冷却，冷却未走完时入场不补能（不扣件、不生效）；冷却走完后的下一次入场重新扣件充能（如聚灵阵盘持续 300 秒 / 冷却 300 秒）。非战斗域持续消耗品的冷却在行动起点同样生效，冷却走完后下一次动作起点重新充能。

**使用条件**：战斗消耗品（药品栏与通用栏共用）与技能使用条件共用同一套触发判定模型——对象-类型-比对三元组，见[总纲第七篇 §7.8.3](./07-战斗数值与内视规约.md#783-出手决策顺序与使用条件触发判定)。

### 6.2.4 手动消耗与槽位消耗的边界

全部可使用物品按消耗入口严格二分：

- **自动消耗品**：丹药、符阵等增益/回复类消耗品**不提供手动使用入口**，只能装配至对应行动域的自动使用槽位（§6.2.3），由触发条件与扣减时钟统一调度。放置挂机语境下消耗节奏必须跟随行动时钟与战斗状态机，手动即嗑会绕过冷却与扣减模型。
- **手动消耗品**：技能书/残卷、装备、后续宝箱/礼包类等「即点即结算」物品走背包手动使用——秘籍/残卷走 `ability.learn`，装备走 `loadout.replace`，后续新增品类按各自权威命令分流；不设通用 `item.use` 命令。
- **槽位准入键**：自动使用槽位（含详情页通用物品栏 `SlotGroupGeneral` 与战斗药品栏 `SlotGroupPotion`）的权威校验只接受 `category == "consumable"` 的物品；手动消耗品（`manual`/`chest` 等）即使误配 `usableInActionTypes` 也一律拒绝入槽，前端选择器同口径过滤。
- **`consumable` 块为自动消耗品专属规格**：手动消耗品不配 `consumable` 块（`ItemDefinition.Consumable` 为 null）；凡声明 `consumable` 块的物品必须在 `usableInActionTypes` 中非空声明合法物品栏域（§6.2.3），DataTool 装载期校验拦截「有块无域」与未知栏域的静默死物品。
- **批量消耗原则**：手动消耗品除装备（单件穿戴语义）外默认支持一次消耗多件；批量语义必须与逐次重复严格等价，且在同一权威事务内逐件结算、整体提交或回滚。是否开放批量按使用场景逐类裁定——秘籍/残卷已开放批量研读（见[第五篇 §5.2](./05-技能神通与秘籍残卷体系.md#52-完整技能书与残卷体系-20-种专属道具)），宝箱类落地时按其开袋结算设计决定。

## 6.3 槽位状态与动作耗时扣减算法

### 6.3.1 槽位数据模型扩展

在各物品栏域（§6.2.3：历练 `exploration`、制造技艺、战斗 `combat`）的自动消耗品槽位 `AutoUseSlot` 中，增加当前启用物品的持续时间状态：

```csharp
public sealed class AutoUseSlot
{
    /// <summary>装配的物品 ID（为 null 表示空槽）。</summary>
    public string? ItemId { get; set; }

    /// <summary>是否启用该槽位。</summary>
    public bool Enabled { get; set; } = true;

    /// <summary>
    /// 当前已启用的这 1 件物品剩余的有效动作持续时间（秒）。
    /// 数值范围：0.0 <= RemainingDurationSeconds <= ItemDefinition.Consumable.DurationSeconds
    /// 若为 0.0 且槽位启用，下次执行动作时自动从背包消耗 1 件并充能为总时长。
    /// </summary>
    public double RemainingDurationSeconds { get; set; }

    /// <summary>触发条件规则列表（主要供战斗槽位或特殊条件使用；正在落地）。</summary>
    public List<CombatTrigger>? Triggers { get; set; }
}
```

### 6.3.2 动作执行与耗时扣减算法 (Deterministic Deduction)

每次动作推进（无论是单步在线模拟还是离线/快进批量补算），遵循严格的确定性流程：

1. **实际动作耗时计算 (Actual Duration)**：
   $$\text{ActualDuration} = \frac{\text{BaseDurationSeconds}}{1.0 + \text{SpeedBonusRatio}}$$
   （`SpeedBonus` 动作加速加成正在落地；当前无速度加成来源时 $\text{ActualDuration}$ 退化为 `BaseDurationSeconds`。）
   例如：引气入体基础耗时 10 秒。
   - 若无加成，$\text{ActualDuration} = 10.0$ 秒；
   - 若有加成使速度提高 100%，$\text{ActualDuration} = 5.0$ 秒。

2. **槽位激活与自动充能判定**：
   - 检查对应动作分类下的各个 `AutoUseSlot`：
     - 若槽位已配置 `ItemId` 且 `Enabled == true`：
       - 若 `RemainingDurationSeconds <= 0`：
         - 检查玩家资产钱包（`AssetWallet`）是否持有该物品且数量 $\ge 1$；
         - 若持有：从资产中扣除 1 个物品，并将槽位 `RemainingDurationSeconds` 充能为该物品的完整 `durationSeconds`（如 300.0 秒）；
         - 若不持有：槽位无法提供加成，跳过该槽位。
       - 若 `RemainingDurationSeconds > 0`：槽位当前处于激活生效状态。

3. **收益加成结算**：
   - 凡处于激活状态的持续消耗品，将其加成效果（如引气丹 `cultivationMultiplier = 1.3`）直接应用至本次动作的产出计算中：
     $$\text{FinalQi} = \text{BaseQi} \times \prod \text{EfficiencyMultipliers}$$
     $$\text{FinalExp} = \text{BaseExp} \times \prod \text{EfficiencyMultipliers}$$

4. **扣除动作实际耗时与透支处理**：
   - 当本次动作周期**成功完成**时，扣减槽位剩余时间：
     $$\text{NewRemaining} = \text{RemainingDurationSeconds} - \text{ActualDuration}$$
   - **透支免单规则**：
     - 若 $\text{NewRemaining} > 0$：更新 $\text{RemainingDurationSeconds} = \text{NewRemaining}$，物品继续保留在槽位中供下次使用；
     - 若 $\text{NewRemaining} \le 0$：说明这 1 件物品已用尽（即使此前只剩 3 秒，而本次动作花了 5 秒，少掉的 2 秒不再倒扣，直接归零）：
       $$\text{RemainingDurationSeconds} = 0.0$$
       当前物品使命结束。若背包中仍有该物品，下一次动作开始时将自动开启新的一瓶/枚。

### 6.3.3 切换/卸下槽位惩罚规则 (Switching Penalty)

当玩家向服务端发送修改/切换/卸下槽位指令（如 `SetAutoUseSlot`）时：
- 若目标槽位当前已有物品 $A$，且 $0 < \text{RemainingDurationSeconds} < \text{TotalDurationSeconds}$（即已开封并使用了一部分时间）：
  - 玩家切换为物品 $B$ 或清空槽位时，**已经消耗部分的这 1 件物品 $A$ 不予退回**，其剩余的持续时间直接作废归零。
  - 新装配的物品 $B$ 处于未开封状态（$\text{RemainingDurationSeconds} = 0.0$），在首次触发动作时再从背包扣除 1 件并完整充能。
- **设计目的**：确保游戏经济与时间价值严谨，杜绝玩家在不同动作之间卡毫秒来回切换单个消耗品以获取超额收益。

## 6.6 确定性与离线快进计算契约

在离线挂机和断线重连确定性快进时：
- **实际结算形态**：`SimulationEngine.AdvanceTo` 外层循环按 Buff 到期、消耗品冷却与自然回复等边界逐秒切片结算，逐片套用上述耗时扣减与充能规则，而非一次性公式化批处理。
- **结果等价性**：逐秒切片与公式化批处理在数学上完全等价——槽位中已有剩余时间 $R$ 最多可供 $K = \lceil R / T_{\text{action}} \rceil$ 次动作消耗；耗尽后，若资产中仍有 $M$ 个备用物品，每个物品可提供 $C = \lfloor \text{Duration} / T_{\text{action}} \rfloor$ 次动作（最后一次不足则透支完结）。
- 无论是逐秒推进还是离线快进补算，物品消耗总数与最终获得的修为/灵力完全等价，保证绝对确定性。

- **七技艺**：炼丹 `alchemy`、炼器 `forging`、符箓 `talisman`、强化 `enhancement`、阵法 `formation`、采集 `gathering`、挖掘 `mining`——独立累计经验，0 级起按修为曲线（`RealmProgressionCatalog.ExpToNext`）逐段升级，每级 +5% 对应行动速度。详见 `20-技艺体系与符箓阵法强化规约.md` §20.1。
- **符箓制品**：雷击符（`item.leiji-talisman`）——战斗通用栏即时打击消耗品（`consumable.strike`），耗 `5%×MaxManapoints`，造成 `20%×MaxMana + 200%×SpellAttack` 木系法术伤害，冷却 60 秒，无吟唱。详见 §20.2。
- **阵法制品**：聚灵阵盘（`item.juling-formation-disk`）——战斗通用栏持续消耗品：持续 300 秒、冷却 300 秒（耗竭时刻起算），每次入场自动消耗 1 件；每 5 秒回蓝 `(原回蓝+5)×1.3`（后段回复乘区 `mpRegenPostRatio`）。详见 §20.3。
- **装备强化**：`enhance.equipment` 行动独立结算（精华+灵石成本、成功率查表+技艺修正、护符保护、±变体迁移），上限 +20。详见 §20.4。
- **行动→技艺映射**：配表 `"technique"` 字段（炼丹/炼器/采集/挖掘/符箓/阵法/强化行动各自绑定）。

# 第七篇 战斗数值与内视规约

本文档记录角色内视体系、双数值类型定义规范、统一基准数值底座、非玩家单位（怪物）全量量化设计模型、六维根基换算规则、普通攻击规则、全量战斗属性分类、抗性减伤与对抗计算公式，以及核心生平记录规范。

---

## 7.1 强制数值类型架构规范 (全量使用 double)

根据系统与领域核心架构规则：
- **全部数值计算与储存一律使用 `double` 精度**（前端对应 JavaScript/TypeScript `number` 即 IEEE 754 double）。
- 杜绝任何整数截断导致的非预期突变，百分比结构体内部存储同样采用 `double` 点数。

### 7.1.1 固定数值类型 (Fixed Value / Flat Value)
- **底层表示**：直接使用 `double` 存储与结算。
- **涵盖属性**：全部基础战斗属性均为此类型。
  - 生命值 (HP)、灵力值 (MP)
  - 物理攻击、术法攻击
  - 护甲 (物防)、法抗 (法防)
  - 命中、闪避
  - 暴击、免爆
  - 破招、化解

### 7.1.2 统一百分比数值类型 (Percent Value)
- **底层表示**：内部统一存储为 `double Points`（点数），以 **100 点 = 100% 当量 (1 点 = 1%)** 作为基准缩放常数 $K = 100$。
- **支持曲线模式 (Curve Mode)**：
  - **`Linear`（线性模式）**：适用于增伤、免伤、仇恨增加、各类属性伤害增免。
  - **`NonLinear`（非线性/速率倒数模式）**：适用于冷却速度 (CDR)、行动速度 (攻速)、灵力消耗减少。

#### 百分比类型双模式换算模型对比表

设属性底层点数为 $x$：

| 点数 $x$ | 模式 (Mode) | 实际战斗乘区倍率 (Multiplier) | 面板展示百分比 (DisplayPercentage) | 业务行为说明 |
| :--- | :--- | :--- | :--- | :--- |
| **0** | Linear | $1.0\times$ | **0%** | 无增益 / 无减益 |
| **+100** | **Linear** | $1 + \frac{x}{100} = \mathbf{2.0\times}$ | $\mathbf{+100\%}$ | 增伤 100 点，伤害翻倍 ($2\times$) |
| **-100** | **Linear** | $\frac{100}{100 + \|x\|} = \mathbf{0.5\times}$ | $\mathbf{-50\%}$ | 负向除法软着陆，伤害减半 ($0.5\times$) |
| **0** | NonLinear | $1.0\times$ | **0%** | 基础冷却 / 消耗时间 |
| **+100** | **NonLinear** | $\frac{100}{100 + x} = \mathbf{0.5\times}$ | $\mathbf{50\%}$ | 冷却速度 100 点，CD 缩减 50% |
| **-100** | **NonLinear** | $1 + \frac{\|x\|}{100} = \mathbf{2.0\times}$ | $\mathbf{-100\%}$ | 冷却减速 100 点，CD 延长一倍 |

全系统单位（包括默认玩家角色、所有怪物、首领、NPC）**均采用同一套基准数值底座**，所有后续成长、装备、功法、Buff 以及怪物强度，均在基准数值上进行量化百分比缩放与增量叠加。

| **最大灵力值** | MP | **50.0** | 基础气海容量 |

| **术法攻击** | AP / SpellAtk | **5.0** | 基础术法灵威 |

## 7.3 全量量化平衡与非玩家单位（怪物）设计模型

### 7.3.1 怪我同构建模原则 (Monster-Player Isomorphic Modeling)
系统杜绝“拍脑袋填表、来回人工调参、牵一发而动全身”的落后配表方式。整个数值体系是**完全参数化、闭环量化**的：
1. **完全对称数据结构（任何战斗单位同一模型）**：怪物、玩家、斗法镜像以及未来任何参战单位（含召唤物）在领域模型中完全同构——共用同一 `CombatantState` 属性池、同一 `SkillSlot` 技能槽、同一触发器求值器、同一 Buff 结算与同一普通攻击机制；不存在按单位身份分叉的专属属性、专属技能或专属效果管线；
2. **挂机基准波次怪物标准**（详见 [第十一篇](./11-数值量化模型集.md) §11.2）：
   - **妖兽 (Minion)**：**80% 全属性，300% 玩家生命**；
   - **精英 (Elite)**：**120% 全属性，500% 玩家生命**（每 5 波一次）；
   - **妖王 (Boss)**：**150% 全属性，2000% 玩家生命**（每 20 波一次）；
   - **底座口径**：「全属性 / 玩家生命」一律以同等级**期望玩家面板**为底座——即 `expected-attributes.json` 的 `levelExpected[].finalExpected`（基础数值池 × 六维 × 装备 × Buff 四乘区完全体，Lv1~127 每级锚点逐级求解，相邻整级插值）；**不是** `baseAttributeAnchors` 裸底座。怪物 `weights.*` 倾向权重在期望底座之上做微调。
3. **大世界单场质量预算生成**（详见 [第八篇](./08-大世界地图与质量预算遇怪系统.md)）：
   - 单场大地图历练按地图危险度预算区间 `[minBudget, maxBudget]` 结合怪物 `budgetCost` 进行动态抽取，支持 1~3 种特色怪群组合。

### 7.3.2 怪物属性倾向量化微调
在等阶基准之上，可通过倾向配置快速派生特色怪物：
- **玄甲巨兽型**：护甲 $\times 1.5$、生命 $\times 1.3$、攻速 $\times 0.8$
- **影蝠刺客型**：闪避 $\times 2.0$、暴击 $\times 1.5$、生命 $\times 0.7$
- **炽炎法王型**：术法攻击 $\times 1.6$、法穿 $\times 1.5$、护甲 $\times 0.6$

## 7.4 普通攻击机制 (Basic Attack)

任何战斗单位（玩家、怪物、斗法镜像、召唤物）在出手边界没有可施放功法技能时，回落普通攻击——普攻模型对所有单位完全统一：
- **行动速度**：默认为 `0` 点（对应 `0.0%`，无增减）。
- **伤害倍率**：造成 **100% 物理攻击伤害**（`1.0 * PhysicalAttack`）。
- **冷却时间 (CD)**：`0.0s`。
- **引导施法时间**：`1.0s`。
- **灵力消耗**：`0` 灵力。

修士初始六维资质为全 0 点（经验 0），每点（每重）**同时**提供固定值与百分比增益——固定值并入基础池，百分比为独立乘区：

| 六维属性 | 拼音 | 初始点数 (double) | 每点（每重）属性增益效果 (double) |
| :--- | :--- | :--- | :--- |
| **体魄** | Tǐ Pò | 0.0 | `+12 且 +1% 生命值`、`+1 且 +1% 护甲`、`+1 且 +1% 生命值回复` |
| **经脉** | Jīng Mài | 0.0 | `+7 且 +1% 灵力值`、`+1 且 +1% 法抗`、`+1 且 +1% 灵力值回复` |
| **根骨** | Gēn Gǔ | 0.0 | `+12 且 +1% 生命值`、`+7 且 +1% 灵力值`、`+1 且 +1% 化解` |
| **力道** | Lì Dào | 0.0 | `+1 且 +1% 物理攻击`、`+1 且 +1% 暴击`、`+1 且 +1% 破招` |
| **神识** | Shén Shí | 0.0 | `+2 且 +2% 术法攻击 (术法攻击×2)`、`+1 且 +1% 命中` |

> 期望玩家面板中六维拆记为 `rootFlat`（固定值，建模口径：各属性按 `ExpectPoints(Level)` 点预算 × 系数）与 `rootMultiplier`（百分比，`rootPercentage = ExpectPoints × 1%`）；`ExpectPoints(Level) = 3×Level`（全线性，一级境界对应三点，Lv18 收敛 54、Lv127 收敛 381）。结算式为 `finalExpected = (baseFlat + rootFlat) × (1 + root%) × (1+装备%) × (1+Buff%)`。

## 7.7 战斗伤害与对抗计算公式

### 7.7.1 伤害结算链：大类抗性穿甲 + 分类增减伤 + 免伤
战斗伤害计算以**大类抗性平方穿甲**打底，再经攻方分类增伤、守方分类减伤、暴击与免伤点数依次修正：

1. **第一层：大类抗性非线性平方减伤（护甲 / 法抗）**：
   $$\text{DamageAfterCategory} = \frac{\mathbf{RawDamage^2}}{\mathbf{RawDamage} + \mathbf{RES} \times K + 1.0}$$
   - **原始伤害口径**：普攻 `RawDamage = 物理攻击 ×(1+普攻增幅点数/100)`；技能命中的单发威力在出手构造时按 `攻基 ×(1+技能增幅点数/100) × 技能倍率` 并入——两类增幅点数均在抗性穿甲之前放大单发威力，天然穿甲优势随之同步生效；
   - **动态抗性系数 $K$**：等于当前等阶 `Tier`，由 `BaseAttributeCatalog.TierAt(level)` 锚点计数推导（`baseAttributeAnchors` 起始等级 `1/18/30/42/54/66/78/90/102/114/126/127`，等级不超过 `level` 的锚点个数即为 `K`；T1 得 `1.0`、T2 得 `2.0`，直至 T12 段 `12.0`，详见基准表）。
   - **有效抗性 ($\mathbf{RES}$)**：计算穿透比例后实际起效的大类抗性。物理伤害对应守方护甲（`Armor`），术法伤害对应守方法抗（`MagicResistance`）；化解成功时 $\text{RES} \times 2$。
   - **公式特性**：单发原始伤害越高，天然穿甲能力越强；法系凭借超大 AP 具备极强天然破防优势。

2. **攻方增伤乘区（Linear 点数，正向线性）**：
   按伤害归属匹配生效，逐项线性乘算：
   $$\times\left(1+\frac{\text{物理增伤或法术增伤}}{100}\right) \times \left(1+\frac{\text{对应五行增伤}}{100}\right) \times \left(1+\frac{\text{总增伤}}{100}\right)$$
   - 物理/法术增伤按伤害大类匹配（普攻与物理技能吃物理增伤，术法技能吃法术增伤）；
   - 五行增伤仅在攻击携带对应五行属性时生效（`Element.None` 跳过该项）；
   - 普攻增幅与技能增幅不在本层——二者已并入原始威力基数（见第一层口径），不与后段增伤重复乘算。

3. **守方减伤乘区（NonLinear 点数，正向收敛）**：
   按承伤归属匹配生效，逐项收敛乘算，任意单项减伤永不归零伤害：
   $$\times\frac{100}{100+\text{物理减伤或法术减伤}} \times \frac{100}{100+\text{对应五行减伤}}$$
   - 与增伤同口径分类匹配：物理减伤抵物理伤害、五行减伤抵对应五行攻击。

4. **暴击判定与最终伤害**：
   $$\text{实际伤害} = \text{DamageAfterElement} \times (\text{是否暴击} ? (1+\frac{\text{暴击伤害点数}}{100}) : 1.0)$$

5. **总减伤（免伤点数）末位收口**：
   通用承伤减免，守方 `DamageAbsorptionPoints + BonusAbsorptionPoints + BuffAbsorptionPoints` 合并后：
   $$\text{最终承伤} = \text{实际伤害} \times \frac{100}{100 + \text{总减伤}}$$
   总减伤为负时反向增伤，结算下限截断为 $0$。

> **修正说明**：五行抗性（`MetalResistance` 等元素抗性字段与第二层抗性减免）为历史误植，已废除——五行防御统一由「五行减伤」百分比点数承担；配表与代码字段清理另行落地。

**公式特性解读**：
- **半伤线**：$\text{RES} \times K \approx \text{RawDamage}$ 处承伤正好减半——守方「有效抗性 × 等阶系数」就是攻方单发伤害的半价线；
- **境界压制**：$K$ = 守方等阶，低阶攻高阶时 $\text{RES} \times K$ 被放大、伤害平方级跌落，跨阶悬殊由公式本身表达，无需特例；
- **天然穿甲**：单发原始伤害越高穿透越强——同等总面板下「一刀大伤害」比「多刀小伤害」破防效率高，AP 大招是天然破防武器；
- **对抗而非固定值**：护甲/法抗不是减伤百分比，而是与攻方单发伤害对抗的「点数」，减伤效果取决于双方量级比。
### 7.7.2 技能消耗口径
技能配表的 `manaCost` 字段直接声明 MP 点数消耗，结算时按表值全额扣除，不再经任何系数放大或二次换算：
$$\text{最终灵力消耗} = \text{manaCost（配表点数）}$$
按此口径，Lv1 基础灵力上限（MP 50，六维为固定值加成、随修炼增长）即可覆盖全部 T1 技能消耗，10 门技能（含嘲讽、破阵子等支援类）全部可装配、可施放。

- **吟唱打断退还**：灵力消耗与冷却的生效语义挂在「吟唱完成结算」上——吟唱中途被打断（如团灭瞬间全场吟唱作废，见 §7.9.4）视为技能未释放，起手预扣的灵力全额退还且不进入冷却；只有完整吟唱并结算的技能才消耗灵力、进入冷却。

### 7.7.3 三大对抗机制与触发概率公式 (常数 $K = 100.0$)

**对抗数值而非固定百分比**：命中、闪避、暴击、免爆、破招、化解全部为「点数」属性，触发概率由**攻防双方点数**与常数 $K=100$ 共同决定，形如 $\frac{\text{我方点数}}{\text{我方点数} + \text{对方点数} + 100}$；不存在写死的百分比面板。双方等点数时概率低于 $50\%$ 并随总点数渐近逼近 $50\%$——常数项是收敛阻尼，数值膨胀天然不溢出，每点边际收益递减。

1. **闪避 vs 命中对抗 (先判定是否被闪避)**：
   攻击发起时，系统优先判定守方是否成功闪避：
   $$\text{闪避概率} = \frac{\text{守方闪避}}{\text{守方闪避} + \text{攻方命中} + 100.0}$$
   - **闪避成功**：本次攻击完全落空，造成 0 伤害；
   - **闪避失败 (即命中)**：进入后续伤害与暴击减免结算。$0$ 闪避对 $0$ 命中时闪避率为 $0\%$ (默认必中)。

2. **暴击 vs 免爆对抗**：
   命中后判定是否触发暴击：
   $$\text{暴击概率} = \frac{\text{攻方暴击}}{\text{攻方暴击} + \text{守方免爆} + 100.0}$$
   - **暴击成功**：伤害乘以暴伤倍率 `1+暴击伤害点数/100`（基础自带 50 点即 150%）。$0$ 暴击时暴击率为 $0\%$。

3. **破招 vs 化解对抗**（同一次 roll 双分支互斥，仅点数更高一方有机会触发）：
   - **破招触发**：攻方破招 > 守方化解时，按概率 $\frac{\text{攻方破招}}{\text{攻方破招} + \text{守方化解} + 100.0}$ 判定，成功时**命中值与暴击值实际计算效果翻倍**；
   - **化解触发**：守方化解 > 攻方破招时，按概率 $\frac{\text{守方化解}}{\text{守方化解} + \text{攻方破招} + 100.0}$ 判定，成功时**双抗（护甲/法抗）与闪避实际计算效果翻倍**。

破招/化解 ×2 修正落定之后、命中掷骰之前，命中与闪避等效还要再过一次**战斗经验对抗**修正（见 §7.7.6）。

### 7.7.4 攻击反应触发器域（吸血/吸蓝/反伤）

所有伤害（普攻、玩家技能、怪物技能、斗法镜像）统一汇流 `ResolveAttack` 单点结算；伤害落账后引擎把攻击方/受击方各一条 `OnHit` 触发器入队 `encounter.PendingTriggers` 并立即按入队序消费——ECS 宿主经 `RunSystem<IOnHitTrigger>(unitEntity)` 实体派发（标记组件 + `SystemOrder` 排序），无实体路径经 `InlineCombatTriggerSink` 内联数学，两路共用 `CombatTriggerMath` 同一实现，结果逐位一致：

- **命中判定与伤害结算**：判定前/落账前的结算链仍在引擎本体内按固定次序执行；
- **落账后衍生结算**（触发器域，`CombatTriggerMath`）：
  - **气血汲取**（Order 100，`OnHitLeechSystem`）：命中后按 `实伤 × HpDrainRatio` 回复攻击方气血，产出治疗衍生事件；
  - **灵力汲取**（Order 110，`ManaLeechSystem`）：按 `实伤 × MpDrainRatio` 从目标灵力池偷取，目标扣全额、攻击方只装得下的部分；
  - **伤害反弹**（Order 200，`ThornsSystem`）：受击方把 `实伤 × DamageReflectRatio` 弹回攻击方，计入受击方威胁值；
  - **受击涨威胁**（Order 300，`ThreatOnTakenSystem`）：受击方按 `原始伤害（减免前面板威力）× ThreatOnTakenRatio` 增加自身威胁；仅命中生效，未命中不算「受到伤害」。

效果强度统一打包在 `CombatantStats.Effects`（`CombatEffectProfile`）：玩家侧由装备 `specialMechanics.hpDrainRatio` / `mpDrainRatio` / `damageReflectRatio` 经属性解析汇入，怪物侧由配表同名字段直接声明；reactive 标记组件（`OnHitLeech`/`ManaLeech`/`Thorns`）由 `CombatTriggerSurface` 按 Effects 管理挂摘，参数永无双写。

**确定性约束**：触发器禁止另起随机源与墙钟读取，随机判定走 `CombatHitContext.NextRoll()` 独立通道（0~15 号通道为核心结算保留，触发器通道自 64 起）；触发器衍生伤害**直接落账、不回流管线**，杜绝递归触发；`UpdateOutcome` 永远在触发器结算之后运行，命中回血可救活自己。

### 7.7.5 百分比属性双曲线规约与修饰属性清单

**双数值类型（`PercentValue`）**：所有百分比修饰属性以 `double`「点数」存储（100 点 = 100%），按曲线模式换算为乘区。设计不变量：**点数在收益域恒定每点 1% 收益，百分比只是投影显示**——加成方向走分子线性、惩罚方向走分母渐近收敛，彻底规避"80%→90% 收益翻倍"与"堆满归零"两类断崖。

- **线性百分比（Linear）**：$+x \Rightarrow \times\left(1+\frac{x}{100}\right)$（+300 = +300%，×4）；负向软着陆 $-x \Rightarrow \times\frac{100}{100+|x|}$（−300 = −75%，×0.25）。适用全部增伤/增幅/汲取类。
- **非线性百分比（NonLinear）**：$+x \Rightarrow \times\frac{100}{100+x}$（+300 = 75% 缩减，时间/承伤 ×0.25，等价速率域每点线性 +1%）；负向线性放大 $-x \Rightarrow \times\left(1+\frac{|x|}{100}\right)$。适用减伤/缩减/速率类。

**伤害增减修饰 16 项**（增伤作用于攻方打出伤害，减伤作用于守方承受伤害）：

| 方向 | 属性（Linear 增伤 / NonLinear 减伤） |
| :--- | :--- |
| 大类 | 物理增伤/物理减伤、法术增伤/法术减伤 |
| 五行 | 金/木/水/火/土 增伤/减伤（10 项，按攻击携带的五行属性匹配，`Element.None` 均跳过） |
| 总增减 | 总增伤、总减伤（免伤点数） |

**特殊属性 10 项**：

| 属性 | 曲线 | 默认 | 语义 |
| :--- | :--- | :--- | :--- |
| 暴击伤害 | Linear 点数 | 50 | 暴击伤害倍率 = 1+点数/100（50 点即 150%） |
| 攻击速度 | NonLinear | 0 | 普攻读条时间 ÷(1+x/100)，仅作用于普攻 |
| 行动速度 | NonLinear | 0 | 所有读条时间 ÷(1+x/100)；普攻上与攻速乘算（双重除数） |
| 冷却缩减 | NonLinear | 0 | 所有冷却时间 ÷(1+x/100)，适用于全部冷却属性 |
| 普攻增幅 | Linear | 0 | 普攻与带「普通攻击」tag 技能的增伤修饰（tag 机制待落地，当前无技能携带） |
| 技能增幅 | Linear | 0 | 不带「普通攻击」tag 技能的增伤修饰 |
| 治疗增幅 | Linear | 0 | 仅放大角色主动治疗技能的回血量（不含自动回复） |
| 威胁增幅 | Linear | 0 | 不改威胁存储值，仅在判定/显示等使用侧乘算：`有效威胁 = Threat × (1 + 增幅)`；增幅归零即还原为基础威胁 |
| 气血汲取 | Linear 非负钳制 | 0 | 命中实伤 × 比例回复攻击方气血 |
| 灵力汲取 | Linear 非负钳制 | 0 | 命中实伤 × 比例从目标灵力池偷取 |

**特殊属性获取口径（玩家 vs 怪物）**：特殊属性对玩家是**获取型属性**——只能经装备 `specialMechanics`、内功、特质、Buff、建筑等明确手段获得，境界不产出、不保送；玩家面板中的此类点数全部可溯源到具体来源。怪物侧则把等级成长折算为「基准点数」注入同一通道，作为同构建模底座：配表等级换算的同额点数在 `GameDataCatalog` 解析时并入怪物 `modifiers`，与玩家走同一结算链（折算公式与逐阶等效值见 §11.1.4.3/§11.2.3.2）。

**怪物基准点数公式**（$x^2$ 为 §11 二次进度 $(Level-1)/126$ 的平方，$Tier$ 为 §3 等阶锚点计数）：

- **行动速度**：基准点数 = $100\cdot(1/(1-0.5x^2)-1)$，满级 +100 ⇒ 读条等效 ×0.5；同时决定波间寻怪读条快慢；

### 7.7.6 战斗经验对抗（命中/闪避等效修正）

战斗经验（`CombatExperience`）是独立的**对抗池**：只累积、不消耗，语义与入账口径见 §7.11。在命中/闪避等效计算末尾——破招/化解 ×2 修正之后、命中掷骰之前——附加一次双方战斗经验对抗修正：

- **经验比值**：记攻方战斗经验 `aCE`、守方战斗经验 `bCE`、防除零小量 `ε`，
  $$r = \mathrm{clamp}\!\left(\frac{aCE}{\max(bCE,\ \varepsilon)},\ 0.1,\ 10\right)$$
  双方战斗经验均 $\le 0$ 时视为**中立**，不做任何修正。
- **$r \ge 1$（攻方经验占优）**：攻方命中等效 $\times \min\!\left(2,\ 1+\frac{r-1}{8}\right)$，守方闪避等效 $\times \max\!\left(0.5,\ 1-\frac{r-1}{16}\right)$。
- **$r < 1$（守方经验占优）**：令 $s = 1/r \in (1, 10]$，攻方命中等效 $\times \max\!\left(0.5,\ 1-\frac{s-1}{16}\right)$，守方闪避等效 $\times \min\!\left(2,\ 1+\frac{s-1}{8}\right)$。
- **镜像对称**：占优方的增益走 $/8$ 斜率、封顶 $\times 2$；劣势方的衰减走 $/16$ 斜率、托底 $\times 0.5$。攻守互换视角后结论互换，公式自洽无特例。
- **示例**：攻方战斗经验为守方 5 倍（$r=5$）→ 命中等效 $\times 150\%$、守方闪避等效 $\times 75\%$；$r \ge 9$ 时封顶 $\times 200\%$ / $\times 50\%$。
- **接入位置**：修正只作用于 §7.7.3 第 1 条闪避对抗的两侧等效输入，不改暴击、破招/化解判定与伤害结算链，不新增随机抽取——随机数序列与 roll 通道分配不变，同种子回放逐位一致。
- **各单位取值**：玩家战斗经验取 `Progression.CombatExperience` 注入战斗面板（`CombatantStats.CombatExperience`）；怪物不入配表，按其配表 `level` 对应累计修为 $\sum_{i=1}^{level-1} \text{expToNext}[i]$ 派生（`RealmProgressionCatalog.CumulativeExpFor(level)`）；斗法镜像的战斗经验随撮合冻结面板（`DuelCombatant.Stats` → `DuelPlaybackState.OpponentStats`）携带，回放期不二次解析。

## 7.8 威胁（仇恨）与技能目标选择机制

### 7.8.1 威胁（Threat / 仇恨）定义与累积规则
- **定义**：单位在战斗中对敌方全体造成的总伤害，统一称为**“威胁”**（`double Threat`）。
- **基础威胁**：每场战斗开始时全体单位（玩家/盟友/敌人）基础威胁重置为 **100**（`CombatantState.BaseThreat`）；快照恢复沿用持久化值，不重复重置。
- **持续累积**：在整场战斗过程中持续累加，全部计算与存储均采用 `double` 精度；伤害/受击/嘲讽等增减直接改写基础存储值，**不在累积侧预乘增幅**。
- **嘲讽技能即时加成**：
  - 嘲讽类技能 `threatGain` 为**即时生效（Real-time Applied）**的基础威胁增量，直接加进存储值；
  - 嘲讽类战内 Buff 提供**限时威胁增幅点数**（如嘲讽 Buff 60s +400 点，冷却 55s 可无缝覆盖），与面板/修正增幅同乘区；
  - 嘲讽类战内 Buff 可携带**每秒周期性威胁累积**（`threatPerSecondMaxHpPoints`，如嘲讽 Buff 10 点）：沿全局 1 秒结算网格，每个整秒结算点为单位增加 `最大气血 × 点数×层数 / 100` 的基础威胁，直接改写存储值（与 `threatGain` 同通道、不预乘增幅）；与灵力回复同口径——倒地单位照常累积，复活后仇恨不回退；负值按减仇恨递减、0 托底；
  - 在计算有效威胁值时，直接按该百分比放大：
    $$\text{有效威胁值} = \text{基础威胁实际值} \times (1 + \text{威胁增幅点数}/100)$$
- **受击累积（特质类来源）**：除「打出伤害」外，`ThreatOnTakenPoints` 效果提供第二条累积通道——单位**受到伤害时**按攻击方面板原始伤害（减免链前原始威力 `AttackPower ×(1+普攻增幅点数/100)`）折算自身威胁；未命中不产生累积。

### 7.8.2 技能目标选择与命中概率分配规则
战斗中，除全体技能或明确锁定特殊类型（如生命最低友方、自身、特定指定单位等）的技能外，其余所有单体与非全体范围技能**均按候选目标的威胁值比例进行目标选择**。

#### 1. 单体技能 (Single-Target Ability)
- **总池计算**：将当前全体可选存活目标的有效威胁值求和作为总池值 $S$：
  $$S = \max\left(1.0, \sum_{i \in \text{可选目标}} \text{Threat}_i\right)$$
  *(设置保底值 $S_{\min} = 1.0$，防止除零异常)*
- **命中概率**：每个候选目标被选中的概率为其威胁值占总池的比例：
  $$P_i = \frac{\text{Threat}_i}{S}$$
- **全零回退规则**：当所有候选目标的威胁值均为 $0.0$ 时，退化为**完全等概率随机**选择其中一个目标（每个目标概率为 $1 / N$）。

#### 2. 非全体群攻技能 (Non-Full AoE Ability / Multi-Target)
根据技能机制设定，分为**可重复命中**与**不可重复命中**两种模式：

1. **可重复命中模式 (Repeatable Multi-Hit)**：
   - 技能进行的每一次打击判定，均独立在全体可选目标中按单体威胁权重概率池完整抽取一次；
   - 同一个目标可能在同一次技能中被连续命中多次。
2. **不可重复命中模式 (Unique Multi-Target)**：
   - 采用**动态缩减概率池（Sequential Elimination）**算法：
     1. 第一段在当前全体候选目标中按威胁比例抽取目标 $T_1$；
     2. 命中后将目标 $T_1$ 从候选池中剔除，剩余目标构成新的总池 $S' = \sum_{j \neq 1} \text{Threat}_j$；
     3. 后续攻击依次在剩余目标池中按更新后的威胁比例继续抽取，直至达到技能目标上限或候选池耗尽；
     4. 保证单次群攻中每个目标至多受到一次命中。

### 7.8.3 出手决策顺序与使用条件触发判定

#### 1. 出手决策顺序（目标先行）

**所有行动在选择使用什么技能之前，必须先进行威胁判定**——按 §7.8.2 规则以有效威胁权重确定性抽取本次行动的目标，锁定的单位即本轮判定的「**目标**」对象；此后才按槽位顺序遍历技能做可用性判定（触发条件 → 冷却就绪 → 灵力消耗），首个满足者进入吟唱，全部不可用时回落普通攻击。即出手序列为：

```text
威胁判定抽取目标 → 锁定为本轮「目标」对象 → 按槽序逐技能求值触发条件 → 命中首个可用技能进吟唱（预扣灵力）→ 否则普攻蓄势
```

实现落点：`DecideNextAction` 的 `primaryTarget` 入参即该锁定目标（`SelectEnemyTarget` 按 `EffectiveThreat` 抽取）；技能落账时的实际命中目标仍按 §7.8.2 在结算时刻抽取。

**敌方侧同构**：敌方出手与决策同样在 `PlayerAllies` 上按 `EffectiveThreat` 轮盘抽取目标（出手随机通道 18、决策 19）。玩家方当前恒为单成员（`PlayerAllies = [Player]`），`SelectTarget` 单存活成员提前返回不掷点——单盟友行为与「固定打玩家」逐位等价；多盟友（召唤物/组队）落地后威胁权重自动生效，受击涨威胁与威胁抑制类特质由此具备真实嘲讽/隐身语义。

#### 2. 使用条件三元组模型（技能与消耗品共用）

每条使用条件为「**对象 → 类型 → 比对方式**」三元组，条件列表全部满足才放行（AND，短路）；空表恒可用。技能与战斗消耗品（药品栏/通用栏）挂同一求值器，同一词汇表，杜绝身份分叉。

**第一层：对象**——决定条件作用域：

| 对象 | 作用域 |
|---|---|
| `self` 自身 | 施放/使用单位本身 |
| `target` 目标 | 本轮威胁判定锁定的单位（见上） |
| `ally` 友方 | 我方全体存活单位构成的集合 |
| `enemy` 敌方 | 敌方全体存活单位构成的集合 |

**第二层：类型**——随对象过滤的可选词表，两类：

- **单位状态值**（自身/目标可用，友方/敌方经成员选择后亦可用）：当前/缺失 气血与灵力（绝对值与百分比）、Buff 层数、控制类状态；
- **群体聚合值（仅友方/敌方可用）**：作用于集合而非单体——`生命值百分比最少/最多的成员`（先选出该成员再取其状态值参与比对）、`剩余存活数量`、`已阵亡数量` 等。此类类型对 `self`/`target` 不出现——单体对象没有"最少的成员"语义。

**第三层：比对方式**——按类型产出值分两种：

| 产出值类型 | 比对词表 |
|---|---|
| 数值（气血、百分比、层数、存活数等） | 大小等于：`>`、`>=`、`=`、`<=`、`<` |
| Boolean（控制状态活性等） | 是否：`是`（is-active）、`否`（is-inactive） |

**实现映射**：现 `SkillTriggerEvaluator` 的 `dependency` 词表即"对象 + 成员选择"的融合写法——单体对象 `self` / `target-enemy` / `ally-lowest-hp` / `ally-highest-hp` / `enemy-lowest-hp` / `enemy-highest-hp`，集合对象 `ally` / `enemy`（配 `alive-count`/`dead-count` 群体聚合条件）；`condition` 对应类型、`comparator` 对应比对方式（数值 `greater-than`/`equal` 等 + 布尔 `is-active`/`is-inactive`）。校验期按对象-类型-比对矩阵拒绝越界组合；运行时求值对非法输入一律返回 false 不抛异常。消耗品配置在 `usableInActionTypes` 之外声明 `triggers` 列表即接入本模型。

**消耗品求值上下文**：即时消耗品在自动激活边界求值、持续消耗品在遭遇入场补能时求值；施放方取玩家当前快照，战斗进行中敌方取当前波单位。「目标」对象在消耗品求值下按**当前存活敌方中有效威胁最高者**确定性解析（非随机抽取，避免消耗随机流）——与技能决策时刻的威胁锁定语义对齐：两者都是"本次判定时锁定的高威胁对象"。

## 7.9 角色状态世界常驻、自动回复与复活规约

### 7.9.1 世界常驻与状态连续流转原则
修士角色在修仙世界中处于持续常驻与状态连续推进状态。生命值（Hitpoints）与灵力值（Manapoints）由底层 `CombatResources` 权威持久化，**彻底移除任何不合理的瞬间重置与满状态重置事件**：
1. **移除战斗边界重置**：单场遭遇结束、战胜单只怪物、跨多波遭遇推进、进入新战斗时，严格保留玩家当前的实际生命与灵力残值，绝不在进入或结束战斗时回满。
2. **移除脱战无故回满**：取消战斗队列、手动移出战斗、切换到生活/采集/打坐行动时，存活玩家保持当前血蓝脱离战斗。

### 7.9.2 自然回复属性由基础属性表配置

角色在挂机、探索、炼丹、打坐、赶路及战斗各阶段均按回复属性结算自然回复。

- **配置是真源**：随境界成长的基础生命上限、基础生命回复 `HpRegen` 和基础灵力回复 `MpRegen` 均由基础属性表提供。调整基础回复数值应修改配置，不在服务端或前端硬编码百分比推导公式。配置归属与当前落地状态见 [基础属性模型 §11.1.5.1](./11-数值量化模型集.md#11151-自然回复基础值的配表边界)。
- **2% 的准确含义**：它是生命回复的配表选值依据，参考的是**对应境界的基础生命上限**，不是包含资质、装备、Buff 后的最终生命上限。配表时将对应点数写入基础回复属性；运行时代码读取该属性，不执行“基础生命上限 × 2%”或“最终生命上限 × 2%”。后续平衡只调整表中数值，不要求代码维持固定比例。
- **独立属性**：生命上限加成不会自动转化为回复加成。只有明确作用于回复属性的资质、装备、Buff 等，才按各自属性规则调整回复量；同一来源同时增加生命上限与回复时分别处理，不能重复计算。
- **灵力回复**：同样读取表中的独立回复属性；本次澄清不为灵力指定固定 2% 或其他比例。
- **不新增隐式规则**：不从“2%”推导运行时保底 1 点、向下取整或缺字段时按上限补算。回复保持 `double` 精度。
- **周期实现基线**：当前实现基线为 **5 秒整额回复周期**——`HpRegen`/`MpRegen` 每 5 秒一跳，整额结算表值回复量（`RegenTickMilliseconds = 5_000`）。表中回复量的时间单位按每跳整额理解，协议展示单位随快照口径下发。

**配表示例（仅解释语义，不指定周期或实际数值）**：某境界基础生命上限配置为 1,000，基础生命回复配置为 20。装备仅将最终生命上限提高至 1,500 时，该基础回复仍为 20；进入基础生命上限 2,000、基础回复 40 的境界时，读取新配置的 40。代码无需也不得为这个示例补入固定 2% 公式。

### 7.9.3 死亡状态下的资源回复规则
当角色生命值归零（$\text{Hitpoints} \le 0$）进入死亡状态（如处于战斗死亡倒计时或历练死亡阶段等待复活读条）：
1. **生命值保持为 0**：未完成复活前不产生任何自然回血，生命值严格保持 0。
2. **灵力持续自动回复**：死亡状态下经脉灵力依然正常运转，按灵力回复速率持续吸收天地灵气恢复，死亡期间积累的灵力在复活或脱战后完整保留。

该规则对一切战斗单位同构：原地复活遭遇的战内躺尸窗口中，阵亡单位（含怪物尸体）气血锁 0 不结算回血、灵力回复按 5 秒网格照常入账。

### 7.9.4 团灭分流规约：原地复活 vs 团灭即败

战斗终局判定统一为「一方全体阵亡」：敌方全灭即玩家胜（`PlayerWon`）；**玩家方全体阵亡 = 团灭**（当前玩家方为单人单位，团灭即玩家阵亡；未来队伍/召唤物扩展后按全体存活判定）。团灭发生后按遭遇声明的团灭规则 `onPartyWipe` 分流，这是战斗的两条正式分支而非模式特例：

| `onPartyWipe` | 适用模式 | 团灭后果 |
| :--- | :--- | :--- |
| `respawn`（原地复活） | 野外历练等常驻 PvE 遭遇（缺省值） | 战斗**不终结**：玩家原地躺尸读条，读满起身续打同一波残局 |
| `defeat`（团灭即败） | 斗法（PVP）、副本、闯关爬塔等 | `Outcome = EnemyWon` 终局，善后由各模式编排层处理 |

- **善后是模式级策略，不进战斗引擎**：引擎只负责产出 `EnemyWon` 终局信号。斗法的善后为暂存物归属结算 + 败绩冷却 + 拆场读条复活重新搜寻；未来副本/爬塔的善后（踢出副本、挑战失败计数、回退层数等）由各自编排层实现。
- 野外遭遇若配置 `defeat`，善后为复活点语义：拆场 → 复活读条（`playerRespawnMilliseconds`）→ 满血满蓝清冷却 → 波次重置回第 1 波重新搜寻。

#### 原地复活（`respawn`）分支细则

1. **阵亡瞬间**：双方正在吟唱的技能全部打断——未完成的吟唱视为未释放，退还起手预扣灵力且不进入冷却（§7.7.2）。
2. **躺尸窗口（时钟照走）**：战斗时钟照常推进。怪物因失去目标不再出手，但其技能冷却（绝对时间戳）自然流逝、面板回血与 Buff 周期回复按 5 秒结算网格照常、Buff 到期正常剥落；玩家气血锁 0，灵力回复照常（§7.9.3）。
3. **起身结算**：读条满（按战斗时钟计 `playerRespawnMilliseconds`）玩家原地起身，**仅恢复满生命值**；灵力、技能冷却、自动消耗品冷却不做任何额外重置——躺尸期间自然转好的即为已转好，自然回复的灵力即为已获得。起身瞬间双方重新蓄势出手。
4. **躺尸期间敌方全灭**：玩家阵亡前施加的持续伤害/反伤在躺尸窗口把怪物跳死全灭 → 照常判 `PlayerWon` 结算掉落与轮次，玩家起身（满血）后进入下一波搜寻。
5. **计数口径**：每次阵亡计一次败走（`totalDefeats`）与死亡（`deaths`）并发 `combat.lost` 事件；起身发 `combat.respawned`。
6. **无兜底**：实力不足时「阵亡→复活→再阵亡」可无限循环，直到玩家手动取消行动脱战（按脱战复苏 1 HP 处理）；怪物在躺尸期间持续回血，连败成本自负。

#### 复活结算总表

| 复活类型 | 触发时机 | 生命值结算 (HP) | 灵力/冷却结算 | 机制说明 |
| :--- | :--- | :--- | :--- | :--- |
| **原地复活** | `onPartyWipe=respawn` 遭遇中玩家阵亡读条完成 | **恢复满生命值** (`MaxHitpoints`) | 灵力不回满（保留死亡期间自然回复累计值）；技能与自动消耗品冷却按自然流逝处理 | 原地起身，续打同一波残局 |
| **复活点读条复活** | `onPartyWipe=defeat` 善后读条完成（斗法落败、defeat 遭遇战败等） | **恢复满生命值** (`MaxHitpoints`) | **恢复满灵力值** (`MaxManapoints`)、清空技能与自动消耗品冷却 | 重塑肉身；战场已拆，重新搜寻第 1 波 |
| **退出战斗脱战复苏** | 处于死亡状态下取消战斗队列、手动移出战斗、历练结束脱离战斗 | **恢复至 1 点生命** (`1 HP`) | **保持当前灵力**（不回满，保留死亡期间已回复灵力） | 仅给予 1 点重伤复苏血量防止脱战后立即死亡，绝不一键回满 |

- 若玩家退出战斗时处于**存活状态**（$\text{Hitpoints} > 0$），则生命值与灵力值均直接保持离开时的当前值，不触发任何复活与重置。

#### 受阻行动的濒死复苏兜底

气血归零（$\text{Hitpoints} \le 0$）驻留时，任何远征/讨伐行动推进到入场都会被判定「无法迎战」进入受阻停泊。由于死亡状态下生命值不产生自然回血（§7.9.3），受阻行动若只等待回血将**永远无法自愈**——因此受阻队首在每次推进复核时先按脱战复苏同口径归一 `1 HP`，再重跑准入续战；复苏后以 1 点残血重新入场，仍可能被再次击倒回到正常连败循环（§7.9.4.6 无兜底条款），但队列本身不再死锁。同理，插队顶替、移除、清空等使远征行动离队的操作，在玩家气血归零时一律按复苏 1 HP 处理。

### 7.9.5 战内 Buff 生命周期

战内 Buff（`CombatBuffState`）是随战斗授予的临时效果，生命周期以**整场战斗行动**为单位，而不是以单场波次为单位：

- **跨波存续（默认）**：波次清空时，单位战内 Buff 按战斗时钟剩余秒数折算为**跨波携带态**（`PlayerCombatBuffState`/`ExpeditionAllyState.CombatBuffs`），下一波入场按 `新时钟 + 定格剩余` 重注入；搜寻/复活等脱战相位时钟冻结不折算（与持续消耗品扣减同模型，§6.3）。玩家、盟友成员同口径——参与会话中盟友携带态随冻结成员镜像同步。
- **`resetOnWave` 特例开关**：配表 `buff.resetOnWave: true` 的 Buff 不进入跨波携带（波次清空即消散），默认 `false`。**战外 Buff、持续消耗品槽注入、特质授予（如隐身）等由外部真源每波重新注入的 Buff 恒视为每波重置**——携带会造成复活幽灵副本并逃逸其真实生命周期。
- **行动结束统一移除**：携带态只在整场战斗行动结束时移除——行动实例离队（移除/完成出队/插队顶替/队列清空/散场结算/迁地重锚）时统一清空；倒地、原地复活、波次轮转、斗法回放均不移除。
- **波中持久化**：战斗进行中的实时 Buff 随 `CombatantSnapshot.Buffs` 持久化（战斗时钟到期时刻），进程重启恢复精确还原，与携带态分工互不重叠。
- **详情面板口径**：战内 Buff 的威胁增幅点数折入属性面板的「威胁增幅」展示值（与 §7.8.1 有效威胁同乘区），面板与目标判定读取同一有效值。
- **作用范围**：战内 Buff 默认作用于持有者单体；**阵法类持续消耗品（`subCategory=formation`）的 Buff 全队生效**——注入己方全部在场单位而非仅使用者（单人与组队同口径：组队按各成员开打定格散布到盟友阵列，同 `buffId` 按成员序后者覆盖）。其余持续消耗品 Buff 仍只加使用者。

## 7.10 斗法（PVP）规约

斗法是历练战斗行动的可选玩法：玩家在战斗行动确认面板勾选「斗法」即同意参与 PVP 匹配，双方为实时结算的同一场战斗。

### 7.10.1 遭遇与匹配

- 勾选斗法的队伍（单人或多人队伍均按一个匹配单位）每次进入战斗按 `duel.settings.encounterChancePerBattle` 概率增加 1 点斗法遭遇计数（默认约两小时一次，允许随机波动）。
- 计数大于 0 时下次搜寻完成进入匹配等待，由撮合运行时在已加载玩家中随机选择实力相近的对手：实力按六维等级总和计算，仅允许 ±`powerBandRatio`（默认 30%）范围内匹配。
- 匹配等待对玩家静默：进入等待不产生任何提示，撮合成功才出现对手并写「斗法遭遇」日志；无候选对手时静默回退为正常波次，遭遇计数保留待下次再试。
- 在线与离线挂机玩家均参与行动与匹配；只有彻底离线（actor 未加载）不参与。
- 斗法失败一方进入 `defeatCooldownSeconds`（默认 3600 秒）冷却，期间不再判定计数与匹配。
- 无撮合能力的离线补算路径保留计数并回退为正常波次，不产生斗法。

### 7.10.2 剧本锁定与弃战

- 撮合成功瞬间冻结双方属性面板、功法槽位与暂存物品清单，一次性推演完整 `DuelScript`；战斗期间任何配置修改不生效，重新进入战斗行动才生效。
- 双方各自回放同一份剧本（`ViewerIsInitiator` 视角翻译）；任一方主动结束行动、调序挪下队首或发起移动即弃战判负，对方立即判胜。

### 7.10.3 收益与暂存区

- 勾选斗法期间战斗物品爆率总增 `dropChanceBonusPercent`（默认 +20%）；掉落的物品先进入暂存区，`stagedSettleSeconds`（默认 1200 秒）后入账；斗法进行中暂存区冻结。
- 暂存区按 `stagedBucketSeconds`（默认 300 秒）档位桶化存储：入账时刻向上量化到桶尾，同一物品同一桶合并为一条，结算时刻 = 桶尾 + `stagedSettleSeconds`——押存窗口为 20~25 分钟，绝不早于 20 分钟落袋；单物品最多 `stagedSettleSeconds/stagedBucketSeconds` 批，暂存列表规模有界。
- 斗法落败时，败方暂存区全部物品转移给胜方；胜方入账走自身模拟的 `AssetDelta` 事务，败方仅清自身分段。
- 每次新战斗行动会话重置本次收益账本，统计修为（`Experience`）、底蕴（`Foundation` 净变动）、战斗经验（`CombatExperience`）、六维经验（`RootExp`）与物品；归档最多保留 `maxBattleReports`（默认 10）条。
- 击杀收益为单参数 `experience`：同额经 `CreditExperience` 结算修为三池、等额累积战斗经验。配表 `experience` 为显式覆盖项——缺省按怪物 `level`+`rank` 派生（`RealmProgressionCatalog.MonsterKillExperience`）：`experience = expToNext[level] / 1000 × 0.9^(level-1) × rankMult`，份额以 Lv1 = 1/1000 为基准、每级指数衰减 10% 渐近 0（同级刷怪的修为条效率随等级递减），层次倍率小怪 1×、精英 3×、妖王 10×；等级超出 `expToNext` 配表上界时按末档非零修为条派生。多人同场击杀按在场玩家平分（共战会话语义见 [第二十一篇 §21.13](./21-同道与组队系统.md)，含掉落增幅加权归属与等级惩罚细则）。六维经验每个归属维度各得全额 `experience × mult_i × eff`（总量 = `experience × eff × Σmult`，非守恒；mult 缺省 1.0、可为 0；`eff = 1 + rootExpEfficiencyPerLevel × (参悟Lv − 1)`），未装内功六维全归属、各得全额（总量 6×），神通/外功不参与分配。修为类收益的 `amp` 另乘内功 `cultivationExpBonusPoints` 独立乘区（见 [第五篇](./05-技能神通与秘籍残卷体系.md) §5.3）。怪物战斗经验不入配表，按其 `level` 经 `CumulativeExpFor` 派生（见 §7.7.6）。

### 7.10.4 队伍斗法（整队为一个匹配单位）

斗法撮合以「单位」为粒度：勾选斗法的单人玩家是单人单位；档案勾选斗法、目标为讨伐且会话进行中的整支队伍是队伍单位（组织与会话语义见 [第二十一篇 §21.13](./21-同道与组队系统.md)）。单人单位与队伍单位同一撮合池、同一实力带口径。

- **开关与冻结**：队伍斗法开关 `pvpEnabled` 是队伍档案字段，仅队长可修改，队员只读可见；仅 `activityKind='combat'` 可为 true，档案目标改离讨伐时自动归位 false。会话创建时把开关冻结进参与规格（`ActionParticipationSpec.PvpEnabled`）；会话存续期间档案开关与冻结值不一致即散场重建（与目标漂移同口径），新会话按新值冻结。
- **单位实力**：单位实力 = 全体出战单位六维等级总和之和（单人即本人六维总和、队伍为全体成员之和），匹配仍限 ±`powerBandRatio`。
- **遭遇计数**：队伍单位的斗法遭遇计数随会话生灭、由会话权威状态承载，随会话每次进入战斗按 `encounterChancePerBattle` 递增；计数大于 0 时下次搜寻完成整队进入撮合等待，回退/等待口径与单人一致。
- **剧本多方化**：`DuelScript` 输入由双方各一名 `DuelCombatant` 扩展为两侧各 1~5 名名单；`DuelScriptEvent` 以双方单位下标定位出手/受击者；回放载荷携带本方名单（成员按 `SelfIndex` 定位自身单位）与对手名单，单方玩家对阵队伍时对手名单即对方全员。剧本撮合时一次性推演完毕，队伍单位全员按同一份剧本各自视角回放，与单人共用同一结算模型。
- **暂存区**：队伍单位每名成员持有个人暂存区；会话勾选斗法期间归属该成员的掉落进其个人暂存区。斗法落败时败方全体成员的暂存物池按胜方成员数均分转移（向下取整，余数按胜方名单顺序补足），入账与清理口径同单人。
- **弃战与冷却**：队伍单位任一成员取消准备、离队、被移出或离线逐出即散场——斗法进行中散场视同整队弃战判负，全体成员各入 `defeatCooldownSeconds` 冷却；单方弃战沿用现有口径。队伍单位再次进入撮合等待要求全体成员均无失败冷却。

## 7.11 成长体系四池与内视协议字段规约

### 7.11.1 四池权威语义

成长体系由四个独立池构成，互不替代、各有结算口径（字段宿主见 [第二篇 §2.2.2](./02-角色核心与常驻实体设计.md)）：

| 池 | 领域字段 | 语义 | 突破时 |
| :--- | :--- | :--- | :--- |
| **修为** | `PlayerProgression.Experience` | 当前层突破计量条（顶部进度条），`expToNext[realmLevel]` 封顶 | **清零** |
| **六维经验** | `PlayerLoadout.CoreAttributes`（`StaminaExp` 等六字段） | 六根各自经验，等级由 `RootAttributeCurve` 经 `RealmProgressionCatalog` 派生的 381 点成本表导出（§3.2.2） | 不清空 |
| **底蕴** | `PlayerProgression.Foundation` | 修为满层溢出沉淀池；未满层时按 1:1 兑换放大修为获取 | **不清空** |
| **战斗经验** | `PlayerProgression.CombatExperience` | 修为类收益按增幅前基础量等额入账，喂给 §7.7.6 对抗修正 | **不清空** |

另有累计口径一条：`LifetimeExperience`（历史修为类收益总量，增幅后口径、含满层转底蕴部分，单调递增永不清零），为前端「总修为」悬浮条数据源。

**修为类收益统一结算公式**（`PlayerProgression.CreditExperience`，连续收益 / 单轮奖励 / 击杀奖励与领域冥想路径共用单点）：记该笔收益增幅后量 `amp`、增幅前基础量 `base`、本层上限 `cap`：

$$\text{credited} = \min\!\left(3 \cdot amp,\ amp + Foundation,\ \max(0,\ cap - Experience)\right)$$
$$Experience \mathrel{+}= \text{credited};\quad Foundation \mathrel{+}= amp - \text{credited};\quad CombatExperience \mathrel{+}= base$$

- 满层时 `credited = 0` → 该笔收益 100% 沉淀为底蕴；
- 未满层时每 1 点底蕴兑换 1 点额外修为，单笔放大最高 3 倍（底蕴耗尽即止）；
- `Foundation` 记**净变动**（可为负：兑换消耗时底蕴减少）；`CombatExperience` 恒按 `base` 入账，满层溢出转底蕴的部分同样计入；
- 修为类收益指入账 `Experience` 池的全部收益（`experience` 类 yields、怪物击杀 `experience`、冥想修为等）；六维经验与物品不经过本结算。

### 7.11.2 内视与协议字段对照

`progression` 分段 wire 键（camelCase）与前端绑定；全库命名总表见 [第十九篇](./19-名词术语对照表.md)：

| wire 键 | 领域字段 | 前端 Stats 键 | 前端词条 / 落点 |
| :--- | :--- | :--- | :--- |
| `realmLevel` | `RealmLevel` | `stats.realmLevel` | 境界等级 Lv（`insight.badge.levelBadge`） |
| `experience` | `Experience` | `stats.experience` | 修为进度条「当前修为 / 突破所需」（`insight.currentExp` / `insight.nextExp`） |
| `foundation` | `Foundation` | `stats.foundation` | 「底蕴」pill（`insight.foundation.daoFoundation`，词条名由「道基底蕴」更名「底蕴」） |
| `combatExperience` | `CombatExperience` | `stats.combatExperience` | 「战斗经验」pill（`insight.foundation.combatExp`） |
| `lifetimeExperience` | `LifetimeExperience` | `stats.lifetimeExperience` | 「总修为」悬浮条（`insight.totalSpirit`/`app.topbar.totalSpirit`） |
| `lifespanYears` | `RealmProgression.LifespanYearsFor(TierAt(realmLevel))` 派生 | `stats.lifespanYears` | 「寿元」（`insight.bio.lifespan`） |

**历史错位（已纠正）**：wire/前端 `spirit` 键曾承载修为（`Experience`），已更名 `experience`；前端「战斗经验」词条此前错位显示 `stats.spirit`（实为修为值），「道基底蕴」词条此前错位借 `stats.qi` 充数——两词条现已分别接 `foundation` / `combatExperience` 真源；「总修为」曾错绑本层 `experience`，已改绑 `lifetimeExperience`。灵气池（`Qi`/`LifetimeQi`/`qi` 收益/`qiReward`）为无消费的废案，已整链移除。

### 7.11.3 前端词条定稿文案

- 「底蕴」tooltip（`insight.foundation.daoFoundationTooltip` 权威口径）：**修为圆满（触及本层瓶颈未突破）后继续获得的修为 100% 沉淀为底蕴；修为未满时每 1 点底蕴兑换 1 点额外修为，单笔最高放大至 3 倍。突破不清空。**
- 「战斗经验」tooltip（`insight.foundation.combatExpTooltip` 权威口径）：**每次获得修为时按增幅前基础量等额累积的实战经验，不受任何加成；与敌方战斗经验的比值在命中/闪避对抗末尾修正双方等效（上限 ×2 / 下限 ×0.5，见 §7.7.6）。**（旧文案「诛灭敌方按对手修为获益/按等级差指数」等历史机制描述作废。）
- 确定性约束：底蕴结算与经验对抗均为纯函数确定性结算——不读墙钟、不占随机通道；离线补算与在线逐秒推进位级一致。

## 7.12 特质系统规约

**特质（Trait）**是单位常驻持有的特殊效果标识：`trait.*` ID 集合随属性面板下发（`CombatantStats.Traits`），设计上分三类、实现上各走各的通道，不做统一抽象：

| 类别 | 生效方式 | 实现通道 |
| :--- | :--- | :--- |
| 纯属性增益 | 面板数值 | 特质 → 属性解析点数/固定值通道汇入面板 |
| 常驻修饰 | 反应/修饰参数 | 特质 → `CombatEffectProfile` 同族点数通道（如 `ThreatOnTakenPoints`），由既有触发器/公式消费 |
| 条件触发 | 时机判定 | 特质 ID 进 `CombatantStats.Traits`，由授予点/触发器按 ID 判定（如开战授予 buff） |

玩家侧载体：`PlayerProgression.TraitIds`（已解锁特质 ID 集合，存档持久化）→ `PlayerAttributeResolver` 折算并透传 → `CombatantStats.Traits`/`Effects`。怪物侧可由配表 `Stats.Traits` 同构声明。特质→效果映射第一版集中于 `CombatTraitRules`（Domain）：点数折算供属性解析调用，开战 buff 映射供遭遇创建调用；配表化（`traits` 词表）属远期扩展。

### 7.12.1 首批特质

- **看不到我（`trait.bukandaowo`）**：开战授予 `buff.yinshen`（持续 10 秒，`ThreatPoints = -100`）——`EffectiveThreat` 乘区归零，敌方针对此单位的威胁权重恒为 0。授予点只在 `CombatEncounterState.Create`（首次开战）；快照恢复由 Buffs 还原不重复授予，玩家复活不视为「开战」不补授。注意 §7.8.2 全零退化规则：若敌方全体候选目标威胁均为 0，退化为等概率抽取——「威胁为 0」是权重归零而非绝对不可选中。
- **力微饭否（`trait.liweifanfou`）**：折算 `ThreatOnTakenPoints = 100`——受到伤害时按攻击方面板原始伤害（减免链前）等额累积自身威胁（§7.8.1 受击累积通道），变相嘲讽。该点数通道对装备 `specialMechanics` 与怪物配表同构开放，不绑定特质 ID。

# 第八篇 大世界地图与质量预算遇怪系统

> **版本**：v1.0.0  
> **状态**：设计评审中  
> **编写时间**：2026-08-23  
> **对应任务**：[TASK-20260823-06](../../tasks/archive/archive-2026-09.md)

## 8.1 核心设计哲学

### 8.1.1 摒弃纯战斗地图，确立“通用世界地点”模型
在《道化太初》中，**不存在与大世界割裂的“纯战斗副本”或“纯刷怪地图”**。
所有地点（`WorldNode`）都是世界中的真实通用地理节点（例如：青岚药谷、青云山门、落霞西岭、玄铁矿洞、流云集等）。

每一个世界地点都拥有自己独立的生态聚合体：
1. **行动体系（Actions）**：
   - **生活 / 采集 / 生产行动**（如：采药 `explore.gather-herbs`、挖矿 `explore.mine-ore`、炼丹 `craft.alchemy` 等）；
   - **历练探索行动**（如：后山寻猎 `combat.hunt-qi-beast`、清剿裂谷 `combat.sweep-twilight-valley`）。
2. **生物生态（Creatures）**：分为 **NPC** 与 **怪物（Monsters）** 两个支柱。
3. **地理建筑 / 阵法设施（Buildings）**：如山门防护阵、聚灵泉眼、老井、哨塔等。

```
┌─────────────────────────────────────────────────────────────┐
│                    通用大世界地点 (WorldNode)                  │
│                     例：青岚药谷 (node.herb-vale)            │
├──────────────────────────────┬──────────────────────────────┤
│ 1. 驻留生物 (Creatures)       │ 2. 开放行动 (Actions)         │
│  ├─ NPC 列表 (任务/传功/剧情)  │  ├─ 采集类行动 (采药/挖矿)    │
│  └─ 怪物生态池 (历练遇怪/掉落) │  └─ 历练类行动 (战斗/清剿)    │
├──────────────────────────────┴──────────────────────────────┤
│ 3. 危险度与预算参数 (Hazard / Budget Parameters)              │
│  ├─ 危险度总预算区间 [minBudget, maxBudget] (直接代表危险度)  │
│  ├─ 精英刷新周期 (battlesPerElite，如每 5 次遭遇)            │
│  └─ 领主刷新周期 (battlesPerBoss，如每 20 次遭遇)            │
└─────────────────────────────────────────────────────────────┘
```

---

## 8.2 生物生态数据模型（NPC 与 怪物）

### 8.2.1 NPC 数据模型（人物 / 住民）
NPC 代表该地点的常驻居民、散修、执事或向导。
- **当前阶段定位**：数据结构完整规范，界面展示头像与描述，**行为交互暂时留空（预留扩展接口）**。
- **后续扩展职能**：发布委托与支线任务、传授技能功法、提供特定交互对话与好感度。

#### 数据结构定义（`NpcDefinition`）：
```typescript
interface NpcDefinition {
  id: string;              // 唯一标识，如 "npc.herbalist-lin"
  name: string;            // 姓名，如 "采药人林伯"
  title?: string;          // 头衔/称号，如 "药谷向导"
  description: string;     // 角色生平与描述
  avatar?: string;         // NPC 头像资源路径/图标
  effectDescription?: string; // 当前环境职能描述（如"后续可提供采集委托"）
  // 后续扩展字段预留
  questIds?: string[];     // 关联任务列表 (预留)
  teachableAbilityIds?: string[]; // 可传授技能列表 (预留)
}
```

---

### 8.2.2 怪物数据模型（Monsters / 妖兽）
怪物代表栖息在该地点的野生妖兽、异化生物或敌对修士。
每个怪物除了具备既定的等阶（`Tier`）、生命层次（`Rank`）与属性权重外，**必须配置单体消耗预算 `budgetCost`（质量预算点数）**。

#### 怪物配表结构示例（`config/game-data/monsters/*.json`）：
```json
{
  "id": "enemy.demonized-rabbit",
  "name": "魔化野兔",
  "visual": { "renderer": "text", "source": "兔" },
  "budgetCost": 10,
  "weights": { "hp": 1.15, "ad": 0.3, "armor": 0.65, "hit": 1.0, "eva": 1.0 },
  "dropTable": [
    { "itemId": "item.beast-hide", "dropChance": 1.0, "minQuantity": 1, "maxQuantity": 1 }
  ],
  "qiReward": 10,
  "experienceReward": 10,
  "rootExpReward": 10
}
```
> 属性面板由 `budgetCost` 与 `weights` 统一推导；`rank`（`minion`/`elite`/`boss`）决定怪我同构倍率（见第八篇）。`skills` 为敌方技能槽（可选）。
> `dropTable` 结算语义：每条目先按 `dropChance` 判定是否掉落，命中后数量在 `[minQuantity, maxQuantity]` 闭区间内整数均匀抽样；前端以迷你图标瓦片展示「`×数量` + 百分比概率」（区间数量显示 `min-max`，固定数量显示实际值）。

#### 典型预算消耗梯度基准：

下表为算法教学示例，名称和预算范围不构成现行配表。实际怪物预算、属性权重、名称及遭遇频率以 `config/game-data/monsters/` 和 `config/game-data/encounters/` 为准；不因示例差异新增同名怪物或重写预算。属性由预算和权重统一推导，目录展示必须复用战斗的解析结果。
| 怪物层次 (`Rank`) | 消耗预算 (`budgetCost`) | 典型代表 | 战力定位 |
| :--- | :--- | :--- | :--- |
| **普通杂鱼小怪 (Minion - Low)** | 10 ~ 15 点 | 魔化野兔、溪边幼龟 | 最基础练手怪，单体弱，常成群出现 |
| **强力小怪 (Minion - High)** | 20 ~ 30 点 | 木灵、火灵、通臂魔猿 | 具备初级法术或特定抗性 |
| **精英怪 (Elite)** | 40 ~ 60 点 | 刀煞尸煞、黑煞猿首 | 拥有 5 倍生命与强力技能，5 波遭遇一次 |
| **关底领主 (Boss)** | 100 ~ 200 点 | 伥鬼妖虎、坠星异兽 | 拥有 20 倍生命，关底大怪，20 波遭遇一次 |

## 8.3 地图 (Maps) 与遭遇 (Encounters) 解耦架构

### 8.3.1 架构解耦设计理念
系统将**世界地理拓扑（Maps）**与**战斗遭遇生态（Encounters）**完全解耦，分别存储于 `config/game-data/maps/` 与 `config/game-data/encounters/`：
1. **地图配置 (`maps/`) 聚焦地理拓扑与设施**：定义大世界节点坐标（`x`, `y`）、背景设定、开放的生活/采集行动（`availableActionIds`）、场景常驻建筑（`buildings`）与 NPC，并通过 `encounterIds` 弱引用战斗遭遇；
2. **遭遇配置 (`encounters/`) 聚焦战力预算与怪群生成**：定义遭遇的质量预算区间 `[minBudget, maxBudget]`、怪群随机抽取权重表（`randomSpawns`）、精英怪池（`eliteEnemyIds`）与领主怪池（`bossEnemyIds`）；
3. **解耦优势**：同一套战斗遭遇与怪物生态可被多个地理节点复用，地图节点亦可独立挂载多种遭遇副本，数值调整与地图绘制互不干扰。

### 8.3.1a 区域化单一世界坐标系
- **一张世界、按区域拆图**：整个大世界本质是同一张共享坐标系的大地图；`maps/*.json` 中每个文件定义一个「区域」（region，即一组地理相邻的节点与图内路径），所有节点的 `x`/`y` 均为**全局世界坐标**（1 单位 ≈ 视口宽/高的 1%），新区域通过在世界空位上放置自身节点坐标来落位，区域之间以留白间隔区分。
- **跨区域只经「关口节点」连通**：区域之间不直接共享节点，由一条**跨域边**（两端节点分属不同区域的边）连接两区的一对关口节点。当前唯一跨域边为 `edge.gate-rift`：**青云山门（`node.cloud-gate`）→ 裂天界隙（`node.astral-rift`）**，山门即青云仙山通往星陨异境的关隘。跨域边可登记在任一侧区域配表内（`BuildWorldGraph` 先全量登记节点再解析边，天然支持跨文件引用）。
- **前端按区域可见性渲染**（详见 §8.5.1）：常态只绘制玩家当前所在区域；当玩家**驻留在关口节点**、或**行进在跨域边上**时，同时绘制当前区域与跨域边直达的邻接区域；区域内移动只显示本区域。路径规划、玩家位置插值与赶路均对合并后的世界图求值，区域仅为显示分组而非寻路边界。

### 8.3.2 地图生灵生态原则（特色化分布）

本节地名和后文 JSON 为生态设计示例，未全部进入当前目录。当前地图索引见 [`../world/maps.md`](../../world/maps.md)，包含青云仙山与星陨异境。预算属于遭遇，不是地图节点属性；示例中的节点预算不得作为 maps 配表新增字段的要求。
- **按地理风貌分布 1~3 种怪物**：同阶（如 T1）怪物不需要全部挤在同一张地图内。每个地图节点根据其地理环境、五行属性与剧情风貌分配 1~3 种契合的怪物即可（灵活可配，不强制多怪）。
  - **青岚药谷 (`node.herb-vale`)**：草木繁茂之地，主要栖息【木灵】（或木灵 + 偶尔出没的野兔）；
  - **落霞西岭 (`node.sunset-ridge`)**：开阔山岭，主要出没【魔化野兔】与【重甲蛮熊】；
  - **暮影关 (`node.twilight-pass`)**：阴煞险关，主要出没【火灵】、【通臂魔猿】与关底【伥鬼妖虎】；
  - **澄心灵泉 (`node.spirit-spring`)**：静修灵泉，可仅出没水系生灵或作为清修少怪之地。

### 关键配置字段解析：
> 注：节点自身只声明 `encounterIds` 引用；以下预算与怪池字段均位于 `config/game-data/encounters/*.json` 遭遇配表中。

- **`minBudget` ~ `maxBudget`（危险度 / 总预算区间）**：**地图没有单独的危险度评级，危险度本身即为 `[minBudget, maxBudget]` 预算区间**。单次遇怪时系统在 `[minBudget, maxBudget]` 之间随机生成本场怪群的战力总预算，预算区间的高低直接体现了该地图遭遇战的危险程度与怪物强度规模。
- **`battlesPerElite`（精英周期）**：每进行 N 次战斗必定触发一次精英遇怪（缺省回退 5）。
- **`battlesPerBoss`（Boss 周期）**：每进行 N 次战斗必定触发一次关底领主 Boss 遇怪（缺省回退 20）。
- **`randomSpawns`（本地普通怪池）**：当前地图栖息的普通怪物及权重/强度（`enemyId`/`weight`/`strength`）。
- **`eliteEnemyIds`（本地精英怪池）**：触发精英波次时抽取的精英阵容。
- **`bossEnemyIds`（本地 Boss 怪池）**：触发领主波次时抽取的 Boss 阵容。
- **`maxTotalStrength`（总强度上限）**：本波怪物强度总和上限（缺省不封顶）。
- **`searchMilliseconds`（首次搜寻时长）**：历练行动开始后的首波寻怪读条，缺省 20000ms（20.0 秒）。首搜是**防「反复启停行动刷场」的固定读条，不吃寻敌速度成长乘区**——每次行动入队重新计时，无法用衰减属性或快速重开压缩；
- **`respawnMilliseconds`（波间再搜寻时长）**：上一波全灭后到下一波寻怪的间隔，缺省 5000ms（5.0 秒）。结算时除以玩家行动速度点数：`×100/(100+行动速度点数)`（玩家行动速度为获取型——装备/内功/特质/Buff 等渠道，怪物侧含同构基准分量，见 §7.7.5；基准满值等效 5.0s→2.5s）；
