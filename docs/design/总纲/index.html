# 第十六篇 生产部署、安全边界与 2c4g/40g 容量目标

## 16.1 生产运维拓扑与持久化
- **部署架构**：Release 多阶段构建 $\to$ CCR 不可变标签 + `prod` 标签 $\to$ 服务器 systemd timer 自动更新 $\to$ Caddy 反向代理 HTTPS/WSS 至回环 `127.0.0.1:15128`。
- **PostgreSQL 权威存储**：账号、玩家快照、Durable Outbox、市场账本与流水全量落库 PostgreSQL；Docker 命名卷 `daohua_daohua-postgres` 承载持久数据；每小时自动生成 gzip 压缩备份并生成 SHA-256 校验。
- **WAL 恢复窗口**：归档对象包含 WAL 段、时间线历史与备份历史文件，以 `<原名>.gz` 压缩原子写入；重复归档校验原始内容一致，PITR 解压恢复。仅 PostgreSQL 自行回收 `pg_wal`，禁止手动删除积压段。
### 16.1.1 两级经济流水留存体系与异地灾备规约

主服务器按 `2c4g/40g` 极限预算设计，严禁将不可变金融流水表（`economy.transactions` 与 `economy.transaction_lines`）作为无界累积的历史存储：

1. **长期流水（Audit Ledger，保存 14 天）**：
   - **严格限定范围**：仅限跨玩家撮合市场交易（`market`）、功德与核心资产消耗（系统商店购买 `shop.buy`、外观解锁 `player.unlock_avatar`）；
   - **留存周期**：主服保留 **14 天**，由 `PostgresRetentionWorker` 自动滚动轮转清理；
   - **业务目的**：仅用于跨玩家经济纠纷裁决、异常资金流转对账与大额真实资产审计。由于真实金融交易低频（全服日均 ~150 笔），14 天全量数据不足 2,000 笔（<1MB），主服长期零存储压力。

2. **短期流水（Volatile Ledger，保存 2 小时）**：
   - **覆盖范围**：除上述长期流水之外的**所有其它业务流水**，包括但不限于：
     - 战斗物品获得与离线推演收益（`simulation.reward`）
     - 组队副本掉落与结算（`participation.settlement`）
     - 系统商店材料回收（`item.sell`）
     - 技能参悟与残卷消耗（`ability.learn`）
     - 宗门公共建筑材料捐献（`building.contribute`）
     - 物品与消耗品使用（`item.use`，如觉醒石）
     - 新手教程赠送与跳过（`tutorial.skip`/`tutorial.restart`）
     - 组队临时资金托管与退款（`participation.assets`/`participation.escrow`）
     - 邀请注册奖励（`invitation.signup`）
   - **留存周期**：主服严格仅保留 **2 小时**，超时由后台 Worker 自动连带明细行级联清理（`ON DELETE CASCADE`）；
   - **业务目的**：仅为客户端临时网络抖动、重连时的端到端幂等确认提供 2 小时缓冲窗口。

3. **异地灾备与历史追溯解耦**：
   - 玩家所有的物品、装备、修为、境界，均实时物化在 `player_state_sections`（八大分段快照）中，这是游戏运行的唯一权威状态；
   - 每小时全库快照已由远程计算节点通过 `deploy/backup-pull-sync.sh` 定时拉取归档，由计算节点承担长期异地灾备与对账职责；
   - 主服只保留当前最新状态与 14 天最小必要金融审计账本，彻底消除因挂机掉落流水导致主服磁盘被打满的隐患。

## 16.2 2c4g/40g 容量目标与基准数据

下表是既有 Release 5800X 的历史基线，包含估算与局部引擎测量；原有“通过”只表示当时测试口径，不是当前真实业务链路或 2c4g 主机容量已验收。当前容量验收必须覆盖专用 PostgreSQL 库、5000 账号存储、100/500 个认证业务收发连接，以及冻结一小时欠债的 2000 名玩家经 ComputeNode → 主服独立 ECS 重演 → 原子落库的全部终态。必须同时记录 Server、ComputeNode、PostgreSQL 的 CPU、RSS、WAL、磁盘与网络证据；目标集合未全部成功、任务中止或资源证据缺失时失败关闭，禁止用 synthetic、少量样本或完成任务百分比替代。

| 场景 | 目标指标 | 历史基线 (Release 5800X / 2c4g 换算；非本轮验收) | 历史预算判断 |
| :--- | :--- | :--- | :--- |
| **账号存储** | 5,000+ 注册账号 | 5,000 账号快照存储仅 **18.6 MB** | 268.4 MB (通过) |
| **在线收发** | 500+ 高峰网络收发 | 500 人稳态下行 **568 KB/s**，服务端 CPU 增量 **5.2s / 15s** | 524 KB/s 峰值 (通过) |
| **离线补算** | 2,000+ 离线挂机补算 | 10,000 人 1 小时补算仅 **2.65s 墙钟** (吞吐 135.8 万边界/秒) | 30s 预算 (通过) |
| **内存工作集** | 运行时常驻内存 | 10,000 人补算后工作集仅 **124.3 MB** | 805.3 MB (通过) |
| **市场撮合** | 订单簿高频撮合 | 100,000 单并发撮合仅 **217.4 ms** (~46 万单/秒) | 0 错误 (通过) |

## 16.3 三版本 ECS 实验的部署隔离边界

基准宿主（生产 `src/Server` 的 Development 基准模式）是本地/专用基准环境的独立进程，不属于当前生产拓扑，也不能共享生产数据库、数据卷、日志目录或端口。约定基准入口为 `127.0.0.1:5130`，数据库为 `daohua_bench_ecs`，运行产物写入 `artifacts/runtime/ecs`。这些名称只服务于隔离测试，不能替换正式 `daohua` 服务、`127.0.0.1:15128` 生产入口或 `daohua_daohua-postgres` 卷。

基准服务必须复用同一份游戏数据指纹和确定性种子，单独采样 CPU、分配、GC、RSS、数据库和网络开销。只有三套服务完成真实 HTTP/ WebSocket / PostgreSQL 边界验证、结果逐位一致、并通过单玩家到目标规模及离线补算门禁后，才能提交是否采用 ECS 的决策；在此之前不得把实验端口、实验镜像或实验数据库接入 Caddy、systemd 自动更新 timer、CCR `prod` 标签或生产持久卷。优化 ECS 的建议目标为相对 ECS-current 核心模拟 p95 降低 20%、每玩家分配降低 20%、GC 暂停增幅不超过 10%，达不到时如实记录，不能为了发布改写生产容量口径。

## 16.4 反多开与反小号账号约束

服务端权威执行设备注册与账号关联限制：默认稳定设备安装标识只能注册一个账号，同一设备主体最多关联两个账号。浏览器无法证明自然人身份；设备配置、IP、网段与指纹只参与综合风险判断，不能独立证明同一人。注册、登录与 Hello 均执行检测，拒绝登录不得签发会话或成功事件。

检测项必须独立动态启停，策略、稳定 HMAC 密钥、关联与审计落 PostgreSQL；软风险支持放行、复核与拒绝，配置相同或共享 IP 不单独硬封。前端只采集摘要，生产构建混淆提高分析成本，密钥与裁决不进入前端。运维面板提供“账号检测”页与密码保护的策略写入，生产环境通过动态随机路径（`/ops-<hex>`）与全量 `X-Ops-Token` 密码门禁访问，裸 `/ops` 路径及非激活 `/ops-*` 路径仍返回 404。具体模块、事务和在线所有权见 [`anti-multi-open.md`](../../backend/anti-multi-open.md)。

# 第十七篇 行动统计系统

> 状态：已随 TASK-20260919-01 落地。本文是行动统计（战报泛化）的唯一权威设计真源。
> 领域实现：`src/Domain/Player/PlayerDuel.cs`（`PlayerBattleReport` / `PlayerDuelState`）与 `src/Domain/Player/ActionReportBook.cs`（记账原语）；记账入口分布于 `ActionExecutionRules.Timed`/`Resources`/`Travel`、`CombatActionRules` 与 `PlayerAggregate.*`，`src/Ecs/Engine/SimulationEngine.cs` 仅为兼容门面。
> 前端：`frontend/src/components/StatsPanel.tsx`（原 `BattleReportPanel` 重构），组件登记见 `common-components.md` §24。

## 17.1 定位

原「战斗收益战报」泛化为**行动统计**：对任意行动（战斗、采集、炼丹、修炼、赶路等）按三类账本持续记录收益与计数，替代仅服务战斗的旧战报。

## 17.2 三个账本

同一 `PlayerBattleReport` 结构承担三类账本：

| 账本 | 绑定 | 生命周期 | 用途 |
| :--- | :--- | :--- | :--- |
| 行动实例账本 | 队列中的**行动实例**（`actionInstanceId`） | 建账于实例开始推进，出队即归档 | 一个任务无论重复多少次都算一个行动，持续记录 |
| 离线挂机账本 | 玩家（单例，`reportId="offline"`） | `Presence` 转入 `Offline` 时重置 | 关闭网页离线挂机期间的全部收益，每次离线会话重置 |
| 每日统计账本 | 玩家（单例，`reportId="daily"`） | 按 **UTC+8 自然日**（`DayIndex`）自动 rollover | 自然日重置 |

- 交易（坊市）不计入任何账本。
- 记账枢纽 `PlayerAggregate.RecordStats(actionInstanceId, atUnixSeconds, apply)`：同一条 `apply` 依次作用于 ①实例账本（存在才记，不隐式建账）②离线账本（仅 `Presence==Offline` 时）③每日账本（先按 UTC+8 日界 rollover 再入账），统一 `MarkDirty(Duel)`。
- 建账：`EnsureActionReport` 在实例通过全部前置校验、开始推进时 get-or-create；`Blocked` 行动不建账。
- 归档：`ArchiveReportForAction` 统一经队列变更管线 `ArchiveIds` 名单消费（`Remove`/`Clear`/`EnqueuePriority` 同类去重/`FinishRound` 离队），覆盖面含 `Clear` 整队清空；空账本丢弃，非空插入 `Reports` 头部并裁剪至 `MaxBattleReports`（10 条）。

## 17.3 账本字段

`PlayerBattleReport` 字段清单（领域字段 / wire JSON 键为 camelCase 同名小写首字母）：

- **经验池**：

| 字段（wire 键） | 语义 |
| :--- | :--- |
| `Experience`（`experience`） | 修为（突破计量条）实际入账增量：瓶颈截断与底蕴兑换放大后的真实入账 |
| `Foundation`（`foundation`） | 底蕴净变动：满层溢出沉淀为正、兑换放大消耗为负（可为负值） |
| `CombatExperience`（`combatExperience`） | 战斗经验入账量：战斗击杀与讨伐收益按基础量记账，打坐修炼等非战斗行动不增加 |
| `RootExp`（`rootExp`） | 六维经验收益（体魄/经脉/力道/根骨/身法/神识） |
| `AbilityExp`（`abilityExp`） | 功法参悟经验收益，按功法 ID 聚合；战斗/斗法中每次成功施放 +1 |
| `TechniqueExp`（`techniqueExp`） | 技艺修行经验收益，按技艺 ID 聚合（per-technique；条目为 `TechniqueId`/`Experience`，wire 键 `techniqueId`/`experience`），经 `PlayerStatsDelta.TechniqueId`/`TechniqueExperience` 记账 |
| `LevelUps`（`levelUps`） | 等级提升：`Kind ∈ realm/root/ability/technique`（technique 级 `TargetId` 为技艺 ID），含 `FromLevel`/`ToLevel` |

- **物品**：`Items`（获得，含野怪掉落与斗法缴获）、`ItemsLost`（失去：行动输入材料、自动消耗品扣件、斗法暂存被缴）；细分集合 `DuelItemsGained`（斗法缴获物品，wire 键 `duelItemsGained`）与 `DuelItemsLost`（斗法被缴物品，wire 键 `duelItemsLost`）。
- **行动信息**：`Cycles`（完成轮次）、`Encounters`（战斗遭遇场次）、`NormalKills`/`EliteKills`/`BossKills`（分级击杀）、`Deaths`（讨伐失败与斗法败北）、`DuelWins`/`DuelLosses`（斗法胜负）、`DayIndex`（仅每日账本）。
- 记账按**实际入账量**：`experience` 记瓶颈截断与底蕴兑换放大后的真实增量；`foundation` 记底蕴池净变动（满层沉淀为正、兑换消耗为负）；`combatExperience` 仅战斗场景按基础量等额记账（非战斗行动恒为 0）。

## 17.4 记账点

记账入口分布于 `ActionExecutionRules.Timed`/`Resources`/`Travel`、`CombatActionRules` 与 `PlayerAggregate.*`；`SimulationEngine` 仅为兼容门面，不走生产规则编排。

| 位置 | 记账 |
| :--- | :--- |
| `ApplyContinuousReward` | 修为类收益经 `CreditExperience` 落 `Experience`/`Foundation`/`CombatExperience` 三池；Mana/Hitpoints 资源回充 |
| `CompleteRepeat` | 修为类收益同上经 `CreditExperience`；Mana/Hitpoints；Item 产出（+）、Inputs（−）、`Cycles+1` |
| `ApplyCombatRewards` | `experience` 单参数→`CreditExperience` 三池 + `DistributeRootExp` 六维全额入账；掉落（+）或 StageItem（+） |
| `DistributeRootExp` | 六维入账 + root 级 `LevelUp` 检测 |
| 波次生成 | `Encounters+1` |
| 波次清空 | `Cycles+1` + 分级击杀 `NormalKills/EliteKills/BossKills` |
| 讨伐失败 / 斗法败北 | `Deaths+1`（斗法另计 `DuelLosses`，暂存区清空入 `ItemsLost` 并记入 `DuelItemsLost`） |
| 斗法胜 | `DuelWins+1`，缴获入 `Items` 并记入 `DuelItemsGained` |
| 自动消耗品扣件 | `ItemsLost+1` |
| travel 抵达 | `Cycles+1` 后实例出队归档 |
| `GrantAbilityExperience` | `AbilityExp` + ability 级 `LevelUp` |
| Timed 行动 `GrantTechniqueExperience` | 技艺经验按当轮实际入账量记 `TechniqueExp`（per-technique；普通计时行动按当轮基准经验、强化按装备等阶与耗时动态基准经验）；跨越技艺等级段产 `kind=technique` `LevelUp`（`TargetId` 为技艺 ID） |
| `Breakthrough` | realm 级 `LevelUp` |

## 17.5 协议与前端

- wire `duel` 分段 = `PlayerDuelStateDocument` JSON（camelCase），随文档自动下发 `offlineReport`、`dailyReport`、`activeReports`；`currentReport` 为队首行动账本（兼容便捷访问）。账本内新字段 `foundation`/`combatExperience` 随 `PlayerBattleReportDocument` 一并下发，前端按缺省 0 容错解析。
- `types.ts` / `snapshot.ts` 解析新字段（缺省容错）；`battleReportStore` 读取 localStorage 旧缓存时为新增字段补默认值。
- `StatsPanel` 分区：当前行动 / 离线挂机 / 今日统计；每区三小节——获取经验（含等级提升）、物品得失、行动信息；另保留斗法展示区（含斗法暂存区及斗法得失明细）与近期战报历史。暂存区按 `itemId` 聚合为 `ItemReference` 胶囊行仅显示暂存总量；斗法获得（缴获）与斗法损失（被缴）在暂存区旁/同一紫调容器内分列展示，同款渲染 `ItemReference` 胶囊。
- 刷新页面且队列非空时自动进入「详情」（combat Tab）。

## 17.6 不变量

- 实例账本与实例 Id 一一对应，轮转/重复执行续记不重置，出队即归档。
- 离线/每日单例账本的 `ActionInstanceId` 为 `Guid.Empty`、`ActionId`/`ActionName` 允许空串。
- 归档历史上限 10 条；导出/恢复往返后三账本完整还原。
- 所有记账只依赖确定性模拟推进，在线/离线/冷挂机补算一致。

## 17.7 行动内战斗单位统计

讨伐行动存续期间，对行动内全部战斗单位的结算量持续累计，挂于队首行动实例账本（`PlayerBattleReport.CombatStats`，`combatants` 字段随 duel 分段持久化与下发）。

- **统计单位**：本机成员 `player`、参与会话盟友 `ally:{成员下标}`、怪物按定义 ID 折叠为 `monster:{defId}`（同类型合并计一个单位）。斗法对方玩家队伍不入账——撮合推演只把本方一行并入账本。
- **口径**：伤害输出、实收伤害、减免伤害均按物理/术法分列；减免 = 命中时原始威力（减免链前 `RawDamage`）− 实际落账伤害，未命中不落账；治疗分自动回复（战内 5 秒 tick + 行动期间战外自然回复）与其他治疗（技能治疗、气血汲取、药品瞬回）。
- **记账点**：`CombatActSystem.ResolveAttack`（普攻/技能命中）、`CastSkill` 治疗分支、`CombatBuffTickSystem` 周期回复、`CombatTriggerMath` 汲取/反伤、消耗品路径（药品瞬回、雷击符术法打击）、资源时钟自然回复。
- **生命周期**：开战入场/快照恢复/手动钉死三处挂接 `StatsBook`；每步战斗推进在 `CompleteCombatAdvanceCore` 收口 `FlushCombatStats` 标脏；行动出队归档时 `CombatStats.Clear()` 即弃，不进入归档战报。
- **斗法**：`DuelScriptEngine.Resolve` 推演时挂接私有统计簿，剧本携带 `InitiatorStats`/`DefenderStats` 各仅本方一行；`DuelPlaybackState.ViewerStats` 随回放载荷持久化，`AttachDuel` 并入队首账本 `player` 行。
- **前端**：`StatsPanel` 当前行动账本新增「战斗单位」表格小节（`ReportCombatantsSection`），归档/离线/每日账本无此数据不渲染。

---
*设计总纲结束。*

# 18 · 服务端 ECS 化执行架构与触发器规约

> 本文档是继任规约：取代总纲 15「聚合运行时规约」中"System 仅作调度壳、Domain 承载全部规则"的分层口径。ECS 从调用层升级为**规则本体层**；Domain 退化为纯库。文档先行，实施序见 §10。

## 0. 目标与红线

**目标**：业务规则本体（推进、结算、触发反应）写在 System 体内，状态写在 Component 上；System↔Domain 静态函数的三段转调结构退役。

**不可动红线**（与现状逐位一致）：

- 边界驱动调度：拍=自然边界跳转，不回到固定帧率。
- `AdvanceTo` 批量窗口推进：一拍消化整段窗口战斗段。任何重构不得以"逐边界一拍"替换它（那是 15 万拍/30h 的已修复缺陷形态）。
- 逐整秒浮点序列、`RemainingRepeats == -1` 无限循环保留、先校验后变更、窗口工作钱包语义。
- `MaxTransitionsPerAdvance` / `MaxEventsPerAdvance` 保险丝语义。
- 单写者：同一玩家全部变更在分片 Fiber 内串行；跨边界不留实体/聚合引用。
- `double` 数值纪律与在线/离线/重连逐位一致。

## 1. 分层反转

```
当前：  System（规则本体）→ Component（状态本体）
        Domain = 纯库：配表类型 / POCO 状态 / 纯公式 / SectionCodec / 协议映射 / DTO
        SimulationEngine/DeterministicCombatEngine = 无世界测试与兼容门面，转发到 ECS System
```

| 层 | 装什么 | 不装什么 |
|---|---|---|
| `src/Domain`（纯库） | `GameDataCatalog`、`ActionDefinition`、`ActiveBuff`/`CombatantState` 等 POCO、属性乘区合成等**无状态公式**、`SectionCodec`、`ProtocolSnapshotMapper`、事件 DTO | 引擎、推进器、状态机的规则方法 |
| `src/Ecs`（规则本体） | 实体、组件、13+N 个 System（含行动实现与战斗边界调度器）、触发器 System 族、`EcsActionPipeline`（退化为请求上下文：窗口/钱包/账本） | 宿主、协议、存储 |
| `src/Server` | 宿主、WebSocket、持久化适配 | 不变 |
| `src/ComputeNode` | **同一 `EcsWorldShard` 执行环境**（§9） | 不变红线：无权威状态、无生产库 |

运行时状态 POCO 物理上仍驻留 `Domain` 程序集（`SectionCodec` 内聚需要），但其中**不得有任何推进规则方法**——状态类是纯数据。

## 2. 组件划分：反应性粒度

拆分原则（用户裁定）：**需要响应事件的独立成组件；纯被读取的数据按内聚域合并**。

### 玩家实体

| 组件 | 内容 | 反应性 | 持久化分段 |
|---|---|---|---|
| `PlayerIdentityComponent` | 版本/脏标记/在线态 | 元数据 | — |
| `PlayerResourcesComponent` | `Hitpoints`/`Mana`/资源游标 | 持久化资源（战斗内外同一份） | Combat |
| `PlayerStatsComponent` | 解析后战斗面板 + 输入修订号 | 被公式读 | 不落库（派生缓存） |
| `PlayerProgressionComponent` | 境界/经验/修为/统计 | 被写入 | Progression |
| `PlayerWorldComponent` | 位置/在途/建筑效果 | 非战斗行动属性域 | World |
| `PlayerActionQueueComponent` | `EcsActionState` 队列 | 调度数据 | ActionQueue |
| `PlayerLoadoutComponent` | 装备/法宝/技能装配 | 被公式读 | Loadout |
| `PassiveBuffsComponent` | **纯修饰 buff 合并容器**（`ActiveBuff`，效果通道载荷 + StatRatios，通道模型见 [第七篇 §7.9.5.3](./07-战斗数值与内视规约.md)） | 被公式读 | Buffs |
| **Reactive Buff 组件族** | 每种触发型 buff 一个组件类：`OnHitLeechComponent`/`ManaLeechComponent`/`ThornsComponent`/`ThreatOnTakenComponent`…参数实时读 Stats.Effects | **主动反应** | Buffs（`ActiveBuff` 扩展） |

| `PlayerSettingsComponent` | 设置/LoopEnabled/AutoTravelEnabled | 数据 | Settings |
| `PlayerDuelComponent` | 斗法 | 数据 | Duel |
| `EcsActionExecutionComponent` | 请求工作区（窗口/钱包/账本/战斗句柄） | 运行时 | 不落库 |

### 战斗单位实体（玩家战斗单位 + 怪物共用结构）

`CombatantComponent`（HP/MP/出手游标）、`SkillStateComponent`、`PassiveBuffsComponent`（同款容器）、**Reactive Buff 组件族复用同款**、`MonsterIdentityComponent`/`DropProfileComponent`（怪物侧）。

### 遭遇 / 节点 / World

`CombatEncounterComponent`（状态+事件缓冲+触发队列）、`CombatLogComponent`；`MapNodeComponent`/`NodeBuildingComponent`/`EncounterProfileComponent`/`NodePopulationComponent`；`EcsClockComponent`（World.Main）。

## 3. System 拓扑

### Update 序列（骨架不变，本体化）

| Order | System | 本体职责（逻辑从 Domain 搬入体内） |
|---|---|---|
| 100 | `ActionClockSystem` | 资源窗口开闭、帧目标（调度语义） |
| 200 | `ActionQueueSystem` | 队首准入：地点白名单、材料前置、Blocked 轮转/出队 |
| 300 | `GatheringActionSystem` | 采集实现本体：时长公式、逐秒产出、轮结算 |
| 310 | `CraftingActionSystem` | 制造实现本体 |
| 320 | `ActionBoundarySystem` | 其余计时行动实现本体（修炼乘区等） |
| 330 | `TravelActionSystem` | 旅行实现本体 |
| 400 | `TimedActionYieldSystem` | 计时轮结算：入账、材料扣除、repeats、出队 |
| 550 | `CombatActionBoundarySystem` | 搜寻/复活阶段推进与遭遇附着 |
| 600 | `CombatEventAdvanceSystem` | `AdvanceTo` 整段窗口推进（含段内触发器派发） |
| 610 | `CombatTargetSystem` | 主目标实体索引 |
| 650 | `CombatEventSystem` | `LastEvents`→`CombatLogComponent` |
| 700 | `CombatActionYieldSystem` | 战斗段结算：预算折算、死亡/掉落/胜负、终局释放实体 |
| 800 | `PlayerClockCommitSystem` | 窗口末提交：游标/版本/脏标记/资源回复落账 |

### Trigger 域（不占 Update 序，`RunSystem<T>(entity)` 点名）

由战斗边界循环在固定点同步派发（§4）。有实体宿主时每类触发器一个 ECS tag；无实体宿主的内联路径使用 §4.1 的轻量处理器，不进入 YuoCore Tag 注册：

```
IOnHitTrigger    OnHitLeechSystem / ManaLeechSystem / ThornsSystem / ThreatOnTakenSystem …
IOnKillTrigger   OnKillBuffSystem / OnKillLootSystem …
IOnCastTrigger   OnCastInterruptSystem / OnCastBonusSystem …
IOnExpireTrigger OnExpireExplodeSystem …
IOnDeathTrigger  OnDeathReviveSystem …
```

内核机制现成：`YuoWorld.RunSystem<T>(entity)`（`YuoCore.Ecs/YuoWorld/RunSystem.cs`）——稠密 tagId 直查 + `system.m_Run(entity)` 同步执行，一次普通方法调用，无 tick 延迟。**此域 System 不进入 Update 序列，不参与每拍扫描。**

负载信箱：`CombatTriggerInboxComponent` 是实体派发期间向触发器 System 传参的唯一通道——`CombatTriggerSurface.Attach` 挂接战斗单位时常驻该组件；派发前 `EcsCombatTriggerSink` 写入 `inbox.Trigger = trigger`，`RunSystem` 同步执行后立即清回 null，非派发期间恒为 null。实体缺失或信箱缺失属不变量违例，快速失败。

## 4. 战斗内核：批量调度器 + 段内触发器

`AdvanceTo` 的边界循环保留批量形态；段内规则按边界类型拆解，在**固定序列点**派发触发器：

```
AdvanceTo(state, windowTarget):
  while boundary := NextNaturalBoundary(state) <= windowTarget:
      ResolveBoundary(boundary)               // 出手/技能/回复 本体结算
      DrainTriggers(encounter.PendingTriggers) // ← 固定派发点
          foreach trigger in 入队顺序:
              有实体宿主：RunSystem<trigger.Tag>(unitEntity)
              无实体宿主：InlineTriggerPipeline.Dispatch(trigger)
      UpdateOutcome()                          // 死亡/胜负永远在触发器结算之后
```

序列契约（确定性红线）：

- 触发器消费点固定在"本边界结算后、下一边界取数前"；`UpdateOutcome` 永远在触发器结算之后——**OnHitHeal 可以救活自己**，这是"挨打回血顶不顶得住下一刀"语义的正确位置。
- 命中反应（OnHit）的派发粒度精确化为**每次命中结算后立即 drain**：同一自然边界内可能有多个单位先后出手，若推迟到边界末统一消费，衍生伤害（反伤致死）的落账时序会相对后续出手错位——"命中后立即消费"是保持旧内联结算时序逐位等价的唯一合法点位，同时也是"边界结算后、下一边界取数前"的更严格实现。
- 触发器内消耗 RNG 只能走 `encounter` 固定随机流，消费顺序 = `PendingTriggers` 入队顺序。
- 触发器不得改变边界时刻表（只可改数值与队列内容）；新增边界只能走正常 `Next*At` 计算。

### 4.1 轻量内联触发器处理流程

无实体战斗（纯领域推进、斗法剧本）不需要 `YuoSystem`、组件标记或 `YuoWorld.RunSystem`。这条路径使用 `CombatTriggerHandler` 基类和按事件固定签名的接口（如 `IInlineOnHitTrigger.OnHit(PendingCombatTrigger)`）：

- 启动时只扫描 `DaoHua.Ecs` 程序集中的 `CombatTriggerHandler` 非抽象子类，实例化一次并按 `CombatTriggerOrder` 排序；不扫描测试程序集，也不把轻量接口继承为 `ISystemTag`。
- 每种事件缓存为强类型接口数组。热路径只按 `CombatTriggerKind` 选择数组并进行接口调用，不使用 `MethodInfo.Invoke`、`Dictionary<Type>` 或运行时反射。
- 同一事件类型按顺序号升序执行；顺序号相同时按处理器全名 `StringComparer.Ordinal` 二次排序，消除 `GetTypes()` 返回顺序差异。
- 处理器只接收 `PendingCombatTrigger` 或事件专用领域上下文，不能持有 `YuoEntity`、`YuoWorld` 或宿主服务引用。
- `InlineCombatTriggerSink` 和 `EcsCombatTriggerSink` 是互斥消费路径；一条 pending trigger 只能交给其中一个 sink，防止同一效果重复结算。两条路径继续共用 `CombatTriggerMath` 与 `Settle` 语义。
- 新增既有事件下的效果只需新增处理器类；新增事件种类仍需定义事件接口、参数记录和 `CombatTriggerKind` 派发槽位。当前仓库没有 AOT/裁剪发布约束；未来启用时必须为扫描类型保留元数据，或将注册表替换为源生成实现。
- 双路径同效果落地固定为四件套：内联 `CombatTriggerHandler`（`CombatTriggerOrder`）+ 薄 `YuoSystem`（`SystemOrder` 同一先后关系）+ 能力标记组件（`CombatTriggerSurface.Sync` 按 `Stats.Effects`/`Stats.Traits` 挂摘）+ `CombatTriggerMath` 共享本体。
- 特质载体：`CombatantStats.Traits`（`trait.*` ID 集合，面板字段，快照重建不带快照负担）。条件触发型特质按 ID 判定（如 `trait.bukandaowo` → `CombatEncounterState.Create` 开战授予 `buff.yinshen`）；数值型特质经 `CombatTraitRules` 折算进 `Stats.Effects` 点数通道（如 `trait.liweifanfou` → `ThreatOnTakenPoints = 100`）。
- 随机通道分配（目标抽取族）：0~15 核心结算保留、3 玩家目标、16 单体兜底、17 AoE 多目标、**18 敌方盟友目标（出手）、19 敌方盟友目标（决策）**、**20+chainIndex 连锁打击目标**（`chainOnKillCount` 击杀连锁的逐次追加抽选，命中未死即终止）、64+ 触发器专属。敌方出手与决策在 `PlayerAllies` 上按 `EffectiveThreat` 轮盘抽取——单存活成员 `SelectTarget` 提前返回不掷点，单盟友行为与固定目标逐位等价。

桥接（Domain 不碰实体的解法）：战斗调度器整体迁入 `src/Ecs/Combat/`，操作的就是组件化状态，`RunSystem` 直接调用无分层冲突；`CombatantState` 增加运行时字段 `EntityId`（`AttachCombat` 时设置，不序列化）。

`DeterministicCombatEngine` 的归宿：边界调度骨架迁入 `src/Ecs/Combat/BattleScheduler`；伤害/技能/回复公式留在 Domain 作纯函数，被 boundary handler 调用。`Domain.Tests` 中的 `AdvanceOneBoundary` 直测迁移到 `Ecs.Tests`。

### 4.2 特殊效果实现工作流

装备被动、技能附加效果、Buff/Debuff、怪物特性及其他玩法特殊效果的新增、修改、修复和评审，统一使用仓库级 [special-effects Skill](../../../.agents/skills/special-effects/SKILL.md)。效果数值与预算由 [data-designer Skill](../../../.agents/skills/data-designer/SKILL.md) 配合处理；纯视觉特效不属于此工作流。

效果先明确触发时机、作用侧、结算口径、叠层与生命周期，再选择属性公式、固定事件接口或已有计时边界。轻量处理器实例全局复用，必须无战斗状态；冷却、次数、层数和到期时间由单位/遭遇/玩家状态持有。当前实际事件只有 `OnHit`，其他事件按具体需求补齐生产点与消费点；实体路径与内联路径继续共享效果本体，并用启用实际效果的场景验证等价性。

## 5. 行动实现本体化样板

以采集为例的目标形态（对照现行三段转调）：

```csharp
// GatheringActionSystem（order 300）体内直接持有规则：
//   准入检查 → 时长公式 → 逐秒产出循环 → 轮结算
// 组件直接读写：player.GetComponent<PlayerActionQueueComponent>() 等
// 账本仍走 pipeline 请求上下文（ActionMutationBatch），不变
```

`EcsActionPipeline` 退化保留的职责：窗口游标/剩余预算/工作钱包/账本事件尾/战斗句柄——它是"请求上下文"，不再是"逻辑转发层"。

## 6. 持久化：分段不动，映射层扩展

- 8 个 `PlayerSectionKind` 落库格式主体不动；`ExportSnapshot`/`SectionCodec` 契约不变。
- 组件↔分段映射层扩展：新组件映射进既有分段（`PlayerResourcesComponent`→Combat；reactive buff→Buffs）。
- `ActiveBuff` 记录扩展触发器字段（`TriggerKind`/`Params`）——**挂钩点**：首个"buff 定义携带触发参数"的特性落地时同步扩展，届时 Buffs 分段格式升版并同步 `PostgresSchema` 与 DataTool 校验；当前 reactive 参数经 `CombatantStats.Effects` 链路承载（装备 flatStats 点数键/怪物配表），无独立 wire 需求。

## 7. 确定性与并发守则

- RNG：段内一切随机消费走 `encounter` 种子流；触发器固定顺序消费。
- 同刻排序：`SystemOrder` 管 Update 序列；`PendingTriggers` 队列序管段内派发——两套都是确定性序列，无字典序。
- 数值顺序：先校验后变更、逐整秒累加、账本按实际入账量记录——搬迁时逐函数比对。
- 所有权不变：Fiber 单写者；跨实体只走 `entityId` 间接寻址，不留实体引用跨越方法边界。
- `YuoCore` 内核红线：新派发面接稠密索引（`RunSystem` 已是），不改生命周期派发语义。

## 8. ComputeNode 统一执行环境

`ComputeNode` 引用 `DaoHua.Ecs`（`src/Ecs` 只引 Domain+YuoCore，无宿主依赖，不违红线），job 流换装：

```
DecodeAggregate → shard.CreatePlayer(state) → shard.RunPlayerOnceAsync(target)
              → ExportSnapshot → EncodeAggregate（脏分段）
```

收益：一致性**由构造保证**（同一代码路径），不再依赖双跑验证；ECS 层新增机制（触发器、实体级玩法）自动被补算继承。代价：job 起 World/Fiber 的固定开销（相对补算体量可忽略，可跨 job 复用 shard）；`AGENTS.md` 依赖图同步为 `ComputeNode -> Domain + Ecs`；golden vector 全量重验。

## 9. 依赖方向（目标态）

```
Server   -> Ecs + Domain + Protocol + YuoCore + Npgsql
Ecs      -> Domain + YuoCore(Abstractions/Ecs/Runtime)
Domain   -> YuoCore.Abstractions（纯库；POCO 状态+配表+公式+编解码）
ComputeNode -> Ecs + Domain（ECS 执行环境，无宿主/存储）
```

## 10. 完整收口记录

组件、行动队列与执行规则、战斗边界与相位、Tag 派发、ComputeNode 共用执行环境和文档规约已经按本文目标落地。`SimulationEngine`/`DeterministicCombatEngine` 保留的公开方法仅用于无世界测试与兼容调用，生产 ECS 路径不从门面进入规则编排。验证记录统一登记在 `docs/tasks/archive/archive-2026-09.md`。

## 11. 验证门禁

- 全部现有测试套件逐位绿（Domain/Ecs/Server/YuoCore）。
- 确定性：`CombatRestoreReproTests` 双跑 + golden vector + 真实存档回放。
- 性能：300 人基准与批量快进路径不回退；`AdvanceTo` 批量粒度不动。
- 保险丝：`MaxTransitionsPerAdvance`/`MaxEventsPerAdvance` 语义与诊断输出保留。

## 12. 风险清单

| 风险 | 对策 |
|---|---|
| 一次性重构中间态全红不可分步 | 长分支纪律 + 实施序内部"每步可编译"约束 |

## 13. 完整 ECS 收口结果（2026-10-01）

本次收口已经完成。生产运行时中，行动队列、行动执行和战斗的状态变更与调度均由 `src/Ecs` 的组件、阶段 System 和 Tag System 持有；`EcsActionPipeline` 只保留请求工作区、窗口游标、账本和提交边界，不再承载规则转发。

### 生产 ECS 规则归属

- `ActionExecutionRules.Pipeline/Resources/Timed/Travel` 与 `ActionClockSystem`、`ActionQueueSystem`、采集/制造/计时/旅行/结算 System 共同持有队列准入、资源边界、行动推进、产出、重复次数和 `-1` 无限循环语义。
- `CombatActionRules` 持有搜寻、复活、入场、持续用品、斗法回放、胜负、掉落、统计和战斗收尾；`CombatEventAdvanceSystem` 持有自然边界、批量推进和固定相位派发；`CombatSystems` 持有战斗实体推进、目标索引、日志和实体释放。
- Buff 到期通过 `PlayerBuffExpiryInboxComponent` 与 `IExpirePlayerBuffs` Tag System 在资源边界同步裁决，真实删除才产生 Buffs 脏标记。
- `DeterministicCombatEngine` 与 `SimulationEngine` 的旧公开入口只作为无世界测试/兼容门面，内部转发到上述 ECS System；Server、ComputeNode 和生产玩家运行时不从这些门面进入规则编排。

### 明确保留在 ECS 之外的边界

纯属性/伤害/目标数学、配表选择器和编解码继续作为无副作用算法；PostgreSQL、快照分段、资产事务、HTTP/WebSocket、认证、协议 DTO、ComputeNode 任务和宿主生命周期继续由 Domain/Server/Protocol/持久化适配层负责。它们通过 ECS 工作区和提交边界交互，不复制行动或战斗规则。

普通推进、批量补算和命令路径现在共用同一套 ECS System 规则入口，验证覆盖终态、账本、脏标记、事件顺序和 `-1` 无限循环语义；无需再按阶段保留未迁移的行动或战斗编排。

## 11. 可信冷补算与原子提交边界（TASK-20261008-10）

- 在线、节点和主服验证复用同一 ECS 确定性执行路径；验证使用独立世界，不改变在线宿主默认世界或静态调度开关。
- 节点仅提供候选结果。主服冻结一致快照中的身份、有效提交头、全集分段、耐久队列与资产余额版本，独立重演后严格比较分段集合、原始 JSON 字节、版本、实际模拟时钟与资产增量；传输 checksum 和节点自报 metrics 不构成可信证明。重复分段或额外字段结果必须拒绝。
- 接受结果时，同一数据库事务校验完整源基线、冷玩家状态、运行时所有权、钱包版本与任务租约；section/游标、可信资产增量与任务完成必须同生同灭。租约完结 CAS 失败必须回滚全部写入，不能仅忽略失败完成动作。
- 学习、跳过引导、模拟结算采用同一状态/经济事务核心；失败恢复遵循 ECS 开发指南的请求前脏集合与单调流水号纪律。公共建筑真源及原子性见总纲09。
- 主服本地执行（§14.4）复用同一独立重演产物直接写回，不再二次比较；写回仍走本节同一事务边界（租约、完整源基线、冷玩家状态、钱包版本、section CAS、资产入账、任务完结同生同灭）。

## 14. 玩家三态生命周期执行规约（TASK-20261011-05）

总纲01 §1.2 第 5 条三态主旨的服务端执行口径。

### 14.1 离线锚点与在线状态

- 聚合持有离线锚点 `OfflineSinceAt`，随 settings 分段与 `Presence` 一同持久化：转离线时写入**断线时刻**，转在线时清空。
- **只有连接生命周期改变在线状态**：WebSocket 握手经 `AttachConnectionAsync` 转在线；断线宽限到期卸载时转离线并以断线时刻为锚点。社交强拉、HTTP 快照、注册装载等非连接装载一律不改在线状态，实体以离线身份常驻或补算。
- 实体创建（运行时装载、冷算执行器、主服验证三路共用 `EcsWorldShard.CreatePlayer`）统一规范化：持久化为在线必为崩溃残留（装载即意味本进程刚取得所有权），按离线处理、锚点取 `LastSimulatedAt`；离线但缺锚点同样取 `LastSimulatedAt`；规范化标脏落盘，三路结果逐位一致。
- 读模型 `game.player_projection.offline_since` 随 settings 分段投影；离线时长的一切判定（会话离线截止、48h 逐出、冷扫描）只读该列。`last_active_at` 不参与生命周期判定。

### 14.2 收益封顶

- 离线收益上限为 Domain 常量 `PlayerLifecycleRules.OfflineIdleLimit`（48h），不可配置。
- 单次推进的实际计算终点 = `min(目标, 请求起点 + 48h 保险丝, OfflineSinceAt + 48h)`；在线玩家无锚点时只受保险丝约束。滚动批算任意切分的累计收益与一次性补算逐位一致，且不越过锚点 + 48h。
- 超出边界的尾段只清理过期态并推进时钟；`offline.capped` 事件只在跨越边界的那次请求（请求起点 ≤ 边界）产生一次。
- 会话引擎的单次推进 48h 仅为保险丝；会话的离线边界由名册离线成员最早的 `offline_since + 48h` 裁决（§21.13.2）。

### 14.3 在线宽限

- 拥有会话的连接断开后进入宽限（`OfflineIdle:GraceSeconds`，默认 300）：实体常驻、在线位保留、按在线实时推进；宽限内重连直接复用实体，不重载不补算。
- 宽限到期且无新连接：注销在线位，`RemoveAsync(flush, offlineSince: 断线时刻)` 落盘离线态并归还运行时租约。新握手先取消或等待在途到期收尾，再装载。
- 优雅停机时立即执行全部在途宽限的到期收尾（锚点仍为各自断线时刻）。

### 14.4 离线挂机批算

- 冷扫描对象：投影离线、无存活运行时租约、无活跃会话绑定与待消费结算、且「距上次结算 ≥ 批算间隔（`OfflineIdle:BatchIntervalMinutes`，默认 60）」或「已到封顶边界仍有欠债」的玩家。批目标 = `min(当前, OfflineSinceAt + 48h)`；扫描与执行不受计算节点配置门控。
- 主服本地执行器常驻消费同一 `compute_jobs` 队列（单路串行，与验证器共用独立 ECS 世界条带）；计算节点派发只领取 pending 超过 `ComputeNode:OverflowAfterSeconds`（默认 300）的积压任务，结果仍经 §11 全量独立重演。重演器按玩家哈希分条带（条带数 = `ProcessorCount` 夹在 2..4），每条带各自持有独立 ECS 世界与内部门，使 2000 任务重演可在 2c 宿主上并行而不共享单门串行瓶颈；同一条带内仍严格串行，确定性不受影响。入队侧按 12 路并行装载冻结输入并合并「身份/头/分段/耐久队列/钱包」为单批次往返；派发侧与本地执行器在队空时同时等待容量信号、任务入队信号与轮询周期，新任务入队即唤醒而不是空转满一个周期。
- 冷结果写回使用 `RepeatableRead` 固定快照，并以玩家身份/投影/提交头/钱包/任务租约行锁、identity MVCC fence 与 section/economy CAS 组成同事务 fence；session/runtime ownership 缺失谓词依赖共享身份行版本 fence，不依赖 SSI 谓词锁。活跃会话探测仍必须命中 `social.party_sessions` 活跃规格 partial GIN `jsonb_path_ops` 索引以避免全表扫描；section/flush_queue 页级交叉不作为逻辑冲突。仅此写回事务改用 RR，其他事务隔离不变；禁止删除或弱化任何 fence，亦禁止用全局串行门代替它们。
- 回线抢占：玩家装载取得运行时租约后，在途任务写回因租约/版本漂移归档丢弃；装载路径即时补算到当前。
- 容量纪律：服务端托管堆以 `System.GC.HeapCount=2` 对齐 2c 生产宿主（Server GC 默认每逻辑核一堆，在大核数开发机上成堆囤段是工作集虚胖主因），`ConserveMemory=7` 偏置勤收集；`ConserveMemory` 再调高会以更多 GC 停顿换取更小堆，实测把 500 连接 HelloAck P99 顶过 5s 预算，不得为此调高。压测侧「已发命令必须全部收到回执」的闭环断言只允许在剩余窗口覆盖一次命令往返预算（`CommandAckBudget`）时继续下发，否则末条命令必然跨过截止时间被误判为丢包。

### 14.5 彻底离线

- 到达 `OfflineSinceAt + 48h` 时冷扫描入队终末批（目标 = 边界），补齐断线到边界的全部收益；此后玩家停止被扫描。
- 看门狗按 `offline_since + 48h` 逐出队伍（队长移交、空队清理、会话仲裁 `member-offline-timeout`）。
- 队列隐式暂停：登录时推进请求起点已在边界，直接封顶推进时钟到当前，不产收益、不再补算，队列随后照常续跑。

### 14.6 组队会话

- 活跃会话只要名册中有成员在线（含宽限期），离线成员实体常驻装载并在批推进中实时消费结算；会话散场或名册全员离线后卸载常驻实体。
- 名册全员离线的会话按批算间隔推进到当前，推进后逐成员经所有权通道强拉消费结算再卸载；会话推进不得越过名册离线成员最早的离线边界。
- 散场后未装载成员同样强拉消费终局结算，保证其持久化状态与个人冷算资格及时恢复。
- 全部非 durable 战斗消耗品采用 Online 真实钱包 / Offline 储备两种库存来源，共用战斗规则。切换、在线实耗、离线划拨/返还与检查点/inbox 原子提交；模式和判定游标随检查点恢复。会话不等待玩家 gate 或成员 Fiber，资产入口在会话门外层排序；缺货不是故障、不散场，提交未知则隔离并核验。详细资产与时序约束见总纲21 §21.13。

### 14.7 已知边界

- 服务器非优雅崩溃时，在线玩家的投影在线标记残留到其下次被装载（届时按 §14.1 规范化）。
- 宽限期内实体与租约留在原实例；多实例部署下换实例重连需等宽限到期。

> **篇目定位**：生活技艺等级/经验/速度加成、符箓与阵盘制造、装备强化的唯一设计真源。
> 实现契约字段名以 `docs/tasks/archive/archive-2026-10.md` 中 TASK-20261003-04 条目为准；本篇约束设计意图与结算语义。

---

## 20.1 技艺等级体系

### 20.1.1 技艺清单

七项生活技艺，独立存储、独立升级：

| 技艺 | `TechniqueId` | 关联行动域 |
| --- | --- | --- |
| 炼丹 | `alchemy` | 炼丹、药材萃取 |
| 炼器 | `forging` | 装备精炼/锻造 |
| 符箓 | `talisman` | 符箓绘制 |
| 强化 | `enhancement` | 装备强化 |
| 阵法 | `formation` | 阵盘部署 |
| 采集 | `gathering` | 采集/砍伐/拾取 |
| 挖掘 | `mining` | 采矿 |

### 20.1.2 经验与等级

- 每项技艺持有**累计经验**（`TechniqueExperiences[id]`），初始为空即 0 级。
- 升级曲线以修为曲线 `RealmProgressionCatalog.ExpToNext` 为基准逐段推进，**但前 30 级所需经验线性下调**：升入 1 级削减 **90%**、逐级线性收敛，至升入 30 级削减 **0%**。
  - 削减比例 $r(L) = 0.9 \times \dfrac{30 - L}{29}$（$L$ 为目标等级，$1 \le L \le 30$；$L > 30$ 时 $r = 0$）。
  - 单段实际需求 $E_{\text{technique}}(L) = \mathrm{round}\big(\text{expToNext}[L] \times (1 - r(L))\big)$，四舍五入取整；30 级以上与修为曲线完全一致。
  - 削减只作用于技艺曲线，**修为曲线本身不变**；技艺经验授予口径亦不变（见下条），因此前期升段速度显著加快。
  - 校验：`TechniqueCatalog.LevelFor` / `ExpToNextFor`（服务端）与 `TECHNIQUE_EXP_TO_NEXT` / `calculateTechniqueProgress`（前端）同式实现，任一侧不得单独改动系数。
- 技艺经验授予：每完成一个有效行动轮次，入账对应行动等级的 100% 单轮基准经验（`Math.Round(BaseExperienceForLevel(行动等级) × 基础耗时秒 ÷ 10)`，不含速度折减，1 级基础耗时每秒折合 1 点经验；强化按被强化装备等阶换算等级与当次实际基础耗时动态计算）。
- 升级记录走 `LevelUp` 账本（kind `technique`）。

### 20.1.3 行动速度加成

- 每级技艺 +5% 对应行动速度：`实际耗时 = 基础耗时 / (1 + 0.05 × level)`。
- 作用于**该技艺对应**的行动耗时（`ActionDefinition.Technique`），不跨技艺叠加，不作用于修炼/探索/战斗/赶路主行动。
- 与节点建筑速度乘区同点结算（`TimedActionDuration`），保持确定性。

### 20.1.4 非战斗行动六维经验

非战斗行动在完成轮次（或赶路行进）时向六维定向发放经验，定位为「以行养形」的缓慢根基积累，与击杀收益的全归属全额口径（§7.10.3）完全独立。

- **收益声明与百分比配置**：`yields` 中 `experience`（修为）与 `rootexp`（六维经验，须带 `aspect`）支持直接配置百分比 `"percentage": N`（如 `100` 表示 100%、`50` 表示 50%）或比率 `"ratio": R`（如 `1.0` 或 `0.5`）；总百分比之和支持超过 100%（例如引气入体为 100% 修为 + 50% 经脉 + 50% 根骨 = 200%）。
- **行动等级**（公式基准）：优先读取行动配置的显式 `"level"`；未显式声明时按产物物等阶换算（`CraftingRecipeRules.ResolveRequiredRealmLevel`：tier≤1→Lv1、tier 2→Lv18、tier N→`18+(N−2)×12`；无产出物时回退输入材料最大等阶，再缺省 Lv1）；装备强化按**被强化装备**的等阶换算。
- **通用基准推导**（与怪物基础经验共用等级曲线计算规则）：以对应境界等级的基础经验 `BaseExperienceForLevel(行动等级) = expToNext[等级] / 1000 × 0.9^(等级-1)` 为基座（1级为 10 点，18级为 133.4 点）；10 秒行动对应 100% 基准：`单轮基准经验 = BaseExperienceForLevel(行动等级) × 基础时长秒 ÷ 10`。各项经验收益装配时按自身百分比自动推导实际点数 `amount = round(单轮基准经验 × ratio)`。
- **定额口径**：六维收益为固定入账，**不吃**持续消耗品/灵脉/建筑产出等收益倍率，速度类加成亦不改变每轮额度（更快 = 单位时间更多轮）。
- **强化特例**：不走静态 yields——每完成一个强化轮次，入账 `神识 = round(BaseExperienceForLevel(目标装备等阶换算等级) × 当次基础耗时(5+t) ÷ 10)`（相当于 100% 神识）。
- **赶路特例**：`world.travel` 声明 `per: second` 身法收益（每秒基准 = 10s 基准 ÷ 10），抵达终点按实际行进总秒数一次性取整入账，中途弃行不补发。

| 归属映射 | 六维 |
| --- | --- |
| 采集 `gathering` | 身法 agility |
| 挖掘 `mining` | 力道 attack + 体魄 stamina（平分） |
| 制造（炼丹/炼器/符箓/阵法）+ 装备强化 | 神识 consciousness |
| 修炼 `cultivation` | 经脉 meridians + 根骨 bone（平分） |
| 赶路 `world.travel` | 身法 agility（按秒） |

## 20.2 符箓 —— 雷击符

- 制造行动 `talisman.draw-leiji`（技艺=符箓）：消耗 `桃木晶×3`，20 秒/张，产出 `item.leiji-talisman`。
- 雷击符为**战斗通用栏即时消耗品**：`usableInActionTypes=["combat"]`，支持触发器条件与 60 秒冷却，无吟唱。
- 触发即扣 `manaCostRatio(5%) × MaxManapoints`；灵力不足则本次不激活。
- 打击 `raw = manaDamageRatio(20%) × MaxMana + spellAttackRatio(200%) × SpellAttack`，元素 Wood、大类 Spell；走守方减伤链（抗性平方穿甲→攻方增伤 Linear→守方减伤 NonLinear→免伤收口），物品打击不参与命中/暴击掷点。
- 目标语义与普攻一致（最高有效威胁，回退首个存活敌人）；伤害直接写入战斗实体或波次快照，胜负判定交回战斗边界。

## 20.3 阵法 —— 聚灵阵盘

- 制造行动 `formation.deploy-juling`（技艺=阵法）：消耗 `桃木晶×6 + 破碎灵核×6`，30 秒/盘，产出 `item.juling-formation-disk`。
- 聚灵阵盘为**战斗通用栏持续消耗品**（`isContinuous` + `durationSeconds=300`，无冷却）：每次遭遇入场自动消耗 1 件充入 300 秒，按战斗存活时钟扣减；耗竭后只要背包有存量即可直接续充，不再有冷却时间。
- 效果：每 5 秒回蓝 `(原回蓝 + 5) × 1.3`（例：原 5 → 13）。
  - 实现为 buff 双通道：固定 `mpRegen=5` 与前段合并，`mpRegenPostRatio=0.3` 在所有固定加成合并后再乘。
  - 战斗中经由 `CombatBuffState` 同构字段作用于战内 5 秒回蓝格，Buff 时长对齐槽位剩余时长，耗尽即自然过期。
- 回复收口公式（全域同构）：`regen = (Stats.Regen + Σbuff.RegenFlat) × (1 + Σbuff.RegenPostRatio)`。

## 20.4 装备强化

### 20.4.1 物品与等级模型

- 强化等级存于**资产变体**：`AssetKey(itemId, "+N")` 为独立余额行；已装备槽位仍记录 `PlayerEquipmentSlot.EnhancementLevel`，装备校验按变体键核对余额。
- 每级强化使装备 `flatStats`/`baseStatRatios` ×1.05（指数成长，+20 满级约 ×2.653）；增幅类 `*Points` 键同样经 `flatStats` 承载并随强化缩放。
- 强化行动 `enhance.equipment`（`ActionKind.Enhancement`，技艺=强化）：按目标物品与当前等级动态结算，不走静态 inputs/yields。

### 20.4.2 单次强化结算

- 目标等级 `t = 当前等级 + 1`；`t > 20` 拒绝开轮。
- 耗时：`5 + t` 秒/次，再受强化技艺速度加成。
- 成本：`灵石 × t×10`。
- 成功率：基础成功率全阶查表（+1 为 50%，+2~+3 为 45%，+4~+6 为 40%，+7~+10 为 35%，+11~+20 统一为 30%）；技艺等级 `L≥t` 线性乘算 `×(1+0.01×L)`，`L<t` 乘性衰减 `×0.9^(t-L)`；终值 clamp `[0,0.99]`。
- 判定走确定性随机（种子=行动实例 Id 前 8 字节，channel 独立不扰战斗种子）。
- 成功 → 资产键升至 `+t`（已装备者同步槽位等级）；失败：保护生效（每轮消耗 1 个保护材料）则强化等级回落一级（`max(0, t-2)`，较当前等级 -1 且下限 +0），无保护直接归零（回到基础键）。起护等级 `protectLevel`（意图参数，最低钳制 +2）：当前等级未达起护线时不检查、不消耗保护材料，失败一律归零；达到起护线后才检查并消耗保护材料。保护材料由 `AuxItemId` 指定：装备配表 `enhanceProtectionItems` 非空时取列表内任一物品，未配置时以同装备无强化基础件（裸 `AssetKey`）代护；保护材料与本体共用裸键时（+0 装备以自身裸件代护）须持有 ≥2。
- `targetLevel` 意图参数到达后行动提前完成出队；余额不足/物品不存在 → 阻塞语义无产出。
- 每完成一个强化轮次（无论成败）入账六维·神识：`round(MonsterKillExperience(目标装备等阶换算等级) × 当次基础耗时(5+t) ÷ 10)`，定额不吃收益倍率（§20.1.4）。

## 20.5 内视「技艺」Tab 与前端页面

- 内视页新增 `technique` Tab：七技艺列表，每项展示等级、经验进度（本级累计/下一级需求）、+5%×等级 行动速度加成。
- 技艺导航组在 炼丹/炼器 之外新增 符箓/阵法/强化 三个子页；符箓/阵法复用行动卡网格；强化为独立页面（物品格+目标等级+保护槽+重复控件 / 费用·成功率·产出·经验·耗时面板）。

## 20.6 持久化与协议

- `PlayerLoadoutDocument.TechniqueExperiences` 随 Loadout 分段持久化；`ActionIntent` 增 `targetItemId`/`auxItemId` 入队载荷。
- `SectionCodec.CurrentSchemaVersion` 与 `PostgresSchema.Version` 同步 +1，新增字段全部可缺省解码。

## 20.7 技艺工具

### 20.7.1 物品模型

- 七技艺各配一件可装备工具，以**装备目录条目**落地（`equipment.` 前缀、进 `RawEquipments`），不参与物品目录登记。
- 装备槽位：`slot = "tool-<techniqueId>"`（`tool-alchemy`/`tool-forging`/`tool-talisman`/`tool-enhancement`/`tool-formation`/`tool-gathering`/`tool-mining`），七个专属槽位随装备槽位唯一互斥校验天然互斥，同技艺至多一件。
- 加成声明：`techniqueBonus = { technique, speedRatio }` 绑定技艺与速度加成数值；`speedRatio` 配表化为后续高品阶工具留空间，本批（tier 1）恒为 `0.10`。
- 工具不配置 `flatStats`/`baseStatRatios`，对战斗属性零贡献；命名遵循「本名不拼品阶前缀」，高阶工具以新 id 承载。
- 首批工具：桃木铲（采集）、精铁镐（挖掘）、灵火炉（炼丹）、百炼铁钳（炼器）、桃木笔（符箓）、桃晶旗（阵法）、淬灵锤（强化）。

### 20.7.2 速度加成结算

- 行动 `Technique` 命中已装备工具的 `techniqueBonus.technique` 时，其 `speedRatio` 与技艺等级加成**同除数加算**：`实际耗时 = 基础耗时 / (1 + 0.05×技艺等级 + Σ工具speedRatio)`。
- 不跨技艺叠加、不乘产出倍率；与节点建筑速度乘区同点结算（`TimedActionDuration`），保持确定性。

### 20.7.3 制造与获取

- 工具由炼器产出：炼器页新增「技艺」子分组，7 条 `forge.tool-*` 配方（`technique=forging`），产出对应 `equipment.tool-*`。
- 工具**可强化**：强化规则同普通装备（指数成长 1.05^强化等级，未配置保护材料时以同装备基础件代护）；强化后其 `techniqueBonus.speedRatio` 随强化等级等比缩放（`有效速度加成 = 基础加成 × 1.05^强化等级`），与技艺等级加成同除数加算，进一步提升对应生活生产行动速度。

### 20.7.4 前端槽位

- 装备面板底部「技艺工具」区为七个可交互槽位（每技艺一格），点击弹网格挑选器按 `tool-<techniqueId>` 过滤，穿脱复用 `loadout.replace` 通道。

# 第二十一篇 同道与组队系统

> **定位**：本篇是「同道」社交入口与完整组队系统的唯一设计真源。第十四篇 §14.5.2 的邀请制队伍仅描述最早的入队通道，本篇在其上扩展队伍档案、招募匹配、组队大厅与聊天队伍链接；传音频道机制本身仍以第十四篇为准。

---

## 21.1 定位与边界

1. **队伍是招募组织层**：目标类型/目标节点/身家门槛均为招募标签；「同图并肩作战」的战斗协同结算由 [§21.13](#2113-同图共战组队讨伐) 定义，队伍频道与成员在线态是已有的协作基础。
2. **同道 Tab**：左侧顶级导航「同道」是社交入口容器，本期只有「队伍」一个子页；好友管理仍留在聊天面板内，后续子页以同一子 Tab 结构扩展。
3. **服务端权威**：队伍档案、成员关系、匹配登记、大厅结果与身家数值全部由服务端产出；前端不本地推演成员/门槛/匹配结果，只保存最近一次服务端视图。
4. **存在感与持久化通知分离**：上线/下线/换节点只改变附近成员及在线位，主服按会话最近一次已入队的社交视图重新投影，禁止为纯存在感事件反复加载整套 PostgreSQL 社交关系。持久化社交变更仍从数据库构建完整视图；新会话尚无视图时由握手全量下发建立基线，可丢弃推送失败不前移基线。异步多订阅通知必须逐个等待，所有通知共享并行上限，不能只等待多播委托的最后返回值；协议仍使用同一 `SocialStateDto`。

## 21.2 队伍档案（Party Profile）

每支队伍除 `party_id`/`leader_id` 外持有一组档案字段，全部落 `social.parties`：

| 字段 | 协议字段 | 口径 |
| :--- | :--- | :--- |
| 队伍名称 | `name` | 1~32 字符；为空时服务端生成「{队长道号}的小队」 |
| 目标类型 | `activityKind` | `any`（不限）/`combat`（讨伐战斗）/`exploration`（历练采集）/`cultivation`（吐纳修炼）+ 五门技艺 `alchemy`（炼丹）/`forging`（炼器）/`talisman`（符箓）/`formation`（阵法）/`enhancement`（强化） |
| 目标节点 | `nodeId` | 空串 = 不限；否则必须是世界图已知节点 ID（`WorldGraph.ContainsNode`）；前端表单按「区域 → 地点」级联选择（区域不限即地点不限，协议无区域级任意节点语义），展示标签为「区域 · 地点」，创建/匹配表单默认当前地点 |
| 身家门槛 | `minValuation` | ≥0；0 表示不设门槛；加入者与自动匹配均按它裁决 |
| 公开性 | `isPublic` | true 进组队大厅；false 只能被邀请或经聊天队伍链接进入 |
| 斗法开关 | `pvpEnabled` | 队伍级 PVP 撮合开关（§7.10.4）；仅 `activityKind='combat'` 可为 true、仅队长可改、队员只读；改离讨伐自动归位 false |

- 队伍上限恒为 5 人（含队长，`SocialRuntime.MaxPartyMembers`）。
- 一名玩家最多属于一个队伍（`social.party_members.player_id` 主键）。
- 每名玩家最多一条待处理队伍邀请；加入任何队伍时邀请与匹配登记同步清除。

## 21.3 身家（valuation）口径

> 「身家」是招募用的量化参照，**不是战斗属性**；名称刻意不锁死——协议与代码统一用 `valuation`，界面文案集中在 i18n 词条（`social.valuation`），后续改名只动词条。

```
身家 = 战斗装备价值 + 功法价值 + 技艺工具价值
战斗装备价值 = Σ 每件已穿戴战斗装备（slot 非 tool-*）的单价（强化 +N 按变体 "+N" 独立计价）
技艺工具价值 = Σ 每件已穿戴技艺工具（slot 为 tool-*）的单价（强化 +N 按变体 "+N" 独立计价）
功法价值 = Σ 每门已参悟功法：max(1, 累计经验 / 500) × 对应残卷单价
装备单价(itemId, variant) = 坊市市场参考价 ?? 包含强化折旧的商店回收价（总纲 §4.6） ?? 0
残卷单价(ability.X) = item.fragment.X 坊市参考价 ?? item.fragment.X 配表回收价 ?? 0
构成结构 = ValuationBreakdownDto { Equipment, Abilities, Tools }，随各处身家字段下发供前端 Hover 展示

- **经验残卷折算**：游戏内 1 本残卷固定注入 500 点经验（全本秘籍注入 10,000 经验 = 20 本残卷）。身家功法估值严格按消耗的残卷资财总量结算，不再采用荒谬的「等级 × 全本秘籍单价」。已习得功法底线按 1 本残卷计。
- **六维/技艺不计入**：它们没有可交易的市场锚定价，身家保持「可支配资源口径」而非全角色强度。
- **数据源**：在线玩家取运行时聚合快照（`PlayerAggregateState.Loadout`）；离线玩家读 `loadout` 持久化分段（含刷盘队列叠加）。入队裁决与匹配自动并入使用实时值；列表展示允许 ≤30s 的估值缓存。
- **不可用兜底**：坊市分片未就绪/品种不在本进程分片 → 回落回收价；新玩家无 loadout 分段 → 身家 0。

## 21.4 无队伍四入口

| 入口 | 语义 |
| :--- | :--- |
| 自主选择 | 三模式页签：「组队大厅」「队伍匹配」「创建队伍」任选其一，一次只显示所选模式面板 |
| 队伍匹配 | 填目标类型/目标节点/队友最低身家 → `party.match.set`：服务端**先尝试自动并入**满足条件的公开队伍，未命中则登记入「匹配中」散人池 |
| 组队大厅 | 同类筛选 + 列表展示：公开队伍（含成员预览、门槛、加入按钮）与匹配中散人 |
| 创建队伍 | 填队名（可空→默认名）/目标类型/目标节点/身家门槛/是否公开 → 创建者任队长 |

## 21.5 匹配语义

1. `party.match.set {activityKind?, nodeId?, minValuation?}`：仅无队伍玩家可用；先写/更新 `social.party_seekers` 行，再扫描公开队伍尝试自动并入。
2. 自动并入条件（全部满足）：队伍 `is_public` 且未满员；活动类型与目标节点须与我方条件一致——`any`/空串为「不限」，筛选侧与被筛侧任一为不限即放行（不限目标的队伍对所有筛选可见，不限筛选的散人匹配全部队伍）；我方身家 ≥ 队伍 `min_valuation`；**每名在队成员身家 ≥ 我方申报的队友最低身家**。命中多队时取人数最多、其次创建最早者。
3. 未命中：保持「匹配中」状态（`SocialStateDto.seeking` 下发），可随时 `party.match.clear` 撤下；加入队伍时登记自动清除。
4. 散人池不自建队伍、不反向强拉：大厅里队长可对散人发 `party.invite`（走既有邀请-接受流程）。

## 21.6 组队大厅

- 拉取式：`PartyLobbyRequest(25) {requestId, activityKind?, nodeId?, minValuation?}` → `PartyLobby(26) {requestId, myValuation, parties[], seekers[]}`。
- `activityKind`/`nodeId` 筛选沿用「不限双向通配」口径（同 §21.5）；`minValuation` 筛选语义：公开队伍按「成员最低身家 ≥ 阈值」、散人按「本人身家 ≥ 阈值」。
- 公开队伍条目含成员预览（道号/在线/身家），前端据此展示加入可行性（我的身家 < 门槛时置灰但可见）。
- 散人条目含道号/在线/身家/目标/队友门槛；本人是队长时提供「邀请」按钮。
- 上限：各类列表最多返回最近 50 条，按创建时间倒序。

## 21.7 队伍管理与权限

| 操作 | 权限 | 说明 |
| :--- | :--- | :--- |
| `party.update` | 队长 | 档案补丁：name/activityKind/nodeId/minValuation/isPublic 任一非空字段即生效 |
| `party.invite` | 队长 | 按道号/ID 邀请；未满员、对方未组队 |
| `party.kick` | 队长 | 移除成员（不能踢自己，队长离队走 leave/移交） |
| `party.disband` | 队长 | 解散整队：成员行随 `ON DELETE CASCADE` 清除，聊天链接置空失效 |
| `party.leave` | 全体成员 | 队长离开时按加入序移交最早成员；最后一人离队删队 |
| `party.share` | 全体成员 | 把队伍卡片发布到世界/附近/好友频道 |
| `party.join` | 无队伍者 | 按 `partyId` 加入：公开队伍大厅加入与不公开队伍链接点击共用；校验未满员 + 身家 ≥ 门槛 |

队伍 ID 是不可猜的 UUID，链接本身即加入凭据：不公开队伍不进入任何列表，但持有链接者点击即可加入（仍受满员与身家门槛约束）。

## 21.8 聊天队伍链接

- `party.share {channel, targetPlayerId?}` 是社交动作，由服务端借 `ChatRuntime` 生成一条 `party_ref` 指向本队的传音消息；正文为服务端规范文本（不消耗 200 字输入），走与发言相同的频道作用域解析与限频。
- `ChatMessageDto.partyLink` 携带队伍卡片快照字段（队名/目标/门槛/成员数），由历史回放与实时广播统一供给。
- 队伍解散 → `party_ref` 外键 `ON DELETE SET NULL`，消息正文保留为普通文本，卡片消失。
- 前端在 `ChatRow` 渲染卡片：队名 + 目标徽标 + 门槛 + 「加入」按钮（已在队伍中/不满足条件时服务端拒绝并以错误帧提示）。

## 21.10 服务端组件

- `SocialRuntime`：新动作分发、档案校验、匹配自动并入、大厅构建（`BuildLobbyAsync`）、成员身家投影进 `BuildStateAsync`。
- `PartyValuationService`：身家计算唯一口径——在线读运行时快照、离线读 `loadout` 分段（刷盘队列叠加），单价经 `MarketRuntime.TryGetBestAskPrice`（本进程分片才查，否则回落回收价）。
- `ChatRuntime.SendPartyShareAsync`：队伍卡片发言（限频/作用域解析与文本发言同口径）。
- `OrderBook.BestAskPrice`：卖一档价只读出口（`_askIndex` 队首即最低挂售）。
- `SectionCodec.DecodeLoadout` / `PostgresSectionRepository.LoadSectionAsync`：单分段读取，避免大厅批量估值拉全量快照。
- 社交/队伍依旧不进玩家级单写者门禁；加队并发用 `social.parties` 行级 `FOR UPDATE` 串行化，满员判队友好地落在事务内。

## 21.11 前端结构

- `uiStore.TabId` 新增 `social`；侧边导航「同道」+ 底部快捷栏同位。
- `SocialPage`（同道）→ 子 Tab「队伍」→ `PartyPanel`：
  - 无队伍：模式页签（大厅/匹配/创建，单面板切换）→ 匹配表单 / 大厅 / 创建表单；创建与匹配表单默认「讨伐 + 当前地点」，大厅筛选默认不限全量展示；
  - 有队伍：档案头（名称徽标/目标/门槛/公开）+「队伍信息/组队大厅」页签；信息页含成员表（队长徽标、在线点、身家）、管理区（队长：改名/目标编辑/门槛/公开开关/踢人/解散/邀请）、全体成员可用的「分享队伍」（世界/附近/好友三向）与离队/解散；大厅页是散人邀请入口（邀请按钮仅队长可见）。
- `socialStore` 增 `seeking`、`lobby`（最近一次大厅结果 + `myValuation`）。
- `ChatRow` 卡片渲染与加入按钮；文案全部入 `social` i18n 域。

## 21.12 邀请系统与功德占位（schema v13）

邀请关系属「同道」域：每名玩家持唯一邀请码，注册时可填邀请码结成邀请关系，按被邀请者
境界里程碑双向发放绑定功德奖励。

### 21.12.1 邀请码与链接

- 邀请码为服务端权威生成的玩家级常量：注册时写入 `identity.players.invite_code`
  （10 位大写字母数字，唯一索引 `ux_players_invite_code`，撞码整体重试新码），
  不变更不回收；邀请接口按 `player_id` 会话声明读回，前端不参与生成。
- 邀请链接为 `https://<host>/?invite=<code>` 静态入口；前端启动时读 `invite` 查询参数
  自动切到注册页并预填邀请码输入框，用户仍可手动修改。注册请求 `invitationCode` 可选。

### 21.12.2 邀请关系与奖励

- `social.player_invitations`：`invitee_id` 主键（一个被邀请者终身至多一条关系）、
  `inviter_id`、`invitation_code` 快照、`highest_realm_level`、
  `qi_rewarded`/`foundation_rewarded` 领取标记；CHECK 禁止自邀（新码入库前先解析
  邀请者，结构上不可能命中自己）。
- 奖励口径（一次性，全部走 `economy` 幂等事务）：
  - 注册：被邀请者 +1000 `item.gongde-bound` + 10000 `currency.spirit-stone`，
    邀请者 +1000 `item.gongde-bound`；同事务随注册落库，幂等键 `invitation.signup:{inviteeId}`。
  - 被邀请者突破至练气期（境界等级 19）：双方各 +1000 `item.gongde-bound`，
    幂等键 `invitation.milestone.qi:{inviteeId}`。
  - 被邀请者突破至筑基期（境界等级 31）：双方各 +2000 `item.gongde-bound`，
    幂等键 `invitation.milestone.foundation:{inviteeId}`。
- 里程碑触发点唯一：`progression.breakthrough` 命令成功后由运行时调
  `IInvitationRepository.GrantMilestonesAsync`；Serializable 事务内对邀请行
  `FOR UPDATE` 后逐里程碑经济入账并翻转标记，钱与标记同生同灭；崩溃留幂等键重放，
  重复突破不重复发奖。在线邀请者经钱包失效 + 结构化日志通知，离线者下次加载读到余额。
- 新增失败码：`INVALID_INVITATION_CODE`（邀请码不存在，注册失败）。

### 21.12.3 功德物品（本期占位）

- `item.gongde`：功德（可交易占位），`kind=category=currency`，`sellPrice=0`，
  可进坊市挂单、不可系统回收；本期无产出与消耗入口。
- `item.gongde-bound`：功德·绑定，`isTradable=false`、`sellPrice=0`，不可挂单、
  不可回收；邀请奖励唯一产出。`market.place` 服务端按目录 `isTradable` 拦截绑定物挂单。
- 后续功德的实际消耗/兑换玩法另立设计，本节只固化占位与发放口径。

### 21.12.4 协议与前端

- HTTP：`RegisterRequest` 增 `invitationCode`（可选）；新增 `GET /api/v1/invitation`
  返回 `{inviteCode, inviteeCount, invitees:[{displayName, highestRealmLevel,
  qiRewarded, foundationRewarded, createdAt}], invitedByName}`。邀请视图走低频 REST，
  不进 WebSocket 社交帧。
- `SocialSubTab` 增 `invite`；`SocialPage` 子页签「邀请」：专属邀请码/邀请链接展示 +
  一键复制（Clipboard API 降级 execCommand）、奖励规则说明、被邀请人境界进度列表。
- 注册页邀请码输入框（`app.login.regInvite*`）；物品名走既有 `game.item.<id>` 词条链。
- 里程碑日志采用 `{{item:id|名称|数量}}` 结构化模板，双方各一条 system 频道战报。

## 21.13 同图共战（行动参与讨伐）

> **定位（TASK-20261009-05）**：组织只决定参与者、准备与开战/散场条件；一次行动参与会话持有唯一权威战斗态，同一场战斗只推演一次。成员行动仅引用会话并消费个人结算。队伍、团队、宗门身份不得进入战斗规则与表现分支。

### 21.13.1 组织条件与参与会话

- 队伍持有 `openSlots`（2~5，默认 5）；成员数等于开启槽位、全员准备、全员位于目标节点才开战。档案目标优先，未指定时取队长驻留节点。
- 开打冻结真实行动 ID、参与者顺序、各成员属性/功法槽/装备/气血灵力/跨战技能状态/持续消耗品 Buff、遭遇、公共种子与寻敌速度；会话内不接受实时装配面板变化。阵法类持续消耗品（`subCategory=formation`）的定格 Buff 全队生效——注入全部成员而非仅携带者（§7.9.5 作用范围条目）。已装载成员经其所有权通道定格最新内存态；未装载成员直接解码持久化真源（与装载对账同一事务快照口径），不触发实体装载与离线补算；若其收件箱仍压着未消费会话结算，定格前先在临时聚合上按装载对账同口径重放结算投影——冻结消费后的有效面板（散场复活回血等随之生效，不能从旧状态开下一场），收件箱本身不消费，挂机收益仍在其上线补算时生效。
- **战斗消耗品统一库存**：冻结启用的战斗槽位、槽序、触发条件与时钟，不冻结数量。范围为 `category=consumable`、适用 `combat`、`durable=false` 的全部自动使用物品，覆盖 potion/general、即时与持续；药品不是独立资产路径。在线模式按各成员真实可用余额工作钱包判定，余额不足只跳过对应物品，不清槽、不停战、不透支。买入成交后从后续合法边界自动使用；已生效限时效果不因卖空而撤销。
- **在线资产顺序与原子结算**：任何影响冻结消耗品的资产变更须先在会话门内把在线会话推进到有效时刻，再按新余额验证和提交资产操作。检查点、成员消耗实扣和各成员 inbox 同事务提交，读集包含零余额键，冲突须丢弃整批结果重算；成员消费 inbox 不二次扣除。开场即时判定与初始检查点及实耗同事务提交，恢复不重演开场。交易或零时长同步不能凭空增加一次判定。
- **离线储备与模式切换**：全员离线时在同事务结清在线实耗、将冻结槽位对应非 durable 战斗消耗品可用数量按成员/物品/variant 去重划入储备并保存 Offline 模式。默认一小时批算只减储备、不逐件写库；储备空后继续战斗。离线入账只进普通钱包，不回填历史；实际批算末端才按净变动补入下一段储备，本批掉落下批可用。储备不可售用。有人回线先按旧储备结清至切换时刻，退回未耗量并原子切 Online；散场/指纹失配只退未耗储备。切换不重建战斗、不重置冷却、持续时间或随机序列。durable 持有型物品仅保留冻结资格，不锁件、不入储备；手动消耗品不参与自动使用。
- 在线/离线后台扫描的存在感快照仅用于筛选候选会话；最终模式必须在会话门内读取当前真实连接与握手中成员。等待查询或会话门期间已完成的上线/下线同步，不能被旧扫描结果反向覆盖；检查点模式、普通余额与离线储备仍同事务切换。
- 队伍斗法开关（`pvpEnabled`，§7.10.4）随会话创建冻结进参与规格；存续期间档案值与冻结值漂移即散场重建，与目标漂移同口径。勾选斗法的会话整队作为一个匹配单位进入斗法撮合，斗法战斗由会话权威相位回放共享剧本。
- 成员原队首挂起，参与行动作为引用锚点插队；结束后按权威时刻恢复原队首。无限重复不因波次完成自动出队。
- 参与引用不占个人行动容量：最多保留 256 项个人行动和 1 个参与引用。迁地命令插队前先按当前权威时刻散场并消费末批，不能把参与引用挂在赶路之后。
- 成员变动、取消准备、槽位失效、目标漂移、解散及原有离线超时逐出终止会话。断开连接本身不散场；离线超时仍按既有窗口裁决。
- 散场先推进会话到权威结束时刻，再投递终态。倒地成员以 1 点气血起身，灵力不恢复；未装载成员由散场流程强拉消费相同终态后卸载（总纲18 §14.6），不能从旧状态开下一场。就绪位跨会话常驻：散场不复位名册 ready，仅成员本人取消准备清除；散场后组织条件再次齐备时，下一次仲裁按常驻就绪直接重开新会话。

### 21.13.2 唯一权威执行上下文

- 会话独立持有搜索、波次、战斗、复活、事件顺序与全部成员战斗态，复用既有多盟友战斗规则；成员不再恢复、挂接或推进自己的同场遭遇。
- 会话有独立所有权与推进锁，不依附队长在线态。玩家仍按 PlayerId 哈希分片；同节点不意味着同分片，会话与成员之间只传不可变文档/结算。
- 任一成员在线（含断线宽限期）即实时推进，离线成员实体常驻装载并实时消费个人结算，收件箱不积压；全员离线时按 §1.2 三态主旨转入离线挂机批算——挂起游标是批算边界间的持久形态，按批算间隔（默认 1 小时）由主服推进，推进后逐成员强拉消费结算，不逐 tick 实时消耗；成员回线未轮到批算点时，由会话统一按墙钟即时补算一次，其他成员直接读取已推进状态（执行口径见总纲18 §14.6）。
- 成员离线不从冻结参战阵列移除；全员离线期间仍服从离线超时逐出等显式散场边界，补算不得越过该时刻。离线时长以成员断线时刻（`offline_since`）起算，强拉装载与结算消费不重置该锚点。
- 成员序是稳定身份，观察者 selfIndex 只决定本人标记、日志称谓与个人结算投影，不改变随机顺序、事件归因与战斗结果。
- 成员个人行动管线遇到参与引用时等待权威状态；搜寻/战间回复、冷却和战中血蓝均由会话计算，不重复消耗成员战斗预算。
- 自然回复余数按成员冻结并持续保存；各成员搜寻/战间回复保持自己的五秒进度，散场与血蓝一起交付，不能重置个人回复周期。战斗入场预扣灵力和吟唱须在同一边界进入全部成员投影；未首次交付的开场事件须随首批交付且只交付一次。
- 模式、模式生效时刻、批次边界、独立自动使用判定游标及离线储备随唯一检查点持久化。服务恢复先恢复会话与参与关系再接收相关资产写入；Offline 停机段只用已提交储备，Online 停机段按已提交在线规则恢复到恢复边界后再切模式，不虚构历史储备。未知提交查持久化版本与幂等事实，未确认时隔离会话，不发布不确定药效或战果。
- 首次装载一律从持久化真源对账；常规命令和周期推进仅对已有参与引用或会话宿主已发现的活跃/待消费成员查询结算，未参战玩家不承担逐人会话查询。成员提示不作为检查点或收益真源，开场、恢复与投递均更新提示。
- 并发上线/迁地触发的同一玩家社交刷新合并为单次在途通知；构建期间再次变更时继续发送最新状态。通知不逐条保存中间状态，主动社交指令回执仍必达，推送失败向调用方报告。

### 21.13.3 收益与成员单写者

- 经验按参与人数平分后叠个人等级惩罚（MWI Level Malus）；共享掉率按全员掉落增幅放大，再按个人权重决定归属；每人只入账自己的份额。
  - **免罚门槛取大**：成员境界低于队内最高 20%（`level × 0.2`）或低于 12 级以内（两者取更高/更宽容的一方免罚），避免前期组队小号体验严重受挫；
  - **超额平滑惩罚**：超出免罚差距后每超 1% 罚 3%（`malus = min(0.9, 3 × (gap - exemptGap) / level)`），惩罚封顶 90%；
  - **透传与角标呈现**：队伍成员条目透传当前境界等级与等级惩罚比率，触发惩罚时在队伍角色卡右上角显示惩罚角标（如 `-90%`）与提示说明。
  - **内功随成员快照冻结**：0 号内功位的功法与参悟等级进入冻结输入（内功不进施放序列，故不在冻结技能槽内），六维经验按该成员心法的 `rootExpMultipliers × eff` 逐人重分配，修为份额乘 `cultivationExpBonusPoints`；会话只投递增幅后的份额，修为瓶颈与底蕴兑换仍在成员单写者内结算。未装内功的成员维持「六维各得全额」口径。
- 会话产生个人经验、功法经验、掉落资产、击杀/死亡/轮次、战斗统计与战报增量，以及最终血蓝/技能状态。结算不覆盖成员实时设置、装备、社交状态或其他无关字段。
- 释放参与引用时回到个人属性上限，按既有个人面板规则夹取终态血蓝；参与期间的冻结上限不会继续覆盖散场后的实时装备面板。
- 成员只能在自己的玩家 gate 与 ECS Fiber 内消费，消费游标、资产、个人分段和收件箱回执必须原子提交；重复投递不重奖，失败不得先确认回执。
- 开场和散场通知只请求成员所有权内对账；活动引用由成员适配器读取权威会话行建立。社交层不得在已消费终局后依据旧开场规格再次入队。
- 行动账本、每日账本与离线账本继续使用现有统计入口；事件发生时刻决定自然日和离线口径。结算投影只消费既定结果，不重新运行战斗。
- 领取会话投影前，成员仍通过原资源管线推进个人暂存物品、Buff 到期与道龄；参与引用阻止个人战斗/原行动推进。该区间资产增量与会话份额、消费游标一并原子提交，投影本身不直接跳过个人模拟时钟。
- 成员等待期间不排个人五秒回复边界，冻结余数只由会话推进和交付；个人 Buff 到期、暂存入账及散场边界照常保留。配表删行动后的终局补投依据结算本身识别终态，不受消费前临时屏蔽散场的绑定影响。
- 同一推进生成的会话检查点与全部成员结算须原子持久化；逐帧展示读取当前会话投影，持久化收件箱只保留必要结算增量，避免离线成员复制完整战斗轨迹。

### 21.13.4 表现与协议

- 保留通用 `participation`、`expedition.allies`、波次、相位、战报与动画结构；盟友阵列固定序，成员读取会话当前状态的本人视角，不在回线后重演整场。
- 盟友属性与装配继续走 `UnitInspect` 按需冻结投影，本人属性面板沿用原通道；组织身份不进入 CombatArena 分支。
- 成员所见事件顺序、倒地/复活、敌方状态与结果必须一致；只有本人称谓、个人收益和 selfIndex 有视角差异。
- **复活时机策略（`respawnPolicy`，§7.9.4.1）**：每名成员在组队信息里设定**自己的**倒地起身时机——直接复活 / 全员可复活或存活 / 指定队友存活。该设置属于玩家个人数据（随 `settings` 分段持久化，开打时随成员冻结快照进入会话规格 `ActionParticipantSnapshot.RespawnPolicy` / `RespawnTargetPlayerId`，由会话在成员下标域解析为 `RespawnTargetIndex`），任何人不得代替他人设定；但它依赖「当前与谁同队」这一前提，故**队伍归属一变即重置为直接复活**：本人离队/换队/被踢/超时逐出/队伍解散/加入新队伍时重置本人；被指名队友发生上述情形时，指名了他的成员同样重置。与本人无关的成员离队不触发重置。会话内不受理实时改动（与冻结面板同口径），重置在下一场会话生效。等待有硬上限（阵亡时刻 + 2 × 读条），到点强制起身，等待不得冻结战场时钟。

### 21.13.5 持久化与恢复契约

- 冻结规格为会话输入，当前远征/战斗态、业务时钟和递增检查点版本为会话恢复真源；成员持有会话引用和已消费游标，不存可自行推进的冻结剧本副本。
- PostgreSQL 原子保存会话状态和各成员收件箱；会话记录及未消费结算独立于队伍生命周期，解散队伍不得级联删除。
- 重启恢复最新会话检查点，不再无条件散场；游戏配表指纹不一致等无法安全续算的明确边界必须保留证据并按最后确定时刻收尾，禁止静默重算/重复发奖。
- 恢复推进先核对持久化成员关系、就绪、槽位与目标驻留条件；发现已失效但缺少确定散场时刻时，保留原因和版本证据，按最后已提交检查点收尾，不补算不确定区间。
- 组织恢复的位置校验从同一事务快照读取最新 `world` 分段（durable 队列叠加已落库段），迁地 `edgeId` 视为不驻留；不使用可能滞后的 `player_projection` 判定会话成立。开场冻结完成后先强制提交已装载成员脏分段，再创建会话检查点；未装载成员以同一事务快照口径的持久化真源定格，无脏分段可提交。
- 确定未提交的会话推进恢复检查点；提交结局未知须通过原版本/幂等标识核验，不能继续覆盖不确定终态。成员消费复用既有经济事务确认与隔离语义：账本事务类型 `participation.settlement`，幂等键 `participation:{sessionId}:{playerId}:{sequence}`（sequence 为会话结算序号），事务 ID 取 SHA-256(幂等键) 前 16 位，随 `ParticipationInboxReceipt` 与成员分段在同一事务内原子提交。
- 单个会话的检查点冲突、未知提交或个人消费失败只隔离其自身，健康会话与其他玩家仍完成当批推进；批次最后报告故障，不能在玩家推进开始前冻结全服。
- 本地库版本同步升级，迁移只放 `migrations/`；新库由权威 DDL 建表。旧模型切换使用该目录内的离线一次性工具解压并移除成员旧参与行动、保留已结算收益及终态血蓝，再由 SQL 收尾旧会话和推进标签；自动 SQL 链遇到未转码载荷必须中止，禁止假升级或清库，不新增运行时兼容路径。
- 离线转码按运行时相同边界验证实际载荷大小、解压长度与 SHA-256；`stored_bytes` 为统计元数据，转码按实际新载荷长度重算。长度统计漂移不触发清库，原始长度或校验和不一致必须中止。

### 21.13.6 宗门累计任务边界

- 宗门累计采集/击杀/贡献任务订阅成员行动结果，维护独立贡献聚合，不创建同场战斗会话。
- 宗门共同讨伐可由组织适配器创建相同参与规格；本任务只落地现有队伍入口，不预建未来组织框架。

### 21.13.7 验收不变量

- 三名成员同场只有一份战斗推进预算，成本为一次推演加成员结算投影；单人普通讨伐规则不变。
- 不同观察者、在线/离线/回线顺序、检查点恢复产生相同战斗结果；成员回线不重新推演已完成区间。
- 散场到边界、倒地复活、资产幂等、个人账本与原行动恢复均保持；崩溃不得留下半结算或重复收益。
- 验证包括确定性与跨分片回归、PostgreSQL 原子失败/恢复、完整门禁、真实容量门禁、健康/WebSocket及本地三人队伍浏览器验收。

## 21.14 队伍成员信息卡

同道页队伍槽位点击成员弹出角色信息卡（`PlayerCardModal`）：道号、立绘、角色序号
（`identity.players.player_seq`）、境界牌匾、身家、六维等级与经验进度、战斗经验、
战斗装备/技艺装备/功法技能，以及「战斗用品」详情页（丹药栏 3 槽 + 通用栏 3 槽
`autoUseSlots` 战斗栏域配置）。

- **查询通道**：`PlayerCardRequest{playerId}` → `PlayerCard`，一次按需查询应答，
  不随社交状态常驻下发（成员详情体量大、打开率低，常驻快照带宽不划算）；应答帧必达。
- **授权边界**：仅可查看本人与同队成员；跨队或陌生人请求返回 `error="forbidden"`，
  身份不存在返回 `error="not-found"`，统一以 `error` 字段随 `PlayerCard` 应答下发。
- **数据源**：已装载玩家读运行时内存态，未装载玩家读持久化分段真源
  （`LoadAsync` + `DecodeAggregate`，与身家估值同一展示口径——不投影未消费会话结算）。
- **六维口径**：等级经 `PlayerCoreAttributes.Levels(RealmProgression)` 服务端派生，
  与 loadout 分段 `coreAttributes` 投影同形（exp + level + totalLevel），前端不重复换算。
- **序号口径**：`player_seq` 为注册自增编号，经社交仓储 `identity.players` 直查，
  不进入玩家聚合与快照分段。

# 第二十二篇 新手引导系统（服务端权威任务链式导览）

> **定位**：新玩家首次进入后的线性任务链引导，覆盖采集 → 炼丹 → 炼器 → 地图移动 → 修炼 → 战斗六条核心玩法通路；表现层沿用「遮罩镂空 + 高亮描边 + 气泡卡 + 步骤进度」的引导范式，步骤权威由服务端持有。

## 22.1 设计目标与红线

- **服务端权威**：引导步骤（`TutorialStep`）持久化在玩家 `settings` 分段，材料赠送与完成奖励在行动结算管线内随模拟事务入账。清理浏览器缓存不得重置进度或重复领取奖励；断线重连后按快照恢复到当前步骤。
- **前端只表现**：前端按快照里的 `tutorialStep` 渲染当前里程碑的引导 UI（准备页签、高亮真实控件、气泡文案、跳过），不在客户端判定完成条件、不发放奖励。
- **严格单向**：步骤只能前进（`0 → … → 7`），不存在回退或分支；跳过收敛到终态并补发剩余未领奖励；唯一的「重来」是显式 `tutorial.restart`（重置步骤但不动奖励游标）。
- **不过度防御**：引导不阻断玩家自由操作；玩家在引导外自行完成的同种行为不计入步骤（每步只认对应行动的完成事件）。

## 22.2 里程碑状态机

`TutorialStep` 为 `int`，挂在 `PlayerSettingsState`（settings 分段），随全量/增量快照以 `settings.tutorialStep` 下发。缺省解码为 `0`。

| 值 | 里程碑 | 推进条件（服务端） | 推进时入账 |
| --- | --- | --- | --- |
| 0 | 采集 | `explore.gather-ningxue-grass` 完成一轮（出生点云溪村就地可采） | 凝气草 ×3（炼丹材料） |
| 1 | 炼丹 | `alchemy.refine-qi-pill` 完成一轮 | 百炼铁 ×7 + 兽骨 ×1（炼器材料） |
| 2 | 炼器 | `forge.qingfeng-sword` 完成一轮 | — |
| 3 | 前往云巅草庐 | 旅行到达 `node.cloud-peak`（或激活本步时已驻留该节点） | — |
| 4 | 修炼 | `cultivation.draw-qi` 完成一轮（云巅草庐修炼加速 1.25×） | — |
| 5 | 返回云溪村 | 旅行到达 `node.yunxi-village`（或激活本步时已驻留该节点） | — |
| 6 | 战斗 | `combat.hunt-qi-beast` 完成一轮（一波清空，即 `combat.won` 口径，而非进入战斗阶段） | **功德 ×1000 + 灵石 ×10000** |
| 7 | 完成 | 终态；跳过引导同样收敛到本值 | — |

规则细节：

- 行动型里程碑只认「该行动 ID 完成一轮」的结算事件，驻留型里程碑只认「当前驻留节点 = 目标节点」。
- 驻留型里程碑在进入该步骤的同一结算窗口内立即重估：若玩家激活旅行步时已驻留目标节点，直接续推进，避免「先旅行后补步骤」造成的卡死。
- 赠送与奖励经结算窗口的 `deltas` 增量通道写入资产钱包，与行动产出共用同一事务与资产差量推送；同一迁移只发生一次（步骤不可逆天然幂等）。
- **奖励游标** `TutorialRewardsStep`（settings 分段，缺省 0）：记录奖励已发放至第几里程碑；里程碑推进仅当 `nextStep > 游标` 才入账该步赠送并推进游标，重学路径不重复发放已领奖励。
- `tutorial.skip` 命令把 `TutorialStep` 置为 7 并**补发剩余未领奖励**（游标+1..7 的赠送/终奖合并入账，走命令经济事务 + 资产差量推送 + 结构化入账日志）；重复跳过幂等空转。
- `tutorial.restart` 命令把 `TutorialStep` 重置为 0（奖励游标不动）：供「重新学习引导」；重走流程可再完成全部交互步骤，但已领过的阶段奖励与终奖不再重复发放，未领过的里程碑走到时仍照常入账。

## 22.3 结算挂钩点

推进器为 ECS 层静态规则 `TutorialRules`，在三处结算边界内嵌调用：

1. `CompleteRepeat`（`ActionExecutionRules.Timed.cs`）：计时行动每轮完成（`action.completed`）后，按行动 ID 匹配里程碑 0/1/2/4。
2. `CompleteCombatAdvanceCore` 波次清空分支（`CombatActionRules.cs`）：`combat.won` 计一轮完成后，匹配里程碑 6。
3. `FinishTravel`（`ActionExecutionRules.Travel.cs`）：`world.arrived` 后按驻留节点匹配里程碑 3/5。

所有钩子只携带「玩家上下文 + 触发事实 + 增量字典/事件尾」参数，无状态、无分配扩张，不在热路径引入集合重建。

## 22.4 前端导览层

React 组件 `TutorialOverlay`（`frontend/src/tutorial/`）按 `tutorialStep` 渲染当前里程碑的 UI 子步骤序列：

- **视觉**：四块半透明暗色遮罩围出目标元素镂空（外扩数像素），金/红描边高亮框脉冲；气泡卡含里程碑 kicker、标题、正文、`n/m` 进度条与「跳过 / 上一步 / 下一步」按钮；箭头小方块指向目标；卡片按剩余空间自动选择方位并 clamp 进视口。
- **子步骤推进模式**：
  - `button`：点「下一步」；
  - `target`：点击高亮目标本身推进（遮罩镂空放行真实点击，先教后做）；
  - `server`：等待型卡片（无推进按钮），服务端里程碑翻转后自动进入下一里程碑。
- **prepare**：子步骤激活时先驱动真实 UI（切页签、切技艺模式/子页签），再轮询等待目标元素出现后再测量定位；目标缺失时卡片降级为居中提示。
- **弹窗治理**：业务弹窗（`Modal`/`ConfirmDialog`，z-index 低于引导层）在引导期间只允许「当前目标所在的弹窗」存在；定位轮询对每个 `.modal-backdrop` 判定——不含当前目标的游离弹窗一律程序化点击其 `.modal-close` 收拢（覆盖「上一步」回退残留弹窗、跨页签 portal 残留等死锁路径）；目标元素 `disabled` 或被遮挡时按定位失败计数，超时出现逃生「下一步」。
- **等待步展示聚焦**：`server`/`arrive` 等待子步骤经 `focusSelector` 镂空聚焦一块「可看不可点」的详情区——行动类等待切「详情」页签聚焦行动实况面板，旅行类等待切「地图」页签聚焦节点地图本体；镂空区上盖透明拦截层吃掉点击（中止按钮等原可交互控件在引导期不可操作），气泡卡以实测尺寸避让到聚焦区外悬浮。
- **锚点**：行动卡片带 `data-action-id`，导航带 `data-tour="nav:*"`，行动模态提交钮、地图「规划路线」「启程」钮带专用 `data-tour`；地图节点沿用既有 `data-node-id`；详情页主面板 `data-tour="combat-detail"`，节点地图 `data-tour="world-map"`。
- **生命周期**：`hasReceivedSnapshot` 且 `tutorialStep < 7` 时挂载；里程碑翻转为 7 时展示一次完成卡（含奖励文案），「完成」后卸载。
- **跳过二次确认**：点「跳过引导」先弹引导层内确认卡（业务 `ConfirmDialog` 层级低于引导层不可复用），文案明确「跳过后剩余奖励将直接发放，之后可在设置→引导重新学习」；确认才发送 `tutorial.skip`。
- **重学入口**：设置页「引导」分类提供「重新学习引导」（发送 `tutorial.restart` 后引导层自动重新挂载）与当前进度说明。

## 22.5 「功德」物品

引导终奖使用既有占位物品 `item.gongde`（名「功德」，见 §21.12.3）：`kind/category = currency`、`sellPrice=0` 不可系统回收、可进坊市挂单，新手引导是其首个产出入口。绑定变体 `item.gongde-bound` 仍归邀请系统独占，引导奖励不涉足。赠送与奖励均为普通资产增量，无独立货币通道。

## 22.6 存档与兼容

- `PlayerSettingsStateDocument` 与 `SectionCodec.SettingsDocument` 新增 `TutorialStep`（缺省解码 `0`）与 `TutorialRewardsStep`（缺省解码 `0`）；schema 版本推进至 15，`migrations/0015_v14_to_v15.sql` 仅做标签推进。
- 旧存档解码 `tutorialStep = 0`：既有内测账号登录后会看到一次引导，可跳过，语义可接受且便于验收。
- v14 载荷无奖励游标：解码时按 `tutorialStep` 回填「必然已领过」的游标下限（已进炼丹 ⇒ 游标≥1，已进炼器 ⇒ ≥2，已 Done ⇒ 7），防止升级后重学/跳过路径重复领取阶段赠送。

## 22.7 验证口径

- 领域/ECS 测试：新建玩家 `tutorialStep = 0`；逐里程碑驱动采集/炼丹/炼器/修炼完成一轮与两次旅行到达、一波讨伐胜利，断言步骤推进、材料与终奖精确入账且不重复；跳过补发清单按物品合并、跳过后游标至 Done 幂等；重学重置步骤不动游标、跳过后重学全程不再入账；编码→解码往返后步骤保留。
- 前端：`tutorialStep` 全量/增量快照链路、各里程碑锚点选择器可解析。

# 第二十三篇 万象图鉴与解锁机制

> 状态：随 TASK-20261013-02 落地；TASK-20261021-07 重构为多维 Toggle 筛选体系。本文档为《道化太初》图鉴系统（Codex）与解锁机制的唯一权威设计真源。
> 前端页面：`frontend/src/components/CodexPage.tsx`，对应主界面顶级页签 `codex`（图鉴）；分类与筛选纯函数：`frontend/src/game/codexFilters.ts`。

---

## 23.1 核心定位与设计哲学

图鉴是修士在大千世界历练、探索、修习与百工营造过程中的见闻典籍。
其核心定位为：
1. **收集与索引真源**：聚合修仙世界中的五大维度——**天地材料、制造配方、节点建筑、功法神通、妖兽精怪**，提供直观的收集进度与详情总览；
2. **能力与玩法解锁的闸门**：
   - **天地材料**：展示大千世界中的草木药材、矿石矿脉与妖兽异材，提供产出来源、基础用途与市场行情指引；
   - **制造配方**：玩家未解锁对应图鉴前，在制造交互列表中**彻底隐藏**，不可见且服务端拒绝执行；
   - **节点建筑**：玩家未解锁对应图鉴前，在地点建造候选列表中**彻底隐藏**，不可见且服务端拒绝发起；
   - **功法神通与妖兽**：记录修士已学神通与已降服妖兽。

---

## 23.2 五大分类与解锁规约

### 23.2.1 天地材料（Materials）

涵盖修仙界百工炼造与历练采集的基础材料，居于万象图鉴首位。材料子分类**直取配表 `subCategory` 字段**，共四类（互斥且完备，禁止按物品 ID 写特例分流）：
1. **灵材 (spiritMaterial)**：野外采集之草木灵材（凝气草、桃木、晨露、伴灵花、引灵松等）；
2. **矿石 (mineral)**：矿脉采掘之原矿（乌铁、赤铜等）；
3. **异材 (exoticMaterial)**：妖兽讨伐掉落之奇珍残蜕——常见战利品（兽皮、兽骨、破碎灵核、兽牙、火羽、残魄灵符、粗韧狼皮、水灵原核、坚岩獠齿、重甲厚皮、金背猿骨，凡品）与低概率稀有掉落（妖丹、煞齿、暴猿煞心为黄品；残刃、煞骨、妖核、陨星破片为玄品）；
4. **精材 (refinedMaterial)**：经萃取与精炼所得的精料（草木精华、伴灵精华、桃木晶、灵松晶、百炼铁、赤铜精，全部凡品）。

> 配表新增材料若缺 `subCategory` 或取值不在上述四类内，图鉴材料页会整条缺失，由 `frontend/src/game/codexFilters.test.mjs` 与 `codexCalculations.test.mjs` 的配表完备性断言强制拦截。

- **品阶口径**（总纲 §6.7）：`tier: 1` 为**凡品（普通材料）**，覆盖全部采集直出、≥50% 高爆率战利品与凡品加工精材；`tier >= 2` 为**稀有材料**，只来自 <50% 低概率掉落，品级 = 产出怪物等阶 + 1（黄品 T1 → 玄品 T2 → 地品 T3 → …）。凡品与稀有材料在图鉴中均按 `tier` 显示等阶徽章，坊市「稀有」筛选取 `tier >= 2`。

- **解锁规则**：
  - **凡品材料**（`tier: 1`）：默认 1 级自动解锁并收录图鉴；
  - **稀有材料**（`tier >= 2`，`tier: 2` 对应 18 级、`tier: 3` 对应 30 级，每阶 +12 级）：
    - **境界或技艺双重解锁（或关系）**：修士角色境界达到该品阶门槛等级，**或者**对应生活技艺等级达到该门槛等级，均可自动解锁收录图鉴：
      - **药材 (Herb)**：草木灵材与百草精粹关联**采集技艺 (gathering)**；
      - **矿石 (Mineral)**：采掘原矿与金铁精材关联**采矿技艺 (mining)**；
      - **异材 (Exotic)**：妖兽讨伐残蜕因无专属生活技艺，由境界等级裁决；
    - **持有直接点亮**：玩家背包当前或曾持有该材料时亦即刻点亮收录。
- **图鉴展示**：
  - 无论是否解锁，在「材料」分类及其子 Tab 下均列出所有已知材料；
  - 未解锁状态以暗墨虚影及锁头标记，Hover 悬浮卡内清晰标注双重解锁条件（如【解锁条件：境界达到 lv18 或 采集达到 18 级解锁】）；
  - 已解锁状态以标准 `ItemTile` 瓦片全彩呈现，悬停展示完整品类标签、等阶、风味描述及坊市行情副卡片。

### 23.2.2 制造配方（Crafting）
涵盖修仙四大技艺生活制造：**炼丹 (Alchemy)、炼器 (Forging)、阵法 (Formation)、符箓 (Talisman)**；子分类取行动配表 `technique` 字段，精炼与萃取类 `craft.*` 行动按实际技艺归属（`craft.refine-*` 属炼器、`craft.extract-*` 属炼丹）。

- **解锁规则**：
  - **T1 配方**（等阶 Tier 1）：默认 1 级自动解锁并收录图鉴；
  - **T2 配方**（等阶 Tier 2，对应 18 级）：
    - **境界或技艺双重解锁（或关系）**：角色境界达到 18 级（凡俗 [天] 叩天门），**或者**对应制造技艺等级（炼丹 alchemy、炼器 forging、阵法 formation、符箓 talisman）达到 18 级，满足其一即自动领悟并解锁图鉴；
    - 配方 T 级由产出物（Yields）或输入物（Inputs）的最大 Tier 裁决（`convertTierToLevel(tier)`）。
- **交互与拦截**：
  - **前端交互**：技艺制造页面（`CraftingPage`）只展示当前玩家已解锁图鉴的配方（境界达到或对应技艺达到）；未解锁配方不出现在列表中。
  - **服务端拦截**：`action.enqueue` 针对制造类及探索采集行动，严格校验 `RealmLevel >= requiredLevel || TechniqueLevel >= requiredLevel`；双重等级均不足时拒绝入队，错误码为 `RECIPE_LOCKED` 或 `ACTION_LOCKED`。
- **图鉴展示**：
  - 无论是否解锁，在图鉴「制造」分类下均列出所有已知配方；
  - 未解锁状态以暗墨剪影/锁头标记，Hover 悬浮卡内清晰标注【解锁条件：境界达到 lv18 或 {技艺名}达到 18 级自动领悟】。

### 23.2.3 建筑图谱（Buildings）

涵盖大世界节点公共建筑（采葛营帐、携行丹灶、聚灵蒲团、淬火铁砧、护阵石龛、养脉泉眼等）。

- **解锁规则**：
  - 根据建筑配表中的 `requiredRealmLevel` 境界等级自动解锁图鉴（如 1 级、19 级、31 级、43 级）。
- **交互与拦截**：
  - **前端交互**：地图附近面板（`NearbyPanel`）的建筑候选弹窗中，只展示当前玩家已解锁图鉴的建筑；未解锁建筑不出现在列表中（隐藏）。
  - **服务端拦截**：`building.build` 校验 `RealmLevel >= definition.RequiredRealmLevel`，不足时拒绝发起（`BUILDING_LOCKED`）。
- **图鉴展示**：
  - 图鉴展示全部建筑条目；
  - 未解锁状态显示虚影暗淡，Hover 悬浮卡内清晰标注【解锁条件：境界达到 X 级自动解锁图鉴】。
- **效果文案规范**：建筑效果必须按 §9.4 的成长模型给出**完整公式**，即「Lv.1 基准值 + 每级增幅」两个数值（如丹房显示 `炼丹行动速度 +12%`、`每级 +2%`），禁止只列 `modifiers` 静态基准——图鉴无等级上下文，单值会被误读为恒定加成。属性名一律走 `PillBonusLabel` 胶囊高亮（属性小图标 + 名称微胶囊 + 色调下划线数值），条目取自 `BUILDING_BONUS_DESCRIPTORS` 全量描述表，新增修饰项字段时只需在此表登记即自动出现在图鉴。

### 23.2.4 功法神通（Abilities）

涵盖心法、剑诀、五行术法、体术与符箓法术等主动与被动技能。

- **解锁规则**：
  - 修士首次通过研读完整技能书（`ability.learn`）领悟该神通后，自动解锁并收录对应图鉴（依据 `learnedAbilityIds`）。
- **交互与状态**：
  - 第一期作为纯收集体系；
  - 未学会的技能显示暗淡问号/虚影；Hover 悬浮卡内注明【解锁条件：研读对应秘籍领悟】。

### 23.2.5 大世界怪物（Monsters）

涵盖各境界区域的普通妖兽、精英怪与世界妖王。

- **解锁规则**：
  - 修士在讨伐遭遇中击败该妖兽（波次胜出清空），即视为降服并解锁收录对应图鉴；
  - 服务端在 `PlayerProgression.DefeatedMonsterIds` 集合中持久化记录所有已击败怪物的 `EnemyId`，并通过快照协议下发至前端。
- **交互与状态**：
  - 第一期作为纯收集体系；
  - 未击败的妖兽显示迷雾剪影，已击败显示全彩；Hover 悬浮卡内注明【解锁条件：在野外讨伐并击败该妖兽】。

---

## 23.3 视觉与交互规范

1. **顶级入口**：位于左侧主导航栏（PC）及移动端快捷导航中，标识符为 `codex`，图标采用典籍卷轴。
2. **两级导航**：
   - 一级：六大主分类页签（材料 / 技艺 / 建造 / 功法 / 妖兽 / 特质），页签右侧常驻「已收录/总数」角标；
   - 二级：**与坊市同款的多维 Toggle 筛选栏**（公共模板 `OptionToggle` + `.filter-bar`），取代旧的独立子 Tab 条。每个维度为一组「全部 + 互斥选项」单选按钮，首项「全部」表示该维不过滤，维度之间 AND 联合；每个选项右挂「已收录/总数」角标，与一级页签及总进度胶囊同一口径。等阶维度项目较多，使用原生下拉（`.filter-grade-select`，`全部` = 不过滤）。
3. **各分类的筛选维度**：

| 主分类 | 分类维度 | 其余维度 |
| :--- | :--- | :--- |
| 材料 | 灵材 / 矿石 / 异材 / 精材（配表 `subCategory`） | 等阶、收录状态 |
| 技艺 | 炼丹 / 炼器 / 阵法 / 符箓（配表 `technique`） | 等阶、收录状态 |
| 建造 | 生产 / 战斗（配表 `group`） | 收录状态 |
| 功法 | 门类（术法 / 内功）+ 伤害大类（物理 / 法术） | 等阶、收录状态 |
| 妖兽 | 层次（妖兽 / 精英 / 妖王，配表 `rank`） | 等阶、收录状态 |
| 特质 | 品阶（凡品 ~ 天品，`TRAIT_DEFINITIONS.quality`） | 收录状态 |

4. **筛选状态常驻**：每个主分类各自持有一份筛选状态（`useUiStore.codexFilters`），切换到其它页签或其它分类后返回，原分类的子分类、等阶与收录过滤 100% 保持；不同主分类之间互不干扰。
5. **收集进度指示**：主分类页签与每个筛选选项均展示「已收录/总数」角标，顶部另设全库总进度胶囊（`收录进度：56 / 187 (30%)`）。
6. **悬浮卡片规约**：遵循 `FloatingInfoCard` 公共组件规范，卡片主体展示条目属性与材料；并在显要位置渲染专属胶囊或说明行标记【解锁条件】。

# 第二十四篇 系统商店与每日限购

> 状态：随 TASK-20261020-05 落地。本文档为《道化太初》系统商店（NPC 直售）与每日限购规则的唯一权威设计真源。
> 前端页面：`frontend/src/components/ShopPage.tsx`，位于主界面顶级页签「万象图鉴」之后；服务端入口为命令 `shop.buy` 与只读接口 `GET /api/v1/players/{playerId}/shop`。

---

## 24.1 定位与边界

1. **系统商店 ≠ 坊市**：坊市（`market`）是玩家之间的挂单撮合与自由定价交易行；商店是系统以固定官价直售物资的货架，**不参与撮合、不产生玩家间流水**，功德与货物均由系统侧吞吐。
2. **唯一权威在服务端**：商品目录来自服务端配表（`config/game-data/shop/offers.json`），价格、限购额度与库存规则由服务端裁决；客户端只做展示与意图提交，不得自行扣减或加发任何资产。
3. **与系统回收对称**：回收口径见第四篇 §4.6（`item.sell` 按 `sellPrice` 折价回收）；本篇为买入方向，二者共同构成灵石的单向阀门。

---

## 24.2 商品目录与定价

### 24.2.1 配表结构

商品条目落在 `config/game-data/shop/offers.json`，根节点为数组，每条：

| 字段 | 类型 | 必填 | 说明 |
| --- | --- | --- | --- |
| `id` | string | 是 | 商品标识，必须以 `shop.` 前缀开头，全局唯一 |
| `itemId` | string | 是 | 发放的物品 ID，必须存在于物品配表 |
| `unitPrice` | number | 是 | 单价（功德），正整数 |
| `dailyLimit` | number | 否 | 每日限购数量，正整数；缺省或 `null` 表示不限购 |
| `sortOrder` | number | 否 | 货架排序权重，升序；缺省按配表读取顺序 |

配表在 `GameDataCatalog.Parse` 中按 `shop.` 前缀归集为 `ShopOffers`，加载期即校验：`id` 前缀与唯一性、`itemId` 存在、`unitPrice` 为正整数、`dailyLimit` 为正整数（若给出）。任何一条不合法都令服务端启动失败，不允许带病上架。

### 24.2.2 首批商品（内测期）

| 商品 ID | 物品 | 单价 | 限购 |
| --- | --- | --- | --- |
| `shop.awakening-stone.daily` | 觉醒石（`item.awakening-stone`） | 100 功德 | 每日 1 个 |
| `shop.awakening-stone.open` | 觉醒石（`item.awakening-stone`） | 1,000 功德 | 不限购 |

两档同物不同价：限购档是每日一次的折扣配额，不限购档是常驻原价供给。

---

## 24.3 每日限购规则

1. **自然日口径**：与行动统计每日账本完全一致，采用 **UTC+8 自然日**：
   $\text{DayIndex} = \left\lfloor \dfrac{\text{unixSeconds} + 28800}{86400} \right\rfloor$。
   同一 `DayIndex` 内累计购买量不得超过 `dailyLimit`，跨日自动归零（无需定时任务，读路径按当日行查询）。
2. **累计口径**：限购按**件数**累计，不按交易笔数。一次购买 `quantity` 件即占用 `quantity` 个配额；限购商品只允许单次购买 1 件（`quantity` 必须为 1）。
3. **不限购商品不写限购行**：没有 `dailyLimit` 的商品不占用任何配额，也不产生限购流水行。
4. **原子裁决**：配额认领与资产增减在**同一个 Serializable 事务**内完成（见 24.4），不存在「先扣配额后扣款失败」或「先发货后配额超卖」的中间态。

---

## 24.4 结算与一致性

一次 `shop.buy` 在经济事务中写入三类事实：

1. **余额行**：扣减功德资产 `unitPrice × quantity`；同时支持绑定功德（`item.gongde-bound`）与流通功德（`item.gongde`），优先扣除绑定功德，不足部分扣除流通功德；`itemId` 增加 `quantity`。扣减与增发在 `economy.player_asset_balances` 内按固定行序 upsert，功德余额不足由既有守卫拒绝。
2. **流水行**：`economy.transactions.transaction_type = "shop.buy"`，分录包含上述两条资产变动，载荷记录 `offerId / itemId / unitPrice / quantity`，供审计与对账。
3. **限购认领行**：`economy.shop_daily_purchases(player_id, offer_id, day_index)` 累加 `quantity`；带 `WHERE quantity + Δ <= dailyLimit` 守卫的条件 upsert。守卫拒绝（返回零行）即判定超出限购，事务整体回滚，资产与流水一律不落库，命令返回 `SHOP_LIMIT_REACHED`。

**幂等**：命令请求 ID 作为幂等键（`shop.buy:{playerId}:{requestId}`），重放命中历史事务时直接返回原结果，不重复扣配额、不重复发物。限购认领参数纳入请求指纹，同一幂等键换商品或数量会被判定为幂等冲突。

---

## 24.5 协议

### 24.5.1 只读货架状态

`GET /api/v1/players/{playerId}/shop`（需会话 Cookie，且只能读本人）：

```json
{
  "dayIndex": 20455,
  "offers": [
    { "offerId": "shop.awakening-stone.daily", "itemId": "item.awakening-stone", "unitPrice": 100, "dailyLimit": 1, "purchasedToday": 1 },
    { "offerId": "shop.awakening-stone.open", "itemId": "item.awakening-stone", "unitPrice": 1000, "dailyLimit": null, "purchasedToday": 3 }
  ]
}
```

`purchasedToday` 为该玩家当日已占用配额；不限购商品按实际成交件数返回，仅作展示参考。

### 24.5.2 购买命令

WebSocket / HTTP 通用命令信封，`command = "shop.buy"`，`payload = { "offerId": "shop.awakening-stone.open", "quantity": 3 }`。

| 结果码 | 触发条件 | 用户提示 |
| --- | --- | --- |
| `INVALID_PAYLOAD` | 商品缺失、数量非正整数、超出单次上限（999） | 商品或数量无效。 |
| `SHOP_OFFER_NOT_FOUND` | `offerId` 不在配表中 | 商品不存在或已下架。 |
| `SHOP_LIMIT_REACHED` | 限购商品当日配额已用尽 / 限购商品一次买多件 | 该商品今日限购已达上限。 |
| `INSUFFICIENT_RESOURCE` | 灵石余额不足以支付总价 | 灵石不足。 |
| `SHOP_UNAVAILABLE` | 玩家运行时未装载商店目录 | 商店暂未开放。 |

成功回执：`Succeeded=true`、`Code="OK"`，气泡文案「购得 X 件…」；钱包增量随快照增量推送，前端无需手动刷新余额。

---

## 24.6 前端规范

1. **入口**：左侧主导航栏「商店」（标识 `shop`，图标为货担/钱袋），位于「坊市」之后；移动端底部页签同步提供入口。
2. **货架卡片**：每件商品一张卡，复用 `ItemTile` + `ItemTooltipTarget` 展示物品瓦片与悬浮详情；卡面只呈现「物名 + 单价 + 限购徽记 + 购买操作」，不重复堆砌配表长描述。
3. **限购徽记**：限购商品显示「每日限购 1 · 今日已购 1/1」，配额用尽时按钮置灰并保持可见（禁止隐藏，避免玩家误以为商品下架）；不限购商品显示「不限购」。
4. **数量选择**：不限购商品提供 `QuantitySelector`（上限 = 余额可买量，硬上限 999）；限购商品固定 1 件，不提供数量控件。
5. **余额反馈**：卡面展示当前灵石余额与本次应付总价；余额不足时按钮置灰并提示「灵石不足」。
6. **状态刷新**：进入页面拉取一次货架状态；购买成功后重新拉取（限购计数以服务端为准，禁止本地自增）。

---

## 24.7 持久化与迁移

- 新增表 `economy.shop_daily_purchases`：

```sql
CREATE TABLE economy.shop_daily_purchases (
    player_id uuid NOT NULL,
    offer_id varchar(64) NOT NULL,
    day_index bigint NOT NULL,
    quantity integer NOT NULL CHECK (quantity >= 0),
    updated_at timestamptz NOT NULL,
    PRIMARY KEY (player_id, offer_id, day_index)
);
```

- `PostgresSchema.Version` 推进至 **38**，对应迁移 `migrations/0038_v37_to_v38.sql`（纯表结构新增，玩家分段与存档标签不变，仍为 v36）。
- 本表只增不改：跨日旧行保留作对账底账，由既有保留策略窗口统一回收；不在读路径做删除。
