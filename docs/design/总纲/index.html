<!DOCTYPE html>
<html lang="zh-CN">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>道化太初 · 设计总纲 (Master GDD)</title>

 <!-- 可选在线字体与样式增强 (断网时自动使用系统本地字体与离线排版) -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
  rel="stylesheet" media="print" onload="this.media='all'">

 <!-- KaTeX 在线数学公式渲染增强 (离线时优雅降级为等宽高亮) -->
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" media="print"
  onload="this.media='all'">
 <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

 <!-- Mermaid 在线流程图渲染增强 (离线时优雅降级为代码块) -->
 <script defer src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>

 <style>
  /* ==========================================================================
       1. 修仙暗墨古典美学基础变量体系
       ========================================================================== */
  :root {
   --bg-void: #050403;
   --bg-dark: #0b0906;
   --bg-card: rgba(16, 13, 9, 0.96);
   --bg-surface: rgba(28, 22, 15, 0.85);
   --bg-hover: rgba(48, 38, 25, 0.6);

   --gold-primary: #d4a853;
   --gold-bright: #f5d076;
   --gold-dim: #8e7033;
   --gold-border: rgba(212, 168, 83, 0.32);
   --gold-glow: rgba(212, 168, 83, 0.22);

   --tone-jade: #4ade80;
   --tone-jade-bg: rgba(74, 222, 128, 0.14);
   --tone-jade-border: rgba(74, 222, 128, 0.4);

   --tone-qi: #38bdf8;
   --tone-qi-bg: rgba(56, 189, 248, 0.14);
   --tone-qi-border: rgba(56, 189, 248, 0.4);

   --tone-danger: #f87171;
   --tone-danger-bg: rgba(248, 113, 113, 0.14);
   --tone-danger-border: rgba(248, 113, 113, 0.4);

   --tone-purple: #c084fc;
   --tone-purple-bg: rgba(192, 132, 252, 0.14);
   --tone-purple-border: rgba(192, 132, 252, 0.4);

   --tone-amber: #fbbf24;
   --tone-amber-bg: rgba(251, 191, 36, 0.14);
   --tone-amber-border: rgba(251, 191, 36, 0.4);

   --text-main: #e8e1d0;
   --text-bright: #ffffff;
   --text-muted: #a39886;
   --text-dim: #706757;

   --font-serif: "Noto Serif SC", "Kaiti SC", STKaiti, "Songti SC", SimSun, serif;
   --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
   --font-mono: "JetBrains Mono", Consolas, Monaco, "Courier New", monospace;

   --sidebar-width: 320px;
   --topbar-height: 56px;
   --base-font-size: 15px;
  }

  * {
   box-sizing: border-box;
   margin: 0;
   padding: 0;
  }

  html,
  body {
   width: 100%;
   height: 100%;
   background-color: var(--bg-void);
   color: var(--text-main);
   font-family: var(--font-sans);
   font-size: var(--base-font-size);
   line-height: 1.85;
   overflow: hidden;
   -webkit-font-smoothing: antialiased;
   -moz-osx-font-smoothing: grayscale;
  }

  /* 顶部流光细金阅读进度条 */
  #reading-progress-bar {
   position: fixed;
   top: 0;
   left: 0;
   height: 3px;
   width: 0%;
   background: linear-gradient(90deg, var(--gold-dim), var(--gold-bright), var(--tone-qi), var(--gold-bright));
   box-shadow: 0 0 14px var(--gold-primary), 0 0 4px var(--gold-bright);
   z-index: 1000;
   transition: width 0.1s ease-out;
   pointer-events: none;
  }

  /* ==========================================================================
       2. 整体全景流式布局拓扑 (宽屏自适应左右全填充)
       ========================================================================== */
  #app-container {
   display: flex;
   width: 100vw;
   height: 100vh;
   overflow: hidden;
   background:
    radial-gradient(circle at 10% 10%, rgba(45, 33, 18, 0.4) 0%, transparent 65%),
    radial-gradient(circle at 90% 90%, rgba(25, 18, 11, 0.5) 0%, transparent 55%),
    linear-gradient(180deg, #090805 0%, #040302 100%);
  }

  /* ==========================================================================
       3. 顶部修仙导航栏 (Topbar)
       ========================================================================== */
  #topbar {
   position: fixed;
   top: 0;
   left: var(--sidebar-width);
   right: 0;
   height: var(--topbar-height);
   background: rgba(12, 10, 6, 0.92);
   backdrop-filter: blur(16px);
   -webkit-backdrop-filter: blur(16px);
   border-bottom: 1px solid var(--gold-border);
   display: flex;
   align-items: center;
   justify-content: space-between;
   padding: 0 28px;
   z-index: 100;
   transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  #topbar.sidebar-collapsed {
   left: 0;
  }

  .topbar-left {
   display: flex;
   align-items: center;
   gap: 16px;
  }

  .btn-toggle-sidebar {
   background: rgba(26, 20, 13, 0.8);
   border: 1px solid var(--gold-border);
   color: var(--gold-primary);
   width: 34px;
   height: 34px;
   border-radius: 4px;
   cursor: pointer;
   display: flex;
   align-items: center;
   justify-content: center;
   transition: all 0.2s;
  }

  .btn-toggle-sidebar:hover {
   background: var(--bg-surface);
   border-color: var(--gold-bright);
   color: var(--gold-bright);
   box-shadow: 0 0 8px var(--gold-glow);
  }

  .topbar-title {
   font-family: var(--font-serif);
   font-size: 17px;
   font-weight: 700;
   color: var(--gold-bright);
   letter-spacing: 1px;
   display: flex;
   align-items: center;
   gap: 8px;
  }

  .topbar-right {
   display: flex;
   align-items: center;
   gap: 12px;
  }

  .search-box {
   position: relative;
   display: flex;
   align-items: center;
  }

  .search-input {
   background: rgba(22, 17, 11, 0.9);
   border: 1px solid var(--gold-border);
   color: var(--text-bright);
   padding: 6px 14px 6px 34px;
   border-radius: 4px;
   font-size: 13px;
   width: 240px;
   transition: all 0.2s;
   outline: none;
  }

  .search-input:focus {
   width: 320px;
   border-color: var(--gold-primary);
   box-shadow: 0 0 12px var(--gold-glow);
  }

  .search-icon {
   position: absolute;
   left: 11px;
   color: var(--gold-dim);
   pointer-events: none;
  }

  .topbar-btn {
   background: rgba(26, 20, 13, 0.8);
   border: 1px solid var(--gold-border);
   color: var(--text-main);
   padding: 5px 14px;
   border-radius: 4px;
   font-size: 13px;
   cursor: pointer;
   display: inline-flex;
   align-items: center;
   gap: 6px;
   transition: all 0.2s;
  }

  .topbar-btn:hover {
   background: var(--bg-surface);
   border-color: var(--gold-primary);
   color: var(--gold-bright);
   box-shadow: 0 0 8px var(--gold-glow);
  }

  /* ==========================================================================
       4. 左侧修仙大纲目录树 (Sidebar TOC)
       ========================================================================== */
  #sidebar {
   width: var(--sidebar-width);
   height: 100vh;
   background: rgba(10, 8, 5, 0.98);
   border-right: 1px solid var(--gold-border);
   display: flex;
   flex-direction: column;
   z-index: 150;
   flex-shrink: 0;
   transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  #sidebar.collapsed {
   transform: translateX(-100%);
  }

  .sidebar-header {
   padding: 16px 20px;
   border-bottom: 1px solid var(--gold-border);
   display: flex;
   align-items: center;
   gap: 12px;
   background: linear-gradient(180deg, rgba(32, 24, 15, 0.7) 0%, transparent 100%);
  }

  .taiji-badge {
   width: 32px;
   height: 32px;
   border-radius: 50%;
   border: 1.5px solid var(--gold-primary);
   display: flex;
   align-items: center;
   justify-content: center;
   background: #000;
   box-shadow: 0 0 10px var(--gold-glow);
   animation: taiji-spin 40s linear infinite;
  }

  @keyframes taiji-spin {
   from {
    transform: rotate(0deg);
   }

   to {
    transform: rotate(360deg);
   }
  }

  .sidebar-brand h1 {
   font-family: var(--font-serif);
   font-size: 16px;
   font-weight: 700;
   color: var(--gold-bright);
   letter-spacing: 1.5px;
  }

  .sidebar-brand p {
   font-size: 11px;
   color: var(--gold-dim);
   letter-spacing: 0.5px;
  }

  .sidebar-toc {
   flex: 1;
   overflow-y: auto;
   padding: 16px 12px;
  }

  .sidebar-toc::-webkit-scrollbar {
   width: 4px;
  }

  .sidebar-toc::-webkit-scrollbar-thumb {
   background: var(--gold-dim);
   border-radius: 2px;
  }

  .toc-item {
   display: block;
   padding: 6px 10px;
   margin-bottom: 2px;
   color: var(--text-muted);
   text-decoration: none;
   font-size: 13px;
   border-radius: 4px;
   border-left: 2px solid transparent;
   transition: all 0.15s;
   white-space: nowrap;
   overflow: hidden;
   text-overflow: ellipsis;
  }

  .toc-item:hover {
   color: var(--gold-bright);
   background: var(--bg-hover);
  }

  .toc-item.active {
   color: var(--gold-bright);
   background: rgba(212, 168, 83, 0.15);
   border-left-color: var(--gold-primary);
   font-weight: 600;
  }

  .toc-level-1 {
   font-family: var(--font-serif);
   font-size: 14px;
   font-weight: 700;
   color: var(--gold-primary);
   margin-top: 12px;
  }

  .toc-level-2 {
   padding-left: 18px;
  }

  .toc-level-3 {
   padding-left: 30px;
   font-size: 12px;
   opacity: 0.85;
  }

  .sidebar-footer {
   padding: 12px 16px;
   border-top: 1px solid var(--gold-border);
   font-size: 11px;
   color: var(--text-dim);
   display: flex;
   justify-content: space-between;
   align-items: center;
   background: rgba(8, 7, 5, 0.9);
  }

  /* ==========================================================================
       5. 右侧主视口与左右全填充流式阅读区 (Main Content)
       ========================================================================== */
  #main-viewport {
   flex: 1;
   height: 100vh;
   overflow-y: auto;
   padding-top: calc(var(--topbar-height) + 24px);
   padding-bottom: 90px;
   scroll-behavior: smooth;
  }

  #main-viewport::-webkit-scrollbar {
   width: 8px;
  }

  #main-viewport::-webkit-scrollbar-track {
   background: var(--bg-void);
  }

  #main-viewport::-webkit-scrollbar-thumb {
   background: rgba(212, 168, 83, 0.35);
   border-radius: 4px;
   box-shadow: 0 0 6px var(--gold-glow);
  }

  #main-viewport::-webkit-scrollbar-thumb:hover {
   background: var(--gold-primary);
  }

  /* 宽屏流式自适应全填充容器 */
  .content-container {
   width: 100%;
   padding: 0 44px;
   position: relative;
  }

  /* 装饰底框与折角金纹 */
  .stone-card-wrapper {
   position: relative;
   width: 100%;
   background: var(--bg-card);
   border: 1px solid var(--gold-border);
   border-radius: 6px;
   padding: 44px 52px;
   box-shadow: 0 10px 50px rgba(0, 0, 0, 0.9);
   backdrop-filter: blur(14px);
   -webkit-backdrop-filter: blur(14px);
  }

  /* 四角折角装饰 */
  .corner-decor {
   position: absolute;
   width: 14px;
   height: 14px;
   border-color: var(--gold-primary);
   pointer-events: none;
  }

  .corner-tl {
   top: -1px;
   left: -1px;
   border-top: 2px solid;
   border-left: 2px solid;
  }

  .corner-tr {
   top: -1px;
   right: -1px;
   border-top: 2px solid;
   border-right: 2px solid;
  }

  .corner-bl {
   bottom: -1px;
   left: -1px;
   border-bottom: 2px solid;
   border-left: 2px solid;
  }

  .corner-br {
   bottom: -1px;
   right: -1px;
   border-bottom: 2px solid;
   border-right: 2px solid;
  }

  /* ==========================================================================
       6. 视口从右向左渐显进入动效 (Right-to-Left Scroll Reveal Animation)
       ========================================================================== */
  .reveal-item {
   opacity: 0;
   transform: translateX(36px);
   filter: blur(4px);
   transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
    filter 0.6s cubic-bezier(0.16, 1, 0.3, 1);
   will-change: opacity, transform, filter;
  }

  .reveal-item.revealed {
   opacity: 1;
   transform: translateX(0);
   filter: blur(0);
  }

  /* ==========================================================================
       7. 阶梯式层次段落缩进与古籍排版体系 (Hierarchical Indentation)
       ========================================================================== */

  /* 篇章总括导言 (H1 紧随导言) */
  .p-lead {
   font-size: 1.05em;
   color: var(--text-bright);
   line-height: 1.9;
   margin: 16px 0 24px 0;
   padding: 12px 18px;
   background: rgba(32, 24, 15, 0.5);
   border-left: 3px solid var(--gold-primary);
   border-radius: 0 4px 4px 0;
   text-indent: 0 !important;
  }

  /* H2 小节段落 (标准首行缩进 2em，层次鲜明) */
  .p-h2-sub {
   text-indent: 2em;
   margin-bottom: 16px;
   color: var(--text-main);
   text-align: justify;
   padding-left: 4px;
  }

  /* H3 深层细则段落 (阶梯式向右缩进 20px，带有淡金导引线) */
  .p-h3-sub {
   margin-left: 20px;
   padding-left: 14px;
   border-left: 1.5px dashed rgba(212, 168, 83, 0.25);
   text-indent: 2em;
   margin-bottom: 14px;
   color: #dfd7c5;
  }

  /* H4/H5 极细段落 */
  .p-h4-sub {
   margin-left: 36px;
   padding-left: 12px;
   border-left: 1px solid rgba(212, 168, 83, 0.15);
   text-indent: 2em;
   margin-bottom: 12px;
   color: #cec5b1;
  }

  /* 普通未分类段落 fallback */
  .markdown-body p {
   margin-bottom: 16px;
   color: var(--text-main);
   text-align: justify;
  }

  /* ==========================================================================
       8. 修仙发光胶囊体系 (Xianxia Glowing Capsule Badges)
       ========================================================================== */
  .capsule {
   display: inline-flex;
   align-items: center;
   gap: 3px;
   padding: 1px 7px;
   border-radius: 4px;
   font-size: 0.88em;
   font-weight: 600;
   line-height: 1.45;
   white-space: nowrap;
   vertical-align: baseline;
   margin: 0 2px;
   border: 1px solid;
   box-shadow: 0 0 6px rgba(0, 0, 0, 0.4);
   transition: all 0.15s ease;
   text-indent: 0 !important;
  }

  .capsule:hover {
   transform: translateY(-1px);
   filter: brightness(1.2);
  }

  /* 1. 境界徽章胶囊 (Realm Badge) */
  .capsule-realm {
   border-color: #f5d076;
   background: linear-gradient(180deg, rgba(212, 168, 83, 0.28) 0%, rgba(142, 112, 51, 0.2) 100%);
   color: #fff4d1;
   box-shadow: 0 0 8px rgba(245, 208, 118, 0.35);
   font-family: var(--font-serif);
   font-weight: 700;
  }

  /* 2. 八品品质色彩胶囊 */
  .capsule-q1 {
   border-color: #d1d5db;
   background: rgba(209, 213, 219, 0.12);
   color: #f3f4f6;
  }

  /* 凡品 白 */
  .capsule-q2 {
   border-color: #4ade80;
   background: rgba(74, 222, 128, 0.15);
   color: #86efac;
   box-shadow: 0 0 6px rgba(74, 222, 128, 0.25);
  }

  /* 黄品 绿 */
  .capsule-q3 {
   border-color: #38bdf8;
   background: rgba(56, 189, 248, 0.15);
   color: #7dd3fc;
   box-shadow: 0 0 6px rgba(56, 189, 248, 0.25);
  }

  /* 玄品 蓝 */
  .capsule-q4 {
   border-color: #c084fc;
   background: rgba(192, 132, 252, 0.18);
   color: #e9d5ff;
   box-shadow: 0 0 8px rgba(192, 132, 252, 0.35);
  }

  /* 地品 紫 */
  .capsule-q5 {
   border-color: #fbbf24;
   background: rgba(251, 191, 36, 0.2);
   color: #fef08a;
   box-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
  }

  /* 天品 金 */
  .capsule-q6 {
   border-color: #fb923c;
   background: rgba(251, 146, 60, 0.22);
   color: #fed7aa;
   box-shadow: 0 0 10px rgba(251, 146, 60, 0.45);
  }

  /* 灵品 橙 */
  .capsule-q7 {
   border-color: #f87171;
   background: rgba(248, 113, 113, 0.25);
   color: #fecaca;
   box-shadow: 0 0 12px rgba(248, 113, 113, 0.5);
  }

  /* 圣品 红 */
  .capsule-q8 {
   border-color: #e879f9;
   background: linear-gradient(90deg, rgba(232, 121, 249, 0.25), rgba(56, 189, 248, 0.25));
   color: #fdf4ff;
   box-shadow: 0 0 14px rgba(232, 121, 249, 0.6);
  }

  /* 帝品 彩 */

  /* 3. 战斗属性胶囊 */
  .capsule-hp {
   border-color: var(--tone-jade-border);
   background: var(--tone-jade-bg);
   color: var(--tone-jade);
  }

  .capsule-mp {
   border-color: var(--tone-qi-border);
   background: var(--tone-qi-bg);
   color: var(--tone-qi);
  }

  .capsule-ad {
   border-color: rgba(245, 208, 118, 0.4);
   background: rgba(212, 168, 83, 0.15);
   color: #fde047;
  }

  .capsule-ap {
   border-color: rgba(56, 189, 248, 0.4);
   background: rgba(56, 189, 248, 0.15);
   color: #67e8f9;
  }

  .capsule-armor {
   border-color: rgba(251, 191, 36, 0.4);
   background: rgba(251, 191, 36, 0.12);
   color: #fde68a;
  }

  .capsule-mr {
   border-color: rgba(192, 132, 252, 0.4);
   background: rgba(192, 132, 252, 0.12);
   color: #d8b4fe;
  }

  .capsule-crit {
   border-color: rgba(248, 113, 113, 0.4);
   background: rgba(248, 113, 113, 0.15);
   color: #fca5a5;
  }

  .capsule-break {
   border-color: rgba(251, 146, 60, 0.4);
   background: rgba(251, 146, 60, 0.15);
   color: #fdba74;
  }

  /* 4. 百分比与增益/减益数值胶囊 */
  .capsule-gain {
   border-color: rgba(74, 222, 128, 0.45);
   background: rgba(74, 222, 128, 0.16);
   color: #86efac;
   font-weight: 700;
  }

  .capsule-loss {
   border-color: rgba(248, 113, 113, 0.45);
   background: rgba(248, 113, 113, 0.16);
   color: #fca5a5;
   font-weight: 700;
  }

  .capsule-scale {
   border-color: rgba(56, 189, 248, 0.45);
   background: rgba(56, 189, 248, 0.16);
   color: #7dd3fc;
   font-weight: 700;
  }

  .capsule-special {
   border-color: rgba(212, 168, 83, 0.4);
   background: rgba(212, 168, 83, 0.12);
   color: var(--gold-bright);
  }

  /* 5. 装备槽位胶囊 */
  .capsule-slot {
   border-color: rgba(212, 168, 83, 0.4);
   background: rgba(36, 28, 18, 0.85);
   color: var(--gold-bright);
   font-family: var(--font-serif);
   font-size: 0.85em;
  }

  /* ==========================================================================
       9. Markdown 标题与元素样式
       ========================================================================== */
  .markdown-body h1 {
   font-family: var(--font-serif);
   font-size: 26px;
   font-weight: 900;
   color: var(--gold-bright);
   letter-spacing: 1.5px;
   margin: 48px 0 20px 0;
   padding-bottom: 14px;
   border-bottom: 1px solid var(--gold-border);
   display: flex;
   align-items: center;
   gap: 12px;
   text-shadow: 0 0 24px var(--gold-glow);
  }

  .markdown-body h1:first-child {
   margin-top: 0;
  }

  .markdown-body h2 {
   font-family: var(--font-serif);
   font-size: 20px;
   font-weight: 700;
   color: var(--gold-primary);
   letter-spacing: 1px;
   margin: 36px 0 16px 0;
   padding-left: 12px;
   border-left: 3.5px solid var(--gold-primary);
  }

  .markdown-body h3 {
   font-family: var(--font-serif);
   font-size: 16.5px;
   font-weight: 700;
   color: var(--text-bright);
   margin: 28px 0 12px 20px;
   padding-left: 8px;
   border-left: 2px solid rgba(212, 168, 83, 0.5);
  }

  .markdown-body h4,
  .markdown-body h5,
  .markdown-body h6 {
   font-size: 14.5px;
   font-weight: 600;
   color: var(--gold-bright);
   margin: 20px 0 8px 36px;
  }

  .markdown-body strong {
   color: var(--gold-bright);
   font-weight: 700;
  }

  .markdown-body em {
   color: var(--tone-qi);

# 第一篇 核心哲学与顶层定位

## 1.1 产品定义
《道化太初》是一款以**服务端权威、高确定性离散事件推进（DES）、长线挂机放置**为核心的修仙 RPG 游戏。玩家绝大多数成长行为通过行动队列驱动，离线挂机与在线游玩具有完全等价的确定性数学模拟结果。

## 1.2 核心设计铁律
1. **怪我完全同构 (Monster-Player Isomorphism)**：怪物在领域模型中与玩家完全同构，共享同一套 14 基础属性池、技能装配逻辑、暴击破招对抗与抗性减伤公式，杜绝给怪物编写特殊隐藏补正。
2. **数值全域使用 `double` 精度**：所有属性、收益率、倍率、战斗伤害、时间与计数，计算与存储一律采用 IEEE 754 `double` 精度（百分比存储为 `double` 点数，1 点 = 1%），杜绝整数截断与精度损失。
3. **离散事件飞跃推进 (Discrete Event Simulation)**：游戏推进不依赖固定帧逐秒轮询，而是跳跃至下一个行动或战斗阶段的到期时间戳进行原子状态跃迁。
4. **长线数值闭环量化**：杜绝拍脑袋配表，全量技能、装备、丹药与怪物属性均由顶层数学模型（期望属性池、部位权重、质量预算）确定性推导。
5. **玩家三态生命周期（核心主旨，不可变更）**：角色在任意时刻仅处于以下三种状态之一，状态语义不再谈判——
   - **在线**：行动、战斗、旅行等全部运算在服务端实时进行，事件消息实时推送；
   - **离线挂机**：断线未达离线时长上限（收益封顶线）。收益按确定性规则持续产生，但实时调度降级为批量冷算——队伍中有人在线时全员强制实时（在线成员须收到真实事件推送）；全员离线时不再实时推进，可按小时级批次统一结算，批算任务在主服与计算节点之间按负载分配。未轮到批算即回线的玩家，由主服即时完全补算到当前时刻；
   - **彻底离线**：断线超过离线时长上限。有队伍者直接退队、行动队列整体暂停；进入该状态时完成一次覆盖「断线→上限边界」的收益补算（补算本身可走非实时派发），省得下次登录再即时补算；
   - **切换阈值**：在线 → 离线挂机存在连续离线宽限（当前口径 5 分钟），断开瞬间不得立即按离线挂机处置。离线时长上限（当前 48 小时）自断线时刻起算，服务端执行口径见总纲18 §14。
6. **本地开发兼容清零**：在内测开发期直接废弃历史兼容包袱，不保留双读双写与兼容适配器，以代码精简、架构清晰为第一原则。

# 第二篇 角色核心与常驻实体设计

> **文档版本**：v1.0.0 权威标准版  
> **更新时间**：2026-08-24  
> **所属体系**：游戏顶层哲学 / 角色领域模型 / 状态连续性 / 聚合模型与数值架构  
> **适用范围**：`src/Domain` 领域规则、`src/Server` 运行时调度、`src/Protocol` 协议 DTO、`frontend` 交互呈现与后续玩法拓展（秘境、PvP 等）

---

## 2.1 角色核心设计哲学（Core Philosophy）

### 2.1.1 统一常驻实体原理（The Unified Living Entity Principle）

在《道化太初》中，**修仙者角色是一个连续存在、拥有完整生命体征与修行底盘的“统一常驻实体”**。
- **拒绝孤立子系统**：彻底打破传统 RPG 将移动跑图、生产采集、打坐修炼、副本战斗、切磋竞技割裂为相互独立、状态互不连通的临时模块的做法。
- **同一性与守恒性**：无论是长途跋涉跨越大洲、在灵田采撷灵草、于丹房开炉炼药、在秘境斩妖伏魔，还是后续参与仙门切磋与玩家对决，**底层和设计上永远是这同一个角色实体在经历世间万象**。
- **状态不重置**：角色的气血、灵力、神识、增益（Buff）、负面状态（Debuff）、境界修为、随身储物与疲惫损伤，在时间轴上保持 100% 的连续演进，不因动作切换或界面跳转而凭空回满或重置。

```text
               ┌────────────────────────────────────────────────────────┐
               │           统一常驻修仙者实体 (Living Character Entity)   │
               ├────────────────────────────────────────────────────────┤
               │  • 生命体征：当前气血 (HP)、灵力 (MP)、技能/消耗品冷却   │
               │  • 修行底盘：境界等级、修为/底蕴/战斗经验、寿元、灵根、突破瓶颈 │
               │  • 常驻增益：各类丹药药效、祈福、伤病、负面 Debuff      │
               │  • 战备装配：主修心法、神通术法、六部位穿戴、技艺工具   │
               │  • 随身资产：储物袋物品、灵石、世界大地图驻留坐标       │
               └────────────────────────────────────────────────────────┘
                                      ▲
                                      │ 原地读写 / 连续演进 (In-Place Mutation)
               ┌──────────────────────┴────────────────────────┐
               │              世界与行为作用力 (World Forces)   │
               ├───────────────────────────────────────────────┤
               │  • 大地图旅行 (Travel)       -> 产生位移，消耗体魄/灵力 │
               │  • 洞府修炼 (Cultivation)   -> 吸纳灵气，增进修为     │
               │  • 灵野采集 (Gathering)     -> 消耗精力，产出天材地宝 │
               │  • 炉鼎炼丹 (Alchemy)       -> 消耗药材/灵力，产出灵丹│
               │  • 斩妖历练 (Combat)        -> 真实攻防损耗，结算战果 │
               │  • 秘境探索 / 切磋 (PvP)    -> 继承即时状态入场交锋   │
               └───────────────────────────────────────────────┘
```

### 2.1.2 行为与系统的“环境作用力”模型（Action as Environmental Force）

在系统交互模型上：
- **角色是状态的唯一容器**：所有的属性、资源与标记仅存储在角色实体上；
- **各类系统与行动是“外部作用力”**：移动、采集、炼丹、打坐、战斗并非持有独立生命周期的子程序，而是作为施加在角色身上的“环境作用力”。它们读取角色的当前状态作为前置判定，并在执行过程中将消耗、收益、创伤与增益**直接写回角色本身**。

### 2.1.3 确定性时空连续性（Deterministic Spatiotemporal Continuity）

- **离散事件推进（DES）的一致性**：无论玩家保持 WebSocket 实时在线、高频切换网络，还是完全断线离线长达数十小时，角色状态的推进逻辑完全一致。
- **离线快进等价于在线驻留**：服务端的确定性模拟引擎（`SimulationEngine`）基于时间轴推进。离线 8 小时的快进补算结果，与在线保持连接 8 小时逐秒计算得出的血量、灵力、修为与 Buff 衰减状态**完全等价、无缝自洽**。

---

## 2.2 角色多维体征与数据模型（Character Anatomy & Data Model）

角色实体在领域层聚合为一套完整自洽的数据网络，所有数值计算与持久化严格遵循 `double` 高精度规约。

### 2.2.1 精气神基础生命体征（Vital Signs）

| 体征属性 | 符号/字段 | 类型 | 设计定位与业务语义 |
| :--- | :--- | :--- | :--- |
| **当前气血** | `Hitpoints` | `double` | 玩家的生命底线。受战斗伤害、极恶环境侵蚀或特殊功法反噬损耗。脱战不自动回满；依靠自然回复属性、疗伤丹药或调息恢复；降至 0 即为力竭/阵亡。 |
| **当前灵力/法力** | `Manapoints` | `double` | 玩家体内周天运转的灵气储备。施展神通、催动法宝、御剑飞天、开炉控火等一切超凡行为的能量消耗。脱战不自动回满，需通过打坐纳气或回灵丹药补充。 |
| **回复周期余量** | `PlayerCombatState.RegenCarrySeconds` | `double` | 自然回复周期内不足一次结算的累计秒数。用于在低频/高频状态推演中保证回复计算无截断误差；现行实现战斗体征字段全部为 `double`，不再使用 long+Remainder 整数进位。 |
| **神通冷却** | `PlayerCombatSkillState.Cooldowns` | `IReadOnlyList<CombatSkillCooldown>` | 各已装配神通的剩余冷却秒数与吟唱状态，跨行动与脱战后持续倒计时，不受动作切换中断。 |
| **消耗品槽位冷却**| `AutoUseSlotState.CooldownUntilUnixSeconds` | `double` | 各自动使用槽位的绝对冷却就绪时间戳（Unix 秒）。 |

### 2.2.2 修仙境界与成长四池（Cultivation & Realm）

- **十一大境界**：凡俗、练气、筑基、金丹、元婴、化神、炼虚、合体、大乘、渡劫、飞升（涵盖修行四期；数值底座见 `总纲` 第十一篇）。其中凡俗（Lv 1~18）下含 18 个有名小境界：凡胎、炼皮、锻骨、易筋、洗髓、养气、通脉、瑶光、开阳、玉衡、天权、天玑、天璇、天枢、宗师、大宗师、临渊、叩天门；凡胎、叩天门为小境界名，不再是大境界。
- **成长四池（`PlayerProgression` / `PlayerLoadout` 字段清单）**：
  - **修为（`Progression.Experience`）**：当前层突破计量条，即顶部进度条；以配表 `expToNext[realmLevel]` 封顶，突破时清零；
  - **底蕴（`Progression.Foundation`）**：修为满层后继续获得的修为 100% 沉淀为底蕴；修为未满层时每 1 点底蕴兑换 1 点额外修为（单笔最高 3 倍，底蕴耗尽即止），突破不清空；
  - **战斗经验（`Progression.CombatExperience`）**：战斗击杀与讨伐收益按基础量入账，打坐修炼等非战斗修行不增加战斗经验、不受任何加成；参与命中/闪避对抗修正（口径见 [第七篇 §7.7.6](./07-战斗数值与内视规约.md)），突破不清空；
  - **六维经验（`Loadout.CoreAttributes`）**：体魄/经脉/力道/根骨/身法/神识各自经验（`StaminaExp` 等六字段），等级由 `RootAttributeCurve` 经 `RealmProgressionCatalog` 派生的 381 点成本表导出（曲线口径见 [第三篇 §3.2.2](./03-修仙境界与四乘区数值底座.md)）。
- **总修为（`Progression.LifetimeExperience`）**：历史修为类收益总量（增幅后口径，含满层转底蕴部分），单调递增永不清零；为前端「总修为」悬浮条数据源。
- **突破瓶颈状态（IsPendingBreakthrough）**：当修为达到当前境界上限（`expToNext`）时触发，修为停止增长、溢出沉淀为底蕴，必须完成突破心魔、渡劫或服用破境丹药方可晋升下一小境界。
- **寿元与道龄（Lifespan & Age）**：依据境界决定寿元上限，随时间与特定禁术消耗自然流逝。

### 2.2.3 核心先天与后天属性（Attributes Matrix）

> **量化落地口径**：战斗侧的属性量化以 [战斗设计 §7.5 六维根基](./07-战斗数值与内视规约.md)（体魄/经脉/根骨/力道/神识/身法）为准；本节为先天/后天能力的概念分层，生活与探索维度在对应系统设计时归入同一份角色底盘，不另建平行属性模型。

角色的战斗与日常行为能力统一基于以下四维与五行底盘展开：
1. **气血与体魄（Constitution）**：决定基础生命上限、物理防御、负重能力以及对恶劣环境的耐受力；
2. **灵力与神识（Divine Sense）**：决定法力上限、法术暴击、命中率、大世界侦测范围与高阶采集/炼丹感知精度；
3. **悟性与心境（Perception & Mind）**：影响神通领悟研读速度、打坐修炼吸纳效率与破境成功率；
4. **身法与遁速（Agility）**：影响战斗行动速度、先手闪避、大地图御剑飞行与长途跋涉耗时；
5. **五行灵根（Five-Element Roots）**：金、木、水、火、土五行亲和度，直接决定对应属性神通的增减伤（五行增伤/五行减伤亲和，点数见 [第七篇](./07-战斗数值与内视规约.md) §7.7.5）。

### 2.2.4 武道装配与战备底盘（Loadout & Equipment）

- **功法体系（Dynamic Kungfu Slots）**：
  - **首位核心主修心法（Internal Core）**：常驻被动心法基座——装配即生效、不进入施放序列；定位为**经验获取调整器**：六维经验非守恒乘率重分配（主升/献祭塑形）＋参悟等级放大总量效率＋修为增减点＋常驻面板效果，字段与首批清单见 [第五篇 §5.3](./05-技能神通与秘籍残卷体系.md)；
  - **动态扩展神通槽位（Active Spells）**：随境界提升逐步解锁的战斗与辅助主动法术序列。
- **六大装备部位（Six Equipment Slots）**：
  - `weapon`（武器/神兵）、`head`（头部/道冠）、`armor`（衣服/宝甲）、`legs`（下装/胫甲）、`boots`（鞋履/行云履）、`trinket`（饰品/法宝灵佩）。
  - 各部位遵循严格的数值预算守恒模型，提供基础属性、增减伤修饰与附加词缀。
- **生活技艺工具槽位（Artisan Tool Slots）**：
- 预留桃木铲、灵火炉、精铁镐等生活生产专属工具，直接赋能采集与生产行为。

### 2.2.5 随身空间与大世界坐标（Spatial Presence & Storage）

- **随身储物与灵石（AssetWallet + economy 关系表）**：材料、丹药、法宝、战利品与灵石等随身资产**不放入玩家聚合分段**，统一由运行时 `AssetWallet` 钱包视图 + `economy.player_asset_balances` / `economy.player_asset_instances` 关系表承载，支持全自动消耗、堆叠与事务内原子扣减。灵石为修仙界通用硬通货，用于坊市交易、传送法阵消耗或阵法驱动。
- **大世界驻留节点（`PlayerWorldState`）**：记录角色当前所处的地理节点/边与坐标（如“云来集”、“青云门山门”等），位移动作会真实改变该坐标。

## 2.3 状态连续性与跨玩法流转（Cross-System State Continuity）

### 2.3.1 跨行为状态无缝穿透（Seamless State Penetration）

角色状态在各种行为切换之间**完全透明继承**，不存在任何形式的状态重置边界：

```text
 场景 A (历练受伤 -> 日常调理):
 ┌────────────────┐ 战斗结算扣减至 20% HP ┌────────────────┐ 动作队列自动轮转 ┌────────────────┐
 │ 幽林斩妖 (战斗) │ ───────────────────> │ 角色实体保留残血 │ ───────────────> │ 打坐调息 / 嗑药 │
 └────────────────┘                      └────────────────┘                 └────────────────┘
                                                                                    │ 真实消耗丹药/时间
                                                                                    ▼
                                                                            ┌────────────────┐
                                                                            │ 状态逐步恢复饱满 │
                                                                            └────────────────┘

 场景 B (日常准备 -> 突发切磋/秘境):
 ┌────────────────┐ 炼丹消耗 50% 灵力     ┌────────────────┐ 直入秘境/切磋   ┌────────────────┐
 │ 洞府炼丹 (制造) │ ───────────────────> │ 角色实体灵力半空 │ ───────────────> │ 以半蓝状态迎敌  │
 └────────────────┘                      └────────────────┘                 └────────────────┘
```

1. **战后创伤保留**：历练脱战后，血量与法力保持结算时的即时值。若玩家带伤切入采集或跑图，角色依然处于虚弱状态，若遭遇野外突发危险将承担更高风险。
2. **日常消耗穿透至战斗**：长途赶路御剑消耗的灵气、炼丹损耗的心神，若未及时打坐或服丹补充，直接作为战斗入场时的初始状态。
3. **装备与属性实时生效**：任何时刻更换装备、升级功法，其带来的属性变更（如最大生命上限提升、抗性变化）即刻作用于实体，并按比例或绝对值平滑过渡。

### 2.3.2 增益/减益（Buff/Debuff）的实体级统一定时衰减与多维共鸣

- **实体级挂载**：所有 Buff（无论是服用灵丹、阵法加持、环境影响还是受到的诅咒中毒）统一挂载在角色的 `Buffs` 列表中，记录其绝对过期时间戳（`ExpiresAt`）。
- **统一时间轴演进**：Buff 的生命周期由 `SimulationEngine.AdvanceTo` 模拟时间推进驱动，在跨越移动、打坐、炼丹与战斗时**连续倒计时，绝不因动作切换而刷新或提前清除**。
- **多维跨界效能**：单一 Buff 具备穿透多系统的能力。例如：
  - 一枚兼具身法与攻速增益的灵丹，在跑图时缩短位移耗时，在进入战斗时则直接提升攻击频次；
  - 一种降低全属性的剧毒 Debuff，既在战斗中削弱输出，又在炼丹时降低成丹概率，在打坐时增加走火入魔风险。

### 2.3.3 战斗脱战真实继承与 1 HP 濒死复苏机制（Post-Combat Retention & Respawn）

- **常规脱战继承**：战斗胜利或主动脱战时，角色的剩余气血、剩余灵力、技能冷却时间 1:1 原地写回 `CombatResources`，不予补满。
- **阵亡与 1 HP 濒死复苏**：
  - 当角色在战斗或极端环境中气血降至 0（`Hitpoints <= 0`）判定为阵亡/力竭；
  - 角色不会被销毁或硬性永久死亡，而是触发**脱战濒死复苏机制**：脱战后生命值自动恢复为 **1 点（1 HP）**；**灵力持续自然回复并保留**（死亡期间 MP 回复不中断，与 `总纲` §7.9 口径一致）；
  - 濒死状态下，高危险行动（如高阶秘境、斩妖历练）将因前置体征不足而受阻（Blocked），促使玩家安排休整或自动消耗补血药物。

### 2.3.4 秘境探索与切磋 PvP 的真实入场机制（Real-State Entrance for Dungeons & PvP）

> **实现状态**：本节为**规划意图，尚未落地**。当前战斗为 `CombatExpeditionState` 远征状态机，`BattleSnapshot`、秘境与 PvP 在代码中均无实现；落地时必须遵守下列设计红线。

- **无单独虚拟镜像**：后续拓展的秘境探索、宗门战或切磋对决（PvP），**严禁创建脱离主实体的“临时满状态克隆体”**；
- **即时快照切片**：入场交锋时，系统基于角色的即时物理状态（当前 HP/MP、当前装备、当前生效 Buff）生成当前局的战斗快照（`BattleSnapshot`）；
- **交锋结果闭环写回**：战斗中消耗的法宝耐久、药品、受到的伤病以及最终剩余气血，结算后直接原地反哺写回玩家常驻实体，维持全宇宙状态唯一性。

## 2.4 行动队列与物理状态互锁（Action Queue & Physical Interlocking）

### 2.4.1 前置体征准入条件（Pre-condition Gating）

每个行动的启动均需对角色的即时物理状态进行前置校验（`CanStartAction`）：
1. **生命条件**：气血必须处于健康存活状态（`Hitpoints > 0`），濒死（1 HP）且无回复手段时禁止开启高烈度历练；
2. **灵力条件**：高阶炼丹、御剑远行需满足最低启动灵力门槛，灵力枯竭时无法催动；
3. **空间条件**：角色的世界驻留节点必须在行动的允许可用节点集合内（`AvailableNodeIds`）；
4. **材料与道具条件**：随身储物袋必须包含该动作所需的全部输入原料（`Inputs`）。

### 2.4.2 动作阻断与自动跳过机制（Action Blocked & Queue Rotation）

- **条件不满足时的阻断**：当队列头部动作因角色当前状态（如灵力不足、原料耗尽、重伤濒死）无法启动时，状态标记为 `ActionStatus.Blocked`。
- **循环模式下的安全空转（`LoopEnabled`，默认关闭）**：
  - 新建角色与默认偏好中设为关闭（`false`），避免新手玩家因初始默认循环导致动作无法排空、产生动作停不下来的误导；玩家可随时在顶栏按需勾选开启；
  - 若开启队列循环（`LoopEnabled`），阻断的动作被安全移至队尾，尝试执行下一个可用动作；
  - 若全部排队动作均受阻，队列进入**安全空转期**。在此期间，角色进入自然休整状态，持续享受生命与灵力自然回复，直至体征恢复或玩家介入调整。
- **自动移动准入修正（`AutoTravelEnabled`，默认关闭）**：
  - 新建角色与默认偏好中同样设为关闭（`false`），避免开轮地点不符时发生未预期的自动赶路插队引起误导；
  - 行动入队时把当前所在节点记入意图锚点（`ActionIntent.AnchorNodeId`）；
  - 队首行动开轮时若地点校验不通过（当前不在该行动允许节点集合内，含旅途中），且自动移动已开启、锚点仍在允许集合内且世界图可达，则不再落入 Blocked，而是把一条 `world.travel` 插队至队首自动赶往锚点，到达后原行动按挂起语义恢复执行；
  - 锚点缺失、锚点已被配表移出允许集、或路径不可规划时，回落原 Blocked 语义；材料不足等非地点原因恒不触发自动移动；
  - 与 `LoopEnabled` 叠加可构成跨节点挂机回路：A 地行动完成轮转 → B 地行动地点不符 → 自动赶往 B → 依此循环；
  - 自动移动只发生在开轮准入一刻，已 Blocked 的停泊行动不追溯解套；
  - 讨伐类战斗行动（`ExecutionKind=CombatEncounter`）不走自动移动回锚点：讨伐跟随玩家驻留地点，当前节点不可执行时按「条件不足」阻断（详见总纲 08 篇讨伐地点语义）。

### 2.4.3 四大动作类型自动消耗品槽位与动作时间池

为保障全常驻实体在无人值守时也能平滑维持生命体征与修炼增益，系统提供完善的消耗品自动使用体系：
- **四大分类独立槽位（4 类 × 3 槽）**：修炼（`Cultivation`）、探索（`Exploration`）、炼丹（`Alchemy`）、战斗（`Combat`）各自拥有独立的 3 个自动消耗品槽位（`AutoUseSlotState`）；
- **持续消耗品 300s 动作时间池机制**：
  - 开启 1 瓶持续型丹药时，消耗 1 件物品并获得 **300 秒有效动作时长**（`RemainingDurationSeconds = 300.0`）；
  - 该时长仅在角色**实际执行对应类型动作时按秒精准扣除**；
  - 动作中途切换或暂停时，剩余秒数精确保存在槽位中，绝不凭空蒸发；
  - 透支免单与切槽惩罚：剩余时间不足以覆盖单次动作时，允许该次动作享受完整增益且不提前吃药；若玩家在尚有剩余时长时主动更换绑定的丹药，旧丹药剩余时长清零（切槽惩罚）。

### 2.4.4 队列级暂停与一键清空（Queue Pause & Clear-All）

- **队列停泊开关（`QueuePaused`）**：`PlayerSettingsState` 玩家级开关，与 `LoopEnabled`/`AutoTravelEnabled` 同族，随 settings 分段持久化与下发，客户端经 `queue.configure { paused }` 切换；
  - 暂停时行动队列整体冻结——计时进度、战斗/搜寻/复活/斗法相位、旅行推进、斗法撮合全部不消费墙钟；队列结构与进度原样保留，恢复后按原进度继续；
  - 墙钟资源窗口照常结算（自然回复、Buff 到期、自动使用冷却、暂存物品、道龄与 48h 离线截断），与 Blocked「时间照走、行动停走」同族；暂停不购买任何额外收益，只是不执行动作；
  - 在线与离线补算语义一致（服务端权威）；暂停期间入队、插队（`world.travel`）与调序照常受理，仅不推进。
- **一键清空（`queue.clear`）**：先补算到当前时刻，队首若为斗法按弃战判负（`ApplyDuelForfeit`，与单项移除同语义）；全部实例经统一队列变更管线归档行动账本、死亡远征恢复最低气血，单次版本提交并清理队首战斗实体；高危操作，前端必须二次确认。

## 2.5 技术架构与系统落地映射（Technical Architecture & Implementation）

在底层实现上，“统一常驻实体”由**纯领域聚合根 + 确定性离散事件引擎 + ECS 分片 Fiber 单写者所有权**三层基座稳固支撑。

```text
 ┌─────────────────────────────────────────────────────────────────────────┐
 │              服务端运行时宿主 (EcsGameRuntime / EcsWorldShard)           │
 │   • 单写者调度：玩家按稳定哈希路由到 ECS 分片，推进在分片 YuoFiber        │
 │     内串行执行；EcsPlayerRuntimeAdapter 玩家级 gate 保证跨边界串行；      │
 │     所有权经 game.player_runtime_leases 租约维持                          │
 │   • 在线实体映射：playerId -> YuoEntity(ECS 组件集)；命令边界经           │
 │     MutatePlayer 通道将组件重建为 PlayerAggregate、执行领域操作、回写组件 │
 │   • 持久化：脏分段经 latest-only 刷盘队列异步写入 PostgreSQL              │
 └────────────────────────────────────┬────────────────────────────────────┘
                                      │ 持有并驱动
                                      ▼
 ┌─────────────────────────────────────────────────────────────────────────┐
 │                      领域聚合根 (PlayerAggregate)                        │
 │   • POCO 纯数据模型，无任何外部框架/IO/数据库依赖                          │
 │   • 按 PlayerSectionKind 八分段聚合                                      │
 │     (Progression/World/Combat/Buffs/Loadout/Settings/ActionQueue/Duel)   │
 │   • 资产走 AssetWallet+economy；细粒度脏段追踪 MarkDirty(PlayerSectionKind)│
 └────────────────────────────────────┬────────────────────────────────────┘
                                      │ 作为唯一输入输出
                                      ▼
 ┌─────────────────────────────────────────────────────────────────────────┐
 │               确定性模拟引擎 (SimulationEngine.AdvanceTo)               │
 │   • 时间片推进 (cursor -> target)，按行动完成边界/微步事件向前演进         │
 │   • 统一执行 Buff 到期结算、行动推进结算、自然回复结算                     │
 │   • 产生增量事件日志与脏分段标记 (DirtySections)                           │
 └─────────────────────────────────────────────────────────────────────────┘
```

### 2.5.1 领域层：`PlayerAggregate` 聚合根

- `PlayerAggregate`（定义于 `src/Domain/Player/PlayerAggregate.cs`）是角色全部状态的**唯一权威数据载体**；
- 内部按 `PlayerSectionKind` 八分段收敛 `PlayerProgression`、`PlayerWorldState`、`PlayerCombatState`（含 `PlayerCombatSkillState`）、`PlayerBuffState`、`PlayerLoadoutState`、`PlayerSettingsState`、`PlayerDuelState` 与行动队列；资产（灵石、物品、装备实例）不进聚合，统一由 `AssetWallet` + `economy.*` 关系表承载；
- 纯 POCO 设计使得任何状态操作都可以被轻松单元测试、离线重放和确定性断言。

### 2.5.2 模拟层：`SimulationEngine` 确定性推进

- `SimulationEngine.AdvanceTo` 是世界状态演进的唯一入口；
- 引擎按离散事件边界切分时间片，在推进循环中统一执行：
  1. Buff 到期结算：推进并失效到期 Buff；
  2. 行动推进与状态转移（根据行动类型由 SimulationEngine 执行挂机产出结算、战斗状态机推进或位移处理；技能施放由 `CombatSkillEngine` 结算）；
  3. 自然回复结算：读取基础属性表及明确加成计算后的回复属性，结算自然气血与灵力回复；不得由生命/灵力上限按固定比例生成回复值，周期口径见 [战斗规约 §7.9.2](./07-战斗数值与内视规约.md#792-自然回复属性由基础属性表配置)；
  4. 产出结算与脏分段标记汇总。

### 2.5.3 运行时层：`EcsGameRuntime` + `EcsWorldShard` + `EcsPlayerRuntimeAdapter`

- **单写者并发模型（Single-Writer）**：每个玩家在内存中是某个 `EcsWorldShard` 内的 `YuoEntity`（按 `PlayerId` 稳定哈希路由），其推进与命令在分片 `YuoFiber` 内串行执行，`EcsPlayerRuntimeAdapter` 的玩家级 `SemaphoreSlim` gate 兜底跨边界串行，从根本上杜绝了多线程并发读写导致的“状态撕裂”；
- **命令通道**：业务命令经 `EcsWorldShard.MutatePlayer` 将 ECS 组件重建为 `PlayerAggregate` 执行领域操作并整体回写，脏段差集驱动回执与推送；
- **冷热无缝切换**：玩家离线后实体休眠，脏分段经 latest-only 刷盘队列异步写入 PostgreSQL section 表。玩家重连时，从 `PlayerStateHead` + 各 `PlayerSectionSnapshot` 恢复组件并由确定性推进补算至当前时刻，状态与一直在线完全无差。

### 2.5.4 网络层：`ProtocolSnapshotMapper` 增量同步

- 服务端通过 `ProtocolSnapshotMapper` 将演进产生的脏分段（`DirtySections`/`PlayerSectionKind`）打包为轻量级快照/增量 DTO（透传当前激活 `GameDataCatalog`）；
- 前端仅针对发生变动的局部数据（如气血微调、Buff 列表变动、背包变动）进行响应式更新，绝不整体重建面板，确保高频状态流转下的流畅交互体验。

---

## 2.6 设计红线与扩展准则（Design Redlines & Guidelines）

为确保“统一常驻实体”核心哲学的长久纯粹性与系统健壮性，后续所有系统开发与玩法扩展必须严格遵守以下红线：

1. **【严禁设立影子角色】**：任何新玩法（秘境、竞技场、帮派战、大世界事件等）不得为玩家创建独立的“临时战斗载荷”或“脱离主实体的副角色”，必须直接引用和修改主 `PlayerAggregate`。（注：秘境/竞技场/PvP 均为规划意图，尚未落地。）
2. **【严禁跨玩法免费重置】**：严禁在进入或退出某个玩法时，私自执行“气血回满”、“灵力回满”、“重置所有技能冷却”等破坏状态连续性的破坏性操作。一切恢复必须有法可循（依赖丹药、打坐、技能或自然回复属性）。
3. **【严禁使用浮点截断】**：所有与时间、资源、属性、收益率相关的计算与存储必须统一使用 `double` 精度，微量回复必须走 `RegenCarrySeconds` 回复周期余量累加机制，严禁因整数截断导致长期挂机收益丢失。
4. **【闭环演进原则】**：任何新增的作用力（新动作类型、新环境效果、新交互机制），必须遵循“从 `PlayerAggregate` 读取条件 -> 计算影响 -> 原地写回 `PlayerAggregate` -> `MarkDirty(PlayerSectionKind.Xxx)`”的标准闭环管线。
5. **【确定性守恒】**：任何状态转移逻辑必须是纯函数的、无副作用的确定性计算，严禁在状态演进代码中调用系统随机数（必须使用确定性种子生成器）、系统时钟（必须使用传入的时间戳参数）或进行异步/外部 I/O 操作。

# 第三篇 修仙境界与四乘区数值底座

## 3.1 境界三层轴、等阶与品质架构
游戏建立**横向等阶（Tier T1~T12，四修行期）**与**纵向品质（Quality 八品）**交织的修仙体系。

### 3.1.1 境界三层展示轴（大境界 · 境界阶段 · 小境界）
- **小境界**：境界等级轴 Lv.1~127，每级一个名号，是突破进度的最小单位；
- **境界阶段**：大境界内的分段徽章单字——凡俗段为「武（Lv1~6）/ 玄（Lv7~12）/ 天（Lv13~18）」，修真段每个大境界 12 层内分「初（1~3 层）/ 中（4~6 层）/ 后（7~9 层）/ 极（10~12 层）」；
- **大境界**（共 11 个）：凡俗（Lv1~18）→ 练气、筑基、金丹、元婴、化神、炼虚、合体、大乘、渡劫（各 12 层，Lv19~126）→ 飞升（Lv127）。凡俗段 18 级的小境界名依次为：凡胎、炼皮、锻骨、易筋、洗髓、养气、通脉、瑶光、开阳、玉衡、天权、天玑、天璇、天枢、宗师、大宗师、临渊、叩天门；修真段每大境界 12 层命名为「X 一层~X 九层 → X 巅峰 → X 大圆满 → 半步 Y」（半步 Y 为下一大境界的破境过渡档）。
- **一体化徽章表现**：`[大境界牌匾框] ◇境界阶段棱形框◇ (小境界胶囊框)`（如 `[练气] ◇极◇ (练气巅峰)`，悬浮展示精准等级 Lv）。

### 3.1.2 等阶（T级）数值内容轴
等阶 T1~T12 是装备套、技能、丹药与怪物的数值底座与产出分档轴，锚点等级为 `1/18/30/42/54/66/78/90/102/114/126/127`（`BaseAttributeCatalog.TierAt`：不超过当前等级的锚点个数即等阶）。等阶边界与大境界错开一层：每个等阶以「破境过渡小境界」开篇——叩天门开启 T2，半步筑基开启 T3，……，半步飞升开启 T11——覆盖到对应大境界大圆满为止。即 T2 对应练气内容档、T3 对应筑基档、T10 对应渡劫档、T11 半步飞升、T12 飞升。

```text
┌────────────────────────────────────────────────────────────────────────┐
│                        全 12 等阶四修行期全景架构                       │
├────────────────────────────────────────────────────────────────────────┤
│ 前期 (凡俗期)   : T1 (Lv1~17) ──> T2 (叩天门 + 练气档 Lv18~29)          │
│ 中期 (气基丹期) : T3 (筑基档) ──> T4 (金丹档) ──> T5 (元婴档)           │
│ 后期 (婴神虚体) : T6 (化神档) ──> T7 (炼虚档) ──> T8 (合体档) ──> T9 (大乘档) │
│ 大后期 (仙道真源): T10 (渡劫档) ──> T11 (半步飞升) ──> T12 (飞升真仙)   │
└────────────────────────────────────────────────────────────────────────┘
```

- **八大品质等级**：Q1 凡品 (白 1.00x) $\to$ Q2 黄品 (绿 1.15x) $\to$ Q3 玄品 (蓝 1.35x) $\to$ Q4 地品 (紫 1.60x) $\to$ Q5 天品 (金 1.90x) $\to$ Q6 灵品 (橙 2.30x) $\to$ Q7 圣品 (红 2.80x) $\to$ Q8 帝品 (彩 3.50x)。
- **怪物生命层次**：妖兽 (Minion 80%) / 精英 (Elite 120%) / 妖王 (Boss 150%)，作用于同级怪物相对**期望玩家面板**（`levelExpected[].finalExpected`，每级锚点）的全属性倍率，非裸 `baseAttributeAnchors` 底座（详见第七篇）。
- **系统与世界观解耦说明**：12 等阶是底层数值、内视面板与装备穿戴的统一系统模型；剧情对白与世界观文案使用“未入门/引炁/炼炁/凝炁”沉浸式口径，两者各司其职。

## 3.2 核心属性四独立乘区归一化数学模型
本篇只定义乘区结构与六维身份，**公式正本与预算折算法则不在本篇重复**：
公式、属性预算折算、期望六维点口径见 [`11-数值量化模型集.md` §11.1.2](./11-数值量化模型集.md)，
乘区的运行时消费方为 `PlayerAttributeResolver`（读 `config/game-data/expected-attributes.json`）。

> 六维每点**同时**提供固定值与百分比：固定值并入基础池后被六维%乘区放大，再叠装备 `flatStats`、被装备%/Buff% 乘区放大——这才是本篇强调的顺序，数值见 §3.2.2。

### 3.2.1 基础数值池总表 (`BaseFlatAnchors` - 乘区 1 底座)
> **动态派生与程序化缩放规则（前三后二，无倒挂）**：为了强化凡俗期境界升级获得感，代码在解析 `baseAttributeAnchors` 时程序化派生实际底座：Lv.1 保持基准不变；Lv.18 增量按 3.0 倍放大（生命 +792、物攻 +30、护甲 +18，Lv.18 达 HP 892 / AD 40 / Armor 28）；Lv.18 之后（修真段）各锚点相对于 Lv.18 的属性增量按 2.0 倍累进放大（如 Lv.30 达 HP 1,852 / AD 100，Lv.66 达 HP 18,460 / AD 764），确保单调递增并彻底杜绝跨大境界倒挂。

全 12 等阶锚点数值（HP/MP/AD/AP/护甲/法抗/命中/闪避/暴击/免爆/破招/化解）**不在本篇重复罗列**：
权威表为 [`11-数值量化模型集.md` §11.1.4.1 基础数值池总表](./11-数值量化模型集.md)，
配表真源为 `config/game-data/expected-attributes.json` 的 `baseAttributeAnchors`（12 个等级锚点）。
本篇只定义该底座的派生规则与四乘区地位，数值一律以上述两处为准。

### 3.2.2 基础六维资质换算规约 (初始 0 点，每点提供固定值 + 百分比双加成)
六维等级由境界修为表派生的**单点成本表**导出（0 级起算，初始经验 0）：每维上限 **381 点**（127 级境界 × 3 点/级）。记 `B[i] = expToNext[max(0, i−1)]`（跨入第 i+1 级消耗的那格修为条，`B[0]` 取第一条），升到第 p 点（1≤p≤381）所需经验 = `B` 在 `t=(p−1)/3` 处的线性插值 `lerp(B[⌊t⌋], B[⌈t⌉], frac(t))`——一级境界对应三点、三点合计约三倍该级修为条，相邻档间平滑过渡不出现三连同价。单维累计至 3Lv 点 ≈ `3×ΣexpToNext[1..Lv−1]`（境界累计修为的 ~3.1 倍，Lv127 收敛 3.05×），使六维成本与修为通胀永远同节奏。每点六维为映射属性**同时**提供固定值与百分比加成：
- **体魄 (Tǐ Pò)**：`1% +12 生命上限`、`1% +1 物理护甲`、`1% +0.5 生命自动回复`
- **经脉 (Jīng Mài)**：`1% +7 灵力上限`、`1% +1 法术抗性`、`2% 灵力自动回复`
- **根骨 (Gēn Gǔ)**：`1% +12 生命上限`、`1% +7 灵力上限`、`1% +1 化解`
- **力道 (Lì Dào)**：`1% +1 物理攻击`、`1% +1 暴击等级`、`1% +1 破招等级`
- **神识 (Shén Shí)**：`2% +2 术法攻击 (术法×2)`、`1% +1 命中等级`
- **身法 (Shēn Fǎ)**：`1% +1 闪避等级`、`1% +1 免爆等级`、`1% +1 化解`

### 3.2.3 双流派对偶配点法则
1. **🗡️ 物理系 (Physical)**：走 **`1 AD : 1 暴击 : 1 破招`**，破招触发**双倍暴击与双倍命中**；普攻为全流派统一物理模型（1.0s 基准 ×(1-ATR)×(1-攻速成长)，满成长 0.25s 极限间隔、`100%→200%` AD），结合重斩/贯星等高倍率单体绝技，主打极致 Boss 斩杀。
2. **🔮 法术系 (Magic)**：**AP 仅供技能结算**（普攻与物理系完全统一）；高法攻面板在平方减伤公式下**天然强势破防**，配合 AP 群攻技能与掌心雷（0CD 填充技）主打范围清场。

# 第四篇 装备标准化预算与锻造升阶体系

## 4.1 装备两段式数据模型与部位预算权重
装备采用**两段式显式配置**（`baseStatRatios` 基础属性百分比增幅 + `flatStats` 固定值）：
- 百分比点数类属性（技能增幅、物理伤害增幅、治疗提升、威胁、冷却缩减等 `*Points` 键）**一律放入 `flatStats`**，与固定值同受强化缩放；装备数据模型不再使用 `specialMechanics` 特效块。
- **白板预算口径**（沿用数值设计规范的量化体系）：基础属性每 1 点 = 1 点预算，百分比每 1% = 1 点，生命/灵力回复每 1 点 = 4 点；`*Points` 增伤、威胁、治疗、冷却等特殊点数**不计入白板预算**，属人工平衡，参考同阶同类装备取值。
- **全套 6 槽位 6.0x 乘区严格守恒**：
  $$\text{全套总预算} = B_T \times 6.0 \times Q_{\text{mult}}$$

| 装备槽位 | 部位定位 | 部位权重乘区 | T1 初始预算 ($B_1=28$) | T1 进阶预算 ($B_9=34$) | T2 叩天门预算 ($B_2=40$) | 核心主属性倾斜 |
| :--- | :--- | :---: | :---: | :---: | :---: | :--- |
| **武器 (Weapon)** | 核心输出 | **1.4×** | **40 点** | **48 点** | **56 点** | 物理/术法攻击、命中、破招 (剑/刀/杖/琴等) |
| **衣服 (Body/Armor)** | 核心生存 | **1.4×** | **40 点** | **48 点** | **56 点** | 生命值、物理护甲、法术抗性、对应输出增幅 |
| **头盔 (Head)** | 防护与灵能 | **0.8×** | **22 点** | **27 点** | **32 点** | 生命/灵力上限、护甲/法抗、命中、对应输出增幅 |
| **下装 (Legs)** | 均衡防御 | **0.8×** | **22 点** | **27 点** | **32 点** | 护甲/法抗、生命/灵力上限、对应输出增幅 |
| **副手 (Off-Hand)** | 四路线任选 | **0.8×** | **22 点** | **27 点** | **32 点** | 物理输出 / 法术输出 / 生存 / 冷却与治疗 |
| **饰品 (Accessory)** | 特殊与回复 | **0.8×** | **22 点** | **27 点** | **32 点** | 攻击增幅、暴击、生命/灵力自动回复 |
## 4.2 强化成长模型 (+20 满级)
$$\text{强化总倍率} = 1.05^{\text{强化等级}} \quad (\text{每级指数提升 } \times 1.05)$$
强化为指数成长：白板基础属性（`baseStatRatios` 与 `flatStats` 全部键，含点数键）每级乘 1.05，强化至 +20 满级时总属性约为白板的 **2.653×（+165%）**。

## 4.3 防具双防配比与输出装备抗性固定化
- **物理防御/生存套**（头/衣/裤）：主护甲取原预算 80%，剩余 20% 转为法术抗性；固定值全量倾斜生命上限与双防；每件附带 **+2% 物理伤害减免**（`physicalDamageReductionPoints: 2`）与 **威胁增幅**（衣服 +150%~+200%、头腿各 +100%~+150%）。
- **物理伤害/输出套**（头/衣/裤）：纯物攻百分比，不再配置微量百分比护甲（低基数下百分比抗性无效，改为纯固定值护甲）；固定值倾斜物攻、命中、暴击、生命与微量固定护甲；每件附带 **+2% 物理伤害增幅**（`physicalDamageBonusPoints: 2`）。
- **法术伤害/输出套**（头/衣/裤）：对齐物理输出套构成，纯法攻百分比，不再配置百分比双抗；固定值倾斜法攻、命中、暴击、生命与微量固定法抗；每件**同时**附带 **+2% 术法伤害增幅**（`spellDamageBonusPoints: 2`）与 **+2% 技能增幅**（`skillBonusPoints: 2`），两项同值并列。
- **法系双增伤守恒律（硬约束）**：一切法系装备（`baseStatRatios` 或 `flatStats` 含 `spellAttack`，即武器/头/衣/裤/副手五槽）的 `spellDamageBonusPoints` 与 `skillBonusPoints` **必须同值并存**——凡原本只配其中一项的，一律补齐为与已有一项完全相同的点数；缺项或不等值视为配表缺陷。理由：`deterministic` 战斗结算中两者处于**不同乘区**（`spellDamageBonusPoints` 在抗性穿透后的分类增伤层、`skillBonusPoints` 并入出手原始威力基数），任一缺项都会让法系装备单乘区收益落后于物理同阶装备。**饰品（trinket）不在此约束内**——三件法系饰品（桃木符/碧波静心佩/聚灵佩）与物理饰品镜像一致，不配置任何增伤点数。
- 拆分后防御与攻击总值严格守恒：比例值按 0.02 粒度取整，固定值主属性就近取整、副属性补齐，每件防具的白板预算严格守恒。（`spellDamageBonusPoints` / `skillBonusPoints` 属特殊点数不计白板预算，上述补齐不破坏守恒。）

## 4.4 副手四路线定义
副手替代原鞋履槽位（`slot: "off-hand"`），每阶四件任选其一，四路线的白板构成与特殊点数如下：

| 路线 | 白板构成（计入预算） | 特殊点数（人工平衡，不计预算） | 定位 |
| :--- | :--- | :--- | :--- |
| **物理输出** | 物攻 % + 物攻 + 命中 | 物理伤害增幅 `physicalDamageBonusPoints` | 物理输出补强 |
| **法术输出** | 法攻 % + 法攻 + 命中 | 术法伤害增幅 `spellDamageBonusPoints` + 技能增幅 `skillBonusPoints`（**同值并列**） | 术法输出补强 |
| **生存** | 护甲 % + 法抗 % + 生命上限 | — | 双防与血量 |
| **冷却与治疗** | 生命回复 + 灵力回复 + 灵力上限 | 冷却缩减 `cooldownReductionPoints` + 治疗提升 `healingBonusPoints` | 节奏与续航 |

## 4.6 装备与生活制造回收定价体系（制造双倍机制与强化50%残值折算）

### 4.6.1 制造翻倍铁律（原材料总成本 $\times 2.0$）

所有生活制造产物（包括精炼材料、丹药符箓、阵盘消耗品与装备成品），其系统商店直接回收基础售价（`sellPrice`）**严格等于制造投入全部原材料卖店成本总和的 2 倍（$\times 2.0$ 翻倍增值，即纯赚 100% 净增值率）**：

$$\text{成品回收基础售价 } V_0 = 2.0 \times \sum_{i} (\text{原材料单价 } P_i \times \text{配方投入数量 } Q_i)$$

- **设计意图**：保证玩家投入挂机时间进行提纯、炼丹、炼器等生活生产时，享有确定、丰厚的时间价值补偿；严禁出现原材料与成品价格倒挂或微利失衡。

### 4.6.2 强化装备回收定价模型（方案 B：50% 额外期望造价折算）

强化后的装备（$+N$ 变体）直接卖给系统商店时，**白板售价 $V_0$ 严格 100% 绝对保底**；高于白板部分按照受保强化额外期望造价的 **50%** 进行折旧返还：

$$\text{SellPrice}(+N) = \text{round}\left( V_0 \times (1 + \beta_N) + F_N \right)$$

其中：
- **$V_0$**：该装备的白板商店回收售价（$N=0$ 时，$\beta_0=0, F_0=0$，售价恒等于 $V_0$，绝对不低于白板）；
- **$\beta_N = 0.50 \times \text{累计期望保护消耗底模数}$**（白板残值加成系数）；
- **$F_N = 0.50 \times \text{累计期望强化灵石手续费}$**（手续费残值返还）。

### 4.6.3 妖兽战利品价值定义机制（真实怪物对齐：普通 20:1 / 精英 3:1 / 妖王 1:1）

游戏内战斗掉落战利品按怪物生态职能严格划分为三档，其「普通掉落期望收益（Common EV）」与「稀有掉落期望收益（Rare EV）」遵循以下固定期望比值（100% 对齐现存怪物配表与真实材料）：

1. **普通妖兽（Common Mobs）**：
   - **期望比例**：$\text{Common EV} : \text{Rare EV} \approx \mathbf{20 : 1}$（稀有材料期望产值严格压制在总收益的 5% 左右）；
   - **真实怪物与掉落**：
     - **T1 魔化野兔** (`enemy.demonized-rabbit`, Lv.1)：普通掉落 `item.beast-hide`（兽皮，单价 6 灵石，Common EV = 6.0 灵石）；稀有掉落初阶秘籍/残卷（Rare EV = 0.3 灵石，比值严格等于 20:1）；
     - **T1 木灵 / 火灵 / 水灵** (`enemy.wood/fire/water-spirit`, Lv.3~5)：普通掉落 `item.broken-spirit-core`（破碎灵核，单价 12 灵石，Common EV = 12.0 灵石）；稀有掉落两门法系秘籍残卷合集（木灵：掌心雷 + 吐纳功；火灵：轰炎 + 清心诀；水灵：甘露 + 掌心雷），Rare EV = 0.6 灵石，比值 20:1。掉落投放与怪物技能槽解耦——水灵只投放《掌心雷》秘籍/残卷而**不装配该技能**，其技能槽仍为甘露；
     - **T2 裂齿妖狼 / 星屑火鸦 / 掠灵邪修** (`enemy.rift-wolf` 等，Lv.14~18)：普通掉落 `item.beast-fang`（兽牙: 18 灵石）、`item.fire-feather`（火羽: 18 灵石）、`item.soul-talisman`（残魄灵符: 20 灵石）；稀有掉落进阶秘籍残卷（Rare EV = 1.0 灵石，比值 18~20:1）。

2. **精英妖兽（Elite Mobs）**：
   - **期望比例**：$\text{Common EV} : \text{Rare EV} \approx \mathbf{3 : 1}$（稀有材料期望产值占总收益的 25%）；
   - **真实怪物与掉落**：
     - **T1 铁甲熊 / 魔猿** (`enemy.armored-bear/demon-ape`, Lv.5~8)：批量掉落兽骨/兽皮/破碎灵核（Common EV = 45.0 灵石）；稀有掉落体魄/攻击秘籍残卷合集（Rare EV = 15.0 灵石，比值严格 3.0:1）；
     - **T2 残刃尸煞** (`enemy.blade-corpse`, Lv.20)：普通掉落兽牙×5（Common EV = 90.0 灵石）；专属稀有掉落 **`item.broken-blade`（残刃，玄品 `tier: 3`）**（爆率 1.0%，单价 2,000 灵石）+ 剑道秘籍（Rare EV = 30.0 灵石，比值严格 3.0:1）；
     - **T2 坠魔祭司** (`enemy.fallen-devil-priest`, Lv.22)：普通掉落残魄灵符×5（Common EV = 100.0 灵石）；专属稀有掉落 **`item.sha-bone`（煞骨，玄品 `tier: 3`）**（爆率 1.0%，单价 2,000 灵石）+ 术法秘籍（Rare EV = 33.0 灵石，比值严格 3.0:1）。

3. **区域妖王（Boss Mobs）**：
   - **期望比例**：$\text{Common EV} : \text{Rare EV} \approx \mathbf{1 : 1}$（稀有首领核心与海量普通包体各占 50%）；
   - **真实怪物与掉落**：
     - **T1 伥虎** (`enemy.chang-tiger`, Lv.12 妖王)：普通掉落巨额兽皮×10 + 兽骨×10（Common EV = 120.0 灵石）；稀有首领核心 **`item.demon-dan`（妖丹，黄品 `tier: 2`：单价 8,000 灵石，爆率 1.0%）** + **`item.sha-fang`（煞齿，黄品 `tier: 2`：单价 2,000 灵石，爆率 1.0%）** + 秘籍包（Rare EV = 120.0 灵石，比值严格 1.0:1）；
     - **T2 坠星兽** (`enemy.falling-star-beast`, Lv.24 妖王)：普通掉落兽牙×10 + 火羽×10（Common EV = 360.0 灵石）；稀有首领核心 **`item.demon-core`（妖核，玄品 `tier: 3`：单价 20,000 灵石，爆率 1.0%）** + **`item.meteor-fragment`（陨星破片，玄品 `tier: 3`：单价 10,000 灵石，爆率 1.0%）** + 顶级神通（Rare EV = 360.0 灵石，比值严格 1.0:1）。

### 4.6.4 行动耗时线性增长模型（采集与制造耗时规则）

为保证玩家境界提升、产物价值暴增时，生活行动的「每秒净收益率（Profit per Second, PPS）」平稳攀升且杜绝高阶行动时间指数爆炸，采集与制造动作耗时采用**「基准线性累加模型（Linear Stacking Duration）」**：

$$T(N) = T_0 \times \left( 1 + 0.30 \times (N - 1) \right)$$

- **$T_0$**：对应门类 T1 阶行动的基础消耗时间（基准耗时，如采伐桃木 6 秒，锻造青锋剑 15 秒）；
- **$N$**：产物或行动的目标等阶（Tier 1 ~ Tier 8）；
- **线性系数**：基于 T1 基准时间，**每提升一阶，耗时线性增加 30% 基准耗时**（绝非指数复利）：
  - **T1 阶**：$1.0 \times T_0$（基准耗时，+0%）；
  - **T2 阶**：$1.3 \times T_0$（基于一阶 +30%，单价收益提升 3 倍）；
  - **T3 阶**：$1.6 \times T_0$（基于一阶累加 +60%）；
  - **T4 阶**：$1.9 \times T_0$（基于一阶累加 +90%）；
  - **T5 阶**：$2.2 \times T_0$（基于一阶累加 +120%）；
  - **T6 阶**：$2.5 \times T_0$（基于一阶累加 +150%）；
  - **T7 阶**：$2.8 \times T_0$（基于一阶累加 +180%）；
  - **T8 阶**：$3.1 \times T_0$（基于一阶累加 +210%）。

- **经济学时间效益（PPS）验证**：
  - T1 采矿（乌铁 5 灵石 / 6 秒）$\to$ **0.83 灵石/秒**；
  - T2 采矿（赤铜 15 灵石 / 7.8 秒 $\approx$ 8 秒）$\to$ **1.92 灵石/秒**（单价涨 3 倍，时间仅涨 30%，每秒净收益跃升 **2.3 倍**！）；
  - 制造同理：T2 装备成品价格为 T1 的 7 倍，时间仅增加 30%，高级工匠的时间溢价效应极为显著。

## 5.2 完整技能书与残卷体系 (23 门功法配套书对 = 46 种专属道具)
1. **完整技能书 (`item.tome.<ability_id>`)**（掉率 0.1%）：
   - **首次研读**：直接领悟并解锁该技能（初始 Lv.1，0 经验）；
   - **学会后再次使用**：为该技能直接增加 **10,000 点技能经验**。
2. **技能书残卷 (`item.fragment.<ability_id>`)**（掉率 2.0%）：
   - **使用前置条件**：必须先学会对应技能，未领悟前无法研读；
   - **使用收益**：为对应技能增加 **500 点技能经验**。
3. **秘籍覆盖面守恒律（硬约束）**：**每一门 `abilities/*.json` 中定义的功法都必须同时存在 `item.tome.<id>` 与 `item.fragment.<id>` 两条物品定义**，不得存在无秘籍可学的功法，也不得存在无对应功法的秘籍。服务端 `ability.learn` 靠 `item.tome.` / `item.fragment.` 前缀反推 `ability.<x>`（`EcsPlayerRuntimeAdapter`），缺任一侧都会让掉落变成死物品或功法永远无法习得。新增功法时必须同批补齐秘籍、残卷、`frontend/src/game/ids.ts` 静态元数据与 `game.zh.ts` 词条（`check-i18n-keys.mjs` 会对缺失硬失败）。
   - **当前覆盖**：23 门功法 × 2 = 46 件；`碎罡`（`ability.sui-gang`）由二图关底首领 **撼地金背猿**（`enemy.golden-ape-boss`）掉落补齐，秘籍 1%、残卷 5%，与该首领既有「重斩/连环」书对同档。
4. **批量研读**：秘籍与残卷属手动即时消耗品，支持一次选择多本（`ability.learn` 携带 `quantity`）。
   - 语义与逐本重复点击等价：未习得功法时使用 N 本秘籍，第 1 本领悟解锁，其余 N-1 本各 +10,000 经验；已习得则 N 本各 +10,000；残卷 N 本各 +500。
   - **结算代价与数量解耦（硬约束）**：等级只由累计经验经立方曲线派生，故服务端按 `总量 = 本数 × 单本经验` **一次注入、一次跃迁判定**，禁止按本数循环。日志账本把批量折叠为一条 `起始等级 → 最终等级` 跃迁记录，经验总量与逐本累加同值。
   - 命令在玩家所在 ECS 世界分片的所有权门闩内执行，客户端可控的 `quantity` 绝不允许决定循环次数或迭代规模；任何批量入口（研读/回收/丢弃/挂售）都必须是 O(1) 或 O(固定槽位数)。
   - 一次批量只针对同一种 `itemId`；**扣减前先按钱包快照校验持有量**，不足整笔拒绝并返回 `INSUFFICIENT_ITEM`（扣减与习得在同一经济事务中原子提交或整体回滚）。
   - 单次 `quantity` 上限 1e12 本且不得超过当前持有量；超出按 `INVALID_QUANTITY` 拒绝。
5. **等级成长推导规则**：
   - 全部技能数值项每级 **+2.0% 线性成长**：`LevelGrowth = 1 + 0.02 × (Lv − 1)`——伤害倍率、固定伤害、治疗量与支援数值（`threatGain`、Buff 增伤/免伤/威胁增幅/每秒威胁等点数及固定回复）同式；
   - 时长与叠层上限不成长。

## 5.3 内功心法体系（10 门内功心法）

**定位**：内功是常驻被动的心法基座——装配 0 号内功位即生效，**不进入施放序列**（无冷却/吟唱/耗蓝/触发器）；其权威定位是**经验获取调整器**：按 `rootExpMultipliers` 对六维经验做**非守恒乘率重分配**（提升某一维度、压低另一维度，达成个性化养成），并可携带修为增减点与常驻面板效果。

### 5.3.1 心法配表字段与结算公式

- `discipline: "internal"`：只入 0 号内功位（槽位双向互斥，术法位只收 `spell`）；internal 功法不配 `defaultTriggers`/`manaCost`/`castMilliseconds`/`damageRatio` 等施放字段，战斗施放管线对 `internal` 一律跳过。
- `rootExpMultipliers`：六维乘率表，键为 `stamina`/`meridians`/`attack`/`bone`/`agility`/`consciousness` 子集，未列维度缺省 `1.0`，允许配 `0`（献祭归墟——该维终身停长，为真代价）。
- **六维入账公式**：`share_i = experience × mult_i × eff`（每个归属维度各得全额乘以自身乘率）；非守恒——六维总效率 = `eff × Σmult/6`，允许偏离 100%（总量是内功强度的定价旋钮：偏科越狠/总量越高，代价越硬）。
- `rootExpEfficiencyPerLevel`：参悟等级每级提升六维总效率，`eff = 1 + perLevel × (参悟Lv − 1)`；参悟等级与术法同口径由功法经验立方曲线导出，内功不施放、参悟经验唯一来源为秘籍/残卷研读（§5.2）。
- `cultivationExpBonusPoints`（修为获取）与 `combatExpBonusPoints`（战斗修为获取）：属于角色通用特殊属性族（100 点 = 100%）。其中 `cultivationExpBonusPoints` 为全路径修为收益通用增幅（击杀/行动收益/冥想/打坐引气，见 [第七篇](./07-战斗数值与内视规约.md) §7.11.1）；`combatExpBonusPoints` 为战斗专精修为增幅，仅在击杀怪物/战胜结算时额外叠加生效。
- `passive`：常驻面板效果块，复用装备 `flatStats` 同族点数字段汇入 `PlayerAttributeResolver`；基础数值按现行口径配置，并随参悟等级线性成长，每级提升 +5%（`passiveScale = 1 + 0.05 × (Lv − 1)`）。内功心法不再使用独立的顶层修为字段，统一通过 `passive` 挂载上述属性（如炼精化气诀配置 `cultivationExpBonusPoints: 20`，焚血功配置 `combatExpBonusPoints: -10`），享受参悟等级成长红利。
- `rootAttribute`：保留为主修维度标识（UI 归属展示/设计语义），不再承担分配计算——分配唯一由 `rootExpMultipliers` 决定。
- 未装备内功时六维全归属、各得全额（每维 `experience`，总量 6×）；神通/外功声明 `rootAttribute` 不参与分配。

### 5.3.3 内功六维总额度双轴量化模型与设计原则

为确保未来全等阶（T1~T12）与八大品质（Q1~Q8）内功数值秩序井然，建立**双轴量化参考模型**：

1. **等阶轴（Tier，T1~T12）**：T1 凡品基准为 $600\%$，T 级每提升 1 级，基础总额度 $+100\%$：
   $$\text{Base}(T) = 600\% + (T - 1) \times 100\% = (500 + T \times 100)\%$$
2. **品质轴（Quality，八品 Q1~Q8）**：品质每提升 1 级，总额度提升 $20\%$（指数型，四舍五入取整）：
   $$\text{Cap}(T, Q) \approx \text{round}\Big( \text{Base}(T) \times 1.20^{Q - 1} \Big)\%$$
3. **宏观设计矩阵标尺（T1~T4 × Q1~Q5 理论基准）**：
   - T1 凡俗：Q1 600% / Q2 720% / Q3 864% / Q4 1037% / Q5 1244%
   - T2 练气：Q1 700% / Q2 840% / Q3 1008% / Q4 1210% / Q5 1452%
   - T3 筑基：Q1 800% / Q2 960% / Q3 1152% / Q4 1382% / Q5 1659%
   - T4 金丹：Q1 900% / Q2 1080% / Q3 1296% / Q4 1555% / Q5 1866%
4. **具体功法落地取整原则**：
   - 上述公式为设计总纲的**宏观基准锚点（Anchor）**，用于规划产出梯队与成长天花板；
   - 具体功法落地时**以整洁好记、符合玩家心智为最高优先级**，可在理论基准上下适度取整，不机械死抠零头（例如 T3 Q3 玄阶玄品理论标尺为 1152%，首门玄门正宗心法《玄元一气功》采用六合同修全维均等方案，直接整洁取整为六维各 200% / 总和 1200% 翻倍，且无常驻 passive 效果，纯粹以强大的潜能倍率彰显高阶底蕴）。
5. **秘籍/残卷物品**：每门内功按 §5.2 同规范配 `item.tome.<id>` / `item.fragment.<id>`；投放途径（掉落/坊市/引导）由后续任务统一规划。
6. **历史归类清理**：嘲讽/清平乐/破阵子三门曾以 `internal` 过渡归类，随真内功落地统一改回 `discipline: "spell"`——`internal` 门类自此只收经验调整型被动心法。
7. **文案纯仙侠风味红线（严禁带出游戏术语）**：所有功法、心法、秘籍、残卷的剧情介绍与悬浮描述，必须保持纯正沉浸的仙侠世界观风味，**绝对禁止出现“六维”等现代游戏系统术语**；统一使用“周天百骸、形神兼修、内外浑融、根基道基”等修仙语境进行沉浸表达。

# 第六篇 持续消耗品机制与生活制造体系

> 本文档正式定义《道化太初》中可使用物品分类（立即消耗品 vs 持续消耗品）、基于动作耗时的持续时间扣除算法、槽位持久化状态、透支结算与切换惩罚规则，以及引气入体与引气丹的数值基线。

---

## 6.1 设计背景与核心目标

在传统放置/挂机 RPG 中，消耗品通常采用自然时间流逝的 Buff 计时器（如吃下一枚丹药获得 5 分钟 Buff，无论角色是否在执行修炼，时间都在无情流逝）。这在多任务切换、断续操作或特定动作加速时体验极差，且容易导致玩家心理负担。

《道化太初》建立了一套契合修仙节奏的**动作耗时分摊持续消耗品机制**：
1. **动作绑定与动作耗时消耗**：持续性道具（如引气丹、寻灵香、地火引等）仅在角色**实际执行并完成对应动作**时，按该动作在本次循环中**实际花费的时间**扣减剩余时间。
2. **状态保全**：不切换槽位物品时，剩余持续时间永久保存在槽位中，绝不随自然时间流逝而损失。
3. **透支友好**：当剩余持续时间不足以支付下一次动作时，直接消耗完当前物品，不足的部分免除（玩家小赚一点）。
4. **切换惩罚**：若物品已启用并消耗了部分时间，玩家主动切换/卸下该槽位物品时，直接扣除当前这一件物品且不返还时间，杜绝频繁切槽蹭药。

---

## 6.2 消耗品分类与生命周期模型

游戏中所有可使用物品（`kind: "consumable"`）先按**消耗入口**严格二分，再在自动消耗品内部按 `isContinuous` 字段划分持续/即时：

| 大类 | 消耗入口 | 品类 | 准入键 |
|---|---|---|---|
| **自动消耗品** | 自动使用槽位调度（触发条件 + 扣减时钟），不提供背包手动使用入口 | 丹药、补给、符箓、阵盘等 | `category == "consumable"`，必须配 `consumable` 块 |
| **手动消耗品** | 背包手动使用、即点即结算，各品类走专属权威命令 | 秘籍/残卷（`ability.learn`）、后续宝箱/礼包等 | `category` 为 `manual`/`chest` 等非 `consumable` 值，**不配 `consumable` 块** |

自动消耗品内部按 `isContinuous` 划分两类：

```mermaid
graph TD
    Item[物品 ItemDefinition] -->|"自动消耗品 category = consumable"| IsContinuous{持续标志 isContinuous}
    IsContinuous -->|"isContinuous = false"| InstantItem[立即消耗品]
    IsContinuous -->|"isContinuous = true"| ContinuousItem[持续消耗品]

    InstantItem --> InstantEffect[瞬发效果: 恢复生命/灵力/爆发伤害]
    InstantEffect --> InstantCD[进入独立冷却 Cooldown]

    ContinuousItem --> EquipSlot[装配至对应行动分类消耗品槽位]
    EquipSlot --> ActionTrigger[执行对应分类动作 Action]
    ActionTrigger --> DurationDeduct[动作完成时: 扣减动作实际耗时]
    DurationDeduct --> TimeCheck{槽位剩余时间判断}
    TimeCheck -->|> 0| RetainTime[保留在槽位中继续生效]
    TimeCheck -->|<= 0| DepleteItem[当前物品耗尽 -> 自动从背包消耗下一件并充能]
```

### 6.2.1 立即消耗品 (Instant Consumable)
- **定义**：使用后立即触发瞬时效果（如战斗瞬回气血丹药、回春丹、回灵丹、保命灵符等）。
- **生效方式**：
  - 装配至自动使用槽位后按机制生效：战斗中根据触发器规则（如生命低于 50%）自动触发；**不提供背包手动使用入口**（边界见 §6.2.4）。
  - 使用后直接结算数值（如 `HitpointRestore`、`ManapointRestore`），并让该槽位或该类物品进入独立冷却时间（`CooldownSeconds`）。
- **生命周期**：单次使用立即消耗 1 件物品，无槽位持续时间概念。

### 6.2.2 持续消耗品 (Continuous / Sustained Consumable)
- **定义**：用于增强特定动作效率或产出的持续性道具（如引气丹、寻灵香、地火引等）。
- **核心属性**（字段名对齐实际 JSON schema）：
  - `durationSeconds`：单件物品提供的总有效动作持续时间（秒，如引气丹为 300 秒）。
  - `usableInActionTypes`：物品可装配的**物品栏域**集合（栏域标识见 §6.2.3），决定该物品允许进入哪些自动使用物品栏；某个物品栏只接受声明了本栏域的自动消耗品。
  - 分类加成字段：直接对该动作结算生效的加成修正，按行动大类分别命名——`cultivationMultiplier`（修炼）、`gatheringMultiplier`（探索）、`alchemyMultiplier`（炼丹制造），如引气丹 `cultivationMultiplier = 1.3` 即增加 30% 修炼效果；**不通过全局 Buff 列表与自然时间计时器流逝**。
  - **生效守卫**：物品对运行中行动大类查得的加成倍率 ≤ 1 时，不充能、不扣剩余时长——引气丹可挂在历练栏内，但跑采集行动时不会白烧丹药（倍率字段只对修炼行动生效）。
  - **无叠层**：同一槽位固定单件效果、无法叠层，多槽位装配同种物品时按独立槽位依次结算或排他生效（不引入 `stackable` 字段）。

### 6.2.3 自动使用物品栏：栏域模型与战斗双组栏位

自动使用消耗品按「物品栏域」（`AutoUseBar`）分支——物品栏域独立于行动大类（`ActionKind`），是槽位、物品准入与消耗判定的统一归属键：

| 物品栏域标识 | 覆盖行动 | 槽数 |
| :--- | :--- | :--- |
| `exploration`（历练栏） | 修炼 `Cultivation` 与历练 `Exploration` 两大类全部行动（吐纳修炼、采集、挖掘、探索等非制造行动） | **6** |
| `alchemy` / `forging` / `talisman` / `formation` / `enhancement`（制造技艺栏） | 炼丹制造大类 `Alchemy` 行动按配表 `technique` 字段归属对应栏域（炼丹/炼器/符箓/阵法行动各归其栏）；强化 `Enhancement` 行动归 `enhancement` 栏 | 各 **3** |
| `combat`（战斗栏） | 战斗 `Combat` 行动 | 药品栏 3 + 通用栏 3 |

- **行动 → 栏域映射**：修炼/历练类 → `exploration`；炼丹大类 → 行动 `technique` 同名栏域（配表装载期校验：炼丹大类行动必须声明制造技艺）；强化 → `enhancement`；战斗 → `combat`；赶路无物品栏。
- **物品准入**：`usableInActionTypes` 声明物品允许装配的栏域集合（如引气丹 `["exploration"]`、地火引 `["alchemy"]`）；`queue.auto_use.configure` 服务端权威校验「物品栏域 ∈ 物品声明集合」。
- **消耗判定**：槽位与运行中行动同栏域时才参与结算；持续消耗品再经 §6.2.2 生效守卫过滤无加成场景。

非战斗物品栏内可用消耗品**一律为持续消耗品**，按 §6.3 动作耗时扣减。战斗行动域的消耗品独立成体系，栏位固定为**两组各 3 槽**：

| 栏位组 | 槽数 | 可装配物品 | 消耗语义 |
|---|---|---|---|
| **药品栏** | 3 | 仅限药品类消耗品（`category: pill` 等药品分类） | 使用即消耗：瞬间回复效果（`hitpointRestore`/`manapointRestore`）与回血/回蓝 Buff（`buffs.hpRegen`/`mpRegen`），使用后进入独立冷却 |
| **通用栏** | 3 | 任意自动消耗品：符咒、阵法、特殊道具，**药品亦可放入** | 物品声明直接消耗或持续消耗两种模式 |

**通用栏持续消耗的扣减时钟**——与行动耗时扣减不同源，按战斗状态机判定：

| 战斗状态 | 是否扣减 |
|---|---|
| 战斗进行中（含我方吟唱/敌方出手间隙） | ✅ 扣减 |
| 玩家死亡等待复活（战斗未终结） | ✅ 扣减 |
| 寻敌/遭遇间隙（战斗已结束、下一波未开始） | ❌ 不扣 |
| 退出战斗后 | ❌ 不扣 |

即：持续消耗随"遭遇战存活时钟"走——只要本次遭遇尚未结算离场（含躺尸等待），持续消耗品就持续扣件；寻敌与脱战期间时钟冻结。

**持续消耗品无冷却约束**：所有持续性消耗品（`isContinuous = true`）不配置或生效冷却时间（`cooldownSeconds` 恒为 0）。持续时长耗尽时，只要玩家背包（在线单人/组队）或离线会话储备中有对应存量且满足触发条件，即在既有合法充能边界消耗 1 件开始新周期；冷却仅由即时消耗品使用。

**使用条件**：战斗消耗品（药品栏与通用栏共用）与技能使用条件共用同一套触发判定模型——对象-类型-比对三元组，见[总纲第七篇 §7.8.3](./07-战斗数值与内视规约.md#783-出手决策顺序与使用条件触发判定)。

**组队战斗消耗品库存（TASK-20261019-04）**：`category=consumable`、适用 `combat` 且 `durable=false` 的全部自动使用物品统一执行，不按丹药、符箓、阵法或槽组分支库存语义。有人在线时不托管，按成员真实可用余额扣件；缺某种物品只跳过该次使用，战斗继续，购入后从下一合法判定边界自动续用。全员离线时先结清在线阶段，将冻结槽位对应物品的可用数量划入离线储备；批内只用储备，批算结束再补入新入账物品，不回补过去。任意成员回线先结清离线阶段并退回未耗储备。durable 持有型物品不扣件、不进入储备，手动消耗品不进入战斗自动使用。详见总纲21 §21.13。


### 6.2.4 手动消耗与槽位消耗的边界

全部可使用物品按消耗入口严格二分：

- **自动消耗品**：丹药、符阵等增益/回复类消耗品**不提供手动使用入口**，只能装配至对应行动域的自动使用槽位（§6.2.3），由触发条件与扣减时钟统一调度。放置挂机语境下消耗节奏必须跟随行动时钟与战斗状态机，手动即嗑会绕过冷却与扣减模型。
- **手动消耗品**：技能书/残卷、装备、后续宝箱/礼包类等「即点即结算」物品走背包手动使用——秘籍/残卷走 `ability.learn`，装备走 `loadout.replace`，后续新增品类按各自权威命令分流；不设通用 `item.use` 命令。
- **槽位准入键**：自动使用槽位（含详情页通用物品栏 `SlotGroupGeneral` 与战斗药品栏 `SlotGroupPotion`）的权威校验只接受 `category == "consumable"` 的物品；手动消耗品（`manual`/`chest` 等）即使误配 `usableInActionTypes` 也一律拒绝入槽，前端选择器同口径过滤。
- **`consumable` 块为自动消耗品专属规格**：手动消耗品不配 `consumable` 块（`ItemDefinition.Consumable` 为 null）；凡声明 `consumable` 块的物品必须在 `usableInActionTypes` 中非空声明合法物品栏域（§6.2.3），DataTool 装载期校验拦截「有块无域」与未知栏域的静默死物品。
- **批量消耗原则**：手动消耗品除装备（单件穿戴语义）外默认支持一次消耗多件；批量语义必须与逐次重复严格等价，且在同一权威事务内逐件结算、整体提交或回滚。是否开放批量按使用场景逐类裁定——秘籍/残卷已开放批量研读（见[第五篇 §5.2](./05-技能神通与秘籍残卷体系.md#52-完整技能书与残卷体系-20-种专属道具)），宝箱类落地时按其开袋结算设计决定。

---

## 6.3 槽位状态与动作耗时扣减算法

### 6.3.1 槽位数据模型扩展

在各物品栏域（§6.2.3：历练 `exploration`、制造技艺、战斗 `combat`）的自动消耗品槽位 `AutoUseSlot` 中，增加当前启用物品的持续时间状态：

```csharp
public sealed class AutoUseSlot
{
    /// <summary>装配的物品 ID（为 null 表示空槽）。</summary>
    public string? ItemId { get; set; }

    /// <summary>是否启用该槽位。</summary>
    public bool Enabled { get; set; } = true;

    /// <summary>
    /// 当前已启用的这 1 件物品剩余的有效动作持续时间（秒）。
    /// 数值范围：0.0 <= RemainingDurationSeconds <= ItemDefinition.Consumable.DurationSeconds
    /// 若为 0.0 且槽位启用，下次执行动作时自动从背包消耗 1 件并充能为总时长。
    /// </summary>
    public double RemainingDurationSeconds { get; set; }

    /// <summary>触发条件规则列表（主要供战斗槽位或特殊条件使用；正在落地）。</summary>
    public List<CombatTrigger>? Triggers { get; set; }
}
```

### 6.3.2 动作执行与耗时扣减算法 (Deterministic Deduction)

每次动作推进（无论是单步在线模拟还是离线/快进批量补算），遵循严格的确定性流程：

1. **实际动作耗时计算 (Actual Duration)**：
   $$\text{ActualDuration} = \frac{\text{BaseDurationSeconds}}{1.0 + \text{SpeedBonusRatio}}$$
   （`SpeedBonus` 动作加速加成正在落地；当前无速度加成来源时 $\text{ActualDuration}$ 退化为 `BaseDurationSeconds`。）
   例如：引气入体基础耗时 10 秒。
   - 若无加成，$\text{ActualDuration} = 10.0$ 秒；
   - 若有加成使速度提高 100%，$\text{ActualDuration} = 5.0$ 秒。

2. **槽位激活与自动充能判定**：
   - 检查对应动作分类下的各个 `AutoUseSlot`：
     - 若槽位已配置 `ItemId` 且 `Enabled == true`：
       - 若 `RemainingDurationSeconds <= 0`：
         - 检查玩家资产钱包（`AssetWallet`）是否持有该物品且数量 $\ge 1$；
         - 若持有：从资产中扣除 1 个物品，并将槽位 `RemainingDurationSeconds` 充能为该物品的完整 `durationSeconds`（如 300.0 秒）；
         - 若不持有：槽位无法提供加成，跳过该槽位。
       - 若 `RemainingDurationSeconds > 0`：槽位当前处于激活生效状态。

3. **收益加成结算**：
   - 凡处于激活状态的持续消耗品，将其加成效果（如引气丹 `cultivationMultiplier = 1.3`）直接应用至本次动作的产出计算中：
     $$\text{FinalQi} = \text{BaseQi} \times \prod \text{EfficiencyMultipliers}$$
     $$\text{FinalExp} = \text{BaseExp} \times \prod \text{EfficiencyMultipliers}$$

4. **扣除动作实际耗时与透支处理**：
   - 当本次动作周期**成功完成**时，扣减槽位剩余时间：
     $$\text{NewRemaining} = \text{RemainingDurationSeconds} - \text{ActualDuration}$$
   - **透支免单规则**：
     - 若 $\text{NewRemaining} > 0$：更新 $\text{RemainingDurationSeconds} = \text{NewRemaining}$，物品继续保留在槽位中供下次使用；
     - 若 $\text{NewRemaining} \le 0$：说明这 1 件物品已用尽（即使此前只剩 3 秒，而本次动作花了 5 秒，少掉的 2 秒不再倒扣，直接归零）：
       $$\text{RemainingDurationSeconds} = 0.0$$
       当前物品使命结束。若背包中仍有该物品，下一次动作开始时将自动开启新的一瓶/枚。

### 6.3.3 切换/卸下槽位惩罚规则 (Switching Penalty)

当玩家向服务端发送修改/切换/卸下槽位指令（如 `SetAutoUseSlot`）时：
- 若目标槽位当前已有物品 $A$，且 $0 < \text{RemainingDurationSeconds} < \text{TotalDurationSeconds}$（即已开封并使用了一部分时间）：
  - 玩家切换为物品 $B$ 或清空槽位时，**已经消耗部分的这 1 件物品 $A$ 不予退回**，其剩余的持续时间直接作废归零。
  - 新装配的物品 $B$ 处于未开封状态（$\text{RemainingDurationSeconds} = 0.0$），在首次触发动作时再从背包扣除 1 件并完整充能。
- **设计目的**：确保游戏经济与时间价值严谨，杜绝玩家在不同动作之间卡毫秒来回切换单个消耗品以获取超额收益。

### 6.4.3 引气入体灵石注灵加速机制 (`spiritStone`)

为了满足修士消耗灵石加速修炼的需求，同时避免因灵石耗尽而中断挂机队列，「引气入体」支持在行动配置中设定**灵石注灵（额外灵石消耗）**档位。

1. **注灵档位与基础倍率**：
   | 档位 | 每轮消耗灵石 (`currency.spirit-stone`) | 基础倍率 ($M_{\text{stone}}$) | 增幅说明 |
   | :---: | :---: | :---: | :--- |
   | **不消耗**（默认） | 0 | **$1.0\times$** | 基础吐纳天地游离灵气 |
   | **1 灵石** | 1 | **$1.2\times$** | 提升 20% 基础收益 |
   | **10 灵石** | 10 | **$2.0\times$** | 提升 100% 基础收益（翻倍） |
   | **100 灵石** | 100 | **$4.0\times$** | 提升 300% 基础收益（四倍冲关） |

2. **重算与加成范围规则**：
   - **仅放大修为（`experience`）与灵力（`mana`）**：六维经验（经脉与根骨）属于身体本质锤炼，保持定额不变，不吃灵石放大。
   - **提升基础值与后续倍率重算**：灵石倍率直接放大产物的基础值：
     $$\text{BaseYield}_{\text{adjusted}} = \text{BaseYield} \times M_{\text{stone}}$$
     后续的持续消耗品（引气丹 $1.3\times$、通脉丹 $1.5\times$）、灵脉倍率及建筑倍率等所有乘区，均在此放大后的基础值之上重算复合结算。
3. **单轮结算与平滑降阶兜底**：
   - 判定时机为单轮完成瞬间（`CompleteRepeat`）；
   - 若玩家当前可用灵石余额 $\ge$ 设定档位，按额扣除灵石，当轮享受注灵基础倍率，并在账本 `itemLosses` 中记录消耗；
   - 若玩家灵石余额不足，**不扣除灵石**，当轮自动回退至 $1.0\times$ 标准产出结算，**不中断挂机队列**；后续轮次若补充灵石则自动恢复注灵加成。

## 6.6 确定性与离线快进计算契约

在离线挂机和断线重连确定性快进时：
- **实际结算形态**：`SimulationEngine.AdvanceTo` 外层循环按 Buff 到期、消耗品冷却与自然回复等边界逐秒切片结算，逐片套用上述耗时扣减与充能规则，而非一次性公式化批处理。
- **结果等价性**：逐秒切片与公式化批处理在数学上完全等价——槽位中已有剩余时间 $R$ 最多可供 $K = \lceil R / T_{\text{action}} \rceil$ 次动作消耗；耗尽后，若资产中仍有 $M$ 个备用物品，每个物品可提供 $C = \lfloor \text{Duration} / T_{\text{action}} \rfloor$ 次动作（最后一次不足则透支完结）。
- 无论是逐秒推进还是离线快进补算，物品消耗总数与最终获得的修为/灵力完全等价，保证绝对确定性。

## 6.7 材料分类体系与丹药配置 (T1~T2 全量)

修仙界全量材料按**产出来源与工艺特性**严格划分为四大独立二级子品类（`subCategory`），彻底解决过去粗粒度归混问题。

- **基础分类（`subCategory`，四类）**：

1. **灵材 (Spirit Material / `spiritMaterial`, 5种)**：天地灵气自然滋养之草木、古树与灵泉甘露，全部由大世界【采集】（Gathering）行动获取：凝气草（`item.ningxue-grass`）、桃木（`item.peach-wood`）、晨露（`item.morning-dew`）、伴灵花（`item.banling-flower`）、引灵松（`item.yinlingsong-wood`）。

2. **矿石 (Mineral / `mineral`, 2种)**：深山地脉与灵矿灵穴蕴藏之原金原石，全部由大世界【挖矿】（Mining）行动获取：乌铁（`item.dark-iron`，原铁沉矿）、赤铜（`item.crimson-copper`，灵脉火纹赤铜）。

3. **异材 (Exotic Material / `exoticMaterial`, 18种)**：凶兽异种体内妖煞灵骨、遗骸皮牙与古战场兵火残片，全部由【战斗讨伐】（Combat Drops）掉落。

4. **精材 (Refined Material / `refinedMaterial`, 6种)**：修士借地火鼎炉千锤百炼、精纯萃取而成的中间加工材料，由【生活制造】（炼器精炼 / 炼丹萃取）产出。

- **品阶分类（`tier`，两档语义）**：材料品阶不再按地图分区标注，而由**产出来源的概率直接决定**，且品阶一旦超过凡品即为稀有材料（`tier >= 2` 是坊市与图鉴「稀有」筛选的唯一判定口径）：

1. **凡品（`tier: 1`，普通材料，共 24 种）**：凡可稳定获取者一律凡品——**采集直出**的全部原材与**高爆率（≥50%）战利品**，以及只由凡品材料加工出的中间精材。常规物品、丹药与全部装备的制造配方**只允许消耗凡品材料**，稀有材料一律不进制造消耗栏。
   - **灵材 5 种**：凝气草、桃木、晨露、伴灵花、引灵松；
   - **矿石 2 种**：乌铁、赤铜；
   - **异材 11 种**：兽皮（`item.beast-hide`）、兽骨（`item.beast-bone`）、破碎灵核（`item.broken-spirit-core`）、兽牙（`item.beast-fang`）、火羽（`item.fire-feather`）、残魄灵符（`item.soul-talisman`）、粗韧狼皮（`item.rough-wolf-hide`）、水灵原核（`item.water-spirit-core`）、坚岩獠齿（`item.rock-fang`）、重甲厚皮（`item.thick-beast-hide`）、金背猿骨（`item.golden-ape-bone`）；
   - **精材 6 种**：
     - **百炼铁** (`item.refined-iron`): 乌铁×3 $\to$ 炼器精炼物理主料；
     - **桃木晶** (`item.peach-wood-crystal`): 桃木×3 $\to$ 炼器精炼术法主料；
     - **草木精华** (`item.herb-essence`): 凝气草×2 + 晨露×1 $\to$ 炼丹萃取基础药露；
     - **赤铜精** (`item.refined-copper`): 赤铜×3 $\to$ 炼器精炼物理主料；
     - **灵松晶** (`item.spirit-pine-crystal`): 引灵松×3 $\to$ 炼器精炼术法主料；
     - **伴灵精华** (`item.banling-essence`): 伴灵花×2 + 晨露×1 $\to$ 炼丹萃取高阶药露。

2. **稀有（`tier >= 2`，共 7 种）**：**低概率（<50%）掉落**方为稀有材料，其品级严格等于「产出源等阶 + 1」——产出源越高的境界区域，同名阶梯上的稀有材料品级随之抬升，**境界提高即稀有材料品级提高**。稀有材料当前不进入任何常规制造配方，仅作为高阶建筑与后续内容的战略储备。
   - **黄品（`tier: 2`，T1 产出，3 种）**：妖丹（`item.demon-dan`，伥虎 1%）、煞齿（`item.sha-fang`，伥虎 1%）、暴猿煞心（`item.ape-heart`，金背巨猿 10%）。
   - **玄品（`tier: 3`，T2 产出，4 种）**：残刃（`item.broken-blade`，残刃尸煞 1%）、煞骨（`item.sha-bone`，坠魔祭司 1%）、妖核（`item.demon-core`，坠星兽 1%）、陨星破片（`item.meteor-fragment`，坠星兽 1%）。

> 品阶口径由 `frontend/src/game/materialTier.test.mjs` 跨 `items`/`monsters`/`actions` 三域联合门禁：材料 tier 必须显式声明、采集直出与 ≥50% 掉落必须凡品、<50% 掉落必须稀有且等于产出源等阶+1、任何制造消耗栏不得出现稀有材料。

3. **生态等级（`level`，真实出处对齐）**：材料等阶（`tier`）决定稀有度与品相，而等级（`level`）忠实反映出处的生态深度与危险梯度：
   - **怪物战利品**：对齐产出怪物的实际等级——Lv.1~3 兽皮/兽骨、Lv.4 破碎灵核、Lv.10 粗韧狼皮、Lv.11 水灵原核、Lv.14 坚岩獠齿/重甲厚皮/兽牙、Lv.16 金背猿骨/火羽、Lv.18 残魄灵符；稀有战利品同样对齐 BOSS/精英等级——Lv.12 妖丹/煞齿、Lv.16 暴猿煞心、Lv.20 残刃、Lv.22 煞骨、Lv.24 妖核/陨星破片。
   - **采集原材**：按采集点大世界生态平滑过渡——新手区幽谷坡地（凝气草/桃木/乌铁 Lv.1、晨露 Lv.2），进阶险地灵脉（悬崖伴灵花 Lv.12、绝壁引灵松 Lv.14、熔岩赤铜 Lv.15）。

- **丹药库 (4种)**：
  - **引气丹** (`item.qi-gathering-pill`): 凝气草×3 | 持续 300s | **+30% 修炼收益**（引气入体 10 Exp $\to$ 13 Exp，10 MP $\to$ 13 MP）

# 第七篇 战斗数值与内视规约

本文档记录角色内视体系、双数值类型定义规范、统一基准数值底座、非玩家单位（怪物）全量量化设计模型、六维根基换算规则、普通攻击规则、全量战斗属性分类、抗性减伤与对抗计算公式，以及核心生平记录规范。

---

## 7.1 强制数值类型架构规范 (全量使用 double)

根据系统与领域核心架构规则：
- **全部数值计算与储存一律使用 `double` 精度**（前端对应 JavaScript/TypeScript `number` 即 IEEE 754 double）。
- 杜绝任何整数截断导致的非预期突变，百分比结构体内部存储同样采用 `double` 点数。

### 7.1.1 固定数值类型 (Fixed Value / Flat Value)
- **底层表示**：直接使用 `double` 存储与结算。
- **涵盖属性**：全部基础战斗属性均为此类型。
  - 生命值 (HP)、灵力值 (MP)
  - 物理攻击、术法攻击
  - 护甲 (物防)、法抗 (法防)
  - 命中、闪避
  - 暴击、免爆
  - 破招、化解

### 7.1.2 统一百分比数值类型 (Percent Value)
- **底层表示**：内部统一存储为 `double Points`（点数），以 **100 点 = 100% 当量 (1 点 = 1%)** 作为基准缩放常数 $K = 100$。
- **支持曲线模式 (Curve Mode)**：
  - **`Linear`（线性模式）**：适用于增伤、免伤、仇恨增加、各类属性伤害增免。
  - **`NonLinear`（非线性/速率倒数模式）**：适用于冷却速度 (CDR)、行动速度 (攻速)、灵力消耗减少。

#### 百分比类型双模式换算模型对比表

设属性底层点数为 $x$：

| 点数 $x$ | 模式 (Mode) | 实际战斗乘区倍率 (Multiplier) | 面板展示百分比 (DisplayPercentage) | 业务行为说明 |
| :--- | :--- | :--- | :--- | :--- |
| **0** | Linear | $1.0\times$ | **0%** | 无增益 / 无减益 |
| **+100** | **Linear** | $1 + \frac{x}{100} = \mathbf{2.0\times}$ | $\mathbf{+100\%}$ | 增伤 100 点，伤害翻倍 ($2\times$) |
| **-100** | **Linear** | $\frac{100}{100 + \|x\|} = \mathbf{0.5\times}$ | $\mathbf{-50\%}$ | 负向除法软着陆，伤害减半 ($0.5\times$) |
| **0** | NonLinear | $1.0\times$ | **0%** | 基础冷却 / 消耗时间 |
| **+100** | **NonLinear** | $\frac{100}{100 + x} = \mathbf{0.5\times}$ | $\mathbf{50\%}$ | 冷却速度 100 点，CD 缩减 50% |
| **-100** | **NonLinear** | $1 + \frac{\|x\|}{100} = \mathbf{2.0\times}$ | $\mathbf{-100\%}$ | 冷却减速 100 点，CD 延长一倍 |

## 7.3 全量量化平衡与非玩家单位（怪物）设计模型

### 7.3.1 怪我同构建模原则 (Monster-Player Isomorphic Modeling)
系统杜绝“拍脑袋填表、来回人工调参、牵一发而动全身”的落后配表方式。整个数值体系是**完全参数化、闭环量化**的：
1. **完全对称数据结构（任何战斗单位同一模型）**：怪物、玩家、斗法镜像以及未来任何参战单位（含召唤物）在领域模型中完全同构——共用同一 `CombatantState` 属性池、同一 `SkillSlot` 技能槽、同一触发器求值器、同一 Buff 结算与同一普通攻击机制；不存在按单位身份分叉的专属属性、专属技能或专属效果管线；
2. **挂机基准波次怪物标准**（详见 [第十一篇](./11-数值量化模型集.md) §11.2）：
   - **妖兽 (Minion)**：**80% 全属性，300% 玩家生命**；
   - **精英 (Elite)**：**120% 全属性，500% 玩家生命**（每 5 波一次）；
   - **妖王 (Boss)**：**150% 全属性，2000% 玩家生命**（每 20 波一次）；
   - **底座口径**：「全属性 / 玩家生命」一律以同等级**期望玩家面板**为底座——即 `expected-attributes.json` 的 `levelExpected[].finalExpected`（基础数值池 × 六维 × 装备 × Buff 四乘区完全体，Lv1~127 每级锚点逐级求解，相邻整级插值）；**不是** `baseAttributeAnchors` 裸底座。怪物 `weights.*` 倾向权重在期望底座之上做微调。
   - **怪物双攻阶梯衰减与生存保护**：为避免怪我同构下怪物输出过高对非满配玩家形成秒杀压迫，怪物装配时双攻（AD/AP）程序化按等级阶梯削减：Lv.1 削减 40%（0.60x），Lv.1~24 线性过渡至削减 20%（0.80x），Lv.24 及后续等级恒定削减 20%（0.80x）；
   - **全体怪物闪避与免爆减半**：全体怪物最终闪避（Evasion）与免爆（CriticalResistance）直接减半（×0.5），显著降低未命中率并提升玩家暴击打击爽快感。
3. **大世界单场质量预算生成**（详见 [第八篇](./08-大世界地图与质量预算遇怪系统.md)）：
   - 单场大地图历练按地图危险度预算区间 `[minBudget, maxBudget]` 结合怪物 `budgetCost` 进行动态抽取，支持 1~3 种特色怪群组合。

### 7.3.2 怪物属性倾向量化微调

| 六维属性 | 拼音 | 初始点数 (double) | 每点（每重）属性增益效果 (double) |
| :--- | :--- | :--- | :--- |
| **体魄** | Tǐ Pò | 0.0 | `1% +12 生命值`、`1% +1 护甲`、`1% +0.5 生命值回复` |
| **经脉** | Jīng Mài | 0.0 | `1% +7 灵力值`、`1% +1 法抗`、`2% 灵力值回复` |
| **根骨** | Gēn Gǔ | 0.0 | `1% +12 生命值`、`1% +7 灵力值`、`1% +1 化解` |
| **力道** | Lì Dào | 0.0 | `1% +1 物理攻击`、`1% +1 暴击`、`1% +1 破招` |
| **神识** | Shén Shí | 0.0 | `2% +2 术法攻击 (术法攻击×2)`、`1% +1 命中` |
| **身法** | Shēn Fǎ | 0.0 | `1% +1 闪避`、`1% +1 免爆`、`1% +1 化解` |

> 期望玩家面板中六维拆记为 `rootFlat`（固定值，建模口径：各属性按 `ExpectPoints(Level)` 点预算 × 系数）与 `rootMultiplier`（百分比，`rootPercentage = ExpectPoints × 1%`，经脉灵力回复为 `ExpectPoints × 2%` 且无固定值）；`ExpectPoints(Level) = 3×Level`（全线性，一级境界对应三点，Lv18 收敛 54、Lv127 收敛 381）。结算式为 `finalExpected = (baseFlat + rootFlat) × (1 + root%) × (1+装备%) × (1+Buff%)`。

## 7.7 战斗伤害与对抗计算公式

### 7.7.1 伤害结算链：大类抗性穿甲 + 分类增减伤 + 免伤
战斗伤害计算以**大类抗性平方穿甲**打底，再经攻方分类增伤、守方分类减伤、暴击与免伤点数依次修正：

1. **第一层：大类抗性非线性平方减伤（护甲 / 法抗）**：
   $$\text{DamageAfterCategory} = \frac{\mathbf{RawDamage^2}}{\mathbf{RawDamage} + \mathbf{RES} \times K + 1.0}$$
   - **原始伤害口径**：普攻 `RawDamage = 物理攻击 ×(1+普攻增幅点数/100)`；技能命中的单发威力在出手构造时按 `攻基 ×(1+技能增幅点数/100) × 技能倍率` 并入——两类增幅点数均在抗性穿甲之前放大单发威力，天然穿甲优势随之同步生效；
   - **动态抗性系数 $K$**：等于当前等阶 `Tier`，由 `BaseAttributeCatalog.TierAt(level)` 锚点计数推导（`baseAttributeAnchors` 起始等级 `1/18/30/42/54/66/78/90/102/114/126/127`，等级不超过 `level` 的锚点个数即为 `K`；T1 得 `1.0`、T2 得 `2.0`，直至 T12 段 `12.0`，详见基准表）。
   - **有效抗性 ($\mathbf{RES}$)**：计算穿透比例后实际起效的大类抗性。物理伤害对应守方护甲（`Armor`），术法伤害对应守方法抗（`MagicResistance`）；化解成功时 $\text{RES} \times 2$。
   - **公式特性**：单发原始伤害越高，天然穿甲能力越强；法系凭借超大 AP 具备极强天然破防优势。

2. **攻方增伤乘区（Linear 点数，正向线性）**：
   按伤害归属匹配生效，逐项线性乘算：
   $$\times\left(1+\frac{\text{物理增伤或法术增伤}}{100}\right) \times \left(1+\frac{\text{对应五行增伤}}{100}\right) \times \left(1+\frac{\text{总增伤}}{100}\right)$$
   - 物理/法术增伤按伤害大类匹配（普攻与物理技能吃物理增伤，术法技能吃法术增伤）；
   - 五行增伤仅在攻击携带对应五行属性时生效（`Element.None` 跳过该项）；
   - 普攻增幅与技能增幅不在本层——二者已并入原始威力基数（见第一层口径），不与后段增伤重复乘算。

3. **守方减伤乘区（NonLinear 点数，正向收敛）**：
   按承伤归属匹配生效，逐项收敛乘算，任意单项减伤永不归零伤害：
   $$\times\frac{100}{100+\text{物理减伤或法术减伤}} \times \frac{100}{100+\text{对应五行减伤}}$$
   - 与增伤同口径分类匹配：物理减伤抵物理伤害、五行减伤抵对应五行攻击。

4. **暴击判定与最终伤害**：
   $$\text{实际伤害} = \text{DamageAfterElement} \times (\text{是否暴击} ? (1+\frac{\text{暴击伤害点数}}{100}) : 1.0)$$

5. **总减伤（免伤点数）末位收口**：
   通用承伤减免，守方 `DamageAbsorptionPoints + BonusAbsorptionPoints + BuffAbsorptionPoints` 合并后：
   $$\text{最终承伤} = \text{实际伤害} \times \frac{100}{100 + \text{总减伤}}$$
   总减伤为负时反向增伤，结算下限截断为 $0$。

6. **第六层：固定伤害增减修正（固定点数直加直减，不吃任何抗性与百分比加成）**：
   在抗性平方穿甲、分类百分比增减伤、暴击倍率与总免伤百分比结算完毕后，在最终伤害数值上直接进行固定点数增减修饰：
   $$\text{最终承伤} = \max\left(0,\; \text{承伤} + \text{固定增伤} - \text{固定减伤}\right)$$
   - **固定增伤**：攻方 `FixedDamageBonus` + (物理攻击时 `FixedPhysicalDamageBonus`，法术攻击时 `FixedSpellDamageBonus`)；
   - **固定减伤**：守方 `FixedDamageReduction` + (物理攻击时 `FixedPhysicalDamageReduction`，法术攻击时 `FixedSpellDamageReduction`)；
   - **不吃抗性与增幅**：固定点数不经抗性削弱、暴击乘算或百分比增减伤。攻方若有 10 点固定增伤，即便守方有无限点护甲/法抗，命中时也能打出 10 点保底伤害；
   - **减免与截断**：固定伤害仍受守方固定减伤抵扣，结算后承伤最低为 0 点；若攻击未命中（Miss/闪避），伤害为 0，不触发固定伤害。

> **修正说明**：五行抗性（`MetalResistance` 等元素抗性字段与第二层抗性减免）为历史误植，已废除——五行防御统一由「五行减伤」百分比点数承担；配表与代码字段清理另行落地。

**公式特性解读**：
- **半伤线**：$\text{RES} \times K \approx \text{RawDamage}$ 处承伤正好减半——守方「有效抗性 × 等阶系数」就是攻方单发伤害的半价线；
- **境界压制**：$K$ = 守方等阶，低阶攻高阶时 $\text{RES} \times K$ 被放大、伤害平方级跌落，跨阶悬殊由公式本身表达，无需特例；
- **天然穿甲**：单发原始伤害越高穿透越强——同等总面板下「一刀大伤害」比「多刀小伤害」破防效率高，AP 大招是天然破防武器；
- **对抗而非固定值**：护甲/法抗不是减伤百分比，而是与攻方单发伤害对抗的「点数」，减伤效果取决于双方量级比。
### 7.7.2 技能消耗口径
技能配表的 `manaCost` 字段直接声明 MP 点数消耗，结算时按表值全额扣除，不再经任何系数放大或二次换算：
$$\text{最终灵力消耗} = \text{manaCost（配表点数）}$$
按此口径，Lv1 基础灵力上限（MP 50，六维为固定值加成、随修炼增长）即可覆盖全部 T1 技能消耗，10 门技能（含嘲讽、破阵子等支援类）全部可装配、可施放。

- **吟唱打断退还**：灵力消耗与冷却的生效语义挂在「吟唱完成结算」上——吟唱中途被打断（如团灭瞬间全场吟唱作废，见 §7.9.4）视为技能未释放，起手预扣的灵力全额退还且不进入冷却；只有完整吟唱并结算的技能才消耗灵力、进入冷却。

### 7.7.3 三大对抗机制与触发概率公式 (常数 $K = 100.0$)

**对抗数值而非固定百分比**：命中、闪避、暴击、免爆、破招、化解全部为「点数」属性，触发概率由**攻防双方点数**与常数 $K=100$ 共同决定，形如 $\frac{\text{我方点数}}{\text{我方点数} + \text{对方点数} + 100}$；不存在写死的百分比面板。双方等点数时概率低于 $50\%$ 并随总点数渐近逼近 $50\%$——常数项是收敛阻尼，数值膨胀天然不溢出，每点边际收益递减。

1. **闪避 vs 命中对抗 (先判定是否被闪避)**：
   攻击发起时，系统优先判定守方是否成功闪避：
   $$\text{闪避概率} = \frac{\text{守方闪避}}{\text{守方闪避} + \text{攻方命中} + 100.0}$$
   - **闪避成功**：本次攻击完全落空，造成 0 伤害；
   - **闪避失败 (即命中)**：进入后续伤害与暴击减免结算。$0$ 闪避对 $0$ 命中时闪避率为 $0\%$ (默认必中)。

2. **暴击 vs 免爆对抗**：
   命中后判定是否触发暴击：
   $$\text{暴击概率} = \frac{\text{攻方暴击}}{\text{攻方暴击} + \text{守方免爆} + 100.0}$$
   - **暴击成功**：伤害乘以暴伤倍率 `1+暴击伤害点数/100`（基础自带 50 点即 150%）。$0$ 暴击时暴击率为 $0\%$。

3. **破招 vs 化解对抗**（同一次 roll 双分支互斥，仅点数更高一方有机会触发）：
   - **破招触发**：攻方破招 > 守方化解时，按概率 $\frac{\text{攻方破招}}{\text{攻方破招} + \text{守方化解} + 100.0}$ 判定，成功时**命中值与暴击值实际计算效果翻倍**；
   - **化解触发**：守方化解 > 攻方破招时，按概率 $\frac{\text{守方化解}}{\text{守方化解} + \text{攻方破招} + 100.0}$ 判定，成功时**双抗（护甲/法抗）与闪避实际计算效果翻倍**。

破招/化解 ×2 修正落定之后、命中掷骰之前，命中与闪避等效还要再过一次**战斗经验对抗**修正（见 §7.7.6）。

### 7.7.4 攻击反应触发器域（吸血/吸蓝/反伤）

所有伤害（普攻、玩家技能、怪物技能、斗法镜像）统一汇流 `ResolveAttack` 单点结算；伤害落账后引擎把攻击方/受击方各一条 `OnHit` 触发器入队 `encounter.PendingTriggers` 并立即按入队序消费——ECS 宿主经 `RunSystem<IOnHitTrigger>(unitEntity)` 实体派发（标记组件 + `SystemOrder` 排序），无实体路径经 `InlineCombatTriggerSink` 内联数学，两路共用 `CombatTriggerMath` 同一实现，结果逐位一致：

- **命中判定与伤害结算**：判定前/落账前的结算链仍在引擎本体内按固定次序执行；
- **落账后衍生结算**（触发器域，`CombatTriggerMath`）：
  - **气血汲取**（Order 100，`OnHitLeechSystem`）：命中后按 `实伤 × HpDrainPoints/100` 回复攻击方气血，产出治疗衍生事件；
  - **灵力汲取**（Order 110，`ManaLeechSystem`）：按 `实伤 × MpDrainPoints/100` 从目标灵力池偷取，目标扣全额、攻击方只装得下的部分；不产生衍生事件；
  - **伤害反弹**（Order 200，`ThornsSystem`）：受击方把 `实伤 × DamageReflectPoints/100` 弹回攻击方，计入受击方威胁值，产出伤害衍生事件；
  - **受击涨威胁**（Order 300，`ThreatOnTakenSystem`）：受击方按 `原始伤害（减免前面板威力）× ThreatOnTakenPoints/100` 增加自身威胁；仅命中生效，未命中不算「受到伤害」。

效果强度统一打包在 `CombatantStats.Effects`（`CombatEffectProfile`）：玩家侧由装备 `flatStats.hpDrainPoints` / `mpDrainPoints` / `damageReflectPoints` / `healingBonusPoints` / `threatOnTakenPoints` 经属性解析汇入，怪物侧由配表同名字段直接声明；reactive 标记组件（`OnHitLeech`/`ManaLeech`/`Thorns`/`ThreatOnTaken`）由 `CombatTriggerSurface` 按 Effects 管理挂摘，参数永无双写。

**确定性约束**：触发器禁止另起随机源与墙钟读取，随机判定走 `CombatHitContext.NextRoll()` 独立通道（0~15 号通道为核心结算保留，连锁打击通道自 20 起按 `20+chainIndex` 分配，触发器通道自 64 起）；触发器衍生伤害**直接落账、不回流管线**，杜绝递归触发；`UpdateOutcome` 永远在触发器结算之后运行，命中回血可救活自己。

**事件流口径**：主事件/施放事件在结算完成时刻携带双方灵力真值（`AttackerManapointsAfter`/`TargetManapointsAfter`），衍生事件该两字段为 `null` 并按序并入主事件之后；衍生事件 `AbilityId` 现状口径为「气血汲取继承触发技能、反伤为空」。消耗品打击（雷击符 `ResolveStrikeDamage`）不汇流 `ResolveAttack`、不产出 `CombatEvent` 与触发器——目标反伤不反弹、攻击方汲取不生效、受击涨威胁不累积，属既定行为边界。

### 7.7.5 百分比属性双曲线规约与修饰属性清单

**双数值类型（`PercentValue`）**：所有百分比修饰属性以 `double`「点数」存储（100 点 = 100%），按曲线模式换算为乘区。设计不变量：**点数在收益域恒定每点 1% 收益，百分比只是投影显示**——加成方向走分子线性、惩罚方向走分母渐近收敛，彻底规避"80%→90% 收益翻倍"与"堆满归零"两类断崖。

- **线性百分比（Linear）**：$+x \Rightarrow \times\left(1+\frac{x}{100}\right)$（+300 = +300%，×4）；负向软着陆 $-x \Rightarrow \times\frac{100}{100+|x|}$（−300 = −75%，×0.25）。适用全部增伤/增幅/汲取类。
- **非线性百分比（NonLinear）**：$+x \Rightarrow \times\frac{100}{100+x}$（+300 = 75% 缩减，时间/承伤 ×0.25，等价速率域每点线性 +1%）；负向线性放大 $-x \Rightarrow \times\left(1+\frac{|x|}{100}\right)$。适用减伤/缩减/速率类。

**伤害增减修饰 16 项**（增伤作用于攻方打出伤害，减伤作用于守方承受伤害）：

| 方向 | 属性（Linear 增伤 / NonLinear 减伤） |
| :--- | :--- |
| 大类 | 物理增伤/物理减伤、法术增伤/法术减伤 |
| 五行 | 金/木/水/火/土 增伤/减伤（10 项，按攻击携带的五行属性匹配，`Element.None` 均跳过） |
| 总增减 | 总增伤、总减伤（免伤点数） |


**固定伤害增减修饰 6 项**（固定点数，不参与百分比换算，在伤害计算末位直接加减修正）：

| 方向 | 属性（固定增伤 / 固定减伤） | 字段定义 | 默认 | 语义说明 |
| :--- | :--- | :--- | :--- | :--- |
| 大类 | 固定物理增伤 / 固定物理减伤 | `fixedPhysicalDamageBonus` / `fixedPhysicalDamageReduction` | 0 / 0 | 仅在物理攻击时在最终伤害加减对应点数 |
| 大类 | 固定法术增伤 / 固定法术减伤 | `fixedSpellDamageBonus` / `fixedSpellDamageReduction` | 0 / 0 | 仅在术法攻击时在最终伤害加减对应点数 |

> **内视面板展示规范**：内视面板与战斗单位详情中，固定伤害增减参考百分比增减对的形式合并为 3 个展示 Item（`固定伤害增减`、`固定物理伤害`、`固定法术伤害`），格式为 `+增伤 / 减伤`（如 `+10 / 5`），两侧均为 0 时默认隐藏。

### 7.7.5.1 五行灵根（开天门产物）

灵根是叩天门（Lv.18）满修为后的必经玩法产物，五项点数各 0~100。五行灵根采用「元素攻防 + 战斗专精 + 百艺机缘」三维立体增幅模型，除元素攻防外，衍生属性线性映射 $\text{Bonus}(P) = \text{Bonus}_{\max} \times \frac{P}{100}$（土系固定减伤与水系组队寻怪走专属规则）：

| 系别 | 元素攻防 (100点满值) | 战斗专精特化 (100点满值) | 修仙百艺与历练机缘 (100点满值) |
| :---: | :--- | :--- | :--- |
| **火 (离火)** | 火系增伤 **+25%**<br>火系承伤 **-25%** | • **暴击率**：**+50%** (`criticalChance`)<br>• **暴击伤害**：**+25%** (`criticalDamageBonusPoints`) | • **炼丹技艺速度**：**+25%** (`Alchemy`)<br>• **炼器技艺速度**：**+25%** (`Forging`) |
| **水 (坎水)** | 水系增伤 **+25%**<br>水系承伤 **-25%** | • **最大灵力**：**+50%** (`maxManapoints`)<br>• **拆招化解**：**+50%** (`parry`)<br>• **生命与灵力自动回复**：各 **+100%** (`hitpointRegen` / `manapointRegen`) | • **符箓技艺速度**：**+25%** (`Talisman`)<br>• **波间寻怪速度**：**+20%** (`SearchSpeedPoints`；单人 +20%，多人组队取全队在场成员算术平均值) |
| **木 (震木)** | 木系增伤 **+25%**<br>木系承伤 **-25%** | • **最大生命**：**+50%** (`maxHitpoints`)<br>• **治疗与被治疗增幅**：各 **+50%** (`healingBonusPoints`) | • **采集技艺速度**：**+25%** (`Gathering` 采药) |
| **金 (兑金)** | 金系增伤 **+25%**<br>金系承伤 **-25%** | • **物理攻击**：**+50%** (`physicalAttack`)<br>• **术法攻击**：**+50%** (`spellAttack`)<br>• **破招点数**：**+50%** (`break`)<br>• **命中点数**：**+50%** (`accuracy`) | • **装备强化速度**：**+25%** (`Enhancement` 淬炼强化) |
| **土 (坤土)** | 土系增伤 **+25%**<br>土系承伤 **-25%** | • **物理护甲**：**+50%** (`physicalArmor`)<br>• **法术抗性**：**+50%** (`spellResistance`)<br>• **免爆抗暴**：**+50%** (`criticalAvoidance`)<br>• **固定减伤**：**最高 10 点** (`fixedDamageReduction`；$P=0$ 时为 0，$P \ge 1$ 时 $\text{FlatDR} = 1.0 + P \times 0.09$，满级整 10 点) | • **阵法制造速度**：**+25%** (`Formation`) |

| 规则项 | 结算口径 |
| :--- | :--- |
| 增伤 / 减伤 | 每点灵根提供 0.25 点对应五行增伤点数（Linear 直加，100 点 = 25%）与 0.25 点对应五行减伤点数（NonLinear 收敛，100 点 = 25 点减伤点数） |
| 内视展示口径 | 内视「根基 → 灵根」每系一行：主卡 `元素图标 + 元素名 + 合并增减伤 + 该系点数进度`，合并文本格式为 `+增伤% / 减伤%`（如 100 点 = `+25% / 20%`），与斗法「特殊」页五行增减对共用同一 `PercentValue` 换算（增伤 Linear、减伤 NonLinear），两处对同一属性必须逐字一致；衍生加成逐条渲染为 `属性图标 + 名称胶囊 + 专属色调下划线数值`，图标与色系取配表登记值（对齐 `STAT_TONE_MAP`），禁止合并为单一「增伤」「减伤」胶囊或统一单色纯文本 |
| 技艺加速并入 | 技艺行动耗时除数按同点加算并入：$\text{duration} /= 1 + 0.05\times L + \Sigma\text{工具加成} + \text{灵根技艺加成}$（炼丹/炼器火、符箓水、采集木、强化金、阵法土，100 点各 +25% 速度） |
| 多人寻怪平均 | 波间寻怪时长除数按 $\text{SearchSpeedPoints}$ 结算；多人组队时全队取所有在场成员寻怪速度属性的**算术平均值**，打破单人最高霸凌，实现团队协同普惠 |
| 升级需求乘区 | 入天门后基础 1.0 已含首条灵根，此后每多一条有效灵根 +50%，五系齐全封顶 **3.0 倍**；调配阶段不放大。乘区作用于**本层修为瓶颈（expToNext 有效值）**：突破校验（`PlayerAggregate.Breakthrough`）、行动修为封顶（`ActionExecutionRules.Timed` 持续/轮次两通道）与底蕴成本折算基数（逆天改命 25%/5%、逆命丹炼制 25%、行动底蕴比例成本）统一按「已含乘区的 expToNext」计算；行动获取速率不放大 |
| 资质评价（展示） | 前端 `linggenEvaluation` 按点数分布解算称号/印章/评语（零结算影响），对标修仙小说公认谱系：单系 ≥90 **天灵根**、60~89 **真灵根**（<35 为废灵根）；双/三系两两纯度论**上品（均 ≥75）/ 中品（均 ≥55）/ 下品**；四系与五系不成天/上品者定名 **「X 系杂灵根」**（伪灵根语境）；**五系皆弱皆全（总值 <200）即「废灵根」** |
流程约束：

1. **突破前置**：叩天门满修为后必须先开天门取得灵根，未入天门时 `Breakthrough` 判定为冲突并阻断。
2. **总值生成与守恒**：开天门抽取总值按 Softmax 连续温度分布在 $[1, 500]$ 全域非零采样，期望随改命次数从基准 180（每级 +8）成长至 500 封顶（40 次拉满 500）；条数按容量下限 $\max(1, \lceil \text{total} / 100 \rceil) \sim 5$ 随机，Fisher-Yates 随机选系并按 Simplex 容量约束分配，单系上限 100 点且总和守恒。玩家在阵盘中只能在总值不变的前提下按「散功 2 返 1、灌注 1:1」重分配五行，且至少保留一条有效灵根。
3. **逆天改命**：入天门后仍可重洗灵根，消耗**当前升级所需修为 25% 的底蕴**；使用逆命丹可降至 **5%**；累计改命次数永久保留，不随突破或重洗清零（且持续推动后续抽取的期望总值向 500 靠近，平均约 40.5 次改命即可洗出五系全 100 满值）。
4. **逆命丹**：炼丹特殊配方产出，炼制本身消耗「当前升级所需修为 25% 的底蕴」，单炉 1 颗。

### 7.7.6 战斗经验对抗（命中/闪避等效修正）

战斗经验（`CombatExperience`）是独立的**对抗池**：只累积、不消耗，语义与入账口径见 §7.11。在命中/闪避等效计算末尾——破招/化解 ×2 修正之后、命中掷骰之前——附加一次双方战斗经验对抗修正：

- **经验比值**：记攻方战斗经验 `aCE`、守方战斗经验 `bCE`、防除零小量 `ε`，
  $$r = \mathrm{clamp}\!\left(\frac{aCE}{\max(bCE,\ \varepsilon)},\ 0.1,\ 10\right)$$
  双方战斗经验均 $\le 0$ 时视为**中立**，不做任何修正。
- **$r \ge 1$（攻方经验占优）**：攻方命中等效 $\times \min\!\left(2,\ 1+\frac{r-1}{8}\right)$，守方闪避等效 $\times \max\!\left(0.5,\ 1-\frac{r-1}{16}\right)$。
- **$r < 1$（守方经验占优）**：令 $s = 1/r \in (1, 10]$，攻方命中等效 $\times \max\!\left(0.5,\ 1-\frac{s-1}{16}\right)$，守方闪避等效 $\times \min\!\left(2,\ 1+\frac{s-1}{8}\right)$。
- **镜像对称**：占优方的增益走 $/8$ 斜率、封顶 $\times 2$；劣势方的衰减走 $/16$ 斜率、托底 $\times 0.5$。攻守互换视角后结论互换，公式自洽无特例。
- **示例**：攻方战斗经验为守方 5 倍（$r=5$）→ 命中等效 $\times 150\%$、守方闪避等效 $\times 75\%$；$r \ge 9$ 时封顶 $\times 200\%$ / $\times 50\%$。
- **接入位置**：修正只作用于 §7.7.3 第 1 条闪避对抗的两侧等效输入，不改暴击、破招/化解判定与伤害结算链，不新增随机抽取——随机数序列与 roll 通道分配不变，同种子回放逐位一致。
- **各单位取值**：玩家战斗经验取 `Progression.CombatExperience` 注入战斗面板（`CombatantStats.CombatExperience`）；怪物不入配表，按其配表 `level` 对应累计修为 $\sum_{i=1}^{level-1} \text{expToNext}[i]$ 派生（`RealmProgressionCatalog.CumulativeExpFor(level)`）；斗法镜像的战斗经验随撮合冻结面板（`DuelCombatant.Stats` → `DuelPlaybackState.OpponentStats`）携带，回放期不二次解析。
