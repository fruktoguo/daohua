## 8.4 遇怪与怪群生成算法规范

服务端在玩家完成每次寻怪倒计时（`InitialSearch`/`Search` 阶段）后，调用确定性怪群生成算法：

当前 `EncounterWaveSelector` 按种子从预算区间选取预算，普通怪只从剩余预算可容纳的候选中按权重抽取，每波最多 3 只（`MaxWaveSize`）；第 5 的倍数波优先精英，Boss 使用 `BattlesPerBoss`（缺省 20）且优先于精英。特殊怪先入波，再以最大预算扣除其成本填充护从；指定 Boss 自身成本可以高于普通波预算。成本读取怪物 `BudgetCost`，不以展示字段重算属性。候选为空（普通怪全部超预算且未抽到特殊怪）时保底塞入 1 只消耗预算最低的普通小怪。下面流程图为现行口径示意，原三次失败重抽设计已由可容纳候选筛选取代。

该怪群列表以多敌同场进入战斗：单体技能与非全体群攻按威胁（仇恨）权重抽取目标（详见 [第七篇 §7.8.2](./07-战斗数值与内视规约.md)），全体技能（`allEnemies`）命中全波存活目标；整波怪物全部击杀后才推进波次计数。

```mermaid
flowchart TD
    Start([寻怪倒计时结束]) --> CheckCount[读取当前地点累计历练完成波次 N]
    
    CheckCount --> IsBoss{(N + 1) % battlesPerBoss == 0 ?}
    IsBoss -- 是 (如第20/40场) --> SpawnBoss[从 bossEnemyIds 抽取 1 只 Boss<br/>总预算分配 maxBudget]
    
    IsBoss -- 否 --> IsElite{(N + 1) % battlesPerElite == 0 ?}
    IsElite -- 是 (如第5/10/15场) --> SpawnElite[从 eliteEnemyIds 抽取 1 只精英怪<br/>扣除该精英 budgetCost]
    IsElite -- 否 --> NormalRoll[在 [minBudget, maxBudget] 随机生成总预算 remainBudget]
    
    SpawnElite --> DeductElite[剩余预算 remainBudget 继续用于抽取小怪护从]
    DeductElite --> LoopExtract
    NormalRoll --> LoopExtract
    
    subgraph LoopExtract [质量预算扣减循环]
        Filter[筛选 budgetCost <= remainBudget<br/>的可容纳候选池] --> HasCandidate{可容纳候选非空<br/>且 remainBudget > 0<br/>且数量 < 上限(3只)?}
        HasCandidate -- 是 --> RollMonster[从可容纳候选按 weight 轮盘抽取]
        RollMonster --> AddMonster[将怪物加入 spawnedList<br/>remainBudget -= candidate.budgetCost]
        AddMonster --> Filter
    end
    
    HasCandidate -- 否 (无可容纳候选或达上限) --> CheckEmpty{spawnedList 是否为空?}
    CheckEmpty -- 是 (保底) --> SafetyFallback[保底塞入 1 只消耗预算最低的普通小怪]
    CheckEmpty -- 否 --> Finalize[生成怪群列表]
    SafetyFallback --> Finalize
    SpawnBoss --> Finalize
    
    Finalize --> BattleSnapshot[构建入场战斗状态，进入 Combat 战斗]
```

### 算法执行示例：

#### 示例 A：单怪特色地图（如青岚药谷，仅栖息木灵）
- **配置**：`minBudget: 20`, `maxBudget: 60`, `randomSpawns: [{ enemyId: "enemy.wood-spirit", weight: 1, strength: 25 }]`（木灵 `budgetCost: 25`）
- **常规波次**：
  - 随机本场总预算 `remainBudget = 55`；
  - 第 1 次抽取：抽中【木灵】（`cost 25 <= 55`），加入阵容，`remainBudget = 30`；
  - 第 2 次抽取：抽中【木灵】（`cost 25 <= 30`），加入阵容，`remainBudget = 5`；
  - 再次筛选：【木灵】`cost 25 > 5`，可容纳候选为空，循环终止；
  - **本场阵容**：`[木灵, 木灵]`（根据预算生成 2 只木灵同场）。

#### 示例 B：多怪复合地图（如落霞西岭，栖息野兔与蛮熊）
- **配置**：`minBudget: 30`, `maxBudget: 80`, `randomSpawns: [{ enemyId: "enemy.demonized-rabbit", weight: 5, strength: 10 }, { enemyId: "enemy.armored-bear", weight: 2, strength: 45 }]`
  - 魔化野兔（`cost: 15`）、重甲蛮熊（`cost: 35`）
- **常规波次**：
  - 随机本场总预算 `remainBudget = 65`；
  - 第 1 次抽取：抽中【重甲蛮熊】（`cost 35 <= 65`），加入阵容，`remainBudget = 30`；
  - 第 2 次抽取：抽中【魔化野兔】（`cost 15 <= 30`），加入阵容，`remainBudget = 15`；
  - 第 3 次抽取：抽中【魔化野兔】（`cost 15 <= 15`），加入阵容，`remainBudget = 0`；
  - 预算耗尽，循环终止；
  - **本场阵容**：`[重甲蛮熊, 魔化野兔, 魔化野兔]`（共 3 只怪）。

## 8.5 前端界面与交互设计

前端主要涉及「地图/附近（`map`）」面板与「历练（`exploration`）」面板的展示与交互联动。

### 8.5.1 地图 / 附近面板（World Map & Nearby Display）
「历练」页（`combat` Tab）下含四个子页签：**地图 / 怪物 / 人物 / 建筑**（`App.tsx` 的 `MAP_TABS`）。当玩家停留在某个地图节点时，各页签直观展示该地点的全景信息：

```
地图页签：世界节点拓扑（按区域可见性渲染：常态单区域、关口/跨界双区域）、玩家位置、赶路进度与目标地点赶路入口
怪物页签：栖息生灵（危险度预算区间 [minBudget, maxBudget]、精英/Boss 周期提示、怪物卡与数值详情）
人物页签：常驻 NPC 与当前分片可见玩家
建筑页签：当前节点公共建筑卡（等级/效果/双进度）、加号占位与可建候选弹窗
```

- **区域界框与名牌**：地图页签为每个当前可见区域绘制虚线界框与区域名牌；跨域边以虚线长路样式区别于图内道路，关口节点带界门描边提示。视口在区域可见集合变化时自动适配：以**玩家当前区域 ∪ 锚点相邻节点**（驻留节点锚=当前节点，行进途中锚=当前边两端点，跨域边取就近端点区域）为锚框缩放居中——关口/跨界时只纳入关口对侧节点而非整个邻接区域，避免双区全景并集把整图缩得过小；邻接区域仍整体渲染、可拖拽漫游查看，玩家亦可滚轮缩放。

- **怪物卡**：展示预算消耗、气血/攻防/抗性与掉落，点击弹出统一 Modal 查看数值详情（复用公共 Modal，不再单列 `MonsterInfoModal` 组件）。
- **建筑卡**：展示名称、等级与效果；建造中显示材料%/时间% 双进度缩略；点击弹详情 Modal（逐项材料清单、提交材料、升级）。节点未配置 `buildableTemplate`/`buildableList` 时不显示加号占位。
- 节点的「本地可选行动」在历练页行动区呈现，与怪物/人物/建筑生态信息分栏。

#### 历练页行动分组与地点约束

历练页（`exploration`）按固定顺序分栏展示当前地点可执行行动：

1. **常驻**：`type=cultivation` 的修炼类行动（如引气入体 `cultivation.draw-qi`）。常驻行动默认**全图可行、无需逐节点登记**——仅当配表显式配置 `excludedNodeIds`（黑名单）时，驻足所列节点不可执行；行进在道路上（无驻留节点）不触发排除。
2. **技艺组**：配置了 `technique` 归属的探索行动（采集/挖掘等），组名 = 技艺名 + 玩家当前技艺等级（如「采集 Lv.3」），按 `TECHNIQUE_IDS` 顺序排列。
3. **历练**：未配置技艺归属的其余探索行动。
4. **讨伐**：`type=combat` 的战斗行动。

行动侧地点约束（`ActionDefinition`，与执行门禁同源）：

| 字段 | 语义 |
| --- | --- |
| `availableNodeIds` | 白名单：非空时仅所列节点可执行；缺省/空 = 不限定 |
| `excludedNodeIds` | 黑名单：驻足所列节点不可执行；与白名单**互斥**（同配即装配拒绝） |

服务端 `ActionExecutionRules` 开轮门禁、入队 `WRONG_LOCATION` 校验与自动移动锚点判定均按「白名单须在列 且 黑名单不含」同口径执行；前端 `isActionAvailableAtNode` 为同口径预览。`DataTool validate --strict` 校验两者节点引用存在且互斥。

讨伐行动的地点语义与普通行动不同，**讨伐跟随玩家驻留地点而非入队锚点**：

- 跨节点移动后讨伐远征就地重锚：远征遭遇不属于当前节点 `encounterIds` 遭遇池时，旧地点搜寻/战斗波次作废、挂接中的旧战斗实体释放，按新节点遭遇池重新搜寻入场；复活读条相位保留「仍待起身」语义，改挂新地点遭遇的复活读条；
- 远征遭遇仍在当前节点遭遇池内（相邻节点共享同一遭遇）时不重锚，搜寻读条与波次原样续跑；
- 讨伐不走自动移动回锚点修正：当前节点不在 `availableNodeIds` 白名单内时按「条件不足」阻断而非地点不符，也不触发 `AutoTravelEnabled` 的赶路插队；
- 行动统计、队列与战斗区的行动名按驻留地点本地化（`localizeActionDisplayText`），与行动卡/弹窗同口径。

### 8.5.2 历练交互流程闭环
1. **点击历练行动**：点击讨伐/历练行动卡，弹出行动配置弹窗（`ActionModal`）；
2. **行动名按驻留地点本地化**：战斗行动显示名与描述中内嵌的地图名替换为当前节点名（人在「漱玉溪」时显示「讨伐 漱玉溪」而非「讨伐 青云仙山」），行动卡、弹窗、队列与战斗区显示同口径；行进在道路上时保留地图级原名；
3. **节点生态妖兽预览**：弹窗内展示当前节点 `encounterIds` 解析出的栖息妖兽**图标网格**（与服务端实战遭遇同根同源），悬停图标出简要信息卡、单击弹详细信息卡，不再平铺全部怪物数值；节点未配置生态时回退行动钉死遭遇的怪群；
4. **选择挂机轮次**：可设置挑战 1 次、10 次、100 次或点击 `∞` 无限历练；
5. **确认进入战斗**：点击【开始历练】，系统立即向队列首位插入该历练任务，并**平滑自动跳转至「详情」战斗界面（`CombatArena`）**，实时推进寻怪与波次战斗。

## 8.6 当前实现落点（非待办规划）

本节记录该系统的实际实现落点，供代码对照；字段归属以本节与配表为准。

1. **配置层**：地图节点定义由 `config/game-data/maps/*.json` 的 `WorldNode` 承载（节点坐标、`availableActionIds`、`npcs`、`buildings`、`buildableTemplate`/`buildableList`、`encounterIds`）；行动侧地点约束由 `config/game-data/actions/*.json` 的 `availableNodeIds`（白名单）/`excludedNodeIds`（黑名单，互斥）承载；遭遇预算与怪群池定义在 `config/game-data/encounters/*.json`（`minBudget`/`maxBudget`/`randomSpawns`/`eliteEnemyIds`/`bossEnemyIds`/`maxTotalStrength`/`battlesPerElite`/`battlesPerBoss`）；怪物定义在 `config/game-data/monsters/*.json`（含 `budgetCost`/`rank`/`strength`）。解析产物为 `GameDataCatalog` 持有的只读定义集合。
2. **领域层**：确定性波次抽取由 `src/Domain/Combat/EncounterWaveSelector.cs` 的 `Select(encounter, monsters, seed, waveNumber)` 实现质量预算扣减；世界图连通性由 `GameDataCatalog.BuildWorldGraph` 与 `WorldGraph` 维护。
3. **协议层与服务端映射**：地点节点 DTO 由 `src/Server/Clean/ProtocolSnapshotMapper.cs` 的 `ToWorldSection` 投影，输出 `minBudget`/`maxBudget`/`encounterIds`/`npcs`/`buildings`/`buildableBuildingIds`/`nodeBuildings` 等字段。
4. **前端**：`frontend/src/components/WorldMapPanel.tsx`（地图，内建 `nodeId→mapId` 全局索引与区域可见集合，画布为世界包围盒）与 `frontend/src/components/NearbyPanel.tsx`（怪物/人物/建筑页签）渲染，快照解码在 `frontend/src/network/snapshot.ts`；讨伐行动弹窗的节点生态图标面板为 `frontend/src/components/CombatEcologyPanel.tsx`（悬停简卡 + 单击详卡双层浮层），行动名地点本地化为 `frontend/src/game/ids.ts` 的 `localizeActionDisplayText`。
5. **门禁与测试**：确定性波次抽取由 `tests/Domain.Tests` 覆盖；建筑配表引用由 `DataTool validate --strict` 校验；整体门禁 `scripts/verify.sh`。

# 第九篇 节点公共建筑系统

> 状态：已随 TASK-20260918-05 / TASK-20260918-06 落地。本文是节点公共建筑玩法的唯一权威设计真源。
> 配表真源：`config/game-data/buildings/buildings.json`；地图节点 `buildableTemplate` / `buildableList`。
> 领域实现：`src/Domain/World/NodeBuildings.cs`；服务端注册表：`src/Server/Clean/NodeBuildingRegistry.cs`。

## 9.1 定位与归属

- 建筑是**节点级公共设施**：无建造者/所有者概念，同节点同种建筑仅一座；任何人可发起建造、填充材料、发起升级。
- 效果对**同地所有玩家**生效（公共增幅），不区分贡献者。
- 建筑状态脱离玩家分段，作为**节点级共享注册表**（`nodeId → 建筑实例列表`）独立持久化到 `game.node_buildings`；玩家聚合内的 `World.NodeBuildings` 只是最近已知投影，供离线/冷挂机补算沿用，真源始终在服务端注册表。
- 跨节点不泄漏：投影记录 `NodeBuildingNodeId`，消费方经 `EffectiveNodeBuildingEffects` 读取，投影节点与当前节点不一致时返回空集。

## 9.2 配表结构

单座建筑定义字段：

| 字段 | 含义 |
| :--- | :--- |
| `id` / `name` / `description` / `effect` | 标识与展示文本（`effect` 为效果文案） |
| `group` | 分组：`production`（生产）/ `combat`（战斗）/ `other`（其他），供节点模板与候选弹窗分组 |
| `requiredRealmLevel` | 建造解锁所需境界等级 |
| `availableNodeIds` | 可选：限定可建节点；缺省表示不限定（仍受节点可建列表约束） |
| `modifiers` | **每级基准效果**（见 §9.4），Lv N 生效 = 基准 × N |
| `materials` | 一级基础材料清单（`itemId` + `quantity`），第 N 级需求 = 基础 × `1.1^(N-1)` |

节点可建列表（地图 JSON 节点字段，二选一，均不写 = 该节点不可建）：

- `buildableTemplate`：`all` 或分组名（`production`/`combat`/`other`），按分组映射全部建筑；
- `buildableList`：自定义建筑 ID 数组（优先于模板）。

## 9.3 建造与升级流程（双进度条）

- 每条建造/升级任务有两条进度：**材料%** 与 **时间%**；总进度 = `min(材料%, 时间%)`。
- 材料不足时进度停滞，补足后继续；无需后台 tick，按「起始时刻 + 材料进度」惰性推算。
- 时间需求：`600 × (1 + 0.2×(N-1))` 秒（基础 10 分钟，每级 +20% 线性；51 级 = 110 分钟）。
- 材料需求：基础清单 × `1.1^(N-1)`（指数 +10%/级）。
- 建成永久生效；升级 = 发起新一轮双进度条（目标 N+1）；升级期间维持旧级效果，完成瞬间跳变；无等级上限。
- 首建期间 `Level=0` 不生效；升级期间 `Level` 维持旧等级。
- 惰性完工：任何读取路径按当前时刻判定 `min(材料%,时间%)≥1` 即落成目标等级并清空材料投入，落库由注册表串行化完成。

## 9.4 效果模型与数值

`modifiers` 七项效果：

| 字段 | 语义 | 接线点 |
| :--- | :--- | :--- |
| `explorationSpeedRatio` | 采集行动加速比率（耗时 ÷ `1+ratio`） | `SimulationEngine` 行动耗时 |
| `explorationOutputRatio` | 采集行动收益增幅 | 行动收益乘区 |
| `alchemySpeedRatio` | 炼丹行动加速比率 | 行动耗时 |
| `alchemyOutputRatio` | 炼丹行动收益增幅 | 行动收益乘区 |
| `cultivationOutputRatio` | 吐纳修炼收益增幅 | 行动收益乘区 |
| `combatHitpointRegen` | 战斗内每 5 秒气血回复固定值 | `PlayerAttributeResolver` 回血乘区 |
| `combatDamageReductionRatio` | 战斗减伤比率 | `PlayerAttributeResolver` 减伤乘区 |

- 效果随等级线性成长：`effect(N) = 基准 × N`；多建筑按项相加汇总。
- 收益增幅与消耗品/灵脉倍率**同乘区叠加**（`× (1 + ratio)`）；速度类为耗时 `÷ (1 + ratio)`。
- 强度预算口径：产出/收益类按「1% = 1 点」预算，回血按「1 点回复 = 4 点预算」换算，行动加速/减伤属特殊属性人工参考同等阶范围。

### 9.4.2 拥挤衰减模型（承载人数与超载线性衰减）

建筑服务有承载人数上限：超过上限后效果对所有人等比衰减，鼓励分流建造与多节点布局。

- **承载上限**：`capacity(L) = 100 + 10 × (L - 1)`（一级 100 人，每级 +10% 基数线性；L2=110、L11=200、L51=600）。
- **使用人数**：在**当前节点**拥有 `Running` 状态、且行动类别属于该建筑**服务类别**的玩家数（在线/离线挂机一视同仁）。服务类别由建筑 `modifiers` 非零项映射：`exploration*`→Exploration、`alchemy*`→Alchemy、`cultivationOutputRatio`→Cultivation、`combat*`→Combat；多类别建筑人数为各类别之和（队列串行，同一玩家不会重复计）。Blocked/排队中/赶路中不计。
- **衰减公式**：`efficiency(L, n) = 1`（n ≤ capacity）；超载时 `1 − min(0.5, (n − capacity) × 0.001)`——每超 1 人 -0.1%（即每 100 人 -10%），减幅**封顶 50%**（n ≥ capacity + 500 时效果恒为 50%，永不归零）；L1 满 1000 人恰为 -50%。
- **衰减施加粒度**：整座建筑的全部修饰项统一乘 `efficiency`（即 `基准 × L × efficiency`），非逐项独立衰减。
- **计数来源（读模型，无新增写路径）**：`game.player_action_queue`（flush 队列与 ComputeNode 回写两条写路径均事务性全量重建）JOIN `game.player_projection.current_node_id`，按 `(node_id, action_id) → ActionKind` 聚合；`presence='suspended'` 不计。计数为**秒级最终一致**的软指标（脏段去抖 + 读模型刷新，滞后 ≤~30s），不参与资产结算、不需要事务级精确。
- **投影一致性**：衰减后效果与使用数随既有节点建筑投影一并发入玩家 `World` 分段并持久化；离线/冷挂机补算沿用最近已知投影（含当时衰减口径），模拟确定性不受跨玩家耦合影响。

## 9.5 交互与协议

- 附近面板「建筑」Tab 展示当前节点建筑卡（名称 + 等级 + 效果 + 使用中人数/承载 + 建造中双进度缩略），点击弹详情 Modal（等级、效果、使用人数与超载衰减、双进度条、逐项材料清单与提交入口、升级按钮）。
- 使用人数展示：每座建筑显示 `使用中 n/capacity`；超载时追加 `超出 +x%`（x=(n−cap)/cap）与 `效果 −y%`（y=(1−efficiency)×100）。
- 提交材料独立界面：每种材料一个数量输入，范围 `[0, min(背包剩余, 本级所需剩余)]`，提交前二次确认；提交不可退还。
- 候选弹窗按 `group` 分组列出全部可建建筑；未解锁灰显并标注所需境界。
- 命令：`building.build` / `building.upgrade` / `building.contribute`；目录端点 `/api/v1/catalog/buildings`。
- 快照 `world` 段透传 `buildableBuildingIds`（可建列表，null=不可建）与 `nodeBuildings`（等级/双进度/材料明细 + `activeUsers`/`capacity`/`efficiency` 拥挤三元组）。

## 9.6 不变量

- 同节点同种建筑仅一座；同一时刻同一节点至多一个进行中的工程。
- 材料提交在数据库建筑行锁内按活行剩余需求封顶；`game.node_buildings`、钱包余额与流水、命令回执必须由同一 Serializable 事务提交，禁止通过独立扣账回调先行提交资产。
- 请求幂等键绑定原始提交参数，首次实际接纳量随结果持久化；重放不能按新的剩余需求重算扣款。事务完成前不发布缓存，成功后才刷新 World 派生投影。
- 所有进度推算只依赖持久化字段与当前时刻，在线/离线/冷挂机补算结果一致。
- 拥挤计数是最终一致读模型（`player_action_queue`×`player_projection` SQL 聚合）：滞后为可接受语义，任何读侧故障不阻塞建筑本体写路径与玩家模拟。

### 11.1.1 境界、等阶与品质三维架构

《道化太初》建立了一套**横向等阶（T1~T12 四修行期）**与**纵向品质（八品）**交织的修仙数值架构：

#### 11.1.1.1 命名规范与概念界定
1. **【等阶】（Tier 1 ~ 12）**：统领装备、法宝、技能、丹药与关卡怪物的基础属性数值底座与修为佩戴门槛；
2. **【品质】（Quality 1 ~ 8）**：决定物品/神通的词条数量上限、附加特效与完美度偏置；
3. **展示规范**：物品与技能直接使用本名（例：`青锋剑`、`太乙神雷`），不拼接冗长前缀，在详情面板与角标标签中展示等阶 `[等阶5]` 与品质色 `[天品]`。

#### 11.1.1.2 修行期划分与一体化徽章
- **前期**：T1（凡俗，Lv 1~17）、T2（叩仙门过渡至练气，Lv 18~29）；
- **中期（气基丹）**：T3（半步筑基至筑基）、T4（半步金丹至金丹）、T5（半步元婴至元婴）；
- **后期（婴神虚体）**：T6（半步化神至化神）、T7（半步炼虚至炼虚）、T8（半步合体至合体）、T9（半步大乘至大乘）；
- **大后期（仙道真源）**：T10（半步渡劫至渡劫）、T11（半步飞升，Lv 126）、T12（飞升，Lv 127）；
- **一体化徽章表现**：`[大境界牌匾框] ◇境界阶段棱形框◇ (小境界胶囊框)`（如 `[练气] ◇极◇ (练气巅峰)`，Hover 浮窗显示精确等级 Lv）。

> **系统与世界观解耦说明**：本文档定义的 12 等阶模型是服务端数值底层、角色内视面板、装备穿戴门槛与境界徽章的唯一统一系统模型；剧情任务与世界观设定（见 [`docs/world/lore.md`](../../world/lore.md)）对外保持“太初之世万物草创、规矩未定”的沉浸式叙事口径，两者各司其职。

---

### 11.1.2 核心属性四独立乘区归一化数学模型

$$\mathbf{最终面板属性} = \mathbf{(基础数值池 (BaseFlat) + 六维固定值 (RootFlat))} \times \mathbf{(1 + 六维\%)} \times \mathbf{(1 + 装备\%)} \times \mathbf{(1 + Buff\%)}$$

> **落地状态**：四乘区模型与六维成长已落地，由 `PlayerAttributeResolver` 统一消费 `expected-attributes.json` 结算。六维每点**同时**提供固定值与百分比（固定值：生命 +12、灵力 +7、术攻 +2、其余 +1；百分比：映射属性 +1%、神识术攻 +2%）。期望建模口径：每属性期望六维点 `ExpectPoints(Level) = 3×Level`（全线性，一级境界对应三点，Lv18 收敛 54、Lv127 收敛 381），`tiers[].rootFlat` 按点数预算折算、`rootPercentage = ExpectPoints × 1%`；怪物同构建模底座改用 `levelExpected[]` 的**每级期望锚点**（Lv1~127 逐级求解），避免跨等阶线性插值把高阶面板提前摊入低等级段。六维升级成本由 `RealmProgressionCatalog` 派生的 381 点成本表结算（一级境界对应三点、每点约一格修为条并在相邻档间线性插值，单维累计 ≈ 3× 境界累计修为），期望模型为「满培养基准」而非自然节奏线——击杀 1:1 入账的自然节奏低于期望，差额由内功乘率等收益通道消化。

#### 11.1.2.1 属性预算与价值折算法则
- **点数价值换算**：
  - **14 项基础属性百分比增幅**：每 +1% 属性增幅 = **1.0 点预算**；
  - **基础数值点数**：每 1 点基础属性 = **1.0 点预算**（基础属性价值差异已由 `BaseFlatAnchors` 基础数值池天然体现，无需二次折算）；
  - **自然自动回复**：每 1 点生命/灵力回复 = **4.0 点预算**；
- **流派配点对偶法则**：
  - **🗡️ 物理系 (Physical)**：走 **`1 AD : 1 暴击 : 1 破招`**，破招触发双倍暴击与命中；普攻为全流派统一物理模型（1.0s 基准 ×(1-ATR)×(1-攻速成长)，`100%→200%` AD），配合高倍率单体绝技爆发斩杀；
  - **🔮 法术系 (Magic)**：**AP 仅供技能结算**（普攻与物理系完全统一）；高 AP 面板在平方减伤下天然破防，配合 AP 群攻技能与掌心雷（0CD 填充技）主打范围清场。

### 11.1.5 跨系统消费与数据流转拓扑
1. **怪我同构数据模型**：怪物与玩家采用完全同构的数据建模，具备相同的属性池、技能系统与普通攻击机制；
2. **地图出怪与基准抽象**：不同地图/秘境/关卡支持灵活独立的出怪逻辑配置，基准文档中的波次为全周期产出基线；
3. **战斗模拟与关卡产出规约**：完整的战斗公式、双流派技能、单人/组队战斗模拟详表，详见独立规约文档 本文第二部分（战斗基准模拟与产出期望模型）；
4. **代码与服务端消费**：所有数值模型以 [`config/game-data/expected-attributes.json`](../../../config/game-data/expected-attributes.json) 作为单点真实数据源。


#### 11.1.5.1 自然回复基础值的配表边界

> 2026-09-14 用户澄清：回复基础值通过基础属性表配置调整，不能把配表参考比例实现为运行时代码公式。

- 基础属性模型的配置真源为 [`config/game-data/expected-attributes.json`](../../../config/game-data/expected-attributes.json)。随境界成长的基础生命上限与基础回复值应在该配置的基础属性表中定义，使用现有基础属性成长/取值规则读取。
- 生命回复的“2%”用于配表时确定相应境界的基础回复点数；参照的是该境界的基础生命上限，最终写入的回复数值才是运行时依据。不得根据装备等叠加后的生命上限重新计算，也不得在代码中硬编码基础上限乘 2%。
- `HpRegen` 与 `MpRegen` 是独立的可配置回复属性；生命上限增幅不隐含回复增幅。本次没有指定灵力回复的比例。
- 运行时负责读取、按明确属性规则叠加回复加成并结算；“2%”不授权新增保底、截断、默认回填或旧比率兼容分支。
- 回复周期以 [战斗规约 §7.9.2](./07-战斗数值与内视规约.md#792-自然回复属性由基础属性表配置) 的口径为准：当前实现基线为 5 秒整额回复周期（`HpRegen`/`MpRegen` 每 5 秒一跳），表中回复量按每跳整额理解。

**当前落地状态**：`expected-attributes.json` 已包含各境界基础生命/灵力回复锚点（`hpRegen`/`mpRegen`），并由 `PlayerAttributeResolver` 消费为回复属性真源；运行时读取配表回复属性并按明确属性规则叠加加成，前端不得以 `baseHp * 0.02` 等推导代替配表值。

## 11.2 战斗基准模拟与产出期望模型 (Combat Benchmark Model)

> **文档定位**：全游戏战斗数值、关卡挂机产出、技能循环、单人与组队效率全景标准规约文档。  
> **关联配置文件**：[`config/game-data/expected-attributes.json`](../../../config/game-data/expected-attributes.json)  
> **玩家属性基准文档**：本文第一部分（期望属性量化模型）  
> **⚠ 待重跑基准**：§11.2.4.2 ~ §11.2.8 的波次耗时/击杀效率/DPS 占比表由确定性战斗模拟器生成，其数值基于旧「基础锚点未翻倍 + 六维仅百分比」模型；新模型（锚点增量翻倍 + 六维固定值 `rootFlat` 与百分比并存 + levelExpected 每级锚点）落地后这些表为陈旧推演，需重新运行模拟器刷新，方法论与公式（怪物同构倍率、平方减伤、二次高级机制）仍然有效。  

---

### 11.2.1 概述与核心设计定位

本模型旨在建立一套**标准玩家数值在标准关卡怪物环境下的确定性战斗模拟与产出期望体系**，用于：
1. **锚定挂机产出节奏**：提供全 12 等阶四修行期（前期凡俗 / 中期气基丹 / 后期婴神虚体 / 大后期仙道真源）单人与组队的击杀量、波次耗时与产出基准；
2. **双流派配点对偶基准**：
   - **🗡️ 物理系 (Physical)**：走 **`1 AD : 1 暴击 : 1 破招`**，破招成功触发**双倍命中与双倍暴击**；普攻为全流派统一模型（1.0s 基准 ×(1-ATR)×(1-攻速成长)，`100%→200%` AD 物理伤害，满成长达 0.25s 极限间隔），配合重斩、贯星等高倍率单体绝技，主打毁灭级单体与 Boss 斩杀；
   - **🔮 法术系 (Magic)**：**AP 仅供技能结算**（普攻与物理系完全相同的物理普攻模型）；术法技能以**掌心雷**（0CD 填充技）与**轰炎 / 雷光引**（全体敌方 AP 群攻）主打范围清场，高 AP 面板在平方减伤下具备天然破防优势；
3. **精确非线性平方减伤公式**：$\text{实际伤害} = \frac{\mathbf{RawDamage^2}}{\mathbf{RawDamage} + \mathbf{RES} \times K + 1.0}$，单发原始伤害越高，天然穿甲能力越强；
4. **四修行期全景覆盖**：前期 (T1~T2 凡俗)、中期 (T3~T5 气基丹)、后期 (T6~T9 婴神虚体)、大后期 (T10~T12 仙道真源)。

### 11.2.2 实体同构建模与关卡出怪基准

#### 11.2.2.1 怪我同构建模原则 (Monster-Player Isomorphic Modeling)
- **完全对称数据结构**：怪物在领域模型（ECS / Domain）中与玩家完全同构，具备相同的属性池、技能系统与普通攻击机制；
- **统一攻防结算**：走同一套抗性减伤、暴击、破招化解与命中判定管线。

#### 11.2.2.2 地图出怪逻辑与基准抽象 (Map Spawning & Benchmark Abstraction)
- **基准抽象波次循环**：
  - **普通波 (Minion Wave)**：在遭遇预算区间 `[minBudget, maxBudget]` 内确定性抽取本场预算，按 `budgetCost` 轮盘填充普通怪直至预算耗尽或满编 **3 只**（受 `maxTotalStrength` 约束）；
  - **精英波 (Elite Wave)**：**每 5 波**刷新 1 次，**1 只精英怪**先入波，再按 `maxBudget - 精英 budgetCost` 剩余预算填充普通护从；
  - **首领波 (Boss Wave)**：**每 20 波**刷新 1 次，**1 只 Boss 首领**先入波，再按 `maxBudget - Boss budgetCost` 剩余预算填充护从；Boss 成本超出预算时该波仅有 Boss 一只。
  - **怪我同构倍率（基准假设）**：普通怪 80% 全属性 / 300% 玩家生命，精英 120% / 500%，Boss 150% / 2000%——底座为同等级**期望玩家面板**（`levelExpected[].finalExpected` 四乘区完全体，每级锚点逐级求解），非 `baseAttributeAnchors` 裸底座；实际阵容数量由预算决定，非固定「1 特殊 + 2 普通」。

### 11.2.3 战斗攻防对抗与高级机制二次函数成长模型

#### 11.2.3.1 动态抗性减伤公式 (Dynamic Resistance)
$$\mathbf{实际伤害} = \frac{\mathbf{RawDamage^2}}{\mathbf{RawDamage} + \mathbf{RES} \times K + 1.0} \times (\text{是否暴击} ? (1+\frac{\text{暴击伤害点数}}{100}) : 1.0)$$

#### 11.2.3.2 二次函数高级成长公式 (Quadratic Model, $x = \frac{Lv-1}{126}$)

> **点数注入口径**：成长不再产出独立乘区字段，而是折算为「点数」注入 §7.7.5 既有点数通道（与配表 `modifiers` 同池相加）；NonLinear 类通道由旧乘区 $f$ 反解点数 $p = 100\cdot(1/f - 1)$，Linear 类直接 ×100——下表各列均为注入后通道的**等效生效值**，与原乘区曲线逐位等价。本组注入为**怪物同构基准**口径；玩家侧特殊属性不保送，仅经装备/内功/特质/Buff 等获取。

1. **波次等待时间**：寻怪读条 $\div(1+\text{行动速度点数}/100)$，行动速度随境界成长 ⇒ $5.00\text{s} \to 2.50\text{s}$
2. **技能冷却缩减 (CDR)**：成长点数 $= 100\cdot(1/(1-0.75x^2)-1)$ 注入冷却缩减通道 ⇒ 有效缩减 $0.0\% \to 75.0\%$（满级 +300 点）
3. **行动速度加成 (ATR)**：成长点数 $= 100\cdot(1/(1-0.5x^2)-1)$ 注入行动速度通道 ⇒ 有效加成 $0.0\% \to 50.0\%$（满级 +100 点）
4. **暴击伤害**：成长点数 $= 350 \times x^2$ 注入暴击伤害点数通道（基础 50 点）⇒ 暴伤倍率 $1+\text{点数}/100 = 150.0\% \to 500.0\%$（满级 400 点）
5. **普攻专属攻速（全流派统一）**：成长点数与行动速度同曲线注入攻击速度通道 ⇒ 有效加成 $0.0\% \to 50.0\%$（满级 +100 点）
   $$\mathbf{普攻实际间隔} = 1.0\text{s} \div (1+\frac{\text{攻击速度}}{100}) \div (1+\frac{\text{行动速度}}{100}) \implies \mathbf{1.000s \to 0.250s}\text{ (1秒4刀)}$$
6. **普攻专属增伤（全流派统一）**：成长点数 $= 100 \times x^2$ 注入普攻增幅通道 ⇒ $+0.0\% \to +100.0\% \implies \mathbf{100\% \to 200\%\text{ AD 物理伤害}}$
   - 普通攻击对所有单位完全统一：基准 1.0s、双速度除数、100%→200% AD 物理伤害；法术系单位的普攻与物理系**完全相同**，AP 仅供技能结算。
7. **掌心雷（0CD 填充技，非普攻）**：$\text{Cast}(Lv) = 2.0\text{s} \div (1+\frac{\text{行动速度}}{100}) \implies \mathbf{2.00s \to 1.00s}\text{ (1秒1发)}$
   - 掌心雷是放在技能栏的普通技能（`castMilliseconds: 2000`、`60% AP + 固定伤害`、0CD）：吟唱只吃行动速度、**不吃攻击速度**；因 0CD 可在蓝量充足时完全顶替普攻出手。普攻与技能吟唱是**同一动作时间线上的互斥动作**——吟唱期间不产生普攻，技能完成后才进入下一次出手决策。

### 11.2.8 单人 vs 组队 四修行期数值生态与平衡性结论

> **推演样例声明**：本节结论基于 §11.2.4.2 基准负载假设套件的推演数值，描述两流派相对趋势；不代表真实配表结算。

1. **前期（T1~T2 凡俗期）**：法修凭借 AP 群攻与掌心雷填充轰炸小怪优势明显，清场效率领先物理约 20%~30%；
2. **中期（T3~T5 练气筑基金丹）**：物理破招与暴击成长起步，两系在金丹期效率收敛至 95%~105% 完美平衡区间；
3. **后期（T6~T9 元婴化神炼虚合体）**：物理群攻与单体绝技配合破防暴击开始发力，两系势均力敌；
4. **大后期（T10~T12 大乘渡劫真仙）**：统一普攻满成长达 0.25s 极限间隔（全流派通用），物理系结合破招翻倍暴击爆发斩杀 Boss 展现极致单体输出，总通关击杀效率领先法术约 15%~30%；
5. **组队提速效应**：全境界 3 人组队相比单人挂机，通关与击杀效率稳定提升 **`2.5 ~ 3.0 倍`**，联机合作收益极佳！

# 第十二篇 世界观设定、主线剧情与叙事红线

## 12.1 时代底色：太初之世
- 天地初开不久，人烟稀少，聚落零星。大地上的“炁”浓郁可见，但**无人知晓炁的规矩**，没有宗门、传承与成型功法。
- 云来集是山脚下唯一的落脚聚落，北边有一口老井（**北井**），集口有刻了阵纹的木柱（**阵基**），山顶有看天的**观星客**。

## 12.2 七章主线剧情与 10 大碎片链
1. **序章·云来**：外乡人落脚云来集，学会引炁入体，夜里路过北井听见怪异声音（水声/风声/数数声）。
2. **第一章·泉变**：澄心灵泉水变味，林伯与兰婆各执一词，玩家学会炼制引炁丹，“听泉底”指向北井。
3. **第二章·矿光**：玄铁矿洞矿壁微光，失踪矿工反复念叨“下面有数数的”，带回发光石头。
4. **第三章·立碑**：古台立起新碑，守井人刻下八字八谜——“**炁有归处，人留门路**”，台基下发现古老暗纹。
5. **第四章·谷鸣**：暮影谷妖兽反常成群，暮影关立起哨塔，谷主身上发现同款暗纹，守岭人赐下行令。
6. **第五章·天铁**：观星客预警坠星，玩家取回天铁，矿光石与天铁放在一起微光暗去，互相感应。
7. **终章·井底**：泉变谷鸣汇聚，玩家与守井人下入北井，见井底窄门石隙与冷白光华，守井人留下谶语：“门不是锁，是留的。回去把碑上的话记住就行。”

## 12.3 文案口径红线清单
- **禁止出现的未来词汇**：道劫、天穹残宫、封天井、星铁雨（用“天铁/坠星”）；在主线剧情对白中不直白出现后世宗门术语。
- **禁止剧透与总结**：不解释井、碑、纹、光的终极来历；任何章节结束不做“所以这一切是……”的总结陈词。

# 第十三篇 前端 UI 设计系统与修仙交互规范

## 13.1 暗墨玄石美学与色调规范
- **材质底色**：`rgba(14, 12, 7, 0.96)` 高透明度深黑底色 + `backdrop-filter: blur(14px)` 毛玻璃效果。
- **古典修仙色调 (`FloatingTone` / `PillTone`)**：
  - `gold` (暗金/极品/破招)、`jade` (苍翠/生命/木行)、`qi` (灵虚淡蓝/灵力/神识)、`danger` (朱砂煞红/负伤/削弱)、`purple` (紫极天道/灵品)、`muted` (玄灰幽暗/背景注记)。

### 13.1.1 深色与浅色显示主题

- 设置 → 显示提供「浅色 / 深色」分段选择，默认浅色；选择在当前浏览器保存，刷新后在首屏恢复。
- 浅色采用平色浅黄纸底（背景不叠渐变）、深墨文字；印章红为主操作、选中态、焦点与危险语义的签名强调色，暖赭金退回边框、角纹与语义金等纹饰用途；保留现有字体、布局、间距、图标、品质层级、修仙色相、法阵及交互动效；深色延续暗墨玄石风格。
- 主题由根节点 `data-theme` 与统一配色、字重变量驱动，悬浮 Portal、弹窗、登录/连接屏幕、地图与战斗信息使用同一主题；物品图像与技能特效不做整体反色。
- 两套主题分别提供正文、次要文字、语义色、面板、输入框与交互状态配色。浅色普通文本对实际底色的对比度至少 4.5:1，焦点与必要控件边界至少 3:1；不能直接把深色高亮文字复用于浅色底。
- 浅色正文、辅助文字、输入控件与原 400/500 字重的标签和标题统一提升至至少 600 字重（由 `--font-weight-regular`/`--font-weight-medium` 主题字重变量驱动），原有 600 及以上字重保留不变；深色沿用原有字重。
- 切换只更新主题外观（配色与字重）与浏览器主题元数据，不重新挂载游戏界面，不触发网络命令，不改变输入值、滚动位置与游戏状态。
- 顶栏右侧提供太极快捷开关：对称正置的阴阳双鱼太极图（鱼眼取对色、盘底为偏差暖米色），常态静止；浅色主题阳鱼居上，深色主题整体翻转 180° 令阴鱼居上，点击切换主题时再旋转 180°；主题切换经 View Transitions 做以触发点为圆心的全屏圆形扩散过渡，扩散区内呈现目标主题；不支持该 API 或减少动效偏好时直接切换。

## 13.2 核心公共组件速查 (强制收拢规范)
1. **`FloatingPopover` / `FloatingInfoCard` / `FloatingTooltip`**：基于 React Portal 挂载至 `#daohua-floating-root`，自动计算视口翻转（Auto Flip）与边界夹持（Viewport Clamp），标准宽度 `medium` (300px)，支持 `quantity={amount}` 独立中文四位分段副气泡；桌面 Hover 防抖、移动端 Touch 0 阻碍穿透底层。
2. **`RealmBadge`**：大境界牌匾框 + 境界阶段棱形框 + 小境界胶囊框，Hover 展示精准等级与属性。
3. **`PillStatLabel` / `PillBonusLabel`**：复合修仙胶囊，内置图标、专属下划线数值、内联进度条与 Tooltip。
4. **`ItemTile` / `ItemGridPicker`**：标准物品方块，品质光晕色调与边框、旋转填充倒计时遮罩。
5. **`QuantitySelector`**：数量输入、常用预设按钮与 `∞` 无限循环按键。
6. **`UnitNumber`**：万进紧凑展示（最多6位数字、2位小数、向下取整），Hover 弹出中文四位分段对照（如 `1234亿 7777万 5211`）。
7. **`CharacterAvatar`**：角色/妖兽立绘，WebP/PNG/SVG 智能降级，敌方自动镜像翻转（`scaleX(-1)`）。

## 13.3 普攻与受击反馈层级

- 普攻采用「掠斩、直刺、回锋、震击」四种短促演出，同一出手单位交替使用；变化只影响画面，不改变攻击时刻、目标、伤害或次数。
- 受伤采用「裂光、震纹、碎星」三种局部反馈，同一受击单位交替使用；正式前端由权威气血下降触发，画廊由沙盘扣血触发，一次伤害只启动一次受击动画。
- 普攻主色限于骨白与淡金，受击用克制的暖白与朱砂；禁止普通命中引发全屏闪白、震屏、大范围烟雾或长尾粒子。每次普攻最多 8 枚小粒子，主体轨迹在约 0.4 秒内收束，所有残留在 0.8 秒内清理。
- 光痕与震纹集中在立绘身位，尺寸跟随立绘台缩放，不触碰名字、资源条与行动条布局；连续攻击时保留目标轮廓与数值可读性。
- 画廊与正式前端共享普攻脚本和受击样式；画廊提供命名变体按钮供逐项查看，环境普攻自动交替。技能、暴击、阵亡仍保持独立演出层级。

# 第十四篇 传音频道与日志分组

> 本文是「游戏内日志分组 + 聊天（传音）系统」的设计真源。协议字段、频道语义、保留策略与前端展示口径以本文为准。

---

## 14.1 面板分组

日志面板共 8 个分组（Tab），顺序固定：

| 分组 | 键 | 数据来源 |
| --- | --- | --- |
| 综合 | `all` | 系统日志 + 好友私聊 + 队伍群聊（三源按时间合并，只读，不提供输入） |
| 世界 | `world` | 世界频道聊天（全服在线修士） |
| 附近 | `nearby` | 附近频道聊天（同一地图节点在线修士） |
| 系统 | `system` | 系统日志（消耗品使用、行动完成、抵达、离线补算、斗法撮合与结算、各类系统通知） |
| 战斗 | `combat` | 战斗过程日志（`combat.*`：搜寻/遭遇/施放/胜负/复活；普通攻击逐帧不落日志，同一次施放的多目标命中合并为一条施放行：模板内以 `\n` 分隔逐目标子句，前端拆行渲染并以隐藏前缀占位使续行「对/为」与首行对齐） |
| 好友 | `friend` | 好友私聊（1:1，需先建立双向好友关系） |
| 宗门 | `sect` | 宗门频道（**当前仅占位**，宗门系统未立项，输入与展示均提示未开放） |
| 队伍 | `party` | 队伍群聊（队伍成员） |

- 综合**不包含**世界、附近、战斗、宗门。
- 系统与战斗由服务端日志事件（`LogBatch`）按 `channel` 字段分流。
- 世界/附近/好友/队伍/宗门为聊天消息（`ChatMessage`）。

---

## 14.2 日志事件频道字段

`LogEventDto` 新增 `channel`（`"system"` | `"combat"`，缺省 `"system"`）。

分类规则（服务端 `SimulationLogMapper`）：

- 事件码前缀 `combat.` → `combat`；
- 其余（`action.*`、`world.arrived`、`offline.capped`、`auto-use.*`、`duel.*`）→ `system`。

前端 `gameLogService` 按 `channel` 过滤，系统/战斗两个 Tab 各自独立渲染；综合不消费日志（只消费系统频道）。

---

## 14.3 聊天频道模型

聊天频道由「频道类型 + 作用域键」唯一确定：

| 频道 | `channel` | `scopeKey` | 可见范围 |
| --- | --- | --- | --- |
| 世界 | `world` | 空字符串 | 全部在线修士 |
| 附近 | `nearby` | 当前地图节点 ID | 同一节点的在线修士 |
| 好友 | `friend` | 两个玩家 ID 升序拼接 | 私聊双方 |
| 队伍 | `party` | 队伍 ID | 队伍全体成员 |
| 宗门 | `sect` | 宗门 ID | 未开放（占位） |

- 消息体长度上限 200 字符（去除首尾空白后非空）。
- 频道级发送节流：同一玩家同一频道 1 秒内最多 3 条，超出返回 `CHAT_RATE_LIMITED`。
- **不设计历史兼容**：聊天记录只保留最近 100 条/频道作用域，超出即删除。

---

## 14.4 保留策略（100 条/作用域）

聊天消息落 PostgreSQL `social.chat_messages`：

- 每条消息插入后，在同一事务内删除该 `(channel, scope_key)` 下超出最新 100 条之外的行；
- 历史回放：玩家握手成功、以及切入某频道时，服务端下发该作用域最近 100 条（`ChatHistory`）；
- 世界频道为单作用域（`scope_key = ''`），全局共享 100 条。

---

## 14.5 社交系统（好友 / 队伍）

### 14.5.1 好友

- 双向关系：申请（`friend.request`）→ 接受（`friend.accept`）/ 拒绝（`friend.reject`）→ 双向 `friendships` 落库；
- 解除（`friend.remove`）双向删除；
- 好友私聊：以双方 ID 升序拼接为 `scopeKey`，只有双方可收发。

### 14.5.2 队伍

- 邀请（`party.invite`）：邀请人未组队时**自建队伍并任队长**；被邀请人收到待处理邀请；
- 接受（`party.accept`）/ 拒绝（`party.decline`）：作用于自己待处理的邀请；
- 队伍上限 5 人（含队长）；只有队长可以邀请；
- 成员离开（`party.leave`）：队长离开时队长位移交剩余成员中最早加入者；成员全部离开后队伍解散；
- 队伍群聊作用域为 `party_id`，成员变更即时生效。
- 完整组队系统（队伍档案/招募匹配/组队大厅/聊天队伍链接/身家口径）以 [第二十一篇](./21-同道与组队系统.md) 为准；本篇仅保留队伍频道与邀请通道的基础语义。

### 14.5.3 持久化表（schema v4 新增 `social` schema；队伍档案/散人池/聊天链接字段见第二十一篇 §21.9）

- `social.friend_requests`：好友申请（`pending`/`accepted`/`rejected`/`cancelled`），`(requester_id, target_id)` 的 pending 部分唯一索引防重复申请；
- `social.friendships`：双向好友关系（两行）；
- `social.parties` / `social.party_members`：队伍与成员（`player_id` 作主键，一名玩家最多一队）；schema v7 起 parties 追加 `name`/`activity_kind`/`map_id`/`min_valuation`/`is_public`/`updated_at` 档案列；
- `social.party_invitations`：待处理队伍邀请（`invitee_id` 作主键，每人最多一条）；
- `social.party_seekers`（schema v7）：「匹配中」散人登记（`player_id` 作主键）；
- `social.chat_messages`：聊天消息（含保留清理索引；schema v7 增 `party_ref` 队伍链接外键）。

---

## 14.6 协议契约

新增 `WireMessageType`：

| 值 | 名称 | 方向 | 载荷 |
| --- | --- | --- | --- |
| 18 | `ChatSend` | C→S | `ChatSendDto` |
| 19 | `ChatMessage` | S→C | `ChatMessageDto` |
| 20 | `ChatHistory` | S→C | `ChatHistoryDto` |
| 21 | `SocialAction` | C→S | `SocialActionDto` |
| 22 | `SocialState` | S→C | `SocialStateDto` |
| 23 | `ChatHistoryRequest` | C→S | `ChatHistoryRequestDto` |
| 24 | `UnitInspect` | C→S | `UnitInspectDto`（火忘帧，无回执） |
| 25 | `PartyLobbyRequest` | C→S | `PartyLobbyRequestDto`（见第二十一篇 §21.6） |
| 26 | `PartyLobby` | S→C | `PartyLobbyDto` |

- `ChatSendDto { requestId, channel, body, targetPlayerId? }`：`targetPlayerId` 仅好友频道使用；正文去首尾空白后 1~200 字符。
- `ChatMessageDto { messageId, channel, scopeKey, senderId, senderName, body, sentAtUnixMilliseconds, partyLink? }`：`partyLink` 为队伍卡片快照（见第二十一篇 §21.8），队伍解散后缺席。
- `ChatHistoryDto { channel, scopeKey, targetPlayerId?, messages[] }`：`targetPlayerId` 仅好友频道回填，供客户端把会话映射到具体好友。
- `ChatHistoryRequestDto { channel, targetPlayerId? }`。
- `SocialActionDto { requestId, action, targetPlayerId?, targetName?, partyId?, channel?, party? }`，`action` ∈ `friend.request|friend.accept|friend.reject|friend.remove|party.invite|party.accept|party.decline|party.leave|party.create|party.update|party.disband|party.kick|party.join|party.match.set|party.match.clear|party.share`（后 8 个动作的字段语义见第二十一篇 §21.7/§21.9）：
  - `friend.request` 可用 `targetPlayerId` 或 `targetName`（道号检索）指定目标；
  - `friend.accept` / `friend.reject` 用 `targetPlayerId` 指向申请人；
  - `party.accept` / `party.decline` 作用于自己待处理的邀请，忽略 `targetPlayerId`；
  - `party.invite` 在自己未组队时**自建队伍并任队长**（邀请是组队的唯一入口）。
- `SocialStateDto { requestId?, friends[], incomingRequests[], outgoingRequests[], party?, partyInvitation?, nearbyPlayers[], seeking? }`：
  - `friends[]`：`FriendDto { playerId, displayName, online }`；
  - `incomingRequests[]` / `outgoingRequests[]`：`FriendRequestDto { requestId, playerId, displayName, createdAtUnixMilliseconds }`；
  - `party?`：`PartyDto { partyId, leaderId, name, activityKind, mapId, minValuation, isPublic, members[] }`，`PartyMemberDto { playerId, displayName, online, valuation }`，队伍上限 5 人；
  - `partyInvitation?`：`PartyInvitationDto { partyId, inviterId, inviterName, partyName }`；
  - `nearbyPlayers[]`：`NearbyPlayerDto { playerId, displayName }`（同节点在线修士，含自己）；
  - `seeking?`：`PartySeekerDto { activityKind, mapId, minValuation, createdAtUnixMilliseconds }`（本人匹配中登记，未登记为 null）。

`requestId` 回传用于指令配对；为 null 表示服务端主动推送（好友上线、队伍变更、附近修士变化）。

---

## 14.7 服务端组件

- `ChatRuntime`（单例）：频道作用域解析、消息落库与广播、历史回放；
- `SocialRuntime`（单例）：好友与队伍的持久化读写、在线状态、附近修士快照；
- `OnlinePresenceRegistry`：在线会话 → 玩家 ID / 道号 / 当前节点，供世界、附近广播与在线状态判定；
- `WebSocketRuntime`：入站 `ChatSend` / `SocialAction` 分发，出站 `ChatMessage` / `ChatHistory` / `SocialState` 推送；
- 玩家节点变化（`world.travel` 抵达、握手加载快照）触发 `OnlinePresenceRegistry.UpdateNode`，并重算附近修士快照。

聊天与社交**不经过玩家级单写者门禁**：它们不属于玩家聚合状态，由独立单例服务串行化处理，避免跨玩家互相阻塞。

# 第十五篇 服务端领域数据架构与聚合运行时规约

> **作废声明**：本篇「聚合运行时规约」已被《第十八篇 服务端 ECS 化执行架构与触发器规约》正式继任——行动/战斗调度内核（`SimulationEngine`/`DeterministicCombatEngine`/`DuelScriptEngine`）已迁入 `src/Ecs`，Domain 回归纯领域库（POCO/配表/公式/编解码），执行宿主统一为 `EcsWorldShard`（含 ComputeNode）。本篇保留作历史参照；凡与第十八篇冲突处以第十八篇为准。

## 15.1 四层数据架构体系
```text
┌────────────────────────────────────────────────────────────────────────┐
│ 1. 策划静态配置 (GameData 解析) │ 只读不可变、编译期内嵌启动加载、ReadOnlyDictionary │
├────────────────────────────────────────────────────────────────────────┤
│ 2. 运行时玩家聚合 (PlayerAggregate) │ PlayerSectionKind 八分段、ECS 分片单写者   │
├────────────────────────────────────────────────────────────────────────┤
│ 3. 纯业务逻辑系统 (SimulationEngine) │ 纯函数离散事件模拟推进、100% 确定性      │
├────────────────────────────────────────────────────────────────────────┤
│ 4. 持久化与快照 (Snapshots/DTO)   │ 异步落盘、冷计算传输、不可变流式投影     │
└────────────────────────────────────────────────────────────────────────┘
```

## 15.2 纯函数离散模拟引擎与单写者架构
- **单一真源推进**：所有挂机时间、产物结算与战斗模拟严格以 `SimulationEngine.AdvanceTo(state, now)` 为唯一真源，杜绝任何第二套执行器或过渡调度系统。
- **领域聚合零损耗**：玩家状态收敛为单体聚合 `PlayerAggregate`，按 `PlayerSectionKind` 划分为 8 大分段（`progression` / `world` / `combat` / `buffs` / `loadout` / `settings` / `action_queue` / `duel`），高频 Tick 直接访问聚合内存字段，零反射、零哈希查找。
- **ECS 分片单写者并发**：生产运行时为优化版 YuoCore ECS——`EcsGameRuntime` 按 `PlayerId` 哈希把玩家固定路由到 `EcsWorldShard`（`YuoWorld`+`YuoFiber`），同一玩家的命令与模拟推进在该分片 Fiber 内串行执行；适配层 `EcsPlayerRuntimeAdapter` 另持玩家级 `SemaphoreSlim` gate 作为跨边界串行保证。玩家聚合不再常驻：`MutatePlayer`/`RemoveAction` 等命令在锁内把实体组件状态还原为 `PlayerAggregate`、执行领域操作、整体回写组件并合并脏分段差集；跨边界访问仍不得直接持有聚合或 `YuoEntity` 引用。

## 15.3 实验性三版本运行时对比边界（TASK-20260924-09）

本节实验用于区分业务 ECS 迁移收益与 YuoCore 内核优化收益。**实验已收敛并收敛为单一实现：优化版 ECS 是生产权威运行时**——`src/Server`（生产入口）即优化内核宿主（`Program.cs`+`EcsPlayerRuntimeAdapter`，引用 `vendor/YuoCore`，上游 `ecs-optimized` 分支）。三版本对照设施（OOP `PlayerRuntime`、`ecs-current` 基线宿主 `src/ServerEcs`、基线 submodule、双内核差分台与消融开关）已全部退役删除，仓库只保留一套实现。历史三版本对照表（供回溯源）：A·OOP 已退役、B·ECS-current 已退役（原基线 submodule 已移除）、C·ECS-optimized 即当前生产——优化内核已正式采用，`vendor/YuoCore` 现指优化内核（上游 `ecs-optimized` 分支），原同名基线路径不再存在。

三种服务必须分别构建、分别启动、分别采样，使用同一份游戏数据指纹、角色种子、行动开始时间、随机种子和协议入口。每个服务的工作目录、日志、GC/RSS 统计与数据库隔离；构建产物分别落在 `artifacts/runtime/oop`、`artifacts/runtime/ecs-current`、`artifacts/runtime/ecs-optimized`。由于两个 YuoCore 的程序集名称与命名空间相同，禁止在同一进程装载基线与优化版本。

ECS 游戏核心只实现一套，初始 B/C 对照仅替换 YuoCore 内核。玩家、怪物、遭遇和地图节点分别是长期可查询的实体；玩家采用粗粒度业务组件（身份、成长、世界、战斗、装配、Buff、行动队列、背包、经济），怪物和地图节点按同一套组件/系统边界组织。行动时钟、行动队列、采集、制造、战斗、奖励与快照系统必须保持离散事件边界、随机数顺序、`RemainingRepeats == -1` 无限循环语义和持久化快照语义与现行 OOP 逐位一致。

TASK-20260927-04 的 300 人离线上线性能收敛实验在 C 中增加宿主/游戏 ECS 优化编译路径：移除跨玩家全局加载门、缓存请求内组件引用，并合并单玩家无战斗计时行动的连续自然窗口。源码仍由 B/C 共用，领域原语与终态必须相同，但此后的 C/B 差值包含这些宿主与调度优化，**不能再全部归因于 YuoCore 内核**。报告应同时保存改造前的纯内核对照与改造后的端到端结果。该批量路径仍由当前玩家 Entity、业务组件与 ECS 行动工作区推进；每次请求末经 Fiber Tick 提交。战斗、旅行或队列切换到其它行动时回到完整 System 顺序，必须验证结果与持久化逐位一致。

对比报告必须同时输出墙钟、CPU、分配、GC、RSS、数据库与网络开销的总量及 p50/p95/p99/max，并记录每个版本相对 A/B 的实测倍率。用户不要求优化 ECS 必须胜过 OOP，因此 OOP 回归不设置“必须赢”的硬门槛；但用户给出的优化目标仍须原样展示并实测：优化 ECS 相对 ECS-current 的核心模拟 p95 目标至少降低 20%、每玩家分配目标至少降低 20%、GC 暂停不增加 10% 以上。未达目标必须如实报告，不得调低门槛或伪造达标；是否可替换仍由真实采集、制造、战斗和离线补算结果及“不比当前实现弱太多”的综合判断决定。任何只在极端 ECS 形状基准中变快、而真实玩法明显变慢或结果不一致的实现，不得进入正式服务。

当前状态说明：**优化版 ECS 已是生产核心架构**——`src/Server` 为生产宿主，全部业务命令经 `EcsPlayerRuntimeAdapter`+`EcsWorldShard.MutatePlayer` 通道落到 ECS 实体；`Domain` 保持纯领域（`SimulationEngine`/`PlayerAggregate` 文档往返不变）。命令迁移已完成：行动入队/取消/循环/排序、功法习得、装配替换、境界突破、世界移动、市场与物品操作、建筑贡献、改名、推进与在线状态等 OOP 全量命令面已逐条对齐；回执幂等、钱包事务、脏段差集、属性输入修订（`WireAttributesChanged`）、弃战路由语义保持一致。以下 15.3.1 起的实验过程规格为历史记录：差分/消融/三版对比设施已退役删除，其中仍生效的运行时不变量（亚 tick 残差、分片所有权、推送语义、脏段差集）已并入正文与代码注释。

### ECS World/Fiber 分片所有权边界（实验运行时）

实验 ECS 运行时允许按固定数量拆分独立的 `YuoWorld`/`YuoFiber` 分片。每个分片独占自己的 `EcsClockComponent`、玩家/遭遇/怪物实体集合、模拟结果缓冲和 owner gate；同一玩家在运行期间固定由稳定的 `PlayerId` 哈希路由到一个分片，不做在线迁移或动态扩缩容。服务端保留玩家级 gate，分片 gate 只负责保护该分片的 ECS 单写者，因此同一玩家的命令、推进、恢复和销毁仍按原顺序串行执行。

`shardCount` 默认值必须为 `1`，保证现有公开 `World`/`Fiber` 访问和单分片测试语义不变；基准实验可显式使用 `4`（后续再评估 `8`）。多分片只改变所有权和调度，不改变领域公式、自然边界、随机数顺序、快照、持久化、协议和数据库提交顺序。地图节点是各分片的只读长期投影，玩家、怪物和遭遇实体不得跨分片持有 `YuoEntity` 引用。

分片初始化必须顺序执行；只有默认分片可设置 `YuoWorld.Instance`，业务系统不得依赖静态 `YuoWorld.Main/Instance`。`YuoWorld.CloseSystemTry` 是进程级状态，运行时销毁不能在仍有其他分片或运行时存活时恢复该值。停止流程先拒绝新请求并等待分片 gate/mailbox 清空，再逐分片释放 Fiber/World。分片数量增加会重复程序集扫描、系统实例和基础实体，必须单独记录启动耗时、RSS、GC 和实体生命周期指标。

本阶段不实现跨玩家实时批量 Tick。跨玩家批量 Tick 仍需解决不同目标时间、`ActivePlayerId` 单值时钟、按玩家回滚和取消回执等语义问题；任何批量实现必须先证明与逐玩家回放逐位一致。TASK-20260927-04 只合并单玩家请求内部的无战斗自然窗口，不合并多个玩家的命令。

---

### 15.3.1 计时行动共享原语边界

采集与制造共用 `IPlayerActionContext` / `IPlayerActionState` 纯领域视图。视图直接引用状态所有者的粗粒度分段；队列操作、账本和脏标通过实际单写者回调完成，不创建第二份权威玩家。`TimedActionDuration`、`PrepareTimedAction`、`AdvanceTimedAction`、`CompleteTimedAction` 保留现行 OOP 的建筑倍率、整秒进位、收益、材料扣除、持续用品和无限循环结算顺序。ECS 时钟与队列负责边界选择和准入，采集/制造系统推进单轮，收益/完成系统提交本轮变化；资源自然窗口负责 Buff、回复、用品冷却、资产与版本提交。不得逐边界导出/重建整个 `PlayerAggregate`，不得把整段 `AdvanceWithResources` 改名包装为 ECS 阶段。早期 `ActionAdvanceSession` 已随原语接线删除，不保留兼容入口。

### 15.3.2 资源窗口、战斗实体与真实宿主验收（2026-09-25 04:05:43）

`EcsActionPipeline`只保存请求/资源边界、直接组件视图和窗口流水，不持有`PlayerAggregate`。Clock开启5秒回复/Buff到期/自动用品冷却自然窗口；Queue准备当前轮；采集/制造/移动系统分别推进自己的自然边界；`CombatEventAdvanceSystem`对实际Encounter与Combatant引用执行`AdvanceOneBoundary`；窗口末或终局由共享战斗原语结算技能、持续用品、死亡、掉落与远征轮转，再执行资源回复和Core版本，最后请求合并资产与版本。其它玩家的tick不能切碎当前玩家原本的浮点预算。零时间准备不得重复消耗物品、随机数、年龄或版本。

**亚 tick 残差不变量（2026-09-28 修复）**：`DateTimeOffset` 以 100ns tick 量化，double 精度的窗口剩余预算可能残留 <1 tick 的量；该残差经 `AddSeconds` 取整会让下一自然边界落回同一时刻，形成"边界==游标"的死循环不动点。规约：行动推进步长以 `min(remaining, needed)` 直接消费（`frameTarget >= NextBoundaryAt` 已蕴含可达性，不得再用量化差值二次限幅）；`CompleteClock` 在 `frameTarget >= windowEnd` 时对 ≤1μs 残差直接归零。

战斗`double`目标由窗口原始余量计算；UTC时钟仅决定系统调度先后，禁止将100ns量化后的差值反复回减成战斗预算。请求结束按现行OOP次序导出完整战斗快照，保留资源镜像和战斗单位内部值的原有区别。载入后恢复一次战斗单位，运行中原地续用；当前/optimized两版复用完全相同的ECS源文件。

宿主日志必须从已提交模拟事件经共享Mapper生成，写入每玩家有界日志buffer并驱动真实WS日志批次及快照增量；资产/状态事务失败时不得发送成功日志。基准持续模式以真实墙钟duration运行、常驻WS连接并发有界，报告实际连接/命令数、总耗时与人均耗时；离线`target-hours`只是模拟跨度，不能冒充在线15/60分钟负载。角色种子按三场景各1000生成，战斗保持持续重复。当前本机默认端口存在既有服务时，基准使用显式空闲端口覆盖，不停止用户既有进程。


### 15.3.3 基准控制面与观测口径（2026-09-25 14:03:00）

基准宿主仅允许 `Development`、API 角色、明确的 `DAOHUA_BENCH_MODE=replay|online` 与三种 variant，并核对本机 PostgreSQL 的三张实验库白名单。`replay` 必须提供固定业务时钟，禁用在线模拟、周期玩家刷盘和冷挂机派发；测量结束显式 flush。`online` 禁止固定时钟，保留在线模拟及持久化后台，按实际墙钟 duration、常驻真实 WebSocket 和显式 concurrency/interval 运行；冷挂机派发在两种基准模式均关闭，避免未加载种子被外部工作者抢先补算。租约和认证过期始终使用系统时钟。

本机 `POST /api/debug/bench/session` 仅为已种入实验库的玩家签发真实 PostgreSQL session 与正式 Cookie，用于绕开批量实验账号的登录准备开销；该端点不修改正式登录限流，不映射到生产环境，也不接受代理来源或浏览器 Origin。其余时钟、flush、metrics 控制面仍要求正式 session。端点映射由 OOP/ECS 共用同一实现，避免验证口径漂移。

观测使用纯 .NET Meter，领域不引用 Server。默认宿主不监听；基准在数据库 bootstrap 与运行时实例化之前监听，三版本必须使用相同 `DAOHUA_BENCH_OBSERVABILITY` 开关。`core.simulation` 样本是一名玩家一次真实推进，不含 Actor/Fiber 等锁等待与数据库；ECS 批量调用另标 `batch`，不得混进逐玩家 p95。共享行动、资源与战斗原语按真实调用阶段计时；ECS 系统 tick、实体创建/销毁及快照导出独立计时。阶段是嵌套观测，不能相加冒充总墙钟。

#### 逐阶段计时契约（2026-09-26）

本实验同时保留请求 RTT、进程窗口指标和服务端阶段直方图。阶段名必须是有限、稳定的代码常量，标签仅允许 `stage` 与 `scenario`（`gathering`、`crafting`、`combat`、`other`、`idle`、`all`）；不得加入玩家、实体、节点、配方或 System 实例 ID。`scenario` 取一次玩家推进开始时的队首行动，之后队列轮转不改写本次请求归属；无可确定的请求归属才用 `all`。在线和 replay 必须按相同埋点与窗口差分方法导出。

| 共享阶段名 | 唯一实测边界 | OOP 与 ECS 对比口径 |
| --- | --- | --- |
| `domain.resource.prepare` | `PrepareResourceBoundaryCore` | 每次自然资源窗口规划，包含 Buff 到期与即时用品检查 |
| `domain.resource.regen` | `CompleteResourceRegeneration` | 仅回复结算；OOP 与 ECS 外层资源收尾结构不同，不将整个 ECS `CompleteResourceBoundary` 假称同一阶段 |
| `domain.action.start` | `TryStartActionCore` | 行动地点、状态、材料等开轮准入 |
| `domain.action.prepare` | `PrepareTimedActionCore` | 持续用品与倍率准备，不与开轮准入混合 |
| `domain.action.advance` | `AdvanceTimedAction` | 计时片段进度与连续收益 |
| `domain.action.yield` | `CompleteRepeat` | 单轮到期的材料、产物、资产、统计与队列结算 |
| `domain.combat.prepare` | `AdvanceCombatPreparationCore` | 搜寻、复活与入场准备；仅在走到此边界时记录 |
| `domain.combat.event` | `DeterministicCombatEngine` 中 OOP `AdvanceTo` 与 ECS `AdvanceOneBoundary` 共用的私有单边界执行函数 | 同一战斗随机原子事件；仅包公开入口会漏掉另一实现 |
| `domain.combat.yield` | `CompleteCombatAdvanceCore` | 战斗片段收尾与终局结算 |
| `domain.combat.reward` | `ApplyCombatRewards` | 实际发生的怪物奖励与掉落；无击杀时可无样本 |

共享阶段必须埋在以上同一领域方法内部，不能在 OOP/ECS 外层各自复制一份名称相同但范围不同的计时。采集与制造沿用 `gathering`/`crafting` 场景标签，战斗用 `combat`；共享方法若在非目标玩法也执行，其样本仍按本次推进场景记录。对这些阶段的倍率，仅在三版相同初态、游戏数据指纹、目标时钟、成功命令和结果一致的 replay 窗口中计算。

领域外层调度阶段以 `domain.logic.*` 命名（原 `oop.logic.*`，OOP 退役后更名）：`domain.logic.resource_window` 是 `AdvanceWithResources` 中一次自然窗口从准备到回复的完整控制段，`domain.logic.action_dispatch` 是其一次 `AdvanceToCore` 调用，`domain.logic.combat_dispatch` 是 `AdvanceCombatAction` 调用。它们显示领域侧外层循环与分派开销，内部会包含上述 `domain.*` 样本；不能与 ECS System 的总量直接相除称为算法倍率。`core.simulation` 仍是一名玩家的一次请求级模拟外层。

ECS 对每个实际游戏 `YuoSystem.Run` 的**活动玩家/遭遇业务调用**记录 `ecs.system.run.<SystemClass>`。先通过 `ActivePlayerId`/准备态门控，再开始计时；非活动实体的空返回不逐次写 Meter，以免全实体遍历在千人负载下制造海量观测样本并扭曲性能。覆盖 `ActionClockSystem`、`ActionQueueSystem`、`GatheringActionSystem`、`CraftingActionSystem`、`ActionBoundarySystem`、`TravelActionSystem`、`TimedActionYieldSystem`、`CombatActionBoundarySystem`、`CombatActionYieldSystem`、`PlayerClockCommitSystem`、`CombatEventAdvanceSystem`、`CombatTargetSystem` 和 `CombatEventSystem`。按类名聚合活动调用，不记录实体 ID；即使活动实体在业务条件判断后不推进，也记录一次调度成本。`ecs.system_tick` 保留每次 Fiber/World Tick 的完整调度、查询、遍历和系统调用开销，包含非活动实体的门控成本。`ecs.system.run.*` 不包含 YuoCore 在调用 `Run` 前的查询/迭代及非活动实体的门控成本；不能把 `ecs.system_tick - Σ ecs.system.run.*` 直接归因于扫描，因为嵌套、非业务 System、异步调度与观测本身也在其中。

ECS 所有权另列 `queue.owner_wait`（进入分片 gate 前）、`ecs.owner_hold`（取得 gate 到释放，含备份、模拟、失败恢复）和 `ecs.mailbox.post`（每次宿主向 Fiber 提交消息并等待完成）。`ecs.system_tick` 已覆盖 `TickAsync`，不再为同一调用重复命名 `ecs.fiber.tick`。这几个阶段彼此嵌套或相邻，owner 等待的并发累计值不能并入请求墙钟。混合场景中，资源阶段与 System 阶段均归属正在推进的目标玩家请求；当一次 Tick 实际处理多个玩家时标为 `batch`，不把批次样本分摊到单人场景。若无法确定目标玩家，统一标 `all` 并在报告说明，禁止根据被遍历的非活动实体行动类型改写归属。

#### YuoCore 内核深度埋点（2026-09-27）

阶段长表另导出 `mean_ms=total_ms/count`。两套 ECS 具有相同真实调用边界且次数一致的 `ecs.core.*` 阶段可计算 C/B 倍率；OOP 列保持缺失。优化版专属的稀疏存储内部阶段只展示绝对值。

当前和优化两套 YuoCore 使用相同的 `YuoCoreTrace` 委托出口，由 ECS 宿主接入现有 Meter；只在 Meter 已启用时注册，故基准监听器必须先于 World 构造。每个存活 World 分片持有一份 hook 租约，最后一个分片释放时撤销。内核阶段统一以 `yuocore.*` 命名，报告归一化展示为 `ecs.core.*`。采样覆盖 Fiber 邮箱投递、排空和 Tick，World 更新、系统分派与生命周期，System 按类的 Run、实体扫描、条件检查与实体执行，以及 Entity 组件访问和增删。计数器单列 `*.count` 或命中、跳过等事件，不把事件次数误作计时样本数。优化版还记录稀疏组件存储、稠密实体集合和批处理独有的内部步骤；这些阶段没有当前版的同名方法时仅展示单版结果，不计算伪倍率。相同名字只有在真实调用边界相同且调用次数可比时才允许横向计算耗时倍率。

内核阶段与 `ecs.system_tick`、`ecs.system.run.*` 互相嵌套。前者测量 YuoCore 框架调度和组件热路径，后者测量游戏系统活动调用；总量不可相加，不能以两者的差值直接声称扫描或排队的独占耗时。所有阶段按测量窗口导出调用次数、累计毫秒、单次均值和 p50/p95/p99/max；另导出事件计数 CSV。`--target-hours 1` 是业务模拟跨度，真实墙钟耗时必须单独记录。深度观测对热路径有扰动，性能结论需同负载开关观测对照，并以业务终态一致性和三版服务的独立进程、数据库、构建产物为前提。

基准客户端先发送离线命令，关闭 WebSocket 并等待服务端会话和玩家卸载完成，再调用 `POST /api/debug/bench/flush`。该端点先请求仍已加载的玩家把脏 section 入 durable queue，再在同一请求内主动认领并应用队列，直到本轮没有可处理行后才返回；基准专用认领忽略 `next_attempt_at` 的模拟时间，但仍遵守已有租约。这样连接卸载追加的 Progression 写入也会落盘，`player_state_sections`、`player_state_heads`、动作队列和流水才可跨库比较；正常后台 `SectionFlushWorker` 仍按原定到期与退避规则刷盘。`flush` 的主动应用耗时单独计入基准的 `flush_wall_ms`，不能混入玩家模拟阶段。

回放测量窗口结束后，Bench 客户端先通过每条真实 WebSocket 发送同一确定性的 `player.presence=offline` 命令，关闭连接并等待服务端卸载，再调用同步 `flush`。该收尾命令不计入玩家推进 RTT，但纳入终态持久化窗口，保证 OOP 与两套 ECS 不因连接关闭时序不同而留下不同的在线状态。

共享领域方法不能从其调用时的当前队首反推场景，否则行动轮转会把同一请求拆到多个标签。基准启用时，OOP 在已确定的玩家推进外层建立请求场景作用域；ECS 在 Fiber 内执行活动 `Run` 前显式建立同一请求场景作用域，并在离开后还原。领域 `Measure` 从作用域读取标签；没有作用域时使用 `all`。`batch` 作用域只覆盖真正的多玩家 Tick。作用域仅传播观测标签，不改变领域输入、时钟、队列或随机序列；不要假定跨 Fiber 消息自动继承调用方的异步上下文。

每个 `variant × scenario × stage` 导出独立的 `count`、`total_ms`、`p50_ms`、`p95_ms`、`p99_ms`、`max_ms`，报告 JSON 保留 `server_measurements` 明细，并增附 `<report>.stages.csv` 长表（每行一个阶段，保留 `variant`、`scenario`、`stage`、`layer`、`count`、上述耗时字段、`status` 和 `percentile_method`）。三版汇总再输出同阶段横向比较：共享 `domain.*` 可计算 B/A、C/A、C/B 的 `total_ms` 与 p95 倍率；实现专属阶段并排展示但不伪称同名等价；每个缺失单元格保留空值及状态。现有总览 CSV 继续保留，但其 p50/p95/p99 明确是成功命令 RTT，不能替代阶段分位。分位只能由测量窗口的直方图桶差分求出；累计百分位和累计最大值均不能相减。窗口内最大值若不能精确恢复，`max_ms` 必须为 `null`；桶上界估计应在方法说明中注明误差。阶段未被调用显示 `not_observed` 且统计字段为 `null`，该版本不适用显示 `not_applicable`，指标窗口或监听缺失显示 `unavailable`；只有实际观测到样本才显示 `measured`。不得以 `0`、客户端 RTT、邻近阶段或另一版本数值补缺。

所有 `total_ms` 均为该阶段样本耗时累计，可能跨并发玩家重叠，不能直接与墙钟相加。父阶段包含子阶段，`domain.*`、`domain.logic.*`、`ecs.system.run.*`、`ecs.system_tick`、数据库时间和网络时间也不能彼此求和；报告并列展示原值、调用次数与分位，避免把重复包含的时间解释为独占耗时。共享领域阶段用于定位相同业务规则的成本，专属阶段用于解释各运行时的调度与扫描差异。

场景按测量开始的队首行动归入 gathering/crafting/combat/other/idle，不保留玩家标识或高基数标签。每个阶段/场景仅保存固定对数桶、样本数、总量与最大值，桶上界误差不超过 2%；窗口 p50/p95/p99 从前后桶差计算，禁止相减累计百分位。核心没有产生样本时显示不可用，不能拿请求 RTT 替代；不存在的 OOP ECS实体阶段也标不可用，不能填伪零。网络计数来自真实 WebSocket 发送完成与接收字节，接收等待含客户端闲置时间且单列。监听聚合自身时间记录为 `instrumentationListenerMs`，它仅是已观测开销下界；完整开销需相同负载开/关观测的独立重复测量。

在线不同调度产生不同结束时钟，其正确性以协议、命令、日志与错误检查为界，不宣称跨库逐字终态一致。固定初态、RNG 与 target 的 deterministic replay 继续承担跨三库严格 parity，离线 1/8/24/48 小时必须分别执行及比较。

#### 优化版活动实体查询边界（2026-09-27）

优化版 YuoCore 在保持公开 `YuoSystem` 完整实体集合语义的前提下，增加本次 Tick 的活动实体查询：`YuoWorld.SetActiveEntities` 为每个 System 按其稳定加入顺序建立稠密候选数组，`m_Run` 只遍历候选数组，`ClearActiveEntities` 后恢复完整集合遍历。输入实体自动去重，仍保留延迟增删、异常隔离和 System 执行顺序；未设置活动集合的批量 `World.Update` 不改变原语义。

DaoHua ECS 玩家级推进在每次 Fiber Tick 前设置当前玩家实体及其 Encounter 实体（`World.SetActiveEntities`），Tick 完成后在 `finally` 清除；采集/制造只命中玩家，战斗同时保留 Encounter 系统的活动实体。活动查询只改变框架候选集合，不改变领域时钟、随机数顺序、战斗公式、快照或持久化语义。


固定回放的模拟资产事务统一使用共享封装，领域原始增量和行序、`simulation:{playerId}:{StateVersion}:{To}`幂等键、结果载荷与提交后余额版本保持现行语义。事务ID来源通过宿主可选依赖注入；生产与实时在线模式继续随机UUID，仅已通过开发环境、本机实验库校验的`replay`装配确定性ID，使跨库账本比较不受随机运维标识污染。该设置不改变事务结算规则、数据库幂等判断或历史数据格式。

300 人制造并发上线会使共享资产提交的 PostgreSQL Serializable 事务遭遇 `40001` 序列化冲突。资产仓储只在该事务整体回滚后的瞬态冲突上，以同一事务 ID、幂等键、业务时间和载荷，在新连接事务中有限次数重试；每次重试仍覆盖余额、流水、随附 section 与回执的完整原子提交。业务拒绝、幂等内容冲突、取消和非瞬态数据库错误直接上抛。重试耗时计入真实数据库和登录结算总耗时，不得从三版本性能报告中剔除。


下线刷盘必须沿用状态变更后的最新聚合版本：`SetPresence(Offline)`重置离线报告并标脏Duel/Settings后，宿主逻辑版本不得落后于聚合版本，随后Progression/Duel/Settings以同一新版本入durable队列并更新提交头。latest-only的严格递增写入约束保持不变，禁止用同版本覆盖放宽仓储不变量。非法presence值必须显式拒绝，不能默认为Offline改变玩家状态。

# 第十六篇 生产部署、安全边界与 2c4g/40g 容量目标

## 16.1 生产运维拓扑与持久化
- **部署架构**：Release 多阶段构建 $\to$ CCR 不可变标签 + `prod` 标签 $\to$ 服务器 systemd timer 自动更新 $\to$ Caddy 反向代理 HTTPS/WSS 至回环 `127.0.0.1:15128`。
- **PostgreSQL 权威存储**：账号、玩家快照、Durable Outbox、市场账本与流水全量落库 PostgreSQL；Docker 命名卷 `daohua_daohua-postgres` 承载持久数据；每小时自动生成 gzip 压缩备份并生成 SHA-256 校验。
- **WAL 恢复窗口**：归档对象包含 WAL 段、时间线历史与备份历史文件，以 `<原名>.gz` 压缩原子写入；重复归档校验原始内容一致，PITR 解压恢复。仅 PostgreSQL 自行回收 `pg_wal`，禁止手动删除积压段。

## 16.2 2c4g/40g 容量目标与基准数据

下表是既有 Release 5800X 的历史基线，包含估算与局部引擎测量；原有“通过”只表示当时测试口径，不是当前真实业务链路或 2c4g 主机容量已验收。当前容量验收必须覆盖专用 PostgreSQL 库、5000 账号存储、100/500 个认证业务收发连接，以及冻结一小时欠债的 2000 名玩家经 ComputeNode → 主服独立 ECS 重演 → 原子落库的全部终态。必须同时记录 Server、ComputeNode、PostgreSQL 的 CPU、RSS、WAL、磁盘与网络证据；目标集合未全部成功、任务中止或资源证据缺失时失败关闭，禁止用 synthetic、少量样本或完成任务百分比替代。

| 场景 | 目标指标 | 历史基线 (Release 5800X / 2c4g 换算；非本轮验收) | 历史预算判断 |
| :--- | :--- | :--- | :--- |
| **账号存储** | 5,000+ 注册账号 | 5,000 账号快照存储仅 **18.6 MB** | 268.4 MB (通过) |
| **在线收发** | 500+ 高峰网络收发 | 500 人稳态下行 **568 KB/s**，服务端 CPU 增量 **5.2s / 15s** | 524 KB/s 峰值 (通过) |
| **离线补算** | 2,000+ 离线挂机补算 | 10,000 人 1 小时补算仅 **2.65s 墙钟** (吞吐 135.8 万边界/秒) | 30s 预算 (通过) |
| **内存工作集** | 运行时常驻内存 | 10,000 人补算后工作集仅 **124.3 MB** | 805.3 MB (通过) |
| **市场撮合** | 订单簿高频撮合 | 100,000 单并发撮合仅 **217.4 ms** (~46 万单/秒) | 0 错误 (通过) |

## 16.3 三版本 ECS 实验的部署隔离边界

基准宿主（生产 `src/Server` 的 Development 基准模式）是本地/专用基准环境的独立进程，不属于当前生产拓扑，也不能共享生产数据库、数据卷、日志目录或端口。约定基准入口为 `127.0.0.1:5130`，数据库为 `daohua_bench_ecs`，运行产物写入 `artifacts/runtime/ecs`。这些名称只服务于隔离测试，不能替换正式 `daohua` 服务、`127.0.0.1:15128` 生产入口或 `daohua_daohua-postgres` 卷。

基准服务必须复用同一份游戏数据指纹和确定性种子，单独采样 CPU、分配、GC、RSS、数据库和网络开销。只有三套服务完成真实 HTTP/ WebSocket / PostgreSQL 边界验证、结果逐位一致、并通过单玩家到目标规模及离线补算门禁后，才能提交是否采用 ECS 的决策；在此之前不得把实验端口、实验镜像或实验数据库接入 Caddy、systemd 自动更新 timer、CCR `prod` 标签或生产持久卷。优化 ECS 的建议目标为相对 ECS-current 核心模拟 p95 降低 20%、每玩家分配降低 20%、GC 暂停增幅不超过 10%，达不到时如实记录，不能为了发布改写生产容量口径。

## 16.4 反多开与反小号账号约束

服务端权威执行设备注册与账号关联限制：默认稳定设备安装标识只能注册一个账号，同一设备主体最多关联两个账号。浏览器无法证明自然人身份；设备配置、IP、网段与指纹只参与综合风险判断，不能独立证明同一人。注册、登录与 Hello 均执行检测，拒绝登录不得签发会话或成功事件。

检测项必须独立动态启停，策略、稳定 HMAC 密钥、关联与审计落 PostgreSQL；软风险支持放行、复核与拒绝，配置相同或共享 IP 不单独硬封。前端只采集摘要，生产构建混淆提高分析成本，密钥与裁决不进入前端。Development 运维面板提供“账号检测”页与令牌保护的策略写入，生产沿用关闭 Ops 路由的边界。具体模块、事务和在线所有权见 [`anti-multi-open.md`](../../backend/anti-multi-open.md)。

# 第十七篇 行动统计系统

> 状态：已随 TASK-20260919-01 落地。本文是行动统计（战报泛化）的唯一权威设计真源。
> 领域实现：`src/Domain/Player/PlayerDuel.cs`（`PlayerBattleReport` / `PlayerDuelState`）与 `src/Domain/Player/ActionReportBook.cs`（记账原语），结算调用点在 `src/Ecs/Engine/SimulationEngine.cs`。
> 前端：`frontend/src/components/StatsPanel.tsx`（原 `BattleReportPanel` 重构），组件登记见 `common-components.md` §24。

## 17.1 定位

原「战斗收益战报」泛化为**行动统计**：对任意行动（战斗、采集、炼丹、修炼、赶路等）按三类账本持续记录收益与计数，替代仅服务战斗的旧战报。

## 17.2 三个账本

同一 `PlayerBattleReport` 结构承担三类账本：

| 账本 | 绑定 | 生命周期 | 用途 |
| :--- | :--- | :--- | :--- |
| 行动实例账本 | 队列中的**行动实例**（`actionInstanceId`） | 建账于实例开始推进，出队即归档 | 一个任务无论重复多少次都算一个行动，持续记录 |
| 离线挂机账本 | 玩家（单例，`reportId="offline"`） | `Presence` 转入 `Offline` 时重置 | 关闭网页离线挂机期间的全部收益，每次离线会话重置 |
| 每日统计账本 | 玩家（单例，`reportId="daily"`） | 按 **UTC+8 自然日**（`DayIndex`）自动 rollover | 自然日重置 |

- 交易（坊市）不计入任何账本。
- 记账枢纽 `PlayerAggregate.RecordStats(actionInstanceId, atUnixSeconds, apply)`：同一条 `apply` 依次作用于 ①实例账本（存在才记，不隐式建账）②离线账本（仅 `Presence==Offline` 时）③每日账本（先按 UTC+8 日界 rollover 再入账），统一 `MarkDirty(Duel)`。
- 建账：`EnsureActionReport` 在实例通过全部前置校验、开始推进时 get-or-create；`Blocked` 行动不建账。
- 归档：`ArchiveReportForAction` 挂接在 `RemoveAction`、travel 去重 `RemoveAt`、`CompleteOrRequeueHeadAction` 三处出口；空账本丢弃，非空插入 `Reports` 头部并裁剪至 `MaxBattleReports`（10 条）。

## 17.3 账本字段

`PlayerBattleReport` 字段清单（领域字段 / wire JSON 键为 camelCase 同名小写首字母）：

- **经验池**：

| 字段（wire 键） | 语义 |
| :--- | :--- |
| `Experience`（`experience`） | 修为（突破计量条）实际入账增量：瓶颈截断与底蕴兑换放大后的真实入账 |
| `Foundation`（`foundation`） | 底蕴净变动：满层溢出沉淀为正、兑换放大消耗为负（可为负值） |
| `CombatExperience`（`combatExperience`） | 战斗经验入账量：修为类收益按增幅前基础量等额记账，不受任何加成增幅 |
| `RootExp`（`rootExp`） | 六维经验收益（体魄/经脉/力道/根骨/身法/神识） |
| `AbilityExp`（`abilityExp`） | 功法参悟经验收益，按功法 ID 聚合；战斗/斗法中每次成功施放 +1 |
| `LevelUps`（`levelUps`） | 等级提升：`Kind ∈ realm/root/ability`，含 `FromLevel`/`ToLevel` |

- **物品**：`Items`（获得，含暂存区/缴获）、`ItemsLost`（失去：行动输入材料、自动消耗品扣件、斗法暂存被缴）。
- **行动信息**：`Cycles`（完成轮次）、`Encounters`（战斗遭遇场次）、`NormalKills`/`EliteKills`/`BossKills`（分级击杀）、`Deaths`（讨伐失败与斗法败北）、`DuelWins`/`DuelLosses`（斗法胜负）、`DayIndex`（仅每日账本）。
- 记账按**实际入账量**：`experience` 记瓶颈截断与底蕴兑换放大后的真实增量；`foundation` 记底蕴池净变动（满层沉淀为正、兑换消耗为负）；`combatExperience` 恒按增幅前基础量等额记账。

## 17.4 记账点（SimulationEngine）

| 位置 | 记账 |
| :--- | :--- |
| `ApplyContinuousReward` | 修为类收益经 `CreditExperience` 落 `Experience`/`Foundation`/`CombatExperience` 三池；Mana/Hitpoints 资源回充 |
| `CompleteRepeat` | 修为类收益同上经 `CreditExperience`；Mana/Hitpoints；Item 产出（+）、Inputs（−）、`Cycles+1` |
| `ApplyCombatRewards` | `experience` 单参数→`CreditExperience` 三池 + `DistributeRootExp` 六维全额入账；掉落（+）或 StageItem（+） |
| `DistributeRootExp` | 六维入账 + root 级 `LevelUp` 检测 |
| 波次生成 | `Encounters+1` |
| 波次清空 | `Cycles+1` + 分级击杀 `NormalKills/EliteKills/BossKills` |
| 讨伐失败 / 斗法败北 | `Deaths+1`（斗法另计 `DuelLosses`） |
| 斗法胜 | `DuelWins+1`，缴获入 `Items` |
| 自动消耗品扣件 | `ItemsLost+1` |
| travel 抵达 | `Cycles+1` 后实例出队归档 |
| `GrantAbilityExperience` | `AbilityExp` + ability 级 `LevelUp` |
| `Breakthrough` | realm 级 `LevelUp` |

## 17.5 协议与前端

- wire `duel` 分段 = `PlayerDuelStateDocument` JSON（camelCase），随文档自动下发 `offlineReport`、`dailyReport`、`activeReports`；`currentReport` 为队首行动账本（兼容便捷访问）。账本内新字段 `foundation`/`combatExperience` 随 `PlayerBattleReportDocument` 一并下发，前端按缺省 0 容错解析。
- `types.ts` / `snapshot.ts` 解析新字段（缺省容错）；`battleReportStore` 读取 localStorage 旧缓存时为新增字段补默认值。
- `StatsPanel` 分区：当前行动 / 离线挂机 / 今日统计；每区三小节——获取经验（含等级提升）、物品得失、行动信息；另保留斗法暂存区与近期战报历史。暂存区按 `itemId` 聚合为 `ItemReference` 胶囊行：仅显示该物品暂存总量（批次口径见 07 篇 §7.10.3 档位桶化，结算倒计时不向前端展示）。
- 刷新页面且队列非空时自动进入「详情」（combat Tab）。

## 17.6 不变量

- 实例账本与实例 Id 一一对应，轮转/重复执行续记不重置，出队即归档。
- 离线/每日单例账本的 `ActionInstanceId` 为 `Guid.Empty`、`ActionId`/`ActionName` 允许空串。
- 归档历史上限 10 条；导出/恢复往返后三账本完整还原。
- 所有记账只依赖确定性模拟推进，在线/离线/冷挂机补算一致。

## 17.7 行动内战斗单位统计

讨伐行动存续期间，对行动内全部战斗单位的结算量持续累计，挂于队首行动实例账本（`PlayerBattleReport.CombatStats`，`combatants` 字段随 duel 分段持久化与下发）。

- **统计单位**：本机成员 `player`、参与会话盟友 `ally:{成员下标}`、怪物按定义 ID 折叠为 `monster:{defId}`（同类型合并计一个单位）。斗法对方玩家队伍不入账——撮合推演只把本方一行并入账本。
- **口径**：伤害输出、实收伤害、减免伤害均按物理/术法分列；减免 = 命中时原始威力（减免链前 `RawDamage`）− 实际落账伤害，未命中不落账；治疗分自动回复（战内 5 秒 tick + 行动期间战外自然回复）与其他治疗（技能治疗、气血汲取、药品瞬回）。
- **记账点**：`CombatActSystem.ResolveAttack`（普攻/技能命中）、`CastSkill` 治疗分支、`CombatBuffTickSystem` 周期回复、`CombatTriggerMath` 汲取/反伤、消耗品路径（药品瞬回、雷击符术法打击）、资源时钟自然回复。
- **生命周期**：开战入场/快照恢复/手动钉死三处挂接 `StatsBook`；每步战斗推进在 `CompleteCombatAdvanceCore` 收口 `FlushCombatStats` 标脏；行动出队归档时 `CombatStats.Clear()` 即弃，不进入归档战报。
- **斗法**：`DuelScriptEngine.Resolve` 推演时挂接私有统计簿，剧本携带 `InitiatorStats`/`DefenderStats` 各仅本方一行；`DuelPlaybackState.ViewerStats` 随回放载荷持久化，`AttachDuel` 并入队首账本 `player` 行。
- **前端**：`StatsPanel` 当前行动账本新增「战斗单位」表格小节（`ReportCombatantsSection`），归档/离线/每日账本无此数据不渲染。

---
*设计总纲结束。*

# 18 · 服务端 ECS 化执行架构与触发器规约

> 本文档是继任规约：取代总纲 15「聚合运行时规约」中"System 仅作调度壳、Domain 承载全部规则"的分层口径。ECS 从调用层升级为**规则本体层**；Domain 退化为纯库。文档先行，实施序见 §10。

## 0. 目标与红线

**目标**：业务规则本体（推进、结算、触发反应）写在 System 体内，状态写在 Component 上；System↔Domain 静态函数的三段转调结构退役。

**不可动红线**（与现状逐位一致）：

- 边界驱动调度：拍=自然边界跳转，不回到固定帧率。
- `AdvanceTo` 批量窗口推进：一拍消化整段窗口战斗段。任何重构不得以"逐边界一拍"替换它（那是 15 万拍/30h 的已修复缺陷形态）。
- 逐整秒浮点序列、`RemainingRepeats == -1` 无限循环保留、先校验后变更、窗口工作钱包语义。
- `MaxTransitionsPerAdvance` / `MaxEventsPerAdvance` 保险丝语义。
- 单写者：同一玩家全部变更在分片 Fiber 内串行；跨边界不留实体/聚合引用。
- `double` 数值纪律与在线/离线/重连逐位一致。

## 1. 分层反转

```
当前：  System（规则本体）→ Component（状态本体）
        Domain = 纯库：配表类型 / POCO 状态 / 纯公式 / SectionCodec / 协议映射 / DTO
        SimulationEngine/DeterministicCombatEngine = 无世界测试与兼容门面，转发到 ECS System
```

| 层 | 装什么 | 不装什么 |
|---|---|---|
| `src/Domain`（纯库） | `GameDataCatalog`、`ActionDefinition`、`ActiveBuff`/`CombatantState` 等 POCO、属性乘区合成等**无状态公式**、`SectionCodec`、`ProtocolSnapshotMapper`、事件 DTO | 引擎、推进器、状态机的规则方法 |
| `src/Ecs`（规则本体） | 实体、组件、13+N 个 System（含行动实现与战斗边界调度器）、触发器 System 族、`EcsActionPipeline`（退化为请求上下文：窗口/钱包/账本） | 宿主、协议、存储 |
| `src/Server` | 宿主、WebSocket、持久化适配 | 不变 |
| `src/ComputeNode` | **同一 `EcsWorldShard` 执行环境**（§9） | 不变红线：无权威状态、无生产库 |

运行时状态 POCO 物理上仍驻留 `Domain` 程序集（`SectionCodec` 内聚需要），但其中**不得有任何推进规则方法**——状态类是纯数据。

## 2. 组件划分：反应性粒度

拆分原则（用户裁定）：**需要响应事件的独立成组件；纯被读取的数据按内聚域合并**。

### 玩家实体

| 组件 | 内容 | 反应性 | 持久化分段 |

| `PlayerResourcesComponent` | `Hitpoints`/`Mana`/资源游标 | 持久化资源（战斗内外同一份） | Combat |
| `PlayerStatsComponent` | 解析后战斗面板 + 输入修订号 | 被公式读 | 不落库（派生缓存） |
| `PlayerProgressionComponent` | 境界/经验/修为/统计 | 被写入 | Progression |

| `PlayerLoadoutComponent` | 装备/法宝/技能装配 | 被公式读 | Loadout |
| `PassiveBuffsComponent` | **纯修饰 buff 合并容器**（StatRatios/攻速/减伤等） | 被公式读 | Buffs |
| **Reactive Buff 组件族** | 每种触发型 buff 一个组件类：`OnHitHealBuffComponent`/`ThornsBuffComponent`/`OnKillBuffComponent`…字段=触发参数 | **主动反应** | Buffs（`ActiveBuff` 扩展） |

### 遭遇 / 节点 / World

## 3. System 拓扑

### Update 序列（骨架不变，本体化）

| 400 | `TimedYieldSystem` | 计时轮结算：入账、材料扣除、repeats、出队 |
| 550 | `CombatPrepSystem` | 搜寻/复活阶段推进与遭遇附着 |
| 600 | `CombatAdvanceSystem` | `AdvanceTo` 整段窗口推进（含段内触发器派发） |
| 610 | `CombatTargetSystem` | 主目标实体索引 |

### Trigger 域（不占 Update 序，`RunSystem<T>(entity)` 点名）

由战斗边界循环在固定点同步派发（§4）。有实体宿主时每类触发器一个 ECS tag；无实体宿主的内联路径使用 §4.1 的轻量处理器，不进入 YuoCore Tag 注册：

```
IOnHitTrigger    OnHitLeechSystem / ManaLeechSystem / ThornsSystem / ThreatOnTakenSystem …
IOnKillTrigger   OnKillBuffSystem / OnKillLootSystem …
IOnCastTrigger   OnCastInterruptSystem / OnCastBonusSystem …
IOnExpireTrigger OnExpireExplodeSystem …
IOnDeathTrigger  OnDeathReviveSystem …
```

内核机制现成：`YuoWorld.RunSystem<T>(entity)`（`YuoCore.Ecs/YuoWorld/RunSystem.cs`）——稠密 tagId 直查 + `system.m_Run(entity)` 同步执行，一次普通方法调用，无 tick 延迟。**此域 System 不进入 Update 序列，不参与每拍扫描。**

## 4. 战斗内核：批量调度器 + 段内触发器

`AdvanceTo` 的边界循环保留批量形态；段内规则按边界类型拆解，在**固定序列点**派发触发器：

```
AdvanceTo(state, windowTarget):
  while boundary := NextNaturalBoundary(state) <= windowTarget:
      ResolveBoundary(boundary)               // 出手/技能/回复 本体结算
      DrainTriggers(encounter.PendingTriggers) // ← 固定派发点
          foreach trigger in 入队顺序:
              有实体宿主：RunSystem<trigger.Tag>(unitEntity)
              无实体宿主：InlineTriggerPipeline.Dispatch(trigger)
      UpdateOutcome()                          // 死亡/胜负永远在触发器结算之后
```

序列契约（确定性红线）：

- 触发器消费点固定在"本边界结算后、下一边界取数前"；`UpdateOutcome` 永远在触发器结算之后——**OnHitHeal 可以救活自己**，这是"挨打回血顶不顶得住下一刀"语义的正确位置。
- 命中反应（OnHit）的派发粒度精确化为**每次命中结算后立即 drain**：同一自然边界内可能有多个单位先后出手，若推迟到边界末统一消费，衍生伤害（反伤致死）的落账时序会相对后续出手错位——"命中后立即消费"是保持旧内联结算时序逐位等价的唯一合法点位，同时也是"边界结算后、下一边界取数前"的更严格实现。
- 触发器内消耗 RNG 只能走 `encounter` 固定随机流，消费顺序 = `PendingTriggers` 入队顺序。
- 触发器不得改变边界时刻表（只可改数值与队列内容）；新增边界只能走正常 `Next*At` 计算。

### 4.1 轻量内联触发器处理流程

无实体战斗（纯领域推进、斗法剧本）不需要 `YuoSystem`、组件标记或 `YuoWorld.RunSystem`。这条路径使用 `CombatTriggerHandler` 基类和按事件固定签名的接口（如 `IInlineOnHitTrigger.OnHit(PendingCombatTrigger)`）：

- 启动时只扫描 `DaoHua.Ecs` 程序集中的 `CombatTriggerHandler` 非抽象子类，实例化一次并按 `CombatTriggerOrder` 排序；不扫描测试程序集，也不把轻量接口继承为 `ISystemTag`。
- 每种事件缓存为强类型接口数组。热路径只按 `CombatTriggerKind` 选择数组并进行接口调用，不使用 `MethodInfo.Invoke`、`Dictionary<Type>` 或运行时反射。
- 同一事件类型按顺序号升序执行；顺序号相同时按处理器全名 `StringComparer.Ordinal` 二次排序，消除 `GetTypes()` 返回顺序差异。
- 处理器只接收 `PendingCombatTrigger` 或事件专用领域上下文，不能持有 `YuoEntity`、`YuoWorld` 或宿主服务引用。
- `InlineCombatTriggerSink` 和 `EcsCombatTriggerSink` 是互斥消费路径；一条 pending trigger 只能交给其中一个 sink，防止同一效果重复结算。两条路径继续共用 `CombatTriggerMath` 与 `Settle` 语义。
- 新增既有事件下的效果只需新增处理器类；新增事件种类仍需定义事件接口、参数记录和 `CombatTriggerKind` 派发槽位。当前仓库没有 AOT/裁剪发布约束；未来启用时必须为扫描类型保留元数据，或将注册表替换为源生成实现。
- 双路径同效果落地固定为四件套：内联 `CombatTriggerHandler`（`CombatTriggerOrder`）+ 薄 `YuoSystem`（`SystemOrder` 同一先后关系）+ 能力标记组件（`CombatTriggerSurface.Sync` 按 `Stats.Effects`/`Stats.Traits` 挂摘）+ `CombatTriggerMath` 共享本体。
- 特质载体：`CombatantStats.Traits`（`trait.*` ID 集合，面板字段，快照重建不带快照负担）。条件触发型特质按 ID 判定（如 `trait.bukandaowo` → `CombatEncounterState.Create` 开战授予 `buff.yinshen`）；数值型特质经 `CombatTraitRules` 折算进 `Stats.Effects` 点数通道（如 `trait.liweifanfou` → `ThreatOnTakenPoints = 100`）。
- 随机通道分配（目标抽取族）：0~15 核心结算保留、3 玩家目标、16 单体兜底、17 AoE 多目标、**18 敌方盟友目标（出手）、19 敌方盟友目标（决策）**、64+ 触发器专属。敌方出手与决策在 `PlayerAllies` 上按 `EffectiveThreat` 轮盘抽取——单存活成员 `SelectTarget` 提前返回不掷点，单盟友行为与固定目标逐位等价。

桥接（Domain 不碰实体的解法）：战斗调度器整体迁入 `src/Ecs/Combat/`，操作的就是组件化状态，`RunSystem` 直接调用无分层冲突；`CombatantState` 增加运行时字段 `EntityId`（`AttachCombat` 时设置，不序列化）。

`DeterministicCombatEngine` 的归宿：边界调度骨架迁入 `src/Ecs/Combat/BattleScheduler`；伤害/技能/回复公式留在 Domain 作纯函数，被 boundary handler 调用。`Domain.Tests` 中的 `AdvanceOneBoundary` 直测迁移到 `Ecs.Tests`。

### 4.2 特殊效果实现工作流

装备被动、技能附加效果、Buff/Debuff、怪物特性及其他玩法特殊效果的新增、修改、修复和评审，统一使用仓库级 [special-effects Skill](../../../.agents/skills/special-effects/SKILL.md)。效果数值与预算由 [data-designer Skill](../../../.agents/skills/data-designer/SKILL.md) 配合处理；纯视觉特效不属于此工作流。

效果先明确触发时机、作用侧、结算口径、叠层与生命周期，再选择属性公式、固定事件接口或已有计时边界。轻量处理器实例全局复用，必须无战斗状态；冷却、次数、层数和到期时间由单位/遭遇/玩家状态持有。当前实际事件只有 `OnHit`，其他事件按具体需求补齐生产点与消费点；实体路径与内联路径继续共享效果本体，并用启用实际效果的场景验证等价性。

## 5. 行动实现本体化样板

以采集为例的目标形态（对照现行三段转调）：

```csharp
// GatheringActionSystem（order 300）体内直接持有规则：
//   准入检查 → 时长公式 → 逐秒产出循环 → 轮结算
// 组件直接读写：player.GetComponent<PlayerActionQueueComponent>() 等
// 账本仍走 pipeline 请求上下文（ActionMutationBatch），不变
```

`EcsActionPipeline` 退化保留的职责：窗口游标/剩余预算/工作钱包/账本事件尾/战斗句柄——它是"请求上下文"，不再是"逻辑转发层"。

## 6. 持久化：分段不动，映射层扩展

- 8 个 `PlayerSectionKind` 落库格式主体不动；`ExportSnapshot`/`SectionCodec` 契约不变。
- 组件↔分段映射层扩展：新组件映射进既有分段（`PlayerResourcesComponent`→Combat；reactive buff→Buffs）。
- `ActiveBuff` 记录扩展触发器字段（`TriggerKind`/`Params`）——**挂钩点**：首个"buff 定义携带触发参数"的特性落地时同步扩展，届时 Buffs 分段格式升版并同步 `PostgresSchema` 与 DataTool 校验；当前 reactive 参数经 `CombatantStats.Effects` 链路承载（装备 specialMechanics/怪物配表），无独立 wire 需求。

## 7. 确定性与并发守则

- RNG：段内一切随机消费走 `encounter` 种子流；触发器固定顺序消费。
- 同刻排序：`SystemOrder` 管 Update 序列；`PendingTriggers` 队列序管段内派发——两套都是确定性序列，无字典序。
- 数值顺序：先校验后变更、逐整秒累加、账本按实际入账量记录——搬迁时逐函数比对。
- 所有权不变：Fiber 单写者；跨实体只走 `entityId` 间接寻址，不留实体引用跨越方法边界。
- `YuoCore` 内核红线：新派发面接稠密索引（`RunSystem` 已是），不改生命周期派发语义。

## 8. ComputeNode 统一执行环境

`ComputeNode` 引用 `DaoHua.Ecs`（`src/Ecs` 只引 Domain+YuoCore，无宿主依赖，不违红线），job 流换装：

```
DecodeAggregate → shard.CreatePlayer(state) → shard.RunPlayerOnceAsync(target)
              → ExportSnapshot → EncodeAggregate（脏分段）
```

收益：一致性**由构造保证**（同一代码路径），不再依赖双跑验证；ECS 层新增机制（触发器、实体级玩法）自动被补算继承。代价：job 起 World/Fiber 的固定开销（相对补算体量可忽略，可跨 job 复用 shard）；`AGENTS.md` 依赖图同步为 `ComputeNode -> Domain + Ecs`；golden vector 全量重验。

ComputeNode -> Ecs + Domain（ECS 执行环境，无宿主/存储）
```

## 13. 完整 ECS 收口结果（2026-10-01）

本次收口已经完成。生产运行时中，行动队列、行动执行和战斗的状态变更与调度均由 `src/Ecs` 的组件、阶段 System 和 Tag System 持有；`EcsActionPipeline` 只保留请求工作区、窗口游标、账本和提交边界，不再承载规则转发。

### 生产 ECS 规则归属

- `ActionExecutionRules.Pipeline/Resources/Timed/Travel` 与 `ActionClockSystem`、`ActionQueueSystem`、采集/制造/计时/旅行/结算 System 共同持有队列准入、资源边界、行动推进、产出、重复次数和 `-1` 无限循环语义。
- `CombatActionRules` 持有搜寻、复活、入场、持续用品、斗法回放、胜负、掉落、统计和战斗收尾；`CombatEventAdvanceSystem` 持有自然边界、批量推进和固定相位派发；`CombatSystems` 持有战斗实体推进、目标索引、日志和实体释放。
- Buff 到期通过 `PlayerBuffExpiryInboxComponent` 与 `IExpirePlayerBuffs` Tag System 在资源边界同步裁决，真实删除才产生 Buffs 脏标记。
- `DeterministicCombatEngine` 与 `SimulationEngine` 的旧公开入口只作为无世界测试/兼容门面，内部转发到上述 ECS System；Server、ComputeNode 和生产玩家运行时不从这些门面进入规则编排。

### 明确保留在 ECS 之外的边界

纯属性/伤害/目标数学、配表选择器和编解码继续作为无副作用算法；PostgreSQL、快照分段、资产事务、HTTP/WebSocket、认证、协议 DTO、ComputeNode 任务和宿主生命周期继续由 Domain/Server/Protocol/持久化适配层负责。它们通过 ECS 工作区和提交边界交互，不复制行动或战斗规则。

普通推进、批量补算和命令路径现在共用同一套 ECS System 规则入口，验证覆盖终态、账本、脏标记、事件顺序和 `-1` 无限循环语义；无需再按阶段保留未迁移的行动或战斗编排。

## 11. 可信冷补算与原子提交边界（TASK-20261008-10）

- 在线、节点和主服验证复用同一 ECS 确定性执行路径；验证使用独立世界，不改变在线宿主默认世界或静态调度开关。
- 节点仅提供候选结果。主服冻结一致快照中的身份、有效提交头、全集分段、耐久队列与资产余额版本，独立重演后严格比较分段集合、原始 JSON 字节、版本、实际模拟时钟与资产增量；传输 checksum 和节点自报 metrics 不构成可信证明。重复分段或额外字段结果必须拒绝。

## 14. 玩家三态生命周期执行规约（TASK-20261011-05）

总纲01 §1.2 第 5 条三态主旨的服务端执行口径。

### 14.1 离线锚点与在线状态

- 聚合持有离线锚点 `OfflineSinceAt`，随 settings 分段与 `Presence` 一同持久化：转离线时写入**断线时刻**，转在线时清空。
- **只有连接生命周期改变在线状态**：WebSocket 握手经 `AttachConnectionAsync` 转在线；断线宽限到期卸载时转离线并以断线时刻为锚点。社交强拉、HTTP 快照、注册装载等非连接装载一律不改在线状态，实体以离线身份常驻或补算。
- 实体创建（运行时装载、冷算执行器、主服验证三路共用 `EcsWorldShard.CreatePlayer`）统一规范化：持久化为在线必为崩溃残留（装载即意味本进程刚取得所有权），按离线处理、锚点取 `LastSimulatedAt`；离线但缺锚点同样取 `LastSimulatedAt`；规范化标脏落盘，三路结果逐位一致。
- 读模型 `game.player_projection.offline_since` 随 settings 分段投影；离线时长的一切判定（会话离线截止、48h 逐出、冷扫描）只读该列。`last_active_at` 不参与生命周期判定。

### 14.2 收益封顶

- 离线收益上限为 Domain 常量 `PlayerLifecycleRules.OfflineIdleLimit`（48h），不可配置。
- 单次推进的实际计算终点 = `min(目标, 请求起点 + 48h 保险丝, OfflineSinceAt + 48h)`；在线玩家无锚点时只受保险丝约束。滚动批算任意切分的累计收益与一次性补算逐位一致，且不越过锚点 + 48h。
- 超出边界的尾段只清理过期态并推进时钟；`offline.capped` 事件只在跨越边界的那次请求（请求起点 ≤ 边界）产生一次。
- 会话引擎的单次推进 48h 仅为保险丝；会话的离线边界由名册离线成员最早的 `offline_since + 48h` 裁决（§21.13.2）。

### 14.3 在线宽限

- 拥有会话的连接断开后进入宽限（`OfflineIdle:GraceSeconds`，默认 300）：实体常驻、在线位保留、按在线实时推进；宽限内重连直接复用实体，不重载不补算。
- 宽限到期且无新连接：注销在线位，`RemoveAsync(flush, offlineSince: 断线时刻)` 落盘离线态并归还运行时租约。新握手先取消或等待在途到期收尾，再装载。
- 优雅停机时立即执行全部在途宽限的到期收尾（锚点仍为各自断线时刻）。

### 14.4 离线挂机批算

- 冷扫描对象：投影离线、无存活运行时租约、无活跃会话绑定与待消费结算、且「距上次结算 ≥ 批算间隔（`OfflineIdle:BatchIntervalMinutes`，默认 60）」或「已到封顶边界仍有欠债」的玩家。批目标 = `min(当前, OfflineSinceAt + 48h)`；扫描与执行不受计算节点配置门控。
- 主服本地执行器常驻消费同一 `compute_jobs` 队列（单路串行，与验证器共用一个独立 ECS 世界）；计算节点派发只领取 pending 超过 `ComputeNode:OverflowAfterSeconds`（默认 300）的积压任务，结果仍经 §11 全量独立重演。
- 回线抢占：玩家装载取得运行时租约后，在途任务写回因租约/版本漂移归档丢弃；装载路径即时补算到当前。

### 14.5 彻底离线

- 到达 `OfflineSinceAt + 48h` 时冷扫描入队终末批（目标 = 边界），补齐断线到边界的全部收益；此后玩家停止被扫描。
- 看门狗按 `offline_since + 48h` 逐出队伍（队长移交、空队清理、会话仲裁 `member-offline-timeout`）。
- 队列隐式暂停：登录时推进请求起点已在边界，直接封顶推进时钟到当前，不产收益、不再补算，队列随后照常续跑。

### 14.6 组队会话

- 活跃会话只要名册中有成员在线（含宽限期），离线成员实体常驻装载并在批推进中实时消费结算；会话散场或名册全员离线后卸载常驻实体。
- 名册全员离线的会话按批算间隔推进到当前，推进后逐成员经所有权通道强拉消费结算再卸载；会话推进不得越过名册离线成员最早的离线边界。
- 散场后未装载成员同样强拉消费终局结算，保证其持久化状态与个人冷算资格及时恢复。

### 14.7 已知边界

- 服务器非优雅崩溃时，在线玩家的投影在线标记残留到其下次被装载（届时按 §14.1 规范化）。
- 宽限期内实体与租约留在原实例；多实例部署下换实例重连需等宽限到期。

# 第二十篇 技艺体系、符箓/阵法制造与装备强化规约

> **篇目定位**：生活技艺等级/经验/速度加成、符箓与阵盘制造、装备强化的唯一设计真源。
> 实现契约字段名以 `docs/tasks/archive/archive-2026-10.md` 中 TASK-20261003-04 条目为准；本篇约束设计意图与结算语义。

---

## 20.1 技艺等级体系

### 20.1.1 技艺清单

七项生活技艺，独立存储、独立升级：

| 技艺 | `TechniqueId` | 关联行动域 |
| --- | --- | --- |
| 炼丹 | `alchemy` | 炼丹、药材萃取 |
| 炼器 | `forging` | 装备精炼/锻造 |
| 符箓 | `talisman` | 符箓绘制 |
| 强化 | `enhancement` | 装备强化 |
| 阵法 | `formation` | 阵盘部署 |
| 采集 | `gathering` | 采集/砍伐/拾取 |
| 挖掘 | `mining` | 采矿 |

### 20.1.2 经验与等级

- 每项技艺持有**累计经验**（`TechniqueExperiences[id]`），初始为空即 0 级。
- 升级曲线与修为完全一致：复用 `RealmProgressionCatalog.ExpToNext` 逐段推进，`exp >= expToNext[0]` 升 1 级，溢出经验连续升级直至 `expToNext` 表耗尽（封顶）。
- 技艺经验授予：每完成一个有效行动轮次，入账 `definition.DurationSeconds`（基础耗时秒数，不含速度折减）；强化按当次实际基础耗时。
- 升级记录走 `LevelUp` 账本（kind `technique`）。

### 20.1.3 行动速度加成

- 每级技艺 +5% 对应行动速度：`实际耗时 = 基础耗时 / (1 + 0.05 × level)`。
- 作用于**该技艺对应**的行动耗时（`ActionDefinition.Technique`），不跨技艺叠加，不作用于修炼/探索/战斗/赶路主行动。
- 与节点建筑速度乘区同点结算（`TimedActionDuration`），保持确定性。

## 20.2 符箓 —— 雷击符

- 制造行动 `talisman.draw-leiji`（技艺=符箓）：消耗 `残魄灵符×2 + 桃木晶×1`，20 秒/张，产出 `item.leiji-talisman`。
- 雷击符为**战斗通用栏即时消耗品**：`usableInActionTypes=["combat"]`，支持触发器条件与 60 秒冷却，无吟唱。
- 触发即扣 `manaCostRatio(5%) × MaxManapoints`；灵力不足则本次不激活。
- 打击 `raw = manaDamageRatio(20%) × MaxMana + spellAttackRatio(200%) × SpellAttack`，元素 Wood、大类 Spell；走守方减伤链（抗性平方穿甲→攻方增伤 Linear→守方减伤 NonLinear→免伤收口），物品打击不参与命中/暴击掷点。
- 目标语义与普攻一致（最高有效威胁，回退首个存活敌人）；伤害直接写入战斗实体或波次快照，胜负判定交回战斗边界。

## 20.3 阵法 —— 聚灵阵盘

- 制造行动 `formation.deploy-juling`（技艺=阵法）：消耗 `灵松晶×2 + 破碎灵核×2`，30 秒/盘，产出 `item.juling-formation-disk`。
- 聚灵阵盘为**战斗通用栏持续消耗品**（`isContinuous` + `durationSeconds=300` + `cooldownSeconds=300`）：每次遭遇入场自动消耗 1 件充入 300 秒，按战斗存活时钟扣减；耗竭时刻起算 300 秒冷却，冷却走完后的下一次入场才重新扣件补能。
- 效果：每 5 秒回蓝 `(原回蓝 + 5) × 1.3`（例：原 5 → 13）。
  - 实现为 buff 双通道：固定 `mpRegen=5` 与前段合并，`mpRegenPostRatio=0.3` 在所有固定加成合并后再乘。
  - 战斗中经由 `CombatBuffState` 同构字段作用于战内 5 秒回蓝格，Buff 时长对齐槽位剩余时长，耗尽即自然过期。
- 回复收口公式（全域同构）：`regen = (Stats.Regen + Σbuff.RegenFlat) × (1 + Σbuff.RegenPostRatio)`。

## 20.4 装备强化

### 20.4.1 物品与等级模型

- 强化等级存于**资产变体**：`AssetKey(itemId, "+N")` 为独立余额行；已装备槽位仍记录 `PlayerEquipmentSlot.EnhancementLevel`，装备校验按变体键核对余额。
- 每级强化使装备 `flatStats`/`baseStatRatios` ×1.05（指数成长，+20 满级约 ×2.653），`specialMechanics` 不缩放。
- 强化行动 `enhance.equipment`（`ActionKind.Enhancement`，技艺=强化）：按目标物品与当前等级动态结算，不走静态 inputs/yields。

### 20.4.2 单次强化结算

- 目标等级 `t = 当前等级 + 1`；`t > 20` 拒绝开轮。
- 耗时：`5 + t` 秒/次，再受强化技艺速度加成。
- 成本：`灵石 × t×10`。
- 成功率：`t≤10` 查表 `[0.5,0.45,0.45,0.4,0.4,0.4,0.35,0.35,0.35,0.35]`；`t≥11` → `0.3×0.95^(t-11)`，clamp `[0.01,0.5]`；技艺等级 `L≥t` 加性 `+0.01×L`，`L<t` 乘性 `×0.9^(t-L)`；终值 clamp `[0,0.99]`。
- 判定走确定性随机（种子=行动实例 Id 前 8 字节，channel 独立不扰战斗种子）。
- 成功 → 资产键升至 `+t`（已装备者同步槽位等级）；失败：启用保护材料（每轮消耗 1 个）则维持当前等级（`max(0, t-1)`），无保护归零（回到基础键）。保护材料由 `AuxItemId` 指定：装备配表 `enhanceProtectionItems` 非空时取列表内任一物品，未配置时以同装备无强化基础件（裸 `AssetKey`）代护；保护材料与本体共用裸键时（+0 装备以自身裸件代护）须持有 ≥2。
- `targetLevel` 意图参数到达后行动提前完成出队；余额不足/物品不存在 → 阻塞语义无产出。

## 20.5 内视「技艺」Tab 与前端页面

- 内视页新增 `technique` Tab：七技艺列表，每项展示等级、经验进度（本级累计/下一级需求）、+5%×等级 行动速度加成。
- 技艺导航组在 炼丹/炼器 之外新增 符箓/阵法/强化 三个子页；符箓/阵法复用行动卡网格；强化为独立页面（物品格+目标等级+保护槽+重复控件 / 费用·成功率·产出·经验·耗时面板）。

## 20.6 持久化与协议

- `PlayerLoadoutDocument.TechniqueExperiences` 随 Loadout 分段持久化；`ActionIntent` 增 `targetItemId`/`auxItemId` 入队载荷。
- `SectionCodec.CurrentSchemaVersion` 与 `PostgresSchema.Version` 同步 +1，新增字段全部可缺省解码。

## 20.7 技艺工具

### 20.7.1 物品模型

- 七技艺各配一件可装备工具，以**装备目录条目**落地（`equipment.` 前缀、进 `RawEquipments`），不参与物品目录登记。
- 装备槽位：`slot = "tool-<techniqueId>"`（`tool-alchemy`/`tool-forging`/`tool-talisman`/`tool-enhancement`/`tool-formation`/`tool-gathering`/`tool-mining`），七个专属槽位随装备槽位唯一互斥校验天然互斥，同技艺至多一件。
- 加成声明：`techniqueBonus = { technique, speedRatio }` 绑定技艺与速度加成数值；`speedRatio` 配表化为后续高品阶工具留空间，本批（tier 1）恒为 `0.10`。
- 工具不配置 `flatStats`/`baseStatRatios`/`specialMechanics`，对战斗属性零贡献；命名遵循「本名不拼品阶前缀」，高阶工具以新 id 承载。
- 首批工具：药锄（采集）、探矿罗盘（挖掘）、灵火鼎（炼丹）、锻灵锤（炼器）、朱砂符笔（符箓）、布阵旗（阵法）、淬灵砧（强化）。

### 20.7.2 速度加成结算

- 行动 `Technique` 命中已装备工具的 `techniqueBonus.technique` 时，其 `speedRatio` 与技艺等级加成**同除数加算**：`实际耗时 = 基础耗时 / (1 + 0.05×技艺等级 + Σ工具speedRatio)`。
- 不跨技艺叠加、不乘产出倍率；与节点建筑速度乘区同点结算（`TimedActionDuration`），保持确定性。

### 20.7.3 制造与获取

- 工具由炼器产出：炼器页新增「技艺」子分组，7 条 `forge.tool-*` 配方（`technique=forging`），产出对应 `equipment.tool-*`。
- 工具**不可强化**：强化裁决对 `tool-` 槽位目标直接拒绝（强化仅缩放 flatStats/baseStatRatios，对工具为零收益纯消耗）。

### 20.7.4 前端槽位

- 装备面板底部「技艺工具」区为七个可交互槽位（每技艺一格），点击弹网格挑选器按 `tool-<techniqueId>` 过滤，穿脱复用 `loadout.replace` 通道。

# 第二十一篇 同道与组队系统

> **定位**：本篇是「同道」社交入口与完整组队系统的唯一设计真源。第十四篇 §14.5.2 的邀请制队伍仅描述最早的入队通道，本篇在其上扩展队伍档案、招募匹配、组队大厅与聊天队伍链接；传音频道机制本身仍以第十四篇为准。

---

## 21.1 定位与边界

1. **队伍是招募组织层**：目标类型/目标节点/身家门槛均为招募标签；「同图并肩作战」的战斗协同结算由 [§21.13](#2113-同图共战组队讨伐) 定义，队伍频道与成员在线态是已有的协作基础。
2. **同道 Tab**：左侧顶级导航「同道」是社交入口容器，本期只有「队伍」一个子页；好友管理仍留在聊天面板内，后续子页以同一子 Tab 结构扩展。
3. **服务端权威**：队伍档案、成员关系、匹配登记、大厅结果与身家数值全部由服务端产出；前端不本地推演成员/门槛/匹配结果，只保存最近一次服务端视图。
4. **存在感与持久化通知分离**：上线/下线/换节点只改变附近成员及在线位，主服按会话最近一次已入队的社交视图重新投影，禁止为纯存在感事件反复加载整套 PostgreSQL 社交关系。持久化社交变更仍从数据库构建完整视图；新会话尚无视图时由握手全量下发建立基线，可丢弃推送失败不前移基线。异步多订阅通知必须逐个等待，所有通知共享并行上限，不能只等待多播委托的最后返回值；协议仍使用同一 `SocialStateDto`。

## 21.2 队伍档案（Party Profile）

每支队伍除 `party_id`/`leader_id` 外持有一组档案字段，全部落 `social.parties`：

| 字段 | 协议字段 | 口径 |
| :--- | :--- | :--- |
| 队伍名称 | `name` | 1~32 字符；为空时服务端生成「{队长道号}的小队」 |
| 目标类型 | `activityKind` | `any`（不限）/`combat`（讨伐战斗）/`exploration`（历练采集）/`cultivation`（吐纳修炼）+ 五门技艺 `alchemy`（炼丹）/`forging`（炼器）/`talisman`（符箓）/`formation`（阵法）/`enhancement`（强化） |
| 目标节点 | `nodeId` | 空串 = 不限；否则必须是世界图已知节点 ID（`WorldGraph.ContainsNode`）；前端表单按「区域 → 地点」级联选择（区域不限即地点不限，协议无区域级任意节点语义），展示标签为「区域 · 地点」，创建/匹配表单默认当前地点 |
| 身家门槛 | `minValuation` | ≥0；0 表示不设门槛；加入者与自动匹配均按它裁决 |
| 公开性 | `isPublic` | true 进组队大厅；false 只能被邀请或经聊天队伍链接进入 |
| 斗法开关 | `pvpEnabled` | 队伍级 PVP 撮合开关（§7.10.4）；仅 `activityKind='combat'` 可为 true、仅队长可改、队员只读；改离讨伐自动归位 false |

- 队伍上限恒为 5 人（含队长，`SocialRuntime.MaxPartyMembers`）。
- 一名玩家最多属于一个队伍（`social.party_members.player_id` 主键）。
- 每名玩家最多一条待处理队伍邀请；加入任何队伍时邀请与匹配登记同步清除。

## 21.3 身家（valuation）口径

> 「身家」是招募用的量化参照，**不是战斗属性**；名称刻意不锁死——协议与代码统一用 `valuation`，界面文案集中在 i18n 词条（`social.valuation`），后续改名只动词条。

```
身家 = 装备价值 + 功法价值
装备价值 = Σ 每件已穿戴装备的单价（强化 +N 按变体 "+N" 独立计价）
功法价值 = Σ 每门已参悟功法：参悟等级 × 对应秘籍单价
单价(itemId, variant) = 坊市当前最低挂售（卖一档）价
                      ?? 配表回收价（ItemDefinition.SellPrice）
                      ?? 0（物品不在配表时）
```

- **功法↔物品映射**：`ability.X` → `item.tome.X`；配表无该秘籍时回落 `item.fragment.X`（残卷）；两者皆无按 0 计。
- **参悟等级**由功法经验经 `AbilityExpCurve.LevelFor` 导出（与面板同式）。
- **六维/技艺不计入**：它们没有可交易的市场锚定价，身家保持「可支配资源口径」而非全角色强度。
- **数据源**：在线玩家取运行时聚合快照（`PlayerAggregateState.Loadout`）；离线玩家读 `loadout` 持久化分段（含刷盘队列叠加）。入队裁决与匹配自动并入使用实时值；列表展示允许 ≤30s 的估值缓存。
- **不可用兜底**：坊市分片未就绪/品种不在本进程分片 → 回落回收价；新玩家无 loadout 分段 → 身家 0。

## 21.4 无队伍四入口

| 入口 | 语义 |
| :--- | :--- |
| 自主选择 | 三模式页签：「组队大厅」「队伍匹配」「创建队伍」任选其一，一次只显示所选模式面板 |
| 队伍匹配 | 填目标类型/目标节点/队友最低身家 → `party.match.set`：服务端**先尝试自动并入**满足条件的公开队伍，未命中则登记入「匹配中」散人池 |
| 组队大厅 | 同类筛选 + 列表展示：公开队伍（含成员预览、门槛、加入按钮）与匹配中散人 |
| 创建队伍 | 填队名（可空→默认名）/目标类型/目标节点/身家门槛/是否公开 → 创建者任队长 |

## 21.5 匹配语义

1. `party.match.set {activityKind?, nodeId?, minValuation?}`：仅无队伍玩家可用；先写/更新 `social.party_seekers` 行，再扫描公开队伍尝试自动并入。
2. 自动并入条件（全部满足）：队伍 `is_public` 且未满员；活动类型与目标节点须与我方条件一致——`any`/空串为「不限」，筛选侧与被筛侧任一为不限即放行（不限目标的队伍对所有筛选可见，不限筛选的散人匹配全部队伍）；我方身家 ≥ 队伍 `min_valuation`；**每名在队成员身家 ≥ 我方申报的队友最低身家**。命中多队时取人数最多、其次创建最早者。
3. 未命中：保持「匹配中」状态（`SocialStateDto.seeking` 下发），可随时 `party.match.clear` 撤下；加入队伍时登记自动清除。
4. 散人池不自建队伍、不反向强拉：大厅里队长可对散人发 `party.invite`（走既有邀请-接受流程）。

## 21.6 组队大厅

- 拉取式：`PartyLobbyRequest(25) {requestId, activityKind?, nodeId?, minValuation?}` → `PartyLobby(26) {requestId, myValuation, parties[], seekers[]}`。
- `activityKind`/`nodeId` 筛选沿用「不限双向通配」口径（同 §21.5）；`minValuation` 筛选语义：公开队伍按「成员最低身家 ≥ 阈值」、散人按「本人身家 ≥ 阈值」。
- 公开队伍条目含成员预览（道号/在线/身家），前端据此展示加入可行性（我的身家 < 门槛时置灰但可见）。
- 散人条目含道号/在线/身家/目标/队友门槛；本人是队长时提供「邀请」按钮。
- 上限：各类列表最多返回最近 50 条，按创建时间倒序。

## 21.7 队伍管理与权限

| 操作 | 权限 | 说明 |
| :--- | :--- | :--- |
| `party.update` | 队长 | 档案补丁：name/activityKind/nodeId/minValuation/isPublic 任一非空字段即生效 |
| `party.invite` | 队长 | 按道号/ID 邀请；未满员、对方未组队 |
| `party.kick` | 队长 | 移除成员（不能踢自己，队长离队走 leave/移交） |
| `party.disband` | 队长 | 解散整队：成员行随 `ON DELETE CASCADE` 清除，聊天链接置空失效 |
| `party.leave` | 全体成员 | 队长离开时按加入序移交最早成员；最后一人离队删队 |
| `party.share` | 全体成员 | 把队伍卡片发布到世界/附近/好友频道 |
| `party.join` | 无队伍者 | 按 `partyId` 加入：公开队伍大厅加入与不公开队伍链接点击共用；校验未满员 + 身家 ≥ 门槛 |

队伍 ID 是不可猜的 UUID，链接本身即加入凭据：不公开队伍不进入任何列表，但持有链接者点击即可加入（仍受满员与身家门槛约束）。

## 21.8 聊天队伍链接

- `party.share {channel, targetPlayerId?}` 是社交动作，由服务端借 `ChatRuntime` 生成一条 `party_ref` 指向本队的传音消息；正文为服务端规范文本（不消耗 200 字输入），走与发言相同的频道作用域解析与限频。
- `ChatMessageDto.partyLink` 携带队伍卡片快照字段（队名/目标/门槛/成员数），由历史回放与实时广播统一供给。
- 队伍解散 → `party_ref` 外键 `ON DELETE SET NULL`，消息正文保留为普通文本，卡片消失。
- 前端在 `ChatRow` 渲染卡片：队名 + 目标徽标 + 门槛 + 「加入」按钮（已在队伍中/不满足条件时服务端拒绝并以错误帧提示）。

## 21.10 服务端组件

- `SocialRuntime`：新动作分发、档案校验、匹配自动并入、大厅构建（`BuildLobbyAsync`）、成员身家投影进 `BuildStateAsync`。
- `PartyValuationService`：身家计算唯一口径——在线读运行时快照、离线读 `loadout` 分段（刷盘队列叠加），单价经 `MarketRuntime.TryGetBestAskPrice`（本进程分片才查，否则回落回收价）。
- `ChatRuntime.SendPartyShareAsync`：队伍卡片发言（限频/作用域解析与文本发言同口径）。
- `OrderBook.BestAskPrice`：卖一档价只读出口（`_askIndex` 队首即最低挂售）。
- `SectionCodec.DecodeLoadout` / `PostgresSectionRepository.LoadSectionAsync`：单分段读取，避免大厅批量估值拉全量快照。
- 社交/队伍依旧不进玩家级单写者门禁；加队并发用 `social.parties` 行级 `FOR UPDATE` 串行化，满员判队友好地落在事务内。

## 21.12 邀请系统与功德占位（schema v13）

邀请关系属「同道」域：每名玩家持唯一邀请码，注册时可填邀请码结成邀请关系，按被邀请者
境界里程碑双向发放绑定功德奖励。

### 21.12.1 邀请码与链接

- 邀请码为服务端权威生成的玩家级常量：注册时写入 `identity.players.invite_code`
  （10 位大写字母数字，唯一索引 `ux_players_invite_code`，撞码整体重试新码），
  不变更不回收；邀请接口按 `player_id` 会话声明读回，前端不参与生成。
- 邀请链接为 `https://<host>/?invite=<code>` 静态入口；前端启动时读 `invite` 查询参数
  自动切到注册页并预填邀请码输入框，用户仍可手动修改。注册请求 `invitationCode` 可选。

### 21.12.2 邀请关系与奖励

- `social.player_invitations`：`invitee_id` 主键（一个被邀请者终身至多一条关系）、
  `inviter_id`、`invitation_code` 快照、`highest_realm_level`、
  `qi_rewarded`/`foundation_rewarded` 领取标记；CHECK 禁止自邀（新码入库前先解析
  邀请者，结构上不可能命中自己）。
- 奖励口径（一次性，全部走 `economy` 幂等事务）：
  - 注册：被邀请者 +1000 `item.gongde-bound` + 10000 `currency.spirit-stone`，
    邀请者 +1000 `item.gongde-bound`；同事务随注册落库，幂等键 `invitation.signup:{inviteeId}`。
  - 被邀请者突破至练气期（境界等级 19）：双方各 +1000 `item.gongde-bound`，
    幂等键 `invitation.milestone.qi:{inviteeId}`。
  - 被邀请者突破至筑基期（境界等级 31）：双方各 +2000 `item.gongde-bound`，
    幂等键 `invitation.milestone.foundation:{inviteeId}`。
- 里程碑触发点唯一：`progression.breakthrough` 命令成功后由运行时调
  `IInvitationRepository.GrantMilestonesAsync`；Serializable 事务内对邀请行
  `FOR UPDATE` 后逐里程碑经济入账并翻转标记，钱与标记同生同灭；崩溃留幂等键重放，
  重复突破不重复发奖。在线邀请者经钱包失效 + 结构化日志通知，离线者下次加载读到余额。
- 新增失败码：`INVALID_INVITATION_CODE`（邀请码不存在，注册失败）。

### 21.12.3 功德物品（本期占位）

- `item.gongde`：功德（可交易占位），`kind=category=currency`，`sellPrice=0`，
  可进坊市挂单、不可系统回收；本期无产出与消耗入口。
- `item.gongde-bound`：功德·绑定，`isTradable=false`、`sellPrice=0`，不可挂单、
  不可回收；邀请奖励唯一产出。`market.place` 服务端按目录 `isTradable` 拦截绑定物挂单。
- 后续功德的实际消耗/兑换玩法另立设计，本节只固化占位与发放口径。

- HTTP：`RegisterRequest` 增 `invitationCode`（可选）；新增 `GET /api/v1/invitation`
  返回 `{inviteCode, inviteeCount, invitees:[{displayName, highestRealmLevel,

- `SocialSubTab` 增 `invite`；`SocialPage` 子页签「邀请」：专属邀请码/邀请链接展示 +

- 注册页邀请码输入框（`app.login.regInvite*`）；物品名走既有 `game.item.<id>` 词条链。
- 里程碑日志采用 `{{item:id|名称|数量}}` 结构化模板，双方各一条 system 频道战报。

## 21.13 同图共战（行动参与讨伐）

> **定位（TASK-20261009-05）**：组织只决定参与者、准备与开战/散场条件；一次行动参与会话持有唯一权威战斗态，同一场战斗只推演一次。成员行动仅引用会话并消费个人结算。队伍、团队、宗门身份不得进入战斗规则与表现分支。

### 21.13.1 组织条件与参与会话

- 队伍持有 `openSlots`（2~5，默认 5）；成员数等于开启槽位、全员准备、全员位于目标节点才开战。档案目标优先，未指定时取队长驻留节点。
- 开打冻结真实行动 ID、参与者顺序、各成员属性/功法槽/装备/气血灵力/跨战技能状态/持续消耗品 Buff、遭遇、公共种子与寻敌速度；会话内不接受实时装配面板变化，即时消耗品不自动触发。阵法类持续消耗品（`subCategory=formation`）的定格 Buff 全队生效——注入全部成员而非仅携带者（§7.9.5 作用范围条目）。已装载成员经其所有权通道定格最新内存态；未装载成员直接解码持久化真源（与装载对账同一事务快照口径），不触发实体装载与离线补算；若其收件箱仍压着未消费会话结算，定格前先在临时聚合上按装载对账同口径重放结算投影——冻结消费后的有效面板（散场复活回血等随之生效，不能从旧状态开下一场），收件箱本身不消费，挂机收益仍在其上线补算时生效。
- 队伍斗法开关（`pvpEnabled`，§7.10.4）随会话创建冻结进参与规格；存续期间档案值与冻结值漂移即散场重建，与目标漂移同口径。勾选斗法的会话整队作为一个匹配单位进入斗法撮合，斗法战斗由会话权威相位回放共享剧本。
- 成员原队首挂起，参与行动作为引用锚点插队；结束后按权威时刻恢复原队首。无限重复不因波次完成自动出队。
- 参与引用不占个人行动容量：最多保留 256 项个人行动和 1 个参与引用。迁地命令插队前先按当前权威时刻散场并消费末批，不能把参与引用挂在赶路之后。
- 成员变动、取消准备、槽位失效、目标漂移、解散及原有离线超时逐出终止会话。断开连接本身不散场；离线超时仍按既有窗口裁决。
- 散场先推进会话到权威结束时刻，再投递终态。倒地成员以 1 点气血起身，灵力不恢复；未装载成员由散场流程强拉消费相同终态后卸载（总纲18 §14.6），不能从旧状态开下一场。就绪位跨会话常驻：散场不复位名册 ready，仅成员本人取消准备清除；散场后组织条件再次齐备时，下一次仲裁按常驻就绪直接重开新会话。

### 21.13.2 唯一权威执行上下文

- 会话独立持有搜索、波次、战斗、复活、事件顺序与全部成员战斗态，复用既有多盟友战斗规则；成员不再恢复、挂接或推进自己的同场遭遇。
- 会话有独立所有权与推进锁，不依附队长在线态。玩家仍按 PlayerId 哈希分片；同节点不意味着同分片，会话与成员之间只传不可变文档/结算。
- 任一成员在线（含断线宽限期）即实时推进，离线成员实体常驻装载并实时消费个人结算，收件箱不积压；全员离线时按 §1.2 三态主旨转入离线挂机批算——挂起游标是批算边界间的持久形态，按批算间隔（默认 1 小时）由主服推进，推进后逐成员强拉消费结算，不逐 tick 实时消耗；成员回线未轮到批算点时，由会话统一按墙钟即时补算一次，其他成员直接读取已推进状态（执行口径见总纲18 §14.6）。
- 成员离线不从冻结参战阵列移除；全员离线期间仍服从离线超时逐出等显式散场边界，补算不得越过该时刻。离线时长以成员断线时刻（`offline_since`）起算，强拉装载与结算消费不重置该锚点。
- 成员序是稳定身份，观察者 selfIndex 只决定本人标记、日志称谓与个人结算投影，不改变随机顺序、事件归因与战斗结果。
- 成员个人行动管线遇到参与引用时等待权威状态；搜寻/战间回复、冷却和战中血蓝均由会话计算，不重复消耗成员战斗预算。
- 自然回复余数按成员冻结并持续保存；各成员搜寻/战间回复保持自己的五秒进度，散场与血蓝一起交付，不能重置个人回复周期。战斗入场预扣灵力和吟唱须在同一边界进入全部成员投影；未首次交付的开场事件须随首批交付且只交付一次。
- 首次装载一律从持久化真源对账；常规命令和周期推进仅对已有参与引用或会话宿主已发现的活跃/待消费成员查询结算，未参战玩家不承担逐人会话查询。成员提示不作为检查点或收益真源，开场、恢复与投递均更新提示。
- 并发上线/迁地触发的同一玩家社交刷新合并为单次在途通知；构建期间再次变更时继续发送最新状态。通知不逐条保存中间状态，主动社交指令回执仍必达，推送失败向调用方报告。

### 21.13.3 收益与成员单写者

- 经验按参与人数平分后叠个人等级惩罚；共享掉率按全员掉落增幅放大，再按个人权重决定归属；每人只入账自己的份额。
- 会话产生个人经验、功法经验、掉落资产、击杀/死亡/轮次、战斗统计与战报增量，以及最终血蓝/技能状态。结算不覆盖成员实时设置、装备、社交状态或其他无关字段。
- 释放参与引用时回到个人属性上限，按既有个人面板规则夹取终态血蓝；参与期间的冻结上限不会继续覆盖散场后的实时装备面板。
- 成员只能在自己的玩家 gate 与 ECS Fiber 内消费，消费游标、资产、个人分段和收件箱回执必须原子提交；重复投递不重奖，失败不得先确认回执。
- 开场和散场通知只请求成员所有权内对账；活动引用由成员适配器读取权威会话行建立。社交层不得在已消费终局后依据旧开场规格再次入队。
- 行动账本、每日账本与离线账本继续使用现有统计入口；事件发生时刻决定自然日和离线口径。结算投影只消费既定结果，不重新运行战斗。
- 领取会话投影前，成员仍通过原资源管线推进个人暂存物品、Buff 到期与道龄；参与引用阻止个人战斗/原行动推进。该区间资产增量与会话份额、消费游标一并原子提交，投影本身不直接跳过个人模拟时钟。
- 成员等待期间不排个人五秒回复边界，冻结余数只由会话推进和交付；个人 Buff 到期、暂存入账及散场边界照常保留。配表删行动后的终局补投依据结算本身识别终态，不受消费前临时屏蔽散场的绑定影响。
- 同一推进生成的会话检查点与全部成员结算须原子持久化；逐帧展示读取当前会话投影，持久化收件箱只保留必要结算增量，避免离线成员复制完整战斗轨迹。

### 21.13.4 表现与协议

- 保留通用 `participation`、`expedition.allies`、波次、相位、战报与动画结构；盟友阵列固定序，成员读取会话当前状态的本人视角，不在回线后重演整场。
- 盟友属性与装配继续走 `UnitInspect` 按需冻结投影，本人属性面板沿用原通道；组织身份不进入 CombatArena 分支。
- 成员所见事件顺序、倒地/复活、敌方状态与结果必须一致；只有本人称谓、个人收益和 selfIndex 有视角差异。

### 21.13.5 持久化与恢复契约

- 冻结规格为会话输入，当前远征/战斗态、业务时钟和递增检查点版本为会话恢复真源；成员持有会话引用和已消费游标，不存可自行推进的冻结剧本副本。
- PostgreSQL 原子保存会话状态和各成员收件箱；会话记录及未消费结算独立于队伍生命周期，解散队伍不得级联删除。
- 重启恢复最新会话检查点，不再无条件散场；游戏配表指纹不一致等无法安全续算的明确边界必须保留证据并按最后确定时刻收尾，禁止静默重算/重复发奖。
- 恢复推进先核对持久化成员关系、就绪、槽位与目标驻留条件；发现已失效但缺少确定散场时刻时，保留原因和版本证据，按最后已提交检查点收尾，不补算不确定区间。
- 组织恢复的位置校验从同一事务快照读取最新 `world` 分段（durable 队列叠加已落库段），迁地 `edgeId` 视为不驻留；不使用可能滞后的 `player_projection` 判定会话成立。开场冻结完成后先强制提交已装载成员脏分段，再创建会话检查点；未装载成员以同一事务快照口径的持久化真源定格，无脏分段可提交。
- 确定未提交的会话推进恢复检查点；提交结局未知须通过原版本/幂等标识核验，不能继续覆盖不确定终态。成员消费复用既有经济事务确认与隔离语义。
- 单个会话的检查点冲突、未知提交或个人消费失败只隔离其自身，健康会话与其他玩家仍完成当批推进；批次最后报告故障，不能在玩家推进开始前冻结全服。
- 本地库版本同步升级，迁移只放 `migrations/`；新库由权威 DDL 建表。旧模型切换使用该目录内的离线一次性工具解压并移除成员旧参与行动、保留已结算收益及终态血蓝，再由 SQL 收尾旧会话和推进标签；自动 SQL 链遇到未转码载荷必须中止，禁止假升级或清库，不新增运行时兼容路径。
- 离线转码按运行时相同边界验证实际载荷大小、解压长度与 SHA-256；`stored_bytes` 为统计元数据，转码按实际新载荷长度重算。长度统计漂移不触发清库，原始长度或校验和不一致必须中止。

### 21.13.6 宗门累计任务边界

- 宗门累计采集/击杀/贡献任务订阅成员行动结果，维护独立贡献聚合，不创建同场战斗会话。
- 宗门共同讨伐可由组织适配器创建相同参与规格；本任务只落地现有队伍入口，不预建未来组织框架。

### 21.13.7 验收不变量

- 三名成员同场只有一份战斗推进预算，成本为一次推演加成员结算投影；单人普通讨伐规则不变。
- 不同观察者、在线/离线/回线顺序、检查点恢复产生相同战斗结果；成员回线不重新推演已完成区间。
- 散场到边界、倒地复活、资产幂等、个人账本与原行动恢复均保持；崩溃不得留下半结算或重复收益。
- 验证包括确定性与跨分片回归、PostgreSQL 原子失败/恢复、完整门禁、真实容量门禁、健康/WebSocket及本地三人队伍浏览器验收。

## 21.14 队伍成员信息卡

同道页队伍槽位点击成员弹出角色信息卡（`PlayerCardModal`）：道号、立绘、角色序号
（`identity.players.player_seq`）、境界牌匾、身家、六维等级与经验进度、战斗经验、
战斗装备/技艺装备/功法技能，以及「战斗用品」详情页（丹药栏 3 槽 + 通用栏 3 槽
`autoUseSlots` 战斗栏域配置）。

- **查询通道**：`PlayerCardRequest{playerId}` → `PlayerCard`，一次按需查询应答，
  不随社交状态常驻下发（成员详情体量大、打开率低，常驻快照带宽不划算）；应答帧必达。
- **授权边界**：仅可查看本人与同队成员；跨队或陌生人请求返回 `error="forbidden"`，
  身份不存在返回 `error="not-found"`，统一以 `error` 字段随 `PlayerCard` 应答下发。
- **数据源**：已装载玩家读运行时内存态，未装载玩家读持久化分段真源
  （`LoadAsync` + `DecodeAggregate`，与身家估值同一展示口径——不投影未消费会话结算）。
- **六维口径**：等级经 `PlayerCoreAttributes.Levels(RealmProgression)` 服务端派生，
  与 loadout 分段 `coreAttributes` 投影同形（exp + level + totalLevel），前端不重复换算。
- **序号口径**：`player_seq` 为注册自增编号，经社交仓储 `identity.players` 直查，
  不进入玩家聚合与快照分段。

# 第二十二篇 新手引导系统（服务端权威任务链式导览）

> **定位**：新玩家首次进入后的线性任务链引导，覆盖采集 → 炼丹 → 炼器 → 地图移动 → 修炼 → 战斗六条核心玩法通路；表现层沿用「遮罩镂空 + 高亮描边 + 气泡卡 + 步骤进度」的引导范式，步骤权威由服务端持有。

## 22.1 设计目标与红线

- **服务端权威**：引导步骤（`TutorialStep`）持久化在玩家 `settings` 分段，材料赠送与完成奖励在行动结算管线内随模拟事务入账。清理浏览器缓存不得重置进度或重复领取奖励；断线重连后按快照恢复到当前步骤。
- **前端只表现**：前端按快照里的 `tutorialStep` 渲染当前里程碑的引导 UI（准备页签、高亮真实控件、气泡文案、跳过），不在客户端判定完成条件、不发放奖励。
- **严格单向**：步骤只能前进（`0 → … → 7`），不存在回退或分支；跳过收敛到终态并补发剩余未领奖励；唯一的「重来」是显式 `tutorial.restart`（重置步骤但不动奖励游标）。
- **不过度防御**：引导不阻断玩家自由操作；玩家在引导外自行完成的同种行为不计入步骤（每步只认对应行动的完成事件）。

## 22.2 里程碑状态机

`TutorialStep` 为 `int`，挂在 `PlayerSettingsState`（settings 分段），随全量/增量快照以 `settings.tutorialStep` 下发。缺省解码为 `0`。

| 值 | 里程碑 | 推进条件（服务端） | 推进时入账 |
| --- | --- | --- | --- |
| 0 | 采集 | `explore.gather-ningxue-grass` 完成一轮（出生点云溪村就地可采） | 凝血草 ×3（炼丹材料） |
| 1 | 炼丹 | `alchemy.refine-qi-pill` 完成一轮 | 百炼铁 ×7 + 兽骨 ×1（炼器材料） |
| 2 | 炼器 | `forge.qingfeng-sword` 完成一轮 | — |
| 3 | 前往云巅草庐 | 旅行到达 `node.cloud-peak`（或激活本步时已驻留该节点） | — |
| 4 | 修炼 | `cultivation.draw-qi` 完成一轮（云巅草庐修炼加速 1.25×） | — |
| 5 | 返回云溪村 | 旅行到达 `node.yunxi-village`（或激活本步时已驻留该节点） | — |
| 6 | 战斗 | `combat.hunt-qi-beast` 完成一轮（一波清空，即 `combat.won` 口径，而非进入战斗阶段） | **功德 ×1000 + 灵石 ×10000** |
| 7 | 完成 | 终态；跳过引导同样收敛到本值 | — |

规则细节：

- 行动型里程碑只认「该行动 ID 完成一轮」的结算事件，驻留型里程碑只认「当前驻留节点 = 目标节点」。
- 驻留型里程碑在进入该步骤的同一结算窗口内立即重估：若玩家激活旅行步时已驻留目标节点，直接续推进，避免「先旅行后补步骤」造成的卡死。
- 赠送与奖励经结算窗口的 `deltas` 增量通道写入资产钱包，与行动产出共用同一事务与资产差量推送；同一迁移只发生一次（步骤不可逆天然幂等）。
- **奖励游标** `TutorialRewardsStep`（settings 分段，缺省 0）：记录奖励已发放至第几里程碑；里程碑推进仅当 `nextStep > 游标` 才入账该步赠送并推进游标，重学路径不重复发放已领奖励。
- `tutorial.skip` 命令把 `TutorialStep` 置为 7 并**补发剩余未领奖励**（游标+1..7 的赠送/终奖合并入账，走命令经济事务 + 资产差量推送 + 结构化入账日志）；重复跳过幂等空转。
- `tutorial.restart` 命令把 `TutorialStep` 重置为 0（奖励游标不动）：供「重新学习引导」；重走流程可再完成全部交互步骤，但已领过的阶段奖励与终奖不再重复发放，未领过的里程碑走到时仍照常入账。

## 22.3 结算挂钩点

推进器为 ECS 层静态规则 `TutorialRules`，在三处结算边界内嵌调用：

1. `CompleteRepeat`（`ActionExecutionRules.Timed.cs`）：计时行动每轮完成（`action.completed`）后，按行动 ID 匹配里程碑 0/1/2/4。
2. `CompleteCombatAdvanceCore` 波次清空分支（`CombatActionRules.cs`）：`combat.won` 计一轮完成后，匹配里程碑 6。
3. `FinishTravel`（`ActionExecutionRules.Travel.cs`）：`world.arrived` 后按驻留节点匹配里程碑 3/5。

所有钩子只携带「玩家上下文 + 触发事实 + 增量字典/事件尾」参数，无状态、无分配扩张，不在热路径引入集合重建。

## 22.4 前端导览层

React 组件 `TutorialOverlay`（`frontend/src/tutorial/`）按 `tutorialStep` 渲染当前里程碑的 UI 子步骤序列：

- **视觉**：四块半透明暗色遮罩围出目标元素镂空（外扩数像素），金/红描边高亮框脉冲；气泡卡含里程碑 kicker、标题、正文、`n/m` 进度条与「跳过 / 上一步 / 下一步」按钮；箭头小方块指向目标；卡片按剩余空间自动选择方位并 clamp 进视口。
- **子步骤推进模式**：
  - `button`：点「下一步」；
  - `target`：点击高亮目标本身推进（遮罩镂空放行真实点击，先教后做）；
  - `server`：等待型卡片（无推进按钮），服务端里程碑翻转后自动进入下一里程碑。
- **prepare**：子步骤激活时先驱动真实 UI（切页签、切技艺模式/子页签），再轮询等待目标元素出现后再测量定位；目标缺失时卡片降级为居中提示。
- **弹窗治理**：业务弹窗（`Modal`/`ConfirmDialog`，z-index 低于引导层）在引导期间只允许「当前目标所在的弹窗」存在；定位轮询对每个 `.modal-backdrop` 判定——不含当前目标的游离弹窗一律程序化点击其 `.modal-close` 收拢（覆盖「上一步」回退残留弹窗、跨页签 portal 残留等死锁路径）；目标元素 `disabled` 或被遮挡时按定位失败计数，超时出现逃生「下一步」。
- **等待步展示聚焦**：`server`/`arrive` 等待子步骤经 `focusSelector` 镂空聚焦一块「可看不可点」的详情区——行动类等待切「详情」页签聚焦行动实况面板，旅行类等待切「地图」页签聚焦节点地图本体；镂空区上盖透明拦截层吃掉点击（中止按钮等原可交互控件在引导期不可操作），气泡卡以实测尺寸避让到聚焦区外悬浮。
- **锚点**：行动卡片带 `data-action-id`，导航带 `data-tour="nav:*"`，行动模态提交钮、地图「规划路线」「启程」钮带专用 `data-tour`；地图节点沿用既有 `data-node-id`；详情页主面板 `data-tour="combat-detail"`，节点地图 `data-tour="world-map"`。
- **生命周期**：`hasReceivedSnapshot` 且 `tutorialStep < 7` 时挂载；里程碑翻转为 7 时展示一次完成卡（含奖励文案），「完成」后卸载。
- **跳过二次确认**：点「跳过引导」先弹引导层内确认卡（业务 `ConfirmDialog` 层级低于引导层不可复用），文案明确「跳过后剩余奖励将直接发放，之后可在设置→引导重新学习」；确认才发送 `tutorial.skip`。
- **重学入口**：设置页「引导」分类提供「重新学习引导」（发送 `tutorial.restart` 后引导层自动重新挂载）与当前进度说明。

## 22.5 「功德」物品

引导终奖使用既有占位物品 `item.gongde`（名「功德」，见 §21.12.3）：`kind/category = currency`、`sellPrice=0` 不可系统回收、可进坊市挂单，新手引导是其首个产出入口。绑定变体 `item.gongde-bound` 仍归邀请系统独占，引导奖励不涉足。赠送与奖励均为普通资产增量，无独立货币通道。

## 22.6 存档与兼容

- `PlayerSettingsStateDocument` 与 `SectionCodec.SettingsDocument` 新增 `TutorialStep`（缺省解码 `0`）与 `TutorialRewardsStep`（缺省解码 `0`）；schema 版本推进至 15，`migrations/0015_v14_to_v15.sql` 仅做标签推进。
- 旧存档解码 `tutorialStep = 0`：既有内测账号登录后会看到一次引导，可跳过，语义可接受且便于验收。

     text = text.replace(/\b(生命值?|HP|生命上限)\b/gi, '<span class="capsule capsule-hp">HP</span>');

     text = text.replace(/(\+\d+(?:\.\d+)?%)/g, '<span class="capsule capsule-gain">$1</span>');

     text = text.replace(/\b(武器|衣服|头盔|下装|鞋履|饰品)\b/g, '<span class="capsule capsule-slot">$1</span>');

    parseInline(text) {
     // 数学公式行内 $...$ (保护不被实体高亮替换)
     const mathTokens = [];
     text = text.replace(/\$([^\$\n]+)\$/g, (m, math) => {
      const token = `__MATH_INLINE_${mathTokens.length}__`;
      mathTokens.push(`<span class="math-inline" data-tex="${this.escapeHtml(math)}">$${this.escapeHtml(math)}$</span>`);
      return token;
     });

     // 粗斜体 ***text***
     text = text.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
     // 粗体 **text**
     text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
     // 斜体 *text*
     text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
     // 删除线 ~~text~~
     text = text.replace(/~~([^~]+)~~/g, '<del>$1</del>');
