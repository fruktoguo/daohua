     // 2. 八品品质色彩 (Q1~Q8 / 凡品~帝品)
     text = text.replace(/\bQ1\b|凡品/g, '<span class="capsule capsule-q1">凡品</span>');
     text = text.replace(/\bQ2\b|黄品/g, '<span class="capsule capsule-q2">黄品</span>');
     text = text.replace(/\bQ3\b|玄品/g, '<span class="capsule capsule-q3">玄品</span>');
     text = text.replace(/\bQ4\b|地品/g, '<span class="capsule capsule-q4">地品</span>');
     text = text.replace(/\bQ5\b|天品/g, '<span class="capsule capsule-q5">天品</span>');
     text = text.replace(/\bQ6\b|灵品/g, '<span class="capsule capsule-q6">灵品</span>');
     text = text.replace(/\bQ7\b|圣品/g, '<span class="capsule capsule-q7">圣品</span>');
     text = text.replace(/\bQ8\b|帝品/g, '<span class="capsule capsule-q8">帝品</span>');

     // 3. 战斗流派 (物理系 / 术法系 / 剑修 / 炼体 / 符箓 / 五行)
     text = text.replace(/🗡️?\s*物理系/g, '<span class="capsule capsule-break">🗡️ 物理系</span>');
     text = text.replace(/🔮?\s*术法系|🔮?\s*法术系/g, '<span class="capsule capsule-ap">🔮 术法系</span>');
     text = text.replace(/\b(剑修|炼体|符箓|五行)\b/g, '<span class="capsule capsule-special">$1</span>');

     // 4. 战斗属性 (生命/HP, 灵力/MP, 物攻/AD, 法攻/AP, 护甲, 法抗, 命中, 闪避, 暴击, 免爆, 破招, 化解)
     text = text.replace(/\b(生命值?|HP|生命上限)\b/gi, '<span class="capsule capsule-hp">HP</span>');
     text = text.replace(/\b(灵力值?|MP|灵力上限)\b/gi, '<span class="capsule capsule-mp">MP</span>');
     text = text.replace(/\b(物理攻击|物攻|AD)\b/gi, '<span class="capsule capsule-ad">物攻</span>');
     text = text.replace(/\b(术法攻击|法攻|AP)\b/gi, '<span class="capsule capsule-ap">法攻</span>');
     text = text.replace(/\b(物理防御|物理护甲|护甲|物防|Armor)\b/gi, '<span class="capsule capsule-armor">护甲</span>');
     text = text.replace(/\b(法术防御|法术抗性|法抗|魔抗|MagicRes)\b/gi, '<span class="capsule capsule-mr">法抗</span>');
     text = text.replace(/\b(暴击率?|暴击等级|暴击)\b/g, '<span class="capsule capsule-crit">暴击</span>');
     text = text.replace(/\b(破招率?|破招等级|破招)\b/g, '<span class="capsule capsule-break">破招</span>');
     text = text.replace(/\b(化解率?|化解等级|化解|拆招)\b/g, '<span class="capsule capsule-armor">化解</span>');

     // 5. 正负百分比与倍率高亮 (+20%, -50%, 100%, 1.4x, 6.0x, 0.250s)
     text = text.replace(/(\+\d+(?:\.\d+)?%)/g, '<span class="capsule capsule-gain">$1</span>');
     text = text.replace(/(-\d+(?:\.\d+)?%)/g, '<span class="capsule capsule-loss">$1</span>');
     text = text.replace(/(\b\d+(?:\.\d+)?%)/g, '<span class="capsule capsule-scale">$1</span>');
     text = text.replace(/(\b\d+(?:\.\d+)?[x×]\b)/gi, '<span class="capsule capsule-scale">$1</span>');
     text = text.replace(/(\b\d+(?:\.\d+)?s\b)/gi, '<span class="capsule capsule-special">$1</span>');
     text = text.replace(/(1秒4刀|1秒1发)/g, '<span class="capsule capsule-special">⚡ $1</span>');

     // 6. 装备槽位 (武器/衣服/头盔/下装/鞋履/饰品)
     text = text.replace(/\b(武器|衣服|头盔|下装|鞋履|饰品)\b/g, '<span class="capsule capsule-slot">$1</span>');

     return text;
    }

    parseInline(text) {
     // 数学公式行内 $...$ (保护不被实体高亮替换)
     const mathTokens = [];
     text = text.replace(/\$([^\$\n]+)\$/g, (m, math) => {
      const token = `__MATH_INLINE_${mathTokens.length}__`;
      mathTokens.push(`<span class="math-inline" data-tex="${this.escapeHtml(math)}">$${this.escapeHtml(math)}$</span>`);
      return token;
     });

     // 粗斜体 ***text***
     text = text.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
     // 粗体 **text**
     text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
     // 斜体 *text*
     text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
     // 删除线 ~~text~~
     text = text.replace(/~~([^~]+)~~/g, '<del>$1</del>');

     // 行内代码 `code` (代码内不进行实体胶囊化，保持原样)
     const codeTokens = [];
     text = text.replace(/`([^`]+)`/g, (m, code) => {
      const token = `__CODE_INLINE_${codeTokens.length}__`;
      codeTokens.push(`<code>${this.escapeHtml(code)}</code>`);
      return token;
     });

     // 链接 [text](url)：#锚点与本文件夹篇目 NN-*.md 走页内跳转（经 data-doc-link 点击时解析），外部链接新开页；
     // 经 token 保护，避免词法高亮改写 href 属性内的关键词
     const linkTokens = [];
     text = text.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, (m, label, url) => {
      const token = `__LINK_${linkTokens.length}__`;
      const style = 'color:var(--tone-qi);text-decoration:none;border-bottom:1px dashed var(--tone-qi);cursor:pointer;';
      const isExternal = /^(https?:|mailto:)/i.test(url);
      linkTokens.push(isExternal
       ? `<a href="${this.escapeHtml(url)}" target="_blank" rel="noopener" style="${style}">${this.highlightXianxiaEntities(label)}</a>`
       : `<a href="${this.escapeHtml(url)}" data-doc-link="${this.escapeHtml(url)}" style="${style}">${this.highlightXianxiaEntities(label)}</a>`);
      return token;
     });

     // 执行全景修仙词法高亮胶囊化
     text = this.highlightXianxiaEntities(text);

     // 还原行内代码与数学公式
     codeTokens.forEach((ct, i) => {
      text = text.replace(`__CODE_INLINE_${i}__`, ct);
     });
     mathTokens.forEach((mt, i) => {
      text = text.replace(`__MATH_INLINE_${i}__`, mt);
     });
     linkTokens.forEach((lt, i) => {
      text = text.replace(`__LINK_${i}__`, lt);
     });

     return text;
    }

    render(markdown) {
     this.toc = [];
     this.headerCount = 0;
     this.currentHeaderLevel = 1;
     this.isLeadParagraph = true;
     this.slugMap = {};
     this.fileMap = {};
     this.currentFile = null;

     const lines = markdown.split(/\r?\n/);
     let html = '';
     let inCodeBlock = false;
     let codeBlockLang = '';
     let codeBlockBuffer = [];
     let inTable = false;
     let tableRows = [];
     let inList = false;
     let listType = 'ul';

     const closeTable = () => {
      if (!inTable) return;
      inTable = false;
      if (tableRows.length === 0) return;

      let tableHtml = '<div class="table-wrapper reveal-item"><table>';
      const headerRow = tableRows[0];
      tableHtml += '<thead><tr>';
      headerRow.forEach(cell => {
       tableHtml += `<th>${this.parseInline(cell)}</th>`;
      });
      tableHtml += '</tr></thead><tbody>';

      for (let i = 1; i < tableRows.length; i++) {
       tableHtml += '<tr>';
       tableRows[i].forEach(cell => {
        tableHtml += `<td>${this.parseInline(cell)}</td>`;
       });
       tableHtml += '</tr>';
      }
      tableHtml += '</tbody></table></div>';
      html += tableHtml;
      tableRows = [];
     };

     const closeList = () => {
      if (!inList) return;
      html += `</${listType}>`;
      inList = false;
     };

     for (let i = 0; i < lines.length; i++) {
      let line = lines[i];

      // 1. 代码块
      if (line.startsWith('```')) {
       if (!inCodeBlock) {
        closeTable();
        closeList();
        inCodeBlock = true;
        codeBlockLang = line.slice(3).trim();
        codeBlockBuffer = [];
       } else {
        inCodeBlock = false;
        const rawCode = codeBlockBuffer.join('\n');
        const escaped = this.escapeHtml(rawCode);

        if (codeBlockLang === 'mermaid') {
         html += `<div class="mermaid reveal-item" style="text-align:center; margin:20px 0;">${escaped}</div>`;
        } else {
         html += `
                    <div class="code-block-wrapper reveal-item">
                      <div class="code-header">
                        <span>${codeBlockLang || 'TEXT'}</span>
                        <button class="btn-copy" onclick="copyCode(this)">复制</button>
                      </div>
                      <pre><code class="language-${codeBlockLang}">${escaped}</code></pre>
                    </div>
                  `;
        }
        codeBlockBuffer = [];
       }
       continue;
      }

      if (inCodeBlock) {
       codeBlockBuffer.push(line);
       continue;
      }

      // 篇目拼接哨兵 <!-- FILE:NN-*.md -->：记录当前行所属篇目，不渲染
      const fileSentinel = line.match(/^<!--\s*FILE:(.+?)\s*-->\s*$/);
      if (fileSentinel) {
       closeTable();
       closeList();
       this.currentFile = fileSentinel[1];
       continue;
      }

      // 2. 表格行
      if (line.trim().startsWith('|') && line.trim().endsWith('|')) {
       closeList();
       const cells = line.split('|').slice(1, -1).map(c => c.trim());
       if (cells.every(c => /^:?-+:?$/.test(c))) {
        continue;
       }
       if (!inTable) {
        inTable = true;
        tableRows = [];
       }
       tableRows.push(cells);
       continue;
      } else {
       closeTable();
      }

      // 3. 独立块级数学公式 $$ ... $$
      if (line.startsWith('$$') && line.endsWith('$$') && line.length > 2) {
       closeList();
       const math = line.slice(2, -2).trim();
       html += `<div class="math-block reveal-item" data-tex="${this.escapeHtml(math)}">$$ ${this.escapeHtml(math)} $$</div>`;
       continue;
      }

      // 4. 标题 H1 ~ H6
      const headerMatch = line.match(/^(#{1,6})\s+(.*)$/);
      if (headerMatch) {
       closeList();
       const level = headerMatch[1].length;
       const titleText = headerMatch[2].trim();
       const id = `heading-${++this.headerCount}`;

       this.currentHeaderLevel = level;
       this.isLeadParagraph = (level === 1);
       this.slugMap[this.githubSlug(titleText)] = id;
       if (this.currentFile && !(this.currentFile in this.fileMap)) {
        this.fileMap[this.currentFile] = id;
       }

       this.toc.push({level, title: titleText, id});

       const parsedTitle = this.parseInline(titleText);
       html += `<h${level} id="${id}" class="reveal-item">${parsedTitle}</h${level}>`;
       continue;
      }

      // 5. 分割线
      if (/^(---|\*\*\*|___)$/.test(line.trim())) {
       closeList();
       html += '<hr class="reveal-item">';
       continue;
      }

      // 6. 引用块 >
      if (line.startsWith('>')) {
       closeList();
       const quoteContent = line.replace(/^>\s?/, '');
       html += `<blockquote class="reveal-item"><p>${this.parseInline(quoteContent)}</p></blockquote>`;
       continue;
      }

      // 7. 列表 (阶梯缩进)
      const ulMatch = line.match(/^(\s*)[-*+]\s+(.*)$/);
      const olMatch = line.match(/^(\s*)\d+\.\s+(.*)$/);

      if (ulMatch || olMatch) {
       const curType = ulMatch ? 'ul' : 'ol';
       const content = ulMatch ? ulMatch[2] : olMatch[2];
       if (!inList || listType !== curType) {
        closeList();
        inList = true;
        listType = curType;
        html += `<${listType} class="reveal-item">`;
       }
       html += `<li>${this.parseInline(content)}</li>`;
       continue;
      } else {
       closeList();
      }

      // 8. 阶梯式层次化段落排版
      if (line.trim().length > 0) {
       let pClass = 'reveal-item ';
       if (this.isLeadParagraph) {
        pClass += 'p-lead';
        this.isLeadParagraph = false;
       } else if (this.currentHeaderLevel === 2) {
        pClass += 'p-h2-sub';
       } else if (this.currentHeaderLevel === 3) {
        pClass += 'p-h3-sub';
       } else if (this.currentHeaderLevel >= 4) {
        pClass += 'p-h4-sub';
       } else {
        pClass += 'p-h2-sub';
       }

       html += `<p class="${pClass}">${this.parseInline(line)}</p>`;
      }
     }

     closeTable();
     closeList();
     return html;
    }
   }

   // ------------------------------------------------------------------------
   // 11.2 视口渐显进入观察器 (Scroll Reveal Observer - 从右到左滑入)
   // ------------------------------------------------------------------------
   let revealObserver = null;

   function setupScrollReveal() {
    if (revealObserver) {
     revealObserver.disconnect();
    }

    const items = document.querySelectorAll('.reveal-item');
    const viewportHeight = window.innerHeight;

    // 首屏可见项直接标记 revealed，避免闪烁
    items.forEach(el => {
     const rect = el.getBoundingClientRect();
     if (rect.top < viewportHeight + 50) {
      el.classList.add('revealed');
     }
    });

    // 视口交叉观察器：当新元素从底部进入时从右向左平滑浮现
    revealObserver = new IntersectionObserver((entries) => {
     entries.forEach(entry => {
      if (entry.isIntersecting) {
       entry.target.classList.add('revealed');
       revealObserver.unobserve(entry.target);
      }
     });
    }, {
     root: document.getElementById('main-viewport'),
     rootMargin: '0px 0px 40px 0px',
     threshold: 0.05
    });

    items.forEach(el => {
     if (!el.classList.contains('revealed')) {
      revealObserver.observe(el);
     }
    });
   }

   // ------------------------------------------------------------------------
   // 11.3 视图控制器与交互绑定
   // ------------------------------------------------------------------------
   const parser = new XianxiaMarkdownParser();
   const outputEl = document.getElementById('markdown-output');
   const tocNavEl = document.getElementById('toc-nav');
   const progressBar = document.getElementById('reading-progress-bar');
   const viewport = document.getElementById('main-viewport');
   const searchInput = document.getElementById('search-input');
   const currentChapterTitle = document.getElementById('current-chapter-title');
   const docStatsEl = document.getElementById('doc-stats');
   const btnBackTop = document.getElementById('btn-back-top');
   const sidebar = document.getElementById('sidebar');
   const topbar = document.getElementById('topbar');
   const dirInput = document.getElementById('dir-input');
   const sourceNote = document.getElementById('source-note');

   let currentFontSize = 15;
   let headingsElements = [];

   function renderMarkdownContent(mdText) {
    // 渲染主文档
    const html = parser.render(mdText);
    outputEl.innerHTML = html;

    // 生成目录树
    let tocHtml = '';
    parser.toc.forEach(item => {
     if (item.level <= 3) {
      tocHtml += `<a href="#${item.id}" class="toc-item toc-level-${item.level}" data-target="${item.id}">${item.title}</a>`;
     }
    });
    tocNavEl.innerHTML = tocHtml;

    // 更新统计信息
    const charCount = mdText.length;
    const wordCount = (charCount / 1000).toFixed(1);
    docStatsEl.textContent = `共 ${charCount} 字 (~${wordCount}k字)`;

    // 收集标题元素供滚动高亮
    headingsElements = Array.from(outputEl.querySelectorAll('h1, h2, h3'));

    // 激活视口从右到左渐显进入动效
    setTimeout(setupScrollReveal, 50);

    // 异步尝试渲染 KaTeX 与 Mermaid
    enhanceMathAndDiagrams();
   }

   function enhanceMathAndDiagrams() {
    if (window.katex) {
     try {
      document.querySelectorAll('.math-inline').forEach(el => {
       const tex = el.getAttribute('data-tex');
       if (tex) katex.render(tex, el, {throwOnError: false});
      });
      document.querySelectorAll('.math-block').forEach(el => {
       const tex = el.getAttribute('data-tex');
       if (tex) katex.render(tex, el, {displayMode: true, throwOnError: false});
      });
     } catch (e) {
      console.warn('KaTeX 渲染降级:', e);
     }
    }

    if (window.mermaid) {
     try {
      mermaid.initialize({startOnLoad: false, theme: 'dark', darkMode: true});
      mermaid.run();
     } catch (e) {
      console.warn('Mermaid 渲染降级:', e);
     }
    }
   }

   // 滚动进度与大纲高亮
   viewport.addEventListener('scroll', () => {
    const scrollTop = viewport.scrollTop;
    const scrollHeight = viewport.scrollHeight - viewport.clientHeight;
    const percent = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
    progressBar.style.width = `${percent}%`;

    if (scrollTop > 300) {
     btnBackTop.classList.add('visible');
    } else {
     btnBackTop.classList.remove('visible');
    }

    let activeHeading = null;
    for (let i = 0; i < headingsElements.length; i++) {
     const el = headingsElements[i];
     const rect = el.getBoundingClientRect();
     if (rect.top <= 120) {
      activeHeading = el;
     } else {
      break;
     }
    }

    if (activeHeading) {
     const id = activeHeading.id;
     currentChapterTitle.textContent = activeHeading.textContent;
     document.querySelectorAll('.toc-item').forEach(item => {
      if (item.getAttribute('data-target') === id) {
       item.classList.add('active');
      } else {
       item.classList.remove('active');
      }
     });
    }
   });

   // 目录点击平滑滚动
   tocNavEl.addEventListener('click', (e) => {
    const targetLink = e.target.closest('.toc-item');
    if (targetLink) {
     e.preventDefault();
     const targetId = targetLink.getAttribute('data-target');
     const targetEl = document.getElementById(targetId);
     if (targetEl) {
      targetEl.scrollIntoView({behavior: 'smooth', block: 'start'});
      if (window.innerWidth <= 900) {
       sidebar.classList.remove('active');
      }
     }
    }
   });

   // 侧边栏切换
   document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
    if (window.innerWidth <= 900) {
     sidebar.classList.toggle('active');
    } else {
     sidebar.classList.toggle('collapsed');
     topbar.classList.toggle('sidebar-collapsed');
    }
   });

   // 字号放大/缩小
   document.getElementById('btn-zoom-in').addEventListener('click', () => {
    if (currentFontSize < 20) {
     currentFontSize += 1;
     document.documentElement.style.setProperty('--base-font-size', `${currentFontSize}px`);
    }
   });
   document.getElementById('btn-zoom-out').addEventListener('click', () => {
    if (currentFontSize > 12) {
     currentFontSize -= 1;
     document.documentElement.style.setProperty('--base-font-size', `${currentFontSize}px`);
    }
   });

   // 回到顶部
   btnBackTop.addEventListener('click', () => {
    viewport.scrollTo({top: 0, behavior: 'smooth'});
   });

   // 实时搜索检索
   searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
     const query = searchInput.value.trim().toLowerCase();
     if (!query) return;

     const elements = Array.from(outputEl.querySelectorAll('p, td, li, h1, h2, h3, h4, span'));
     for (let el of elements) {
      if (el.textContent.toLowerCase().includes(query)) {
       el.scrollIntoView({behavior: 'smooth', block: 'center'});
       el.style.outline = '2px solid var(--gold-bright)';
       setTimeout(() => {el.style.outline = '';}, 2000);
       break;
      }
     }
    }
   });

   // ------------------------------------------------------------------------
   // 篇目文件夹自动加载与页内文档跳转
   // ------------------------------------------------------------------------

   // 篇目拼接：注入 <!-- FILE:文件名 --> 哨兵，供解析器建立 篇目文件→首标题 映射
   function joinChapterParts(files, texts) {
    return files.map((f, i) => `<!-- FILE:${f} -->\n${texts[i].trim()}`).join('\n\n');
   }

   // HTTP 访问：manifest.json → 逐篇 fetch，永远读取文件夹最新内容
   async function tryAutoLoadFolder() {
    const r = await fetch('manifest.json', {cache: 'no-store'});
    if (!r.ok) throw new Error(`manifest ${r.status}`);
    const manifest = await r.json();
    const texts = await Promise.all(manifest.files.map(async (f) => {
     const resp = await fetch(encodeURIComponent(f), {cache: 'no-store'});
     if (!resp.ok) throw new Error(`chapter ${f} ${resp.status}`);
     return resp.text();
    }));
    return {files: manifest.files, md: joinChapterParts(manifest.files, texts)};
   }

   // 手动指定文件夹（file:// 直开兜底）：读取全部篇目 md 按文件名排序拼接
   function readFilesAsChapters(fileList) {
    const arr = Array.from(fileList)
     .filter(f => /^\d{2}-.*\.md$/i.test(f.name))
     .sort((a, b) => a.name.localeCompare(b.name, 'zh-Hans-CN-u-kn-true'));
    if (arr.length === 0) {
     sourceNote.textContent = '所选文件夹内未发现 NN-*.md 篇目文档';
     return;
    }
    Promise.all(arr.map(f => f.text())).then(texts => {
     renderMarkdownContent(joinChapterParts(arr.map(f => f.name), texts));
     sourceNote.textContent = `已从所选文件夹载入 ${arr.length} 篇`;
     viewport.scrollTo({top: 0});
    });
   }

   dirInput.addEventListener('change', (e) => {
    readFilesAsChapters(e.target.files);
    dirInput.value = '';
   });

   // 页内跳转解析：#锚点 → slug 映射；NN-*.md(#锚点) → 篇目首标题/篇内标题
   function resolveDocLink(url) {
    const u = decodeURIComponent(url.trim());
    if (u.startsWith('#')) {
     return parser.slugMap[u.slice(1)] || parser.slugMap[parser.githubSlug(u.slice(1))] || null;
    }
    const m = u.match(/(?:^|\/)([^/]+\.md)(?:#(.+))?$/i);
    if (!m || !(m[1] in parser.fileMap)) return null;
    if (!m[2]) return parser.fileMap[m[1]];
    return parser.slugMap[m[2]] || parser.slugMap[parser.githubSlug(m[2])] || parser.fileMap[m[1]];
   }

   outputEl.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-doc-link]');
    if (!a) return;
    e.preventDefault();
    const href = a.getAttribute('data-doc-link');
    const targetId = resolveDocLink(href);
    if (targetId) {
     const targetEl = document.getElementById(targetId);
     if (targetEl) targetEl.scrollIntoView({behavior: 'smooth', block: 'start'});
    } else if (!href.startsWith('#')) {
     // 未匹配的相对链接（文件夹外文档等）：保持原新开页行为
     window.open(href, '_blank', 'noopener');
    }
   });

   // 拖拽篇目文件夹或单个 md 至页面即刻渲染
   function collectEntryFiles(entry, out) {
    if (entry.isFile) {
     return new Promise(res => entry.file(f => {
      if (/\.md$/i.test(f.name)) out.push(f);
      res(out);
     }));
    }
    return new Promise(res => {
     const reader = entry.createReader();
     const all = [];
     const pump = () => reader.readEntries(entries => {
      if (entries.length === 0) {
       Promise.all(all).then(() => res(out));
      } else {
       entries.forEach(en => all.push(collectEntryFiles(en, out)));
       pump();
      }
     });
     pump();
    });
   }

   window.addEventListener('dragover', (e) => e.preventDefault());
   window.addEventListener('drop', (e) => {
    e.preventDefault();
    const dirEntry = e.dataTransfer.items &&
     Array.from(e.dataTransfer.items)
      .map(i => i.webkitGetAsEntry && i.webkitGetAsEntry())
      .find(en => en && en.isDirectory);
    if (dirEntry) {
     collectEntryFiles(dirEntry, []).then(files => readFilesAsChapters(files));
     return;
    }
    const file = e.dataTransfer.files[0];
    if (file && /\.(md|markdown|txt)$/i.test(file.name)) {
     file.text().then(text => {
      renderMarkdownContent(text);
      viewport.scrollTo({top: 0, behavior: 'smooth'});
     });
    }
   });

   // 代码一键复制
   window.copyCode = function (button) {
    const pre = button.closest('.code-block-wrapper').querySelector('pre');
    if (pre) {
     navigator.clipboard.writeText(pre.innerText).then(() => {
      const originalText = button.textContent;
      button.textContent = '已复制!';
      button.style.borderColor = 'var(--tone-jade)';
      button.style.color = 'var(--tone-jade)';
      setTimeout(() => {
       button.textContent = originalText;
       button.style.borderColor = '';
       button.style.color = '';
      }, 2000);
     });
    }
   };

   // 初始加载：优先自动读取本文件夹全部篇目（HTTP 访问时永远为最新）；
   // file:// 直开 fetch 不可用时回退内嵌快照，可点「📂 读取文件夹」或拖入文件夹读最新
   (async () => {
    try {
     const {files, md} = await tryAutoLoadFolder();
     renderMarkdownContent(md);
     sourceNote.textContent = `已自动读取文件夹 ${files.length} 篇（实时）`;
    } catch (err) {
     renderMarkdownContent(document.getElementById('default-markdown').textContent);
     sourceNote.textContent = '内嵌快照 · 可点「📂 读取文件夹」或拖入文件夹读最新';
    }
   })();

  })();
 </script>
