name: daohua-local

services:
  db:
    image: postgres:17-alpine
    container_name: daohua-local-db
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: daohua
      POSTGRES_USER: daohua
      POSTGRES_PASSWORD: ${DB_PASSWORD:-daohua-local-dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_wal_size=1GB
      - -c
      - min_wal_size=80MB
      - -c
      - autovacuum_max_workers=2
      - -c
      - autovacuum_vacuum_scale_factor=0.05
    volumes:
      - daohua-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daohua -d daohua"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    shm_size: 256m
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  app:
    build:
      context: .
      args:
        BUILD_VERSION: local
    image: daohua:local
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-5128}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Storage__Provider: postgres
      Storage__ConnectionString: Host=db;Port=5432;Database=daohua;Username=daohua;Password=${DB_PASSWORD:-daohua-local-dev};Maximum Pool Size=32;Minimum Pool Size=1;Timeout=5;Command Timeout=30;Keepalive=30
      Storage__DurableOutboxEnabled: "true"
      Storage__PersistenceQueueCapacity: "65536"
      Storage__EnableSchemaBootstrap: "true"
      Market__LedgerProvider: postgres
      Market__PartitionCount: "1"
      Market__PartitionId: "0"
      Market__TradeRetentionDays: "14"
      DistributedCompute__Enabled: ${DISTRIBUTED_COMPUTE_ENABLED:-false}
      DistributedCompute__NodeEndpoints: ${COMPUTE_NODE_ENDPOINTS:-}
      DistributedCompute__Token: ${COMPUTE_TOKEN:-}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

volumes:
  daohua-postgres:
